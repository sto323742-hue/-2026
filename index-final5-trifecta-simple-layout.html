<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI予想 Ver.3・シンプル配置版</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
#shell{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="shell" src="./index-final5-trifecta-lowodds-adjusted.html?v=simple-layout-20260915"></iframe>
<script>
const shell=document.getElementById('shell');

function deepWindow(){
  try{
    const w1=shell.contentWindow;
    const inner=w1.document.getElementById('app');
    return inner&&inner.contentWindow ? inner.contentWindow : null;
  }catch(e){return null;}
}

function findByText(doc,text){
  const all=[...doc.querySelectorAll('button,a,div,section,h1,h2,h3,h4')];
  return all.find(el=>{
    const t=(el.textContent||'').replace(/\s+/g,' ').trim();
    return t===text || t.includes(text);
  })||null;
}

function nearestCard(el){
  if(!el)return null;
  let cur=el;
  for(let i=0;i<8&&cur;i++,cur=cur.parentElement){
    const r=cur.getBoundingClientRect?.();
    const s=cur.ownerDocument.defaultView.getComputedStyle(cur);
    if(r && r.width>250 && r.height>55 &&
      (s.borderRadius!=='0px' || s.borderStyle!=='none' || s.backgroundColor!=='rgba(0, 0, 0, 0)')) return cur;
  }
  return el.parentElement||el;
}

function clickOriginal(doc,label){
  const candidates=[...doc.querySelectorAll('button,a,[role="button"],div')]
    .filter(el=>!el.closest('#simpleQuickMenu'))
    .filter(el=>(el.textContent||'').replace(/\s+/g,' ').trim().includes(label));
  const target=candidates.find(el=>{
    const r=el.getBoundingClientRect();
    return r.width>80 && r.height>30;
  })||candidates[0];

  if(target){
    try{target.click();}catch(e){}
    setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'start'}),120);
  }
}

function scrollToLabel(doc,label){
  const el=findByText(doc,label);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

function installSimpleLayout(){
  const w=deepWindow();
  if(!w || !w.document || !w.document.body)return false;
  const d=w.document;

  if(!d.getElementById('simple-layout-style')){
    const style=d.createElement('style');
    style.id='simple-layout-style';
    style.textContent=`
      #simpleQuickMenu{
        margin:14px 0 16px;
        padding:14px;
        border:1px solid rgba(228,178,58,.65);
        border-radius:18px;
        background:#0b0b0b;
        box-sizing:border-box
      }
      #simpleQuickMenu .sqm-title{
        font-size:18px;font-weight:800;color:#f1c75b;margin:0 0 12px
      }
      #simpleQuickMenu .sqm-grid{
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:8px
      }
      #simpleQuickMenu button{
        appearance:none;
        border:1px solid rgba(228,178,58,.45);
        background:#121212;
        color:#fff;
        border-radius:14px;
        padding:14px 6px;
        font-size:13px;
        font-weight:800;
        line-height:1.35;
        min-height:66px
      }
      #simpleQuickMenu button .i{
        display:block;font-size:22px;margin-bottom:5px
      }
      #simpleQuickMenu .sqm-learning{
        margin-top:10px;
        border-top:1px solid rgba(228,178,58,.18);
        padding-top:10px;
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px
      }
      #simpleQuickMenu .sqm-learning button{
        min-height:54px;padding:10px 6px;font-size:12px
      }
      #simpleQuickMenu .sqm-note{
        font-size:11px;color:#8d8d8d;margin-top:10px;line-height:1.55
      }
      @media(max-width:380px){
        #simpleQuickMenu .sqm-grid{gap:6px}
        #simpleQuickMenu button{font-size:12px;padding:12px 4px}
      }
    `;
    d.head.appendChild(style);
  }

  if(d.getElementById('simpleQuickMenu'))return true;

  const forecastLabel=findByText(d,'本日のAI予想');
  const forecastCard=nearestCard(forecastLabel);
  if(!forecastCard || !forecastCard.parentElement)return false;

  const menu=d.createElement('section');
  menu.id='simpleQuickMenu';
  menu.innerHTML=`
    <div class="sqm-title">クイックメニュー</div>
    <div class="sqm-grid">
      <button type="button" data-action="AI成績を見る"><span class="i">📊</span>AI成績</button>
      <button type="button" data-action="的中・不的中"><span class="i">🎯</span>的中・不的中</button>
      <button type="button" data-action="会場別成績"><span class="i">📍</span>会場別成績</button>
    </div>
    <div class="sqm-learning">
      <button type="button" data-scroll="不的中接近度分析">🧠 不的中分析</button>
      <button type="button" data-scroll="会場別 学習進捗">📌 学習進捗</button>
    </div>
    <div class="sqm-note">予想のすぐ下から、成績・分析・学習へ移動できます。</div>
  `;
  forecastCard.insertAdjacentElement('afterend',menu);

  menu.querySelectorAll('[data-action]').forEach(btn=>
    btn.addEventListener('click',()=>clickOriginal(d,btn.dataset.action))
  );
  menu.querySelectorAll('[data-scroll]').forEach(btn=>
    btn.addEventListener('click',()=>scrollToLabel(d,btn.dataset.scroll))
  );

  // 元の大きな3ボタンは重複表示を避けて非表示化。
  // DOMには残すため、クイックメニューから元機能を呼び出せます。
  ['AI成績を見る','的中・不的中','会場別成績'].forEach(label=>{
    const el=[...d.querySelectorAll('button,a,[role="button"],div')]
      .filter(x=>!x.closest('#simpleQuickMenu'))
      .find(x=>{
        const t=(x.textContent||'').replace(/\s+/g,' ').trim();
        const r=x.getBoundingClientRect();
        return t.includes(label) && r.width>220 && r.height>45 && r.height<150;
      });
    if(el){
      const card=nearestCard(el);
      if(card && card!==forecastCard) card.style.display='none';
      else el.style.display='none';
    }
  });

  return true;
}

function boot(){
  let tries=0;
  const timer=setInterval(()=>{
    tries++;
    if(installSimpleLayout() || tries>80) clearInterval(timer);
  },250);
}

shell.addEventListener('load',()=>setTimeout(boot,500));
setTimeout(boot,1200);
</script>
</body>
</html>
