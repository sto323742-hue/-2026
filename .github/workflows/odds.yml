name: BOATRACE Odds Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boatrace-odds
  cancel-in-progress: false

jobs:
  collect-odds:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Repository checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # =========================================================
      # 2. PHP setup
      # =========================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer


      # =========================================================
      # 3. BOATRACE scraper install
      # =========================================================
      - name: Install BOATRACE scraper
        run: |
          composer require bvp/scraper --no-interaction --no-progress


      # =========================================================
      # 4. Collect trifecta odds
      # =========================================================
      - name: Collect trifecta odds
        run: |

          cat > collect_odds.php <<'PHP'
          <?php

          require __DIR__ . '/vendor/autoload.php';

          use BVP\Scraper\Scraper;

          date_default_timezone_set('Asia/Tokyo');

          $today = date('Y-m-d');
          $todayCompact = date('Ymd');

          echo "========================================\n";
          echo "BOATRACE Odds Collector\n";
          echo "DATE: {$today}\n";
          echo "========================================\n\n";


          // =====================================================
          // Scraper
          // =====================================================

          $scraper = new Scraper();


          // =====================================================
          // 開催場取得
          //
          // scrapeStadium() は
          //
          // [
          //   1 => "桐生",
          //   2 => "戸田",
          //   ...
          // ]
          //
          // の形式で返るため、
          // array_keys() で場番号を取得する
          // =====================================================

          try {

              $stadiums = $scraper->scrapeStadium(
                  $today,
                  true
              );

          } catch (Throwable $e) {

              echo "STADIUM ERROR: "
                  . $e->getMessage()
                  . "\n";

              exit(1);
          }


          if (
              !is_array($stadiums)
              ||
              count($stadiums) === 0
          ) {

              echo "ERROR: 開催場が取得できませんでした。\n";

              exit(1);
          }


          echo "開催場一覧:\n";

          foreach ($stadiums as $number => $name) {

              echo $number
                  . " : "
                  . $name
                  . "\n";
          }


          $stadiumNumbers = array_keys($stadiums);


          // =====================================================
          // 出力データ
          // =====================================================

          $output = [

              'date' => $todayCompact,

              'updated_at' => date(DATE_ATOM),

              'stadiums' => []

          ];


          $raceCount = 0;

          $oddsCount = 0;


          // =====================================================
          // 各会場
          // =====================================================

          foreach ($stadiumNumbers as $stadiumNumber) {

              $stadiumNumber = (int)$stadiumNumber;


              if (
                  $stadiumNumber < 1
                  ||
                  $stadiumNumber > 24
              ) {

                  continue;
              }


              $stadiumKey = (string)$stadiumNumber;


              echo "\n";
              echo "========================================\n";
              echo "STADIUM {$stadiumNumber}\n";
              echo "========================================\n";


              $stadiumRaceData = [];


              // =================================================
              // 1R ～ 12R
              // =================================================

              for (
                  $raceNumber = 1;
                  $raceNumber <= 12;
                  $raceNumber++
              ) {

                  echo "\n";

                  echo "GET "
                      . $stadiumNumber
                      . "場 "
                      . $raceNumber
                      . "R\n";


                  // =============================================
                  // 3連単取得
                  // =============================================

                  try {

                      $data = $scraper->scrapeTrifecta(

                          $today,

                          $stadiumNumber,

                          $raceNumber,

                          true

                      );

                  } catch (Throwable $e) {

                      echo "SKIP: "
                          . $e->getMessage()
                          . "\n";

                      continue;
                  }


                  if (
                      !is_array($data)
                      ||
                      empty($data)
                  ) {

                      echo "NO DATA\n";

                      continue;
                  }


                  // =============================================
                  // trifecta部分
                  //
                  // 現在の scraper は
                  //
                  // trifecta
                  //   └ 1
                  //      └ 2
                  //         └ 3 = 12.5
                  //
                  // のような3階層
                  // =============================================

                  $trifecta =
                      $data['trifecta']
                      ??
                      null;


                  if (
                      !is_array($trifecta)
                      ||
                      empty($trifecta)
                  ) {

                      echo "NO TRIFECTA\n";

                      continue;
                  }


                  $map = [];


                  // =============================================
                  // 120通りへ変換
                  // =============================================

                  for (
                      $first = 1;
                      $first <= 6;
                      $first++
                  ) {

                      for (
                          $second = 1;
                          $second <= 6;
                          $second++
                      ) {

                          if ($second === $first) {

                              continue;
                          }


                          for (
                              $third = 1;
                              $third <= 6;
                              $third++
                          ) {

                              if (
                                  $third === $first
                                  ||
                                  $third === $second
                              ) {

                                  continue;
                              }


                              $odds =
                                  $trifecta[$first][$second][$third]
                                  ??
                                  $trifecta[(string)$first][(string)$second][(string)$third]
                                  ??
                                  null;


                              if ($odds === null) {

                                  continue;
                              }


                              // ---------------------------------
                              // 数値化
                              // ---------------------------------

                              if (is_string($odds)) {

                                  $odds = str_replace(
                                      [
                                          ',',
                                          '倍',
                                          ' '
                                      ],
                                      '',
                                      $odds
                                  );
                              }


                              if (!is_numeric($odds)) {

                                  continue;
                              }


                              $odds = (float)$odds;


                              if ($odds <= 0) {

                                  continue;
                              }


                              $combo =
                                  $first
                                  . '-'
                                  . $second
                                  . '-'
                                  . $third;


                              $map[$combo] = $odds;
                          }
                      }
                  }


                  // =============================================
                  // 保存
                  // =============================================

                  if (count($map) > 0) {

                      asort(
                          $map,
                          SORT_NUMERIC
                      );


                      $stadiumRaceData[
                          (string)$raceNumber
                      ] = [

                          'trifecta' => $map,

                          'count' => count($map)

                      ];


                      $raceCount++;

                      $oddsCount += count($map);


                      echo "OK: "
                          . count($map)
                          . "通り\n";

                  } else {

                      echo "NO ODDS\n";
                  }


                  // =============================================
                  // サイトへの負荷軽減
                  // =============================================

                  usleep(350000);
              }


              // =================================================
              // オッズが1R以上あった会場だけ保存
              // =================================================

              if (count($stadiumRaceData) > 0) {

                  $output['stadiums'][$stadiumKey] = [

                      'name' =>
                          $stadiums[$stadiumNumber]
                          ??
                          '',

                      'races' =>
                          $stadiumRaceData

                  ];
              }
          }


          // =====================================================
          // 最終確認
          // =====================================================

          echo "\n";
          echo "========================================\n";
          echo "RESULT\n";
          echo "========================================\n";

          echo "取得会場数: "
              . count($output['stadiums'])
              . "\n";

          echo "取得レース数: "
              . $raceCount
              . "\n";

          echo "取得オッズ数: "
              . $oddsCount
              . "\n";


          // =====================================================
          // 0件なら既存の正常データを上書きしない
          // =====================================================

          if ($raceCount === 0) {

              echo "\n";
              echo "ERROR: オッズ取得レースが0件です。\n";
              echo "既存 odds_today.json は上書きしません。\n";

              exit(1);
          }


          if ($oddsCount === 0) {

              echo "\n";
              echo "ERROR: 3連単オッズが0件です。\n";
              echo "既存 odds_today.json は上書きしません。\n";

              exit(1);
          }


          // =====================================================
          // JSON作成
          // =====================================================

          $json = json_encode(

              $output,

              JSON_UNESCAPED_UNICODE
              |
              JSON_UNESCAPED_SLASHES
              |
              JSON_PRETTY_PRINT

          );


          if ($json === false) {

              echo "JSON ERROR\n";

              exit(1);
          }


          // =====================================================
          // 一旦tmpへ保存
          // =====================================================

          $tmpFile = 'odds_today.tmp.json';


          if (
              file_put_contents(
                  $tmpFile,
                  $json
              ) === false
          ) {

              echo "FILE WRITE ERROR\n";

              exit(1);
          }


          // =====================================================
          // JSON再確認
          // =====================================================

          $check = json_decode(
              file_get_contents($tmpFile),
              true
          );


          if (
              !is_array($check)
              ||
              empty($check['stadiums'])
          ) {

              echo "VALIDATION ERROR\n";

              @unlink($tmpFile);

              exit(1);
          }


          // =====================================================
          // 正常時だけ本番ファイルへ置換
          // =====================================================

          if (
              !rename(
                  $tmpFile,
                  'odds_today.json'
              )
          ) {

              echo "RENAME ERROR\n";

              exit(1);
          }


          echo "\n";
          echo "========================================\n";
          echo "SAVE SUCCESS\n";
          echo "odds_today.json\n";
          echo "========================================\n";

          PHP


          php collect_odds.php


      # =========================================================
      # 5. JSON validation
      # =========================================================
      - name: Validate odds JSON
        run: |

          echo "========================================"
          echo "Validate odds_today.json"
          echo "========================================"

          test -f odds_today.json

          php -r '
          $d=json_decode(file_get_contents("odds_today.json"),true);

          if(!is_array($d)){
              fwrite(STDERR,"JSON invalid\n");
              exit(1);
          }

          if(empty($d["stadiums"])){
              fwrite(STDERR,"stadiums empty\n");
              exit(1);
          }

          $races=0;
          $odds=0;

          foreach($d["stadiums"] as $s){

              foreach(($s["races"] ?? []) as $r){

                  $races++;

                  $odds += count(
                      $r["trifecta"] ?? []
                  );
              }
          }

          echo "stadiums="
              .count($d["stadiums"])
              .PHP_EOL;

          echo "races="
              .$races
              .PHP_EOL;

          echo "odds="
              .$odds
              .PHP_EOL;

          if($races < 1 || $odds < 1){
              exit(1);
          }
          '


      # =========================================================
      # 6. Show result
      # =========================================================
      - name: Show result
        run: |

          echo "========================================"
          echo "odds_today.json"
          echo "========================================"

          ls -lh odds_today.json

          echo ""

          head -80 odds_today.json


      # =========================================================
      # 7. GitHubへ保存
      # =========================================================
      - name: Commit odds file
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add odds_today.json


          if git diff --cached --quiet
          then

            echo "No odds changes"

            exit 0

          fi


          git commit \
            -m "Update BOATRACE trifecta odds"


          # 他のActionsと更新が重なった場合に備える
          git pull --rebase origin main


          git push origin main
