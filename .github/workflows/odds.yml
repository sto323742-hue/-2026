name: BOATRACE Odds Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boatrace-odds
  cancel-in-progress: false

jobs:
  collect-odds:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. リポジトリ取得
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. PHPセットアップ
      # =========================================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer


      # =========================================================
      # 3. BOATRACE scraper インストール
      # =========================================================
      - name: Install BOATRACE scraper
        run: |
          composer require bvp/scraper --no-interaction --no-progress


      # =========================================================
      # 4. 3連単オッズ取得
      # =========================================================
      - name: Collect trifecta odds
        run: |

          cat > collect_odds.php <<'PHP'

          <?php

          require __DIR__ . '/vendor/autoload.php';

          use BVP\Scraper\Scraper;


          // =====================================================
          // 日本時間
          // =====================================================

          date_default_timezone_set('Asia/Tokyo');

          $today = date('Y-m-d');

          $todayCompact = date('Ymd');

          echo "========================================\n";
          echo "BOATRACE Odds Collector\n";
          echo "DATE: {$today}\n";
          echo "========================================\n\n";


          // =====================================================
          // Scraper
          // =====================================================

          $scraper = new Scraper();


          // =====================================================
          // 当日開催場取得
          // =====================================================

          try {

              $stadiums = $scraper->scrapeStadium(
                  $today
              );

          } catch (Throwable $e) {

              echo "STADIUM ERROR: "
                  . $e->getMessage()
                  . "\n";

              exit(1);
          }


          echo "STADIUMS:\n";

          print_r($stadiums);


          // =====================================================
          // JSON保存用
          // =====================================================

          $output = [

              'date' => $todayCompact,

              'updated_at' => date(DATE_ATOM),

              'stadiums' => []

          ];


          // =====================================================
          // 開催場を順番に処理
          // =====================================================

          foreach ($stadiums as $stadium) {


              // -------------------------------------------------
              // scrapeStadium の返り値に対応
              // -------------------------------------------------

              if (is_array($stadium)) {

                  $stadiumNumber =
                      $stadium['stadium_number']
                      ??
                      $stadium['number']
                      ??
                      null;

              } else {

                  $stadiumNumber = $stadium;

              }


              $stadiumNumber = (int)$stadiumNumber;


              // -------------------------------------------------
              // BOATRACE場番号チェック
              // -------------------------------------------------

              if (
                  $stadiumNumber < 1
                  ||
                  $stadiumNumber > 24
              ) {

                  continue;

              }


              echo "\n";
              echo "========================================\n";
              echo "STADIUM {$stadiumNumber}\n";
              echo "========================================\n";


              $stadiumKey = (string)$stadiumNumber;


              $output['stadiums'][$stadiumKey] = [

                  'races' => []

              ];


              // =================================================
              // 1R ～ 12R
              // =================================================

              for (
                  $raceNumber = 1;
                  $raceNumber <= 12;
                  $raceNumber++
              ) {


                  echo "\n";

                  echo "GET "
                      . $stadiumNumber
                      . "場 "
                      . $raceNumber
                      . "R\n";


                  // =============================================
                  // 3連単取得
                  // =============================================

                  try {

                      $data =
                          $scraper->scrapeTrifecta(

                              $today,

                              $stadiumNumber,

                              $raceNumber

                          );

                  } catch (Throwable $e) {

                      echo "SKIP: "
                          . $e->getMessage()
                          . "\n";

                      continue;

                  }


                  if (!is_array($data)) {

                      echo "NO DATA\n";

                      continue;

                  }


                  // =============================================
                  // 3連単マップ
                  // =============================================

                  $map = [];


                  foreach ($data as $row) {


                      if (!is_array($row)) {

                          continue;

                      }


                      // -----------------------------------------
                      // 組み合わせ
                      // -----------------------------------------

                      $combo =
                          $row['combination']
                          ??
                          $row['combination_source']
                          ??
                          null;


                      // -----------------------------------------
                      // オッズ
                      // -----------------------------------------

                      $odds =
                          $row['odds']
                          ??
                          $row['odds_source']
                          ??
                          null;


                      if (!$combo) {

                          continue;

                      }


                      // =========================================
                      // 組み合わせ文字列を統一
                      // =========================================

                      $combo = preg_replace(

                          '/[^1-6]/',

                          '-',

                          (string)$combo

                      );


                      $combo = preg_replace(

                          '/-+/',

                          '-',

                          $combo

                      );


                      $combo = trim(

                          $combo,

                          '-'

                      );


                      // =========================================
                      // 1-2-3形式だけ採用
                      // =========================================

                      if (

                          !preg_match(

                              '/^[1-6]-[1-6]-[1-6]$/',

                              $combo

                          )

                      ) {

                          continue;

                      }


                      // =========================================
                      // 同じ艇番号は禁止
                      // =========================================

                      $parts = explode('-', $combo);


                      if (
                          count(array_unique($parts))
                          !== 3
                      ) {

                          continue;

                      }


                      // =========================================
                      // オッズ確認
                      // =========================================

                      if (!is_numeric($odds)) {

                          continue;

                      }


                      $odds = (float)$odds;


                      if ($odds <= 0) {

                          continue;

                      }


                      // =========================================
                      // 保存
                      // =========================================

                      $map[$combo] = $odds;

                  }


                  // =============================================
                  // オッズが取得できた場合だけ保存
                  // =============================================

                  if (count($map) > 0) {


                      // 数値の小さい順
                      asort($map, SORT_NUMERIC);


                      $output[
                          'stadiums'
                      ][
                          $stadiumKey
                      ][
                          'races'
                      ][
                          (string)$raceNumber
                      ] = [

                          'trifecta' => $map,

                          'count' => count($map)

                      ];


                      echo "OK: "
                          . count($map)
                          . "通り\n";


                  } else {


                      echo "NO ODDS\n";


                  }


                  // =============================================
                  // BOATRACEサイトへの負荷軽減
                  // =============================================

                  usleep(500000);

              }

          }


          // =====================================================
          // JSON作成
          // =====================================================

          $json = json_encode(

              $output,

              JSON_UNESCAPED_UNICODE
              |
              JSON_UNESCAPED_SLASHES
              |
              JSON_PRETTY_PRINT

          );


          if ($json === false) {

              echo "JSON ERROR\n";

              exit(1);

          }


          // =====================================================
          // JSON保存
          // =====================================================

          file_put_contents(

              'odds_today.json',

              $json

          );


          echo "\n";
          echo "========================================\n";
          echo "SAVE odds_today.json\n";
          echo "========================================\n";


          // =====================================================
          // 取得結果確認
          // =====================================================

          $raceCount = 0;

          $oddsCount = 0;


          foreach (
              $output['stadiums']
              as $stadiumData
          ) {

              foreach (
                  $stadiumData['races']
                  as $raceData
              ) {

                  $raceCount++;

                  $oddsCount +=
                      $raceData['count']
                      ??
                      0;

              }

          }


          echo "取得レース数: "
              . $raceCount
              . "\n";


          echo "取得オッズ数: "
              . $oddsCount
              . "\n";


          if ($raceCount === 0) {

              echo "WARNING: オッズ取得レースが0件です\n";

          }


          PHP


          php collect_odds.php


      # =========================================================
      # 5. JSON結果確認
      # =========================================================
      - name: Show result
        run: |

          echo "========================================"
          echo "odds_today.json"
          echo "========================================"

          ls -lh odds_today.json

          echo ""
          echo "----- JSON HEAD -----"

          head -80 odds_today.json


      # =========================================================
      # 6. GitHubへ保存
      # =========================================================
      - name: Commit odds file
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add odds_today.json


          if git diff --cached --quiet
          then

            echo "No odds changes"

          else

            git commit \
              -m "Update BOATRACE trifecta odds"

            git push

          fi
