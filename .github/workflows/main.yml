          # =====================================================
          # 通知対象分析
          # =====================================================

          def collect_predictions(
              races,
              odds_data,
              budget=1000
          ):

              results = []
              raw_s_count = 0
              odds_ok_count = 0

              for race in races:

                  if not upcoming(race):
                      continue

                  analysis = evaluate_race(
                      race
                  )

                  if analysis is None:
                      continue

                  if (
                      analysis["grade"]
                      !=
                      "S"
                  ):
                      continue

                  raw_s_count += 1

                  stadium = int_num(
                      race.get(
                          "stadium_number"
                      )
                  )

                  race_no = int_num(
                      race.get(
                          "race_number"
                      )
                  )

                  odds_map = get_odds_map(
                      odds_data,
                      stadium,
                      race_no
                  )

                  ticket_set = make_tickets(
                      analysis,
                      odds_map
                  )

                  if not (
                      ticket_set["has_odds"]
                      and
                      ticket_set["valid343"]
                  ):
                      continue

                  tickets = allocate_tickets(
                      ticket_set,
                      budget
                  )

                  if len(tickets) != 10:
                      continue

                  odds_ok_count += 1

                  results.append({
                      "analysis":
                          analysis,

                      "ticket_set":
                          ticket_set,

                      "tickets":
                          tickets,
                  })

              results.sort(
                  key=lambda x: (
                      -x[
                          "analysis"
                      ][
                          "rating"
                      ],

                      int_num(
                          x[
                              "analysis"
                          ][
                              "race"
                          ].get(
                              "stadium_number"
                          )
                      ),

                      int_num(
                          x[
                              "analysis"
                          ][
                              "race"
                          ].get(
                              "race_number"
                          )
                      ),
                  )
              )

              return (
                  results,
                  raw_s_count,
                  odds_ok_count
              )

