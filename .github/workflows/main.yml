name: BOATRACE AI LINE Notification

on:
  workflow_dispatch:

  schedule:
    # 5分ごとに確認
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boatrace-ai-line
  cancel-in-progress: false

jobs:
  boatrace-line:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. リポジトリ取得
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Python
      # =========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =========================================================
      # 3. 必要ライブラリ
      # =========================================================
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      # =========================================================
      # 4. ツール表示内容 → LINE通知
      # =========================================================
      - name: Run LINE Notification
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.BOATAI }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

        run: |
          cat > line_notify.py <<'PY'
          import os
          import re
          import json
          import requests

          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from playwright.sync_api import sync_playwright


          # =====================================================
          # 基本設定
          # =====================================================

          JST = timezone(timedelta(hours=9))
          NOW = datetime.now(JST)

          # -----------------------------------------------------
          # GitHub Pages のツールURL
          # -----------------------------------------------------
          TOOL_URL = "https://sto323742-hue.github.io/-2026/"

          # -----------------------------------------------------
          # 通知する時間帯
          #
          # 締切10～30分前
          # -----------------------------------------------------
          MIN_MINUTES_BEFORE = 10
          MAX_MINUTES_BEFORE = 30

          # -----------------------------------------------------
          # 通知済み保存ファイル
          # -----------------------------------------------------
          STATE_FILE = Path(".boatrace_line_notified.json")


          # =====================================================
          # 通知済みデータ
          # =====================================================

          def load_state():

              if not STATE_FILE.exists():
                  return {}

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

                      if isinstance(data, dict):
                          return data

              except Exception:
                  pass

              return {}


          def save_state(state):

              # 3日以上前の履歴を削除
              limit = NOW - timedelta(days=3)

              new_state = {}

              for key, value in state.items():

                  try:

                      dt = datetime.fromisoformat(value)

                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=JST)

                      if dt >= limit:
                          new_state[key] = value

                  except Exception:
                      pass

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      new_state,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # 締切時刻
          # =====================================================

          def extract_cutoff(meta):

              match = re.search(
                  r"締切\s*(\d{1,2}:\d{2})",
                  meta
              )

              if not match:
                  return None

              return match.group(1)


          def minutes_until(cutoff):

              try:

                  h, m = map(
                      int,
                      cutoff.split(":")
                  )

                  target = NOW.replace(
                      hour=h,
                      minute=m,
                      second=0,
                      microsecond=0
                  )

                  diff = (
                      target - NOW
                  ).total_seconds() / 60

                  return int(round(diff))

              except Exception:
                  return None


          # =====================================================
          # LINE送信
          # =====================================================

          def send_line(message):

              token = os.environ.get(
                  "LINE_CHANNEL_ACCESS_TOKEN"
              )

              user_id = os.environ.get(
                  "LINE_USER_ID"
              )

              if not token:
                  raise RuntimeError(
                      "LINE_CHANNEL_ACCESS_TOKEN がありません"
                  )

              if not user_id:
                  raise RuntimeError(
                      "LINE_USER_ID がありません"
                  )

              url = (
                  "https://api.line.me/v2/bot/message/push"
              )

              headers = {
                  "Authorization":
                      f"Bearer {token}",
                  "Content-Type":
                      "application/json",
              }

              payload = {
                  "to": user_id,
                  "messages": [
                      {
                          "type": "text",
                          "text": message
                      }
                  ]
              }

              response = requests.post(
                  url,
                  headers=headers,
                  json=payload,
                  timeout=30
              )

              if response.status_code >= 400:

                  print(
                      "LINE ERROR:",
                      response.status_code,
                      response.text
                  )

                  response.raise_for_status()

              print("LINE送信成功")


          # =====================================================
          # テキスト整理
          # =====================================================

          def clean_text(text):

              if text is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()


          def combo_list(card, selector):

              items = card.locator(
                  selector
              ).all_inner_texts()

              result = []

              for x in items:

                  text = clean_text(x)

                  # ★はそのまま残す
                  if text:
                      result.append(text)

              return result


          # =====================================================
          # ツール画面から予想取得
          # =====================================================

          def get_predictions():

              predictions = []

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  page = browser.new_page(
                      viewport={
                          "width": 390,
                          "height": 844
                      }
                  )

                  print(
                      "ツールを開きます:",
                      TOOL_URL
                  )

                  page.goto(
                      TOOL_URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  # ツールの自動取得・AI分析を待つ
                  page.wait_for_timeout(12000)

                  cards = page.locator(
                      ".race"
                  )

                  count = cards.count()

                  print(
                      "表示S評価レース:",
                      count
                  )

                  for i in range(count):

                      card = cards.nth(i)

                      race_name = clean_text(
                          card.locator(
                              ".race-name"
                          ).inner_text()
                      )

                      meta = clean_text(
                          card.locator(
                              ".race-meta"
                          ).inner_text()
                      )

                      score = clean_text(
                          card.locator(
                              ".ai-score"
                          ).inner_text()
                      )

                      main = combo_list(
                          card,
                          ".main-col .combo"
                      )

                      target = combo_list(
                          card,
                          ".cover-col .combo"
                      )

                      hole = combo_list(
                          card,
                          ".hole-col .combo"
                      )

                      # -----------------------------------------
                      # 展開予測
                      # -----------------------------------------

                      scenario = ""

                      try:

                          scenario = clean_text(
                              card.locator(
                                  ".scenario-main"
                              ).inner_text()
                          )

                      except Exception:
                          scenario = ""

                      # -----------------------------------------
                      # 判断基準
                      # -----------------------------------------

                      judgment = []

                      try:

                          reason_text = (
                              card.locator(
                                  ".reason"
                              ).inner_text()
                          )

                          lines = [
                              clean_text(x)
                              for x in
                              reason_text.splitlines()
                              if clean_text(x)
                          ]

                          judgment = [
                              x for x in lines
                              if (
                                  "今回のAI判断根拠"
                                  not in x
                              )
                          ]

                      except Exception:
                          judgment = []

                      cutoff = extract_cutoff(
                          meta
                      )

                      predictions.append({
                          "race_name":
                              race_name,

                          "meta":
                              meta,

                          "score":
                              score,

                          "main":
                              main[:3],

                          "target":
                              target[:4],

                          "hole":
                              hole[:3],

                          "scenario":
                              scenario,

                          "judgment":
                              judgment,

                          "cutoff":
                              cutoff,
                      })

                  browser.close()

              return predictions


          # =====================================================
          # LINE本文
          # =====================================================

          def build_message(
              race,
              remain
          ):

              main_text = (
                  "\n".join(
                      f"・{x}"
                      for x in race["main"]
                  )
                  if race["main"]
                  else "・なし"
              )

              target_text = (
                  "\n".join(
                      f"・{x}"
                      for x in race["target"]
                  )
                  if race["target"]
                  else "・なし"
              )

              hole_text = (
                  "\n".join(
                      f"・{x}"
                      for x in race["hole"]
                  )
                  if race["hole"]
                  else "・なし"
              )

              judgment_text = ""

              if race["judgment"]:

                  judgment_text = (
                      "\n\n📊 判断基準\n"
                      +
                      "\n".join(
                          f"・{x}"
                          for x in race["judgment"]
                      )
                  )

              scenario_text = ""

              if race["scenario"]:

                  scenario_text = (
                      "\n\n🧠 展開予測\n"
                      f"{race['scenario']}"
                  )

              message = (
                  "🚤 BOATRACE AI予想\n"
                  "━━━━━━━━━━━━━━\n"
                  f"🏁 {race['race_name']}\n"
                  f"🔥 勝負度：S\n"
                  f"🤖 AI信頼スコア："
                  f"{race['score']}\n"
                  "\n"
                  f"⏰ 締切予定 {race['cutoff']}"
                  f"　｜　残り {remain}分\n"
                  "\n"
                  "本命🚤\n"
                  f"{main_text}\n"
                  "\n"
                  "狙い🚤\n"
                  f"{target_text}\n"
                  "\n"
                  "穴　🚤\n"
                  f"{hole_text}"
                  f"{scenario_text}"
                  f"{judgment_text}"
                  "\n\n"
                  "━━━━━━━━━━━━━━\n"
                  "📱ツール表示と同一買い目"
              )

              return message


          # =====================================================
          # メイン
          # =====================================================

          def main():

              state = load_state()

              predictions = (
                  get_predictions()
              )

              if not predictions:

                  print(
                      "現在S評価レースはありません"
                  )

                  save_state(state)
                  return

              sent = 0

              for race in predictions:

                  cutoff = race.get(
                      "cutoff"
                  )

                  if not cutoff:

                      print(
                          "締切取得失敗:",
                          race["race_name"]
                      )

                      continue

                  remain = minutes_until(
                      cutoff
                  )

                  if remain is None:
                      continue

                  print(
                      race["race_name"],
                      "締切:",
                      cutoff,
                      "残り:",
                      remain
                  )

                  # ---------------------------------------------
                  # 締切10～30分前だけ通知
                  # ---------------------------------------------

                  if (
                      remain <
                      MIN_MINUTES_BEFORE
                      or
                      remain >
                      MAX_MINUTES_BEFORE
                  ):

                      continue

                  # ---------------------------------------------
                  # 買い目数チェック
                  # ---------------------------------------------

                  if (
                      len(race["main"]) != 3
                      or
                      len(race["target"]) != 4
                      or
                      len(race["hole"]) != 3
                  ):

                      print(
                          "買い目数が不正なので通知しません:",
                          race["race_name"],
                          "本命",
                          len(race["main"]),
                          "狙い",
                          len(race["target"]),
                          "穴",
                          len(race["hole"])
                      )

                      continue

                  # ---------------------------------------------
                  # 日付＋会場Rで重複防止
                  # ---------------------------------------------

                  today = NOW.strftime(
                      "%Y-%m-%d"
                  )

                  key = (
                      f"{today}|"
                      f"{race['race_name']}"
                  )

                  if key in state:

                      print(
                          "通知済み:",
                          race["race_name"]
                      )

                      continue

                  # ---------------------------------------------
                  # LINE本文
                  # ---------------------------------------------

                  message = build_message(
                      race,
                      remain
                  )

                  print(message)

                  send_line(
                      message
                  )

                  state[key] = (
                      NOW.isoformat()
                  )

                  sent += 1

              save_state(state)

              print(
                  "今回のLINE通知数:",
                  sent
              )


          if __name__ == "__main__":
              main()

          PY

          python line_notify.py

      # =========================================================
      # 5. 通知済み履歴をGitHubへ保存
      # =========================================================
      - name: Save notification state
        run: |
          if [ -f .boatrace_line_notified.json ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .boatrace_line_notified.json

            if git diff --cached --quiet; then
              echo "通知履歴の変更なし"
            else
              git commit -m "Update BOATRACE LINE notification state"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin HEAD:"${GITHUB_REF_NAME}"
            fi

          fi
