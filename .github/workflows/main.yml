                  now_jst().isoformat()
              )

              print(
                  "======================================"
              )

              race_data = (
                  fetch_race_data()
              )

              races = flatten_races(
                  race_data
              )

              print(
                  "RACES:",
                  len(races)
              )

              (
                  odds_data,
                  odds_source
              ) = fetch_odds_data()

              if odds_data is None:

                  print(
                      "オッズ未取得のため"
                      "通知判定を見送ります"
                  )

                  return

              (
                  predictions,
                  raw_s_count,
                  odds_ok_count
              ) = collect_predictions(
                  races,
                  odds_data,
                  budget=1000
              )

              print(
                  "AI S評価:",
                  raw_s_count
              )

              print(
                  "オッズ条件通過:",
                  odds_ok_count
              )

              print(
                  "通知候補:",
                  len(predictions)
              )

              state = load_state()

              if (
                  state.get(
                      "last_date"
                  )
                  !=
                  today_jst()
              ):

                  state = {
                      "sent": {},
                      "last_date":
                          today_jst(),
                  }

              sent = state.setdefault(
                  "sent",
                  {}
              )

              new_count = 0

              for item in predictions:

                  analysis = item[
                      "analysis"
                  ]

                  ticket_set = item[
                      "ticket_set"
                  ]

                  tickets = item[
                      "tickets"
                  ]

                  key = race_key(
                      analysis["race"]
                  )

                  phash = prediction_hash(
                      analysis,
                      tickets
                  )

                  old_hash = sent.get(
                      key
                  )

                  if old_hash == phash:

                      print(
                          "SKIP SENT:",
                          key
                      )

                      continue

                  message = build_message(
                      analysis,
                      ticket_set,
                      tickets,
                      odds_source
                  )

                  line_push(
                      message
                  )

                  sent[key] = phash

                  new_count += 1

                  save_state(
                      state
                  )

                  time.sleep(1)

              print(
                  "NEW LINE:",
                  new_count
              )

              save_state(
                  state
              )

              print(
                  "======================================"
              )

              print(
                  "BOATRACE AI LINE END"
              )

              print(
                  "======================================"
              )

          # =====================================================
          # Python実行
          # =====================================================

          if __name__ == "__main__":
              main()

          PY

      # =========================================================
      # 5. Python実行
      # =========================================================

      - name: Run BOATRACE AI LINE

        run: |
          python line_notify.py

      # =========================================================
      # 6. 通知済み状態をGitHubへ保存
      # =========================================================

      - name: Save notification state

        run: |
          if [ -f boatrace_line_state.json ]; then

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            git add boatrace_line_state.json

            if git diff --cached --quiet; then

              echo "通知状態に変更なし"

            else

              git commit \
                -m "Update BOATRACE LINE notification state"

              git push

            fi

          else

            echo "state file not found"

          fi
