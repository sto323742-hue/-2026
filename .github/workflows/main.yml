name: BOATRACE AI LINE Notification

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boatrace-ai-line
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: BOATRACE AI LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.BOATAI }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

        run: |
          cat > line_notify.py <<'PY'

          import os
          import re
          import json
          import time
          import itertools
          import requests

          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from playwright.sync_api import sync_playwright


          # =====================================================
          # 設定
          # =====================================================

          JST = timezone(timedelta(hours=9))
          NOW = datetime.now(JST)

          TOOL_URL = "https://sto323742-hue.github.io/-2026/"


          # =====================================================
          # LINE通知設定
          # =====================================================

          # 締切1分前以降は送らない
          MIN_BEFORE = 1

          # False = ツールに予想が完成した時点で通知
          # True  = 指定時間帯だけ通知
          USE_NOTIFICATION_WINDOW = False

          WINDOW_MIN_BEFORE = 10
          WINDOW_MAX_BEFORE = 30


          # =====================================================
          # Web予想完成待ち設定
          # =====================================================

          # 最大60秒待つ
          PREDICTION_WAIT_SECONDS = 60

          # 1秒ごとに確認
          PREDICTION_CHECK_INTERVAL_MS = 1000


          # =====================================================
          # 通知履歴
          # =====================================================

          STATE_FILE = Path(
              ".boatrace_line_notified.json"
          )


          def load_state():

              if not STATE_FILE.exists():
                  return {}

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

                      if isinstance(
                          data,
                          dict
                      ):
                          return data

              except Exception as e:

                  print(
                      "履歴読込エラー:",
                      e
                  )

              return {}


          def save_state(state):

              limit = (
                  NOW
                  -
                  timedelta(days=3)
              )

              cleaned = {}

              for key, value in state.items():

                  try:

                      dt = datetime.fromisoformat(
                          value
                      )

                      if dt.tzinfo is None:

                          dt = dt.replace(
                              tzinfo=JST
                          )

                      if dt >= limit:

                          cleaned[key] = value

                  except Exception:
                      pass


              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      cleaned,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # テキスト整理
          # =====================================================

          def clean(text):

              if text is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  str(text)
              ).strip()


          def combo_only(text):

              if not text:
                  return ""

              m = re.search(
                  r"([1-6]-[1-6]-[1-6])",
                  str(text)
              )

              return (
                  m.group(1)
                  if m
                  else ""
              )


          def unique_combos(values):

              result = []
              seen = set()

              for value in values:

                  combo = combo_only(
                      value
                  )

                  if not combo:
                      continue

                  if combo in seen:
                      continue

                  seen.add(
                      combo
                  )

                  result.append(
                      combo
                  )

              return result


          # =====================================================
          # 締切時間
          # =====================================================

          def get_cutoff(meta):

              m = re.search(
                  r"締切\s*(?:予定)?\s*(\d{1,2}:\d{2})",
                  meta or ""
              )

              return (
                  m.group(1)
                  if m
                  else None
              )


          def remaining_minutes(cutoff):

              try:

                  h, m = map(
                      int,
                      cutoff.split(":")
                  )

                  target = NOW.replace(
                      hour=h,
                      minute=m,
                      second=0,
                      microsecond=0
                  )

                  return int(
                      (
                          target
                          -
                          NOW
                      ).total_seconds()
                      //
                      60
                  )

              except Exception:
                  return None


          # =====================================================
          # BOX判定
          # =====================================================

          def make_box(boats):

              result = set()

              for p in itertools.permutations(
                  boats,
                  3
              ):

                  result.add(
                      f"{p[0]}-{p[1]}-{p[2]}"
                  )

              return result


          def find_box(combos):

              combo_set = set(
                  combos
              )

              for boats in itertools.combinations(
                  range(1, 7),
                  3
              ):

                  box = make_box(
                      boats
                  )

                  if box.issubset(
                      combo_set
                  ):

                      return {
                          "boats": boats,
                          "combos": box
                      }

              return None


          # =====================================================
          # フォーメーション判定
          # =====================================================

          def formation_combos(
              first,
              second,
              third
          ):

              result = set()

              for a in first:

                  for b in second:

                      for c in third:

                          if len({
                              a,
                              b,
                              c
                          }) != 3:
                              continue

                          result.add(
                              f"{a}-{b}-{c}"
                          )

              return result


          def format_numbers(nums):

              return ",".join(
                  str(x)
                  for x in sorted(
                      nums
                  )
              )


          def find_best_formation(
              combos
          ):

              combo_set = set(
                  combos
              )

              if len(combo_set) < 2:
                  return None

              parsed = [
                  tuple(
                      map(
                          int,
                          c.split("-")
                      )
                  )
                  for c in combo_set
              ]

              first_pool = sorted(
                  set(
                      x[0]
                      for x in parsed
                  )
              )

              second_pool = sorted(
                  set(
                      x[1]
                      for x in parsed
                  )
              )

              third_pool = sorted(
                  set(
                      x[2]
                      for x in parsed
                  )
              )

              best = None


              def subsets(values):

                  out = []

                  for size in range(
                      1,
                      len(values) + 1
                  ):

                      out.extend(
                          itertools.combinations(
                              values,
                              size
                          )
                      )

                  return out


              for first in subsets(
                  first_pool
              ):

                  for second in subsets(
                      second_pool
                  ):

                      for third in subsets(
                          third_pool
                      ):

                          generated = formation_combos(
                              first,
                              second,
                              third
                          )

                          if len(
                              generated
                          ) < 2:
                              continue

                          if not generated.issubset(
                              combo_set
                          ):
                              continue

                          candidate = {
                              "first": first,
                              "second": second,
                              "third": third,
                              "combos": generated,
                              "score": len(
                                  generated
                              )
                          }

                          if (
                              best is None
                              or
                              candidate["score"]
                              >
                              best["score"]
                          ):

                              best = candidate

              return best


          # =====================================================
          # 通常 / フォーメーション / BOX
          # =====================================================

          def classify_bets(
              combos
          ):

              remaining = set(
                  combos
              )

              formations = []
              boxes = []


              while True:

                  found = find_box(
                      list(
                          remaining
                      )
                  )

                  if not found:
                      break

                  boxes.append(
                      "・".join(
                          str(x)
                          for x in found["boats"]
                      )
                  )

                  remaining -= (
                      found["combos"]
                  )


              while len(
                  remaining
              ) >= 2:

                  found = find_best_formation(
                      list(
                          remaining
                      )
                  )

                  if not found:
                      break

                  formations.append(
                      f"{format_numbers(found['first'])}"
                      f" - "
                      f"{format_numbers(found['second'])}"
                      f" - "
                      f"{format_numbers(found['third'])}"
                  )

                  remaining -= (
                      found["combos"]
                  )


              return {
                  "normal":
                      sorted(
                          remaining
                      ),

                  "formation":
                      formations,

                  "box":
                      boxes
              }
                        # =====================================================
          # Webツールから買い目を取得
          # 本命3 / 狙い4 / 穴3
          # をそのままLINEへ使用
          # =====================================================

          def extract_bet_sections(card):

              data = card.evaluate(
                  """
                  (root) => {

                    const result = {
                      main: [],
                      cover: [],
                      hole: []
                    };

                    let current = null;

                    const nodes = root.querySelectorAll(
                      '.bet-head, .ticket'
                    );

                    for (const node of nodes) {

                      if (
                        node.classList.contains('bet-head')
                      ) {

                        if (
                          node.classList.contains('main')
                        ) {
                          current = 'main';
                        }

                        else if (
                          node.classList.contains('cover')
                        ) {
                          current = 'cover';
                        }

                        else if (
                          node.classList.contains('hole')
                        ) {
                          current = 'hole';
                        }

                        else {
                          current = null;
                        }

                        continue;
                      }

                      if (
                        !node.classList.contains('ticket')
                        ||
                        !current
                      ) {
                        continue;
                      }

                      const comboNode =
                        node.querySelector('.combo');

                      if (!comboNode) {
                        continue;
                      }

                      const text =
                        comboNode.textContent || '';

                      const match = text.match(
                        /([1-6]-[1-6]-[1-6])/
                      );

                      if (!match) {
                        continue;
                      }

                      result[current].push(
                        match[1]
                      );
                    }

                    return result;
                  }
                  """
              )


              return {

                  "main":
                      unique_combos(
                          data.get(
                              "main",
                              []
                          )
                      )[:3],

                  "cover":
                      unique_combos(
                          data.get(
                              "cover",
                              []
                          )
                      )[:4],

                  "hole":
                      unique_combos(
                          data.get(
                              "hole",
                              []
                          )
                      )[:3]
              }


          # =====================================================
          # 本命3・狙い4・穴3が完成するまで待機
          # =====================================================

          def wait_for_complete_bets(
              page,
              card,
              race_name
          ):

              deadline = (
                  time.monotonic()
                  +
                  PREDICTION_WAIT_SECONDS
              )


              last_bets = {
                  "main": [],
                  "cover": [],
                  "hole": []
              }


              while (
                  time.monotonic()
                  <
                  deadline
              ):

                  try:

                      bets = extract_bet_sections(
                          card
                      )

                      last_bets = bets

                      main = bets["main"]
                      cover = bets["cover"]
                      hole = bets["hole"]


                      all_combos = (
                          main
                          +
                          cover
                          +
                          hole
                      )


                      print(
                          "予想完成待ち:",
                          race_name,
                          f"本命{len(main)}",
                          f"狙い{len(cover)}",
                          f"穴{len(hole)}"
                      )


                      # -----------------------------------------
                      # 本命3・狙い4・穴3 完成
                      # -----------------------------------------

                      if (
                          len(main) == 3
                          and
                          len(cover) == 4
                          and
                          len(hole) == 3
                      ):

                          # -------------------------------------
                          # カテゴリ間重複チェック
                          # -------------------------------------

                          if (
                              len(all_combos)
                              ==
                              len(
                                  set(
                                      all_combos
                                  )
                              )
                          ):

                              print(
                                  "✅ 予想完成:",
                                  race_name
                              )

                              print(
                                  "本命🚤:",
                                  main
                              )

                              print(
                                  "狙い🚤:",
                                  cover
                              )

                              print(
                                  "穴🚤:",
                                  hole
                              )

                              return bets


                          print(
                              "予想完成待ち・"
                              "買い目重複あり:",
                              race_name
                          )


                  except Exception as e:

                      print(
                          "予想確認エラー:",
                          race_name,
                          e
                      )


                  page.wait_for_timeout(
                      PREDICTION_CHECK_INTERVAL_MS
                  )


              # =================================================
              # 60秒待っても完成しなかった場合
              # =================================================

              print(
                  "❌ 予想完成タイムアウト:",
                  race_name,
                  f"本命{len(last_bets['main'])}",
                  f"狙い{len(last_bets['cover'])}",
                  f"穴{len(last_bets['hole'])}"
              )


              return last_bets


          # =====================================================
          # Webツール画面取得
          # =====================================================

          def get_predictions():

              results = []


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  page = browser.new_page(
                      viewport={
                          "width": 390,
                          "height": 844
                      }
                  )


                  print(
                      "OPEN:",
                      TOOL_URL
                  )


                  page.goto(
                      TOOL_URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )


                  # ---------------------------------------------
                  # レースカード表示待ち
                  # ---------------------------------------------

                  try:

                      page.wait_for_selector(
                          ".race",
                          timeout=30000
                      )

                  except Exception:

                      print(
                          "レースカード待機タイムアウト"
                      )


                  # ---------------------------------------------
                  # ページ初期描画だけ少し待つ
                  # 各レースの予想完成は
                  # wait_for_complete_bets() で確認
                  # ---------------------------------------------

                  page.wait_for_timeout(
                      3000
                  )


                  cards = page.locator(
                      ".race"
                  )


                  count = cards.count()


                  print(
                      "Web表示レース数:",
                      count
                  )


                  # =================================================
                  # 各レース
                  # =================================================

                  for i in range(
                      count
                  ):

                      card = cards.nth(
                          i
                      )


                      # ---------------------------------------------
                      # 会場・R
                      # ---------------------------------------------

                      try:

                          race_name = clean(
                              card.locator(
                                  ".race-name"
                              )
                              .first
                              .inner_text()
                          )

                      except Exception:

                          race_name = ""


                      if not race_name:

                          print(
                              "レース名取得失敗:",
                              i
                          )

                          continue


                      # ---------------------------------------------
                      # メタ情報
                      # ---------------------------------------------

                      try:

                          meta = clean(
                              card.locator(
                                  ".race-meta"
                              )
                              .first
                              .inner_text()
                          )

                      except Exception:

                          meta = ""


                      cutoff = get_cutoff(
                          meta
                      )


                      # ---------------------------------------------
                      # 本命3・狙い4・穴3が完成するまで待機
                      # ---------------------------------------------

                      try:

                          bets = wait_for_complete_bets(
                              page,
                              card,
                              race_name
                          )

                      except Exception as e:

                          print(
                              "買い目取得エラー:",
                              race_name,
                              e
                          )

                          bets = {
                              "main": [],
                              "cover": [],
                              "hole": []
                          }


                      main = bets["main"]
                      cover = bets["cover"]
                      hole = bets["hole"]


                      print(
                          "------------------------------"
                      )

                      print(
                          race_name
                      )

                      print(
                          "本命:",
                          main
                      )

                      print(
                          "狙い:",
                          cover
                      )

                      print(
                          "穴:",
                          hole
                      )


                      # ---------------------------------------------
                      # 同一買い目が複数カテゴリに
                      # 入っていないか安全確認
                      # ---------------------------------------------

                      all_combos = (
                          main
                          +
                          cover
                          +
                          hole
                      )


                      if (
                          len(all_combos)
                          !=
                          len(
                              set(
                                  all_combos
                              )
                          )
                      ):

                          print(
                              "重複買い目を検出:",
                              race_name
                          )

                          continue


                      # ---------------------------------------------
                      # 展開予測
                      # ---------------------------------------------

                      scenario = ""


                      try:

                          scenario_node = (
                              card.locator(
                                  ".scenario-main"
                              )
                          )


                          if (
                              scenario_node.count()
                              >
                              0
                          ):

                              scenario = clean(
                                  scenario_node
                                  .first
                                  .inner_text()
                              )

                      except Exception as e:

                          print(
                              "展開予測取得エラー:",
                              race_name,
                              e
                          )


                      # ---------------------------------------------
                      # 判断基準
                      # ---------------------------------------------

                      reasons = []


                      try:

                          reason_node = (
                              card.locator(
                                  ".reason"
                              )
                          )


                          if (
                              reason_node.count()
                              >
                              0
                          ):

                              reason_text = (
                                  reason_node
                                  .first
                                  .inner_text()
                              )


                              for line in (
                                  reason_text
                                  .splitlines()
                              ):

                                  line = clean(
                                      line
                                  )


                                  if not line:
                                      continue


                                  if (
                                      "今回のAI判断根拠"
                                      in line
                                      or
                                      "判断基準"
                                      ==
                                      line
                                  ):
                                      continue


                                  line = (
                                      line
                                      .replace(
                                          "・",
                                          ""
                                      )
                                      .strip()
                                  )


                                  if line:

                                      reasons.append(
                                          line
                                      )

                      except Exception as e:

                          print(
                              "判断基準取得エラー:",
                              race_name,
                              e
                          )


                      # ---------------------------------------------
                      # 3 + 4 + 3 完全一致確認
                      # ---------------------------------------------

                      valid_343 = (
                          len(main) == 3
                          and
                          len(cover) == 4
                          and
                          len(hole) == 3
                      )


                      if not valid_343:

                          print(
                              "❌ Web買い目が"
                              "3+4+3ではありません:",
                              race_name,
                              len(main),
                              len(cover),
                              len(hole)
                          )


                      # ---------------------------------------------
                      # 保存
                      # ---------------------------------------------

                      results.append({

                          "race":
                              race_name,

                          "meta":
                              meta,

                          "cutoff":
                              cutoff,

                          "main":
                              main,

                          "cover":
                              cover,

                          "hole":
                              hole,

                          "scenario":
                              scenario,

                          "reasons":
                              reasons,

                          "valid_343":
                              valid_343
                      })


                  browser.close()


              return results


          # =====================================================
          # LINE Flex用 共通テキスト
          # =====================================================

          def text_component(
              text,
              size="sm",
              weight="regular",
              color="#222222",
              align="start",
              wrap=True
          ):

              return {
                  "type": "text",
                  "text": str(text),
                  "size": size,
                  "weight": weight,
                  "color": color,
                  "align": align,
                  "wrap": wrap
              }


          # =====================================================
          # 本命 / 狙い / 穴 表示
          # =====================================================

          def bet_column(
              title,
              combos,
              header_color
          ):

              body = [

                  {
                      "type": "box",
                      "layout": "vertical",
                      "backgroundColor":
                          header_color,
                      "paddingAll": "7px",

                      "contents": [

                          text_component(
                              title,
                              size="sm",
                              weight="bold",
                              align="center"
                          )
                      ]
                  }
              ]


              for combo in combos:

                  body.append(

                      {
                          "type": "box",
                          "layout": "vertical",
                          "paddingTop": "7px",
                          "paddingBottom": "3px",

                          "contents": [

                              text_component(
                                  combo,
                                  size="md",
                                  weight="bold",
                                  align="center"
                              )
                          ]
                      }
                  )


              return {

                  "type": "box",
                  "layout": "vertical",
                  "flex": 1,
                  "margin": "xs",
                  "backgroundColor":
                      "#FFFFFF",
                  "cornerRadius": "md",
                  "contents": body
              }


          # =====================================================
          # 投票表示
          # =====================================================

          def purchase_column(
              title,
              values,
              color
          ):

              contents = [

                  {
                      "type": "box",
                      "layout": "vertical",
                      "backgroundColor":
                          color,
                      "paddingAll": "6px",

                      "contents": [

                          text_component(
                              title,
                              size="xs",
                              weight="bold",
                              color="#FFFFFF",
                              align="center"
                          )
                      ]
                  }
              ]


              if values:

                  for value in values:

                      contents.append(

                          {
                              "type": "box",
                              "layout": "vertical",
                              "paddingAll": "6px",

                              "contents": [

                                  text_component(
                                      value,
                                      size="xs",
                                      weight="bold",
                                      align="center"
                                  )
                              ]
                          }
                      )


              else:

                  contents.append(

                      {
                          "type": "box",
                          "layout": "vertical",
                          "paddingAll": "6px",

                          "contents": [

                              text_component(
                                  "－",
                                  size="xs",
                                  align="center",
                                  color="#999999"
                              )
                          ]
                      }
                  )


              return {

                  "type": "box",
                  "layout": "vertical",
                  "flex": 1,
                  "margin": "xs",
                  "cornerRadius": "md",
                  "backgroundColor":
                      "#FFFFFF",
                  "contents":
                      contents
              }
                        # =====================================================
          # LINE Flex作成
          # =====================================================

          def build_flex(race, remain):

              all_combos = (
                  race["main"]
                  +
                  race["cover"]
                  +
                  race["hole"]
              )


              classified = classify_bets(
                  all_combos
              )


              body = []


              # -----------------------------------------------
              # タイトル
              # -----------------------------------------------

              body.append(
                  text_component(
                      "🚤 BOATRACE AI予想",
                      size="lg",
                      weight="bold"
                  )
              )


              body.append({
                  "type": "separator",
                  "margin": "md"
              })


              # -----------------------------------------------
              # 会場・R
              # -----------------------------------------------

              body.append(
                  {
                      "type": "box",
                      "layout": "vertical",
                      "margin": "md",

                      "contents": [

                          text_component(
                              race["race"],
                              size="xl",
                              weight="bold"
                          )
                      ]
                  }
              )


              # -----------------------------------------------
              # 締切予定 / 残り時間
              # -----------------------------------------------

              body.append(
                  {
                      "type": "box",
                      "layout": "horizontal",
                      "margin": "md",

                      "contents": [

                          text_component(
                              f"⏰ 締切予定 {race['cutoff']}",
                              size="sm",
                              weight="bold"
                          ),

                          text_component(
                              f"残り {remain}分",
                              size="sm",
                              weight="bold",
