name: BOATRACE AI LINE Notification

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boatrace-ai-line
  cancel-in-progress: false

jobs:

  notify:

    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Repository
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Python
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # =========================================================
      # 3. Packages
      # =========================================================

      - name: Install packages

        run: |

          python -m pip install --upgrade pip

          pip install requests playwright

          python -m playwright install --with-deps chromium


      # =========================================================
      # 4. BOATRACE AI → LINE
      # =========================================================

      - name: BOATRACE AI LINE

        env:

          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.BOATAI }}

          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}


        run: |

          cat > line_notify.py <<'PY'

          import os
          import re
          import json
          import time
          import itertools
          import requests

          from pathlib import Path

          from datetime import (
              datetime,
              timedelta,
              timezone
          )

          from playwright.sync_api import (
              sync_playwright
          )


          # =====================================================
          # 基本設定
          # =====================================================

          JST = timezone(
              timedelta(hours=9)
          )


          TOOL_URL = (
              "https://sto323742-hue.github.io/-2026/"
          )


          STATE_FILE = Path(
              ".boatrace_line_notified.json"
          )


          # =====================================================
          # LINE通知設定
          # =====================================================

          # 締切1分前以降は通知しない

          MIN_BEFORE = 1


          # False
          # Web側で予想完成後、
          # 通知可能ならすぐ通知

          USE_NOTIFICATION_WINDOW = False


          WINDOW_MIN_BEFORE = 10

          WINDOW_MAX_BEFORE = 30


          # =====================================================
          # Web予想完成待ち
          # =====================================================

          PREDICTION_WAIT_SECONDS = 60

          PREDICTION_CHECK_INTERVAL_MS = 1000


          # =====================================================
          # 現在時刻
          # =====================================================

          def now_jst():

              return datetime.now(
                  JST
              )


          # =====================================================
          # 通知履歴
          # =====================================================

          def load_state():

              if not STATE_FILE.exists():

                  return {}


              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(
                          f
                      )


                      if isinstance(
                          data,
                          dict
                      ):

                          return data


              except Exception as e:

                  print(
                      "履歴読込エラー:",
                      e
                  )


              return {}


          def save_state(state):

              limit = (
                  now_jst()
                  -
                  timedelta(days=3)
              )


              cleaned = {}


              for key, value in state.items():

                  try:

                      dt = datetime.fromisoformat(
                          value
                      )


                      if dt.tzinfo is None:

                          dt = dt.replace(
                              tzinfo=JST
                          )


                      if dt >= limit:

                          cleaned[key] = value


                  except Exception:

                      pass


              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      cleaned,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # テキスト整理
          # =====================================================

          def clean(text):

              if text is None:

                  return ""


              return re.sub(
                  r"\s+",
                  " ",
                  str(text)
              ).strip()


          def combo_only(text):

              if not text:

                  return ""


              m = re.search(
                  r"([1-6]-[1-6]-[1-6])",
                  str(text)
              )


              if not m:

                  return ""


              return m.group(1)


          # =====================================================
          # オッズ
          # =====================================================

          def parse_odds(text):

              if not text:

                  return 0.0


              m = re.search(
                  r"オッズ\s*([0-9]+(?:\.[0-9]+)?)倍",
                  str(text)
              )


              if not m:

                  m = re.search(
                      r"([0-9]+(?:\.[0-9]+)?)倍",
                      str(text)
                  )


              if not m:

                  return 0.0


              try:

                  return float(
                      m.group(1)
                  )

              except Exception:

                  return 0.0


          # =====================================================
          # 人気順位
          # =====================================================

          def parse_popularity(text):

              if not text:

                  return 0


              m = re.search(
                  r"人気\s*([0-9]+)位",
                  str(text)
              )


              if not m:

                  return 0


              try:

                  return int(
                      m.group(1)
                  )

              except Exception:

                  return 0


          # =====================================================
          # 買い目オブジェクト整理
          # =====================================================

          def unique_tickets(values):

              result = []

              seen = set()


              for value in values:

                  if not isinstance(
                      value,
                      dict
                  ):

                      continue


                  combo = combo_only(
                      value.get(
                          "combo",
                          ""
                      )
                  )


                  if not combo:

                      continue


                  if combo in seen:

                      continue


                  seen.add(
                      combo
                  )


                  try:

                      odds = float(
                          value.get(
                              "odds",
                              0
                          )
                          or
                          0
                      )

                  except Exception:

                      odds = 0.0


                  try:

                      popularity = int(
                          value.get(
                              "popularity",
                              0
                          )
                          or
                          0
                      )

                  except Exception:

                      popularity = 0


                  result.append({

                      "combo":
                          combo,

                      "odds":
                          odds,

                      "popularity":
                          popularity

                  })


              return result


          # =====================================================
          # 買い目からコンボだけ取得
          # =====================================================

          def ticket_combos(tickets):

              return [

                  x["combo"]

                  for x in tickets

                  if x.get(
                      "combo"
                  )

              ]


          # =====================================================
          # 残り時間
          # =====================================================

          def remaining_minutes(cutoff):

              try:

                  h, m = map(
                      int,
                      cutoff.split(":")
                  )


                  now = now_jst()


                  target = now.replace(

                      hour=h,

                      minute=m,

                      second=0,

                      microsecond=0

                  )


                  seconds = (
                      target
                      -
                      now
                  ).total_seconds()


                  return int(
                      seconds // 60
                  )


              except Exception as e:

                  print(
                      "残り時間計算エラー:",
                      cutoff,
                      e
                  )


                  return None


          # =====================================================
          # 残り時間表示
          # =====================================================

          def remaining_text(minutes):

              if minutes is None:

                  return "--"


              if minutes <= 0:

                  return "締切"


              if minutes >= 60:

                  h = minutes // 60

                  m = minutes % 60


                  return (
                      f"{h}時間{m}分"
                  )


              return (
                  f"{minutes}分"
              )


          # =====================================================
          # オッズ帯チェック
          # =====================================================

          def odds_band_ok(
              group,
              odds
          ):

              if odds <= 0:

                  return False


              if group == "main":

                  return (
                      odds <= 15.0
                  )


              if group == "cover":

                  return (
                      odds > 15.0
                      and
                      odds < 80.0
                  )


              if group == "hole":

                  return (
                      odds >= 80.0
                  )


              return False          
          # =====================================================
          # BOX
          # =====================================================

          def make_box(boats):

              result = set()


              for p in itertools.permutations(
                  boats,
                  3
              ):

                  result.add(
                      f"{p[0]}-{p[1]}-{p[2]}"
                  )


              return result


          def find_box(combos):

              combo_set = set(
                  combos
              )


              for boats in itertools.combinations(
                  range(1, 7),
                  3
              ):

                  box = make_box(
                      boats
                  )


                  if box.issubset(
                      combo_set
                  ):

                      return {

                          "boats":
                              boats,

                          "combos":
                              box

                      }


              return None


          # =====================================================
          # フォーメーション
          # =====================================================

          def formation_combos(
              first,
              second,
              third
          ):

              result = set()


              for a in first:

                  for b in second:

                      for c in third:

                          if len({
                              a,
                              b,
                              c
                          }) != 3:

                              continue


                          result.add(
                              f"{a}-{b}-{c}"
                          )


              return result


          def format_numbers(nums):

              return ",".join(

                  str(x)

                  for x in sorted(
                      nums
                  )

              )


          def find_best_formation(
              combos
          ):

              combo_set = set(
                  combos
              )


              if len(
                  combo_set
              ) < 2:

                  return None


              parsed = [

                  tuple(
                      map(
                          int,
                          c.split("-")
                      )
                  )

                  for c in combo_set

              ]


              first_pool = sorted(

                  set(
                      x[0]
                      for x in parsed
                  )

              )


              second_pool = sorted(

                  set(
                      x[1]
                      for x in parsed
                  )

              )


              third_pool = sorted(

                  set(
                      x[2]
                      for x in parsed
                  )

              )


              def subsets(values):

                  out = []


                  for size in range(
                      1,
                      len(values) + 1
                  ):

                      out.extend(

                          itertools.combinations(
                              values,
                              size
                          )

                      )


                  return out


              best = None


              for first in subsets(
                  first_pool
              ):

                  for second in subsets(
                      second_pool
                  ):

                      for third in subsets(
                          third_pool
                      ):

                          generated = formation_combos(
                              first,
                              second,
                              third
                          )


                          if len(
                              generated
                          ) < 2:

                              continue


                          if not generated.issubset(
                              combo_set
                          ):

                              continue


                          candidate = {

                              "first":
                                  first,

                              "second":
                                  second,

                              "third":
                                  third,

                              "combos":
                                  generated,

                              "score":
                                  len(
                                      generated
                                  )

                          }


                          if (
                              best is None
                              or
                              candidate["score"]
                              >
                              best["score"]
                          ):

                              best = candidate


              return best


          # =====================================================
          # 通常 / フォーメーション / BOX
          # =====================================================

          def classify_bets(
              combos
          ):

              remaining = set(
                  combos
              )


              formations = []

              boxes = []


              while True:

                  found = find_box(
                      list(
                          remaining
                      )
                  )


                  if not found:

                      break


                  boxes.append(

                      "・".join(
                          str(x)
                          for x in found["boats"]
                      )

                  )


                  remaining -= (
                      found["combos"]
                  )


              while len(
                  remaining
              ) >= 2:

                  found = find_best_formation(
                      list(
                          remaining
                      )
                  )


                  if not found:

                      break


                  formations.append(

                      f"{format_numbers(found['first'])}"
                      f" - "
                      f"{format_numbers(found['second'])}"
                      f" - "
                      f"{format_numbers(found['third'])}"

                  )


                  remaining -= (
                      found["combos"]
                  )


              return {

                  "normal":
                      sorted(
                          remaining
                      ),

                  "formation":
                      formations,

                  "box":
                      boxes

              }


          # =====================================================
          # Webツールから
          # 本命3 / 狙い4 / 穴3
          # ＋ オッズ
          # ＋ 人気順位
          # を取得
          # =====================================================

          def extract_bet_sections(card):

              data = card.evaluate(
                  """
                  (root) => {

                    const result = {
                      main: [],
                      cover: [],
                      hole: []
                    };

                    let current = null;


                    const nodes =
                      root.querySelectorAll(
                        '.bet-head, .ticket'
                      );


                    for (const node of nodes) {


                      if (
                        node.classList.contains(
                          'bet-head'
                        )
                      ) {

                        if (
                          node.classList.contains(
                            'main'
                          )
                        ) {

                          current = 'main';

                        }

                        else if (
                          node.classList.contains(
                            'cover'
                          )
                        ) {

                          current = 'cover';

                        }

                        else if (
                          node.classList.contains(
                            'hole'
                          )
                        ) {

                          current = 'hole';

                        }

                        else {

                          current = null;

                        }


                        continue;
                      }


                      if (
                        !node.classList.contains(
                          'ticket'
                        )
                        ||
                        !current
                      ) {

                        continue;
                      }


                      const comboNode =
                        node.querySelector(
                          '.combo'
                        );


                      const subNode =
                        node.querySelector(
                          '.ticket-sub'
                        );


                      if (!comboNode) {

                        continue;
                      }


                      const comboText =
                        comboNode.textContent
                        || '';


                      const comboMatch =
                        comboText.match(
                          /([1-6]-[1-6]-[1-6])/
                        );


                      if (!comboMatch) {

                        continue;
                      }


                      const subText =
                        subNode
                          ?(
                              subNode.textContent
                              || ''
                            )
                          :'';


                      const oddsMatch =
                        subText.match(
                          /オッズ\\s*([0-9]+(?:\\.[0-9]+)?)倍/
                        );


                      const popularityMatch =
                        subText.match(
                          /人気\\s*([0-9]+)位/
                        );


                      result[current].push({

                        combo:
                          comboMatch[1],

                        odds:
                          oddsMatch
                            ?Number(
                                oddsMatch[1]
                              )
                            :0,

                        popularity:
                          popularityMatch
                            ?Number(
                                popularityMatch[1]
                              )
                            :0

                      });

                    }


                    return result;

                  }
                  """
              )


              return {

                  "main":
                      unique_tickets(
                          data.get(
                              "main",
                              []
                          )
                      )[:3],

                  "cover":
                      unique_tickets(
                          data.get(
                              "cover",
                              []
                          )
                      )[:4],

                  "hole":
                      unique_tickets(
                          data.get(
                              "hole",
                              []
                          )
                      )[:3]

              }


          # =====================================================
          # 3 + 4 + 3 完成確認
          # ＋ オッズ帯チェック
          # =====================================================

          def validate_bets(
              bets,
              race_name=""
          ):

              main = bets.get(
                  "main",
                  []
              )


              cover = bets.get(
                  "cover",
                  []
              )


              hole = bets.get(
                  "hole",
                  []
              )


              if len(main) != 3:

                  print(
                      "本命3点未完成:",
                      race_name,
                      len(main)
                  )

                  return False


              if len(cover) != 4:

                  print(
                      "狙い4点未完成:",
                      race_name,
                      len(cover)
                  )

                  return False


              if len(hole) != 3:

                  print(
                      "穴3点未完成:",
                      race_name,
                      len(hole)
                  )

                  return False


              all_tickets = (
                  main
                  +
                  cover
                  +
                  hole
              )


              all_combos = ticket_combos(
                  all_tickets
              )


              if len(
                  all_combos
              ) != 10:

                  print(
                      "10点未完成:",
                      race_name,
                      len(all_combos)
                  )

                  return False


              if len(
                  set(
                      all_combos
                  )
              ) != 10:

                  print(
                      "買い目重複あり:",
                      race_name
                  )

                  return False


              # ----------------------------------------------
              # 本命🚤 15.0倍以下
              # ----------------------------------------------

              for ticket in main:

                  odds = float(
                      ticket.get(
                          "odds",
                          0
                      )
                      or
                      0
                  )


                  if not odds_band_ok(
                      "main",
                      odds
                  ):

                      print(
                          "❌ 本命オッズ条件違反:",
                          race_name,
                          ticket.get("combo"),
                          odds
                      )

                      return False


              # ----------------------------------------------
              # 狙い🚤 15.0倍超〜80.0倍未満
              # ----------------------------------------------

              for ticket in cover:

                  odds = float(
                      ticket.get(
                          "odds",
                          0
                      )
                      or
                      0
                  )


                  if not odds_band_ok(
                      "cover",
                      odds
                  ):

                      print(
                          "❌ 狙いオッズ条件違反:",
                          race_name,
                          ticket.get("combo"),
                          odds
                      )

                      return False


              # ----------------------------------------------
              # 穴🚤 80.0倍以上
              # ----------------------------------------------

              for ticket in hole:

                  odds = float(
                      ticket.get(
                          "odds",
                          0
                      )
                      or
                      0
                  )


                  if not odds_band_ok(
                      "hole",
                      odds
                  ):

                      print(
                          "❌ 穴オッズ条件違反:",
                          race_name,
                          ticket.get("combo"),
                          odds
                      )

                      return False


              return True


          # =====================================================
          # 3 + 4 + 3 完成待ち
          # =====================================================

          def wait_for_complete_bets(
              page,
              card,
              race_name
          ):

              deadline = (
                  time.monotonic()
                  +
                  PREDICTION_WAIT_SECONDS
              )


              last_bets = {

                  "main": [],

                  "cover": [],

                  "hole": []

              }


              while (
                  time.monotonic()
                  <
                  deadline
              ):

                  try:

                      bets = extract_bet_sections(
                          card
                      )


                      last_bets = bets


                      main = bets[
                          "main"
                      ]


                      cover = bets[
                          "cover"
                      ]


                      hole = bets[
                          "hole"
                      ]


                      print(
                          "予想完成待ち:",
                          race_name,
                          f"本命{len(main)}",
                          f"狙い{len(cover)}",
                          f"穴{len(hole)}"
                      )


                      if validate_bets(
                          bets,
                          race_name
                      ):

                          print(
                              "✅ 予想完成:",
                              race_name
                          )


                          print(
                              "本命🚤:",
                              [
                                  (
                                      x["combo"],
                                      x["odds"]
                                  )
                                  for x in main
                              ]
                          )


                          print(
                              "狙い🚤:",
                              [
                                  (
                                      x["combo"],
                                      x["odds"]
                                  )
                                  for x in cover
                              ]
                          )


                          print(
                              "穴🚤:",
                              [
                                  (
                                      x["combo"],
                                      x["odds"]
                                  )
                                  for x in hole
                              ]
                          )


                          return bets


                  except Exception as e:

                      print(
                          "予想確認エラー:",
                          race_name,
                          e
                      )


                  page.wait_for_timeout(
                      PREDICTION_CHECK_INTERVAL_MS
                  )


              print(
                  "❌ 予想完成タイムアウト:",
                  race_name,
                  f"本命{len(last_bets['main'])}",
                  f"狙い{len(last_bets['cover'])}",
                  f"穴{len(last_bets['hole'])}"
              )


              return None


          # =====================================================
          # 買い目表示
          # =====================================================

          def format_ticket_line(
              ticket
          ):

              combo = ticket.get(
                  "combo",
                  ""
              )


              odds = float(
                  ticket.get(
                      "odds",
                      0
                  )
                  or
                  0
              )


              popularity = int(
                  ticket.get(
                      "popularity",
                      0
                  )
                  or
                  0
              )


              if (
                  odds > 0
                  and
                  popularity > 0
              ):

                  return (
                      f"{combo}　"
                      f"{odds:.1f}倍"
                      f"（人気{popularity}位）"
                  )


              if odds > 0:

                  return (
                      f"{combo}　"
                      f"{odds:.1f}倍"
                  )


              return combo


          def tickets_text(
              tickets
          ):

              return "\n".join(

                  format_ticket_line(
                      x
                  )

                  for x in tickets

              )  
          # =====================================================
          # 投票方法表示
          # =====================================================

          def betting_summary(
              bets
          ):

              all_combos = (

                  ticket_combos(
                      bets.get(
                          "main",
                          []
                      )
                  )

                  +

                  ticket_combos(
                      bets.get(
                          "cover",
                          []
                      )
                  )

                  +

                  ticket_combos(
                      bets.get(
                          "hole",
                          []
                      )
                  )

              )


              classified = classify_bets(
                  all_combos
              )


              lines = []


              if classified["normal"]:

                  lines.append(
                      "通常"
                  )


                  for combo in classified[
                      "normal"
                  ]:

                      lines.append(
                          combo
                      )


              for f in classified[
                  "formation"
              ]:

                  lines.append(
                      "フォーメーション"
                  )

                  lines.append(
                      f
                  )


              for b in classified[
                  "box"
              ]:

                  lines.append(
                      "BOX"
                  )

                  lines.append(
                      b
                  )


              return "\n".join(
                  lines
              )


          # =====================================================
          # レース名取得
          # =====================================================

          def race_name_from_card(
              card
          ):

              try:

                  return clean(

                      card.locator(
                          ".race-name"
                      ).inner_text()

                  )

              except Exception:

                  return ""


          # =====================================================
          # 締切予定取得
          # =====================================================

          def cutoff_from_card(
              card
          ):

              try:

                  boxes = card.locator(
                      ".time-box"
                  )


                  count = boxes.count()


                  for i in range(
                      count
                  ):

                      box = boxes.nth(
                          i
                      )


                      label = clean(

                          box.locator(
                              "small"
                          ).inner_text()

                      )


                      if (
                          "締切予定"
                          not in label
                      ):

                          continue


                      value = clean(

                          box.locator(
                              "b"
                          ).inner_text()

                      )


                      if re.fullmatch(
                          r"\d{2}:\d{2}",
                          value
                      ):

                          return value


              except Exception as e:

                  print(
                      "締切取得エラー:",
                      e
                  )


              return ""


          # =====================================================
          # Web側残り時間取得
          # =====================================================

          def web_remaining_from_card(
              card
          ):

              try:

                  boxes = card.locator(
                      ".time-box"
                  )


                  count = boxes.count()


                  for i in range(
                      count
                  ):

                      box = boxes.nth(
                          i
                      )


                      label = clean(

                          box.locator(
                              "small"
                          ).inner_text()

                      )


                      if (
                          "残り時間"
                          not in label
                      ):

                          continue


                      return clean(

                          box.locator(
                              "b"
                          ).inner_text()

                      )


              except Exception as e:

                  print(
                      "残り時間取得エラー:",
                      e
                  )


              return ""


          # =====================================================
          # AI信頼スコア
          # =====================================================

          def ai_score_from_card(
              card
          ):

              try:

                  return clean(

                      card.locator(
                          ".ai-score"
                      ).inner_text()

                  )

              except Exception:

                  return ""


          # =====================================================
          # AI展開予測
          # =====================================================

          def scenario_from_card(
              card
          ):

              try:

                  root = card.locator(
                      ".scenario-main"
                  )


                  if root.count() == 0:

                      return ""


                  strong = clean(

                      root.locator(
                          "strong"
                      ).inner_text()

                  )


                  pct = clean(

                      root.locator(
                          "span"
                      ).inner_text()

                  )


                  return clean(
                      f"{strong} {pct}"
                  )


              except Exception as e:

                  print(
                      "展開予測取得エラー:",
                      e
                  )


              return ""


          # =====================================================
          # 判断基準
          # =====================================================

          def reason_from_card(
              card
          ):

              try:

                  root = card.locator(
                      ".reason"
                  )


                  if root.count() == 0:

                      return ""


                  text = clean(
                      root.inner_text()
                  )


                  text = re.sub(
                      r"^判断基準\s*",
                      "",
                      text
                  )


                  return text


              except Exception as e:

                  print(
                      "判断基準取得エラー:",
                      e
                  )


              return ""


          # =====================================================
          # 会場・R番号
          # =====================================================

          def split_race_name(
              race_name
          ):

              race_name = clean(
                  race_name
              )


              m = re.search(
                  r"(.+?)\s+(\d+)R",
                  race_name
              )


              if not m:

                  return (
                      race_name,
                      ""
                  )


              return (
                  clean(
                      m.group(1)
                  ),
                  f"{m.group(2)}R"
              )


          # =====================================================
          # LINE用Flexテキスト
          # =====================================================

          def flex_text(
              text,
              size="sm",
              color="#FFFFFF",
              weight="regular",
              wrap=True,
              margin=None
          ):

              item = {

                  "type":
                      "text",

                  "text":
                      str(text),

                  "size":
                      size,

                  "color":
                      color,

                  "weight":
                      weight,

                  "wrap":
                      wrap

              }


              if margin:

                  item[
                      "margin"
                  ] = margin


              return item


          # =====================================================
          # 買い目ブロック
          # =====================================================

          def bet_group_block(
              title,
              tickets,
              color
          ):

              contents = [

                  flex_text(
                      title,
                      size="md",
                      color=color,
                      weight="bold"
                  )

              ]


              for ticket in tickets:

                  contents.append(

                      flex_text(
                          format_ticket_line(
                              ticket
                          ),
                          size="sm",
                          color="#FFFFFF",
                          margin="sm"
                      )

                  )


              return {

                  "type":
                      "box",

                  "layout":
                      "vertical",

                  "margin":
                      "md",

                  "contents":
                      contents

              }


          # =====================================================
          # LINE Flex Message
          # =====================================================

          def build_flex_message(
              race_name,
              cutoff,
              remain,
              ai_score,
              scenario,
              reason,
              bets
          ):

              venue, race_no = split_race_name(
                  race_name
              )


              body = []


              # ----------------------------------------------
              # タイトル
              # ----------------------------------------------

              body.append(

                  flex_text(
                      "🚤 BOAT RACE AI予想",
                      size="lg",
                      color="#F2CD67",
                      weight="bold"
                  )

              )


              body.append(

                  flex_text(
                      f"{venue} {race_no}",
                      size="xl",
                      color="#FFFFFF",
                      weight="bold",
                      margin="sm"
                  )

              )


              # ----------------------------------------------
              # S評価 / AIスコア
              # ----------------------------------------------

              if ai_score:

                  body.append({

                      "type":
                          "box",

                      "layout":
                          "horizontal",

                      "margin":
                          "md",

                      "contents":[

                          flex_text(
                              "勝負度",
                              size="sm",
                              color="#AAAAAA"
                          ),

                          flex_text(
                              "S",
                              size="md",
                              color="#F2CD67",
                              weight="bold"
                          ),

                          flex_text(
                              f"AI {ai_score}",
                              size="sm",
                              color="#FFFFFF",
                              weight="bold"
                          )

                      ]

                  })


              # ----------------------------------------------
              # 締切予定 / 残り時間
              # 横並び
              # ----------------------------------------------

              body.append({

                  "type":
                      "box",

                  "layout":
                      "horizontal",

                  "margin":
                      "md",

                  "spacing":
                      "md",

                  "contents":[

                      {

                          "type":
                              "box",

                          "layout":
                              "vertical",

                          "flex":
                              1,

                          "contents":[

                              flex_text(
                                  "締切予定",
                                  size="xs",
                                  color="#999999"
                              ),

                              flex_text(
                                  cutoff or "--:--",
                                  size="md",
                                  color="#F2CD67",
                                  weight="bold"
                              )

                          ]

                      },


                      {

                          "type":
                              "box",

                          "layout":
                              "vertical",

                          "flex":
                              1,

                          "contents":[

                              flex_text(
                                  "残り時間",
                                  size="xs",
                                  color="#999999"
                              ),

                              flex_text(
                                  remain or "--",
                                  size="md",
                                  color="#F2CD67",
                                  weight="bold"
                              )

                          ]

                      }

                  ]

              })


              # ----------------------------------------------
              # 本命🚤
              # ----------------------------------------------

              body.append(

                  bet_group_block(
                      "本命🚤",
                      bets.get(
                          "main",
                          []
                      ),
                      "#71BAFF"
                  )

              )


              # ----------------------------------------------
              # 狙い🚤
              # ----------------------------------------------

              body.append(

                  bet_group_block(
                      "狙い🚤",
                      bets.get(
                          "cover",
                          []
                      ),
                      "#E8D7A4"
                  )

              )


              # ----------------------------------------------
              # 穴🚤
              # ----------------------------------------------

              body.append(

                  bet_group_block(
                      "穴🚤",
                      bets.get(
                          "hole",
                          []
                      ),
                      "#FF9B52"
                  )

              )


              # ----------------------------------------------
              # 投票
              # ----------------------------------------------

              bet_text = betting_summary(
                  bets
              )


              if bet_text:

                  body.append(

                      flex_text(
                          "🎟 投票",
                          size="md",
                          color="#F2CD67",
                          weight="bold",
                          margin="lg"
                      )

                  )


                  body.append(

                      flex_text(
                          bet_text,
                          size="sm",
                          color="#FFFFFF",
                          margin="sm"
                      )

                  )


              # ----------------------------------------------
              # 展開予測
              # ----------------------------------------------

              if scenario:

                  body.append(

                      flex_text(
                          "🧠 展開予測",
                          size="md",
                          color="#F2CD67",
                          weight="bold",
                          margin="lg"
                      )

                  )


                  body.append(

                      flex_text(
                          scenario,
                          size="sm",
                          color="#FFFFFF",
                          weight="bold",
                          margin="sm"
                      )

                  )


              # ----------------------------------------------
              # 判断基準
              # ----------------------------------------------

              if reason:

                  body.append(

                      flex_text(
                          "📌 判断基準",
                          size="md",
                          color="#F2CD67",
                          weight="bold",
                          margin="lg"
                      )

                  )


                  body.append(

                      flex_text(
                          reason,
                          size="xs",
                          color="#BBBBBB",
                          margin="sm"
                      )

                  )


              return {

                  "type":
                      "flex",

                  "altText":
                      f"{race_name} AI予想",

                  "contents":{

                      "type":
                          "bubble",

                      "size":
                          "mega",

                      "body":{

                          "type":
                              "box",

                          "layout":
                              "vertical",

                          "backgroundColor":
                              "#090909",

                          "contents":
                              body

                      }

                  }

              }


          # =====================================================
          # LINE送信
          # =====================================================

          def send_line(
              message
          ):

              token = os.getenv(
                  "LINE_CHANNEL_ACCESS_TOKEN",
                  ""
              )


              user_id = os.getenv(
                  "LINE_USER_ID",
                  ""
              )


              if not token:

                  raise RuntimeError(
                      "LINE_CHANNEL_ACCESS_TOKEN がありません"
                  )


              if not user_id:

                  raise RuntimeError(
                      "LINE_USER_ID がありません"
                  )


              url = (
                  "https://api.line.me/v2/bot/message/push"
              )


              headers = {

                  "Authorization":
                      f"Bearer {token}",

                  "Content-Type":
                      "application/json"

              }


              payload = {

                  "to":
                      user_id,

                  "messages":[
                      message
                  ]

              }


              response = requests.post(
                  url,
                  headers=headers,
                  json=payload,
                  timeout=30
              )


              print(
                  "LINE status:",
                  response.status_code
              )


              if response.status_code >= 400:

                  print(
                      "LINE error:",
                      response.text
                  )


                  raise RuntimeError(
                      f"LINE送信失敗 {response.status_code}"
                  )


              return True


          # =====================================================
          # 通知可能時間チェック
          # =====================================================

          def notification_allowed(
              remaining
          ):

              if remaining is None:

                  return False


              # 締切済み・締切直前
              if remaining < MIN_BEFORE:

                  return False


              if not USE_NOTIFICATION_WINDOW:

                  return True


              return (
                  remaining >= WINDOW_MIN_BEFORE
                  and
                  remaining <= WINDOW_MAX_BEFORE
              )


          # =====================================================
          # 日付キー
          # =====================================================

          def today_key():

              return now_jst().strftime(
                  "%Y-%m-%d"
              )          
          # =====================================================
          # メイン処理
          # =====================================================

          def main():

              print(
                  "=============================================="
              )

              print(
                  "BOATRACE AI LINE START"
              )

              print(
                  "現在時刻:",
                  now_jst().isoformat()
              )

              print(
                  "=============================================="
              )


              state = load_state()


              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )


                  page = browser.new_page(

                      viewport={
                          "width": 1280,
                          "height": 2000
                      },

                      locale="ja-JP"

                  )


                  # ---------------------------------------------
                  # GitHub Pagesを開く
                  # ---------------------------------------------

                  print(
                      "Webツールを開きます:",
                      TOOL_URL
                  )


                  page.goto(

                      TOOL_URL,

                      wait_until="domcontentloaded",

                      timeout=120000

                  )


                  # JavaScript予想完成待ち

                  page.wait_for_timeout(
                      5000
                  )


                  # ---------------------------------------------
                  # レースカード出現待ち
                  # ---------------------------------------------

                  try:

                      page.wait_for_selector(

                          ".race",

                          timeout=60000

                      )

                  except Exception:

                      print(
                          "現在表示可能なS評価レースはありません"
                      )

                      browser.close()

                      save_state(
                          state
                      )

                      return


                  cards = page.locator(
                      ".race"
                  )


                  count = cards.count()


                  print(
                      "S評価レース数:",
                      count
                  )


                  # ---------------------------------------------
                  # 各レース確認
                  # ---------------------------------------------

                  for i in range(
                      count
                  ):

                      card = cards.nth(
                          i
                      )


                      try:

                          race_name = race_name_from_card(
                              card
                          )


                          if not race_name:

                              print(
                                  "レース名取得失敗"
                              )

                              continue


                          print(
                              ""
                          )

                          print(
                              "------------------------------------------"
                          )

                          print(
                              "確認:",
                              race_name
                          )


                          # ---------------------------------
                          # 締切予定
                          # ---------------------------------

                          cutoff = cutoff_from_card(
                              card
                          )


                          if not cutoff:

                              print(
                                  "締切予定取得失敗:",
                                  race_name
                              )

                              continue


                          remaining = remaining_minutes(
                              cutoff
                          )


                          print(
                              "締切:",
                              cutoff
                          )


                          print(
                              "残り:",
                              remaining
                          )


                          # ---------------------------------
                          # 通知可能時間か確認
                          # ---------------------------------

                          if not notification_allowed(
                              remaining
                          ):

                              print(
                                  "通知時間外:",
                                  race_name,
                                  remaining
                              )

                              continue


                          # ---------------------------------
                          # 通知済み確認
                          # ---------------------------------

                          notify_key = (
                              f"{today_key()}|"
                              f"{race_name}"
                          )


                          if notify_key in state:

                              print(
                                  "通知済み:",
                                  race_name
                              )

                              continue


                          # ---------------------------------
                          # 買い目表示ボタンを開く
                          # ---------------------------------

                          try:

                              detail_button = card.locator(
                                  ".gold-btn"
                              )


                              if detail_button.count() > 0:

                                  detail = card.locator(
                                      ".detail"
                                  )


                                  display_value = detail.evaluate(
                                      """
                                      (el) => {
                                        return window.getComputedStyle(el).display;
                                      }
                                      """
                                  )


                                  if display_value != "block":

                                      detail_button.click()

                                      page.wait_for_timeout(
                                          500
                                      )


                          except Exception as e:

                              print(
                                  "買い目展開エラー:",
                                  race_name,
                                  e
                              )


                          # ---------------------------------
                          # Web予想の3・4・3完成待ち
                          # ---------------------------------

                          bets = wait_for_complete_bets(

                              page,

                              card,

                              race_name

                          )


                          if not bets:

                              print(
                                  "予想未完成のため通知しません:",
                                  race_name
                              )

                              continue


                          # ---------------------------------
                          # 最終オッズ帯チェック
                          # ---------------------------------

                          if not validate_bets(
                              bets,
                              race_name
                          ):

                              print(
                                  "オッズ帯条件不一致のため通知しません:",
                                  race_name
                              )

                              continue


                          # ---------------------------------
                          # AI信頼スコア
                          # ---------------------------------

                          ai_score = ai_score_from_card(
                              card
                          )


                          # ---------------------------------
                          # Web側残り時間
                          # ---------------------------------

                          web_remain = web_remaining_from_card(
                              card
                          )


                          # GitHub Actions側でも再計算
                          # Web表示よりこちらを優先

                          calc_remain = remaining_text(
                              remaining
                          )


                          remain = (
                              calc_remain
                              or
                              web_remain
                              or
                              "--"
                          )


                          # ---------------------------------
                          # 展開予測
                          # ---------------------------------

                          scenario = scenario_from_card(
                              card
                          )


                          # ---------------------------------
                          # 判断基準
                          # ---------------------------------

                          reason = reason_from_card(
                              card
                          )


                          # ---------------------------------
                          # LINE Flex作成
                          # ---------------------------------

                          message = build_flex_message(

                              race_name=race_name,

                              cutoff=cutoff,

                              remain=remain,

                              ai_score=ai_score,

                              scenario=scenario,

                              reason=reason,

                              bets=bets

                          )


                          # ---------------------------------
                          # LINE送信
                          # ---------------------------------

                          print(
                              "LINE送信:",
                              race_name
                          )


                          send_line(
                              message
                          )


                          # ---------------------------------
                          # 通知済み保存
                          # ---------------------------------

                          state[
                              notify_key
                          ] = now_jst().isoformat()


                          save_state(
                              state
                          )


                          print(
                              "✅ LINE通知完了:",
                              race_name
                          )


                      except Exception as e:

                          print(
                              "レース処理エラー:",
                              e
                          )


                  browser.close()


              # ---------------------------------------------
              # 最終履歴保存
              # ---------------------------------------------

              save_state(
                  state
              )


              print(
                  "=============================================="
              )

              print(
                  "BOATRACE AI LINE END"
              )

              print(
                  "=============================================="
              )


          # =====================================================
          # 実行
          # =====================================================

          if __name__ == "__main__":

              main()

