          # =====================================================
          # LINE送信
          # =====================================================

          def send_line(flex):

              token = os.environ.get(
                  "LINE_CHANNEL_ACCESS_TOKEN"
              )

              user_id = os.environ.get(
                  "LINE_USER_ID"
              )


              if not token:

                  raise RuntimeError(
                      "BOATAI が設定されていません"
                  )


              if not user_id:

                  raise RuntimeError(
                      "LINE_USER_ID が設定されていません"
                  )


              response = requests.post(

                  "https://api.line.me/v2/bot/message/push",

                  headers={

                      "Authorization":
                          f"Bearer {token}",

                      "Content-Type":
                          "application/json"
                  },

                  json={

                      "to":
                          user_id,

                      "messages": [
                          flex
                      ]
                  },

                  timeout=30
              )


              print(
                  "LINE:",
                  response.status_code
              )


              if response.status_code >= 400:

                  print(
                      "LINEレスポンス:",
                      response.text
                  )

                  response.raise_for_status()


          # =====================================================
          # メイン処理
          # =====================================================

          def main():

              state = load_state()


              predictions = get_predictions()


              print(
                  "取得レース数:",
                  len(predictions)
              )


              sent = 0


              for race in predictions:


                  print(
                      "================================"
                  )

                  print(
                      "判定開始:",
                      race["race"]
                  )


                  # -------------------------------------------
                  # Web側が3 + 4 + 3であることを確認
                  # -------------------------------------------

                  if not race.get(
                      "valid_343",
                      False
                  ):

                      print(
                          "❌ LINE未送信:",
                          race["race"],
                          "理由: 本命3・狙い4・穴3が未完成"
                      )

                      continue


                  # -------------------------------------------
                  # 念のため再チェック
                  # -------------------------------------------

                  if (
                      len(race["main"]) != 3
                      or
                      len(race["cover"]) != 4
                      or
                      len(race["hole"]) != 3
                  ):

                      print(
                          "❌ LINE未送信:",
                          race["race"],
                          "理由: 買い目数不一致"
                      )

                      continue


                  # -------------------------------------------
                  # 買い目重複チェック
                  # -------------------------------------------

                  all_combos = (
                      race["main"]
                      +
                      race["cover"]
                      +
                      race["hole"]
                  )


                  if (
                      len(all_combos)
                      !=
                      len(
                          set(
                              all_combos
                          )
                      )
                  ):

                      print(
                          "❌ LINE未送信:",
                          race["race"],
                          "理由: カテゴリ間で買い目重複"
                      )

                      continue


                  # -------------------------------------------
                  # 締切取得
                  # -------------------------------------------

                  cutoff = race.get(
                      "cutoff"
                  )


                  if not cutoff:

                      print(
                          "❌ LINE未送信:",
                          race["race"],
                          "理由: 締切時間を取得できない"
                      )

                      continue


                  # -------------------------------------------
                  # 残り時間
                  # -------------------------------------------

                  remain = remaining_minutes(
                      cutoff
                  )


                  if remain is None:

                      print(
                          "❌ LINE未送信:",
                          race["race"],
                          "理由: 残り時間計算失敗"
                      )

                      continue


                  print(
                      race["race"],
                      "締切",
                      cutoff,
                      "残り",
                      remain,
                      "分"
                  )


                  # -------------------------------------------
                  # 締切直前・締切済みは通知しない
                  # -------------------------------------------

                  if remain < MIN_BEFORE:

                      print(
                          "❌ LINE未送信:",
                          race["race"],
                          "理由: 締切直前または締切済み",
                          f"残り{remain}分"
                      )

                      continue


                  # -------------------------------------------
                  # 任意の通知時間帯制限
                  # -------------------------------------------

                  if USE_NOTIFICATION_WINDOW:

                      if (
                          remain
                          <
                          WINDOW_MIN_BEFORE
                          or
                          remain
                          >
                          WINDOW_MAX_BEFORE
                      ):

                          print(
                              "❌ LINE未送信:",
                              race["race"],
                              "理由: 通知時間外",
                              f"残り{remain}分"
                          )

                          continue


                  # -------------------------------------------
                  # 重複通知防止
                  # -------------------------------------------

                  key = (
                      NOW.strftime(
                          "%Y-%m-%d"
                      )
                      +
                      "|"
                      +
                      race["race"]
                  )


                  if key in state:

                      print(
                          "❌ LINE未送信:",
                          race["race"],
                          "理由: 本日すでに通知済み"
                      )

                      continue


                  # -------------------------------------------
                  # 通知対象ログ
                  # -------------------------------------------

                  print(
                      "✅ 通知対象:",
                      race["race"]
                  )


                  print(
                      "本命🚤:",
                      race["main"]
                  )


                  print(
                      "狙い🚤:",
                      race["cover"]
                  )


                  print(
                      "穴🚤:",
                      race["hole"]
                  )


                  # -------------------------------------------
                  # Flex作成
                  # -------------------------------------------

                  flex = build_flex(
                      race,
                      remain
                  )


                  # -------------------------------------------
                  # LINE送信
                  # -------------------------------------------

                  try:

                      send_line(
                          flex
                      )

                  except Exception as e:

                      print(
                          "❌ LINE送信失敗:",
                          race["race"],
                          e
                      )

                      continue


                  # -------------------------------------------
                  # 通知済み保存
                  # -------------------------------------------

                  state[key] = (
                      NOW.isoformat()
                  )


                  sent += 1


                  print(
                      "✅ 送信完了:",
                      race["race"]
                  )


              # -----------------------------------------------
              # 通知履歴保存
              # -----------------------------------------------

              save_state(
                  state
              )


              print(
                  "================================"
              )


              print(
                  "今回通知:",
                  sent,
                  "件"
              )
                        # =====================================================
          # 実行
          # =====================================================

          if __name__ == "__main__":
              main()

