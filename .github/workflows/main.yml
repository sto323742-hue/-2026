name: BOATRACE AI LINE Notification

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boatrace-ai-line
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          python -m playwright install --with-deps chromium

      - name: BOATRACE AI LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.BOATAI }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

        run: |
          cat > line_notify.py <<'PY'
          import os
          import re
          import json
          import itertools
          import requests

          from pathlib import Path
          from datetime import datetime, timedelta, timezone
          from playwright.sync_api import sync_playwright


          # =====================================================
          # 設定
          # =====================================================

          JST = timezone(timedelta(hours=9))
          NOW = datetime.now(JST)

          TOOL_URL = "https://sto323742-hue.github.io/-2026/"

          # 締切何分前から通知するか
          MIN_BEFORE = 10
          MAX_BEFORE = 30

          STATE_FILE = Path(".boatrace_line_notified.json")


          # =====================================================
          # 通知履歴
          # =====================================================

          def load_state():

              if not STATE_FILE.exists():
                  return {}

              try:
                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

                      if isinstance(data, dict):
                          return data

              except Exception as e:
                  print("履歴読込エラー:", e)

              return {}


          def save_state(state):

              limit = NOW - timedelta(days=3)

              cleaned = {}

              for key, value in state.items():

                  try:
                      dt = datetime.fromisoformat(value)

                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=JST)

                      if dt >= limit:
                          cleaned[key] = value

                  except Exception:
                      pass

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      cleaned,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )


          # =====================================================
          # テキスト整理
          # =====================================================

          def clean(text):

              if text is None:
                  return ""

              return re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()


          def combo_only(text):

              if not text:
                  return ""

              m = re.search(
                  r"([1-6]-[1-6]-[1-6])",
                  text
              )

              return m.group(1) if m else ""


          # =====================================================
          # 締切
          # =====================================================

          def get_cutoff(meta):

              m = re.search(
                  r"締切\s*(\d{1,2}:\d{2})",
                  meta
              )

              return m.group(1) if m else None


          def remaining_minutes(cutoff):

              try:

                  h, m = map(
                      int,
                      cutoff.split(":")
                  )

                  target = NOW.replace(
                      hour=h,
                      minute=m,
                      second=0,
                      microsecond=0
                  )

                  return int(
                      (target - NOW).total_seconds()
                      // 60
                  )

              except Exception:
                  return None


          # =====================================================
          # BOX判定
          # =====================================================

          def make_box(boats):

              result = set()

              for p in itertools.permutations(
                  boats,
                  3
              ):
                  result.add(
                      f"{p[0]}-{p[1]}-{p[2]}"
                  )

              return result


          def find_box(combos):

              combo_set = set(combos)

              # 3艇BOX = 6点
              for boats in itertools.combinations(
                  range(1, 7),
                  3
              ):

                  box = make_box(boats)

                  if box.issubset(combo_set):

                      return {
                          "boats": boats,
                          "combos": box
                      }

              return None


          # =====================================================
          # フォーメーション判定
          # =====================================================

          def formation_combos(
              first,
              second,
              third
          ):

              result = set()

              for a in first:
                  for b in second:
                      for c in third:

                          if len({
                              a,
                              b,
                              c
                          }) != 3:
                              continue

                          result.add(
                              f"{a}-{b}-{c}"
                          )

              return result


          def format_numbers(nums):

              return ",".join(
                  str(x)
                  for x in sorted(nums)
              )


          def find_best_formation(combos):

              combo_set = set(combos)

              if len(combo_set) < 2:
                  return None

              parsed = [
                  tuple(
                      map(
                          int,
                          c.split("-")
                      )
                  )
                  for c in combo_set
              ]

              first_pool = sorted(
                  set(x[0] for x in parsed)
              )

              second_pool = sorted(
                  set(x[1] for x in parsed)
              )

              third_pool = sorted(
                  set(x[2] for x in parsed)
              )

              best = None

              # 全部分集合を試す
              def subsets(values):

                  out = []

                  for size in range(
                      1,
                      len(values) + 1
                  ):

                      out.extend(
                          itertools.combinations(
                              values,
                              size
                          )
                      )

                  return out

              for first in subsets(first_pool):

                  for second in subsets(second_pool):

                      for third in subsets(third_pool):

                          generated = formation_combos(
                              first,
                              second,
                              third
                          )

                          # 2点以上まとめられるものだけ
                          if len(generated) < 2:
                              continue

                          # 元の買い目以外を絶対に増やさない
                          if not generated.issubset(
                              combo_set
                          ):
                              continue

                          score = len(generated)

                          candidate = {
                              "first": first,
                              "second": second,
                              "third": third,
                              "combos": generated,
                              "score": score
                          }

                          if (
                              best is None
                              or
                              candidate["score"]
                              >
                              best["score"]
                          ):
                              best = candidate

              return best


          # =====================================================
          # 10点を
          # 通常 / フォーメーション / BOX
          # に自動整理
          # =====================================================

          def classify_bets(combos):

              remaining = set(combos)

              normal = []
              formations = []
              boxes = []

              # -----------------------------------------------
              # BOXを先に探す
              # -----------------------------------------------

              while True:

                  found = find_box(
                      list(remaining)
                  )

                  if not found:
                      break

                  boats = found["boats"]

                  boxes.append(
                      "・".join(
                          str(x)
                          for x in boats
                      )
                  )

                  remaining -= found["combos"]

              # -----------------------------------------------
              # 次にフォーメーション
              # -----------------------------------------------

              while len(remaining) >= 2:

                  found = find_best_formation(
                      list(remaining)
                  )

                  if not found:
                      break

                  formations.append(
                      f"{format_numbers(found['first'])}"
                      f" - "
                      f"{format_numbers(found['second'])}"
                      f" - "
                      f"{format_numbers(found['third'])}"
                  )

                  remaining -= found["combos"]

              # -----------------------------------------------
              # 残りは通常
              # -----------------------------------------------

              normal = sorted(
                  remaining
              )

              return {
                  "normal": normal,
                  "formation": formations,
                  "box": boxes
              }


          # =====================================================
          # ツール画面取得
          # =====================================================

          def get_predictions():

              results = []

              with sync_playwright() as p:

                  browser = p.chromium.launch(
                      headless=True
                  )

                  page = browser.new_page(
                      viewport={
                          "width": 390,
                          "height": 844
                      }
                  )

                  print("OPEN:", TOOL_URL)

                  page.goto(
                      TOOL_URL,
                      wait_until="domcontentloaded",
                      timeout=60000
                  )

                  # ツールのAI解析待ち
                  page.wait_for_timeout(15000)

                  cards = page.locator(".race")

                  count = cards.count()

                  print(
                      "S評価表示数:",
                      count
                  )

                  for i in range(count):

                      card = cards.nth(i)

                      race_name = clean(
                          card.locator(
                              ".race-name"
                          ).inner_text()
                      )

                      meta = clean(
                          card.locator(
                              ".race-meta"
                          ).inner_text()
                      )

                      cutoff = get_cutoff(meta)

                      # ---------------------------------------
                      # 本命3
                      # ---------------------------------------

                      main_raw = (
                          card.locator(
                              ".main-col .combo"
                          ).all_inner_texts()
                      )

                      main = [
                          combo_only(x)
                          for x in main_raw
                      ]

                      main = [
                          x for x in main
                          if x
                      ][:3]

                      # ---------------------------------------
                      # 狙い4
                      # ---------------------------------------

                      cover_raw = (
                          card.locator(
                              ".cover-col .combo"
                          ).all_inner_texts()
                      )

                      cover = [
                          combo_only(x)
                          for x in cover_raw
                      ]

                      cover = [
                          x for x in cover
                          if x
                      ][:4]

                      # ---------------------------------------
                      # 穴3
                      # ---------------------------------------

                      hole_raw = (
                          card.locator(
                              ".hole-col .combo"
                          ).all_inner_texts()
                      )

                      hole = [
                          combo_only(x)
                          for x in hole_raw
                      ]

                      hole = [
                          x for x in hole
                          if x
                      ][:3]

                      # ---------------------------------------
                      # 展開予測
                      # ---------------------------------------

                      scenario = ""

                      try:

                          scenario = clean(
                              card.locator(
                                  ".scenario-main"
                              ).inner_text()
                          )

                      except Exception:
                          pass

                      # ---------------------------------------
                      # 判断基準
                      # ---------------------------------------

                      reasons = []

                      try:

                          reason = (
                              card.locator(
                                  ".reason"
                              ).inner_text()
                          )

                          for line in (
                              reason.splitlines()
                          ):

                              line = clean(line)

                              if not line:
                                  continue

                              if (
                                  "今回のAI判断根拠"
                                  in line
                              ):
                                  continue

                              line = (
                                  line
                                  .replace("・", "")
                                  .strip()
                              )

                              if line:
                                  reasons.append(line)

                      except Exception:
                          pass

                      results.append({
                          "race":
                              race_name,

                          "cutoff":
                              cutoff,

                          "main":
                              main,

                          "cover":
                              cover,

                          "hole":
                              hole,

                          "scenario":
                              scenario,

                          "reasons":
                              reasons
                      })

                  browser.close()

              return results


          # =====================================================
          # Flex Message用
          # =====================================================

          def text_component(
              text,
              size="sm",
              weight="regular",
              color="#222222",
              align="start",
              wrap=True
          ):

              return {
                  "type": "text",
                  "text": text,
                  "size": size,
                  "weight": weight,
                  "color": color,
                  "align": align,
                  "wrap": wrap
              }


          def bet_column(
              title,
              combos,
              header_color
          ):

              body = [
                  {
                      "type": "box",
                      "layout": "vertical",
                      "backgroundColor":
                          header_color,
                      "paddingAll": "7px",
                      "contents": [
                          text_component(
                              title,
                              size="sm",
                              weight="bold",
                              align="center"
                          )
                      ]
                  }
              ]

              for combo in combos:

                  body.append(
                      {
                          "type": "box",
                          "layout": "vertical",
                          "paddingTop": "7px",
                          "contents": [
                              text_component(
                                  combo,
                                  size="md",
                                  weight="bold",
                                  align="center"
                              )
                          ]
                      }
                  )

              return {
                  "type": "box",
                  "layout": "vertical",
                  "flex": 1,
                  "margin": "xs",
                  "backgroundColor": "#FFFFFF",
                  "cornerRadius": "md",
                  "contents": body
              }


          def purchase_column(
              title,
              values,
              color
          ):

              contents = [
                  {
                      "type": "box",
                      "layout": "vertical",
                      "backgroundColor": color,
                      "paddingAll": "6px",
                      "contents": [
                          text_component(
                              title,
                              size="xs",
                              weight="bold",
                              color="#FFFFFF",
                              align="center"
                          )
                      ]
                  }
              ]

              if values:

                  for value in values:

                      contents.append(
                          {
                              "type": "box",
                              "layout": "vertical",
                              "paddingAll": "6px",
                              "contents": [
                                  text_component(
                                      value,
                                      size="xs",
                                      weight="bold",
                                      align="center"
                                  )
                              ]
                          }
                      )

              else:

                  contents.append(
                      {
                          "type": "box",
                          "layout": "vertical",
                          "paddingAll": "6px",
                          "contents": [
                              text_component(
                                  "－",
                                  size="xs",
                                  align="center",
                                  color="#999999"
                              )
                          ]
                      }
                  )

              return {
                  "type": "box",
                  "layout": "vertical",
                  "flex": 1,
                  "margin": "xs",
                  "cornerRadius": "md",
                  "backgroundColor": "#FFFFFF",
                  "contents": contents
              }


          # =====================================================
          # LINE Flex作成
          # =====================================================

          def build_flex(race, remain):

              all_combos = (
                  race["main"]
                  +
                  race["cover"]
                  +
                  race["hole"]
              )

              classified = classify_bets(
                  all_combos
              )

              body = []

              # -----------------------------------------------
              # 会場・R
              # -----------------------------------------------

              body.append(
                  text_component(
                      "🚤 BOATRACE AI予想",
                      size="lg",
                      weight="bold"
                  )
              )

              body.append({
                  "type": "separator",
                  "margin": "md"
              })

              body.append(
                  {
                      "type": "box",
                      "layout": "vertical",
                      "margin": "md",
                      "contents": [
                          text_component(
                              race["race"],
                              size="xl",
                              weight="bold"
                          )
                      ]
                  }
              )

              # -----------------------------------------------
              # 締切・残り
              # -----------------------------------------------

              body.append(
                  {
                      "type": "box",
                      "layout": "horizontal",
                      "margin": "md",
                      "contents": [
                          text_component(
                              f"⏰ 締切 {race['cutoff']}",
                              size="sm",
                              weight="bold"
                          ),
                          text_component(
                              f"残り {remain}分",
                              size="sm",
                              weight="bold",
                              align="end"
                          )
                      ]
                  }
              )

              # -----------------------------------------------
              # 本命 / 狙い / 穴
              # -----------------------------------------------

              body.append(
                  {
                      "type": "box",
                      "layout": "horizontal",
                      "margin": "lg",
                      "contents": [

                          bet_column(
                              "本命🚤",
                              race["main"],
                              "#FFE5E8"
                          ),

                          bet_column(
                              "狙い🚤",
                              race["cover"],
                              "#E3F2FF"
                          ),

                          bet_column(
                              "穴🚤",
                              race["hole"],
                              "#E4F8E9"
                          )
                      ]
                  }
              )

              # -----------------------------------------------
              # 買い目
              # -----------------------------------------------

              body.append(
                  {
                      "type": "box",
                      "layout": "vertical",
                      "margin": "lg",
                      "contents": [
                          text_component(
                              "🎫 買い目",
                              size="md",
                              weight="bold"
                          )
                      ]
                  }
              )

              body.append(
                  {
                      "type": "box",
                      "layout": "horizontal",
                      "margin": "sm",
                      "contents": [

                          purchase_column(
                              "通常",
                              classified["normal"],
                              "#718096"
                          ),

                          purchase_column(
                              "フォーメーション",
                              classified["formation"],
                              "#1976D2"
                          ),

                          purchase_column(
                              "BOX",
                              classified["box"],
                              "#079447"
                          )
                      ]
                  }
              )

              # -----------------------------------------------
              # 展開予測
              # -----------------------------------------------

              if race["scenario"]:

                  body.append(
                      {
                          "type": "box",
                          "layout": "vertical",
                          "margin": "lg",
                          "backgroundColor": "#F5F7FA",
                          "cornerRadius": "md",
                          "paddingAll": "10px",
                          "contents": [
                              text_component(
                                  "🧠 展開予測",
                                  size="md",
                                  weight="bold",
                                  color="#1261A0"
                              ),
                              text_component(
                                  race["scenario"],
                                  size="sm",
                                  weight="bold"
                              )
                          ]
                      }
                  )

              # -----------------------------------------------
              # 判断基準
              # -----------------------------------------------

              if race["reasons"]:

                  reason_contents = [
                      text_component(
                          "📊 判断基準",
                          size="md",
                          weight="bold",
                          color="#1261A0"
                      )
                  ]

                  for reason in race["reasons"]:

                      reason_contents.append(
                          text_component(
                              f"・{reason}",
                              size="xs"
                          )
                      )

                  body.append(
                      {
                          "type": "box",
                          "layout": "vertical",
                          "margin": "md",
                          "backgroundColor": "#F5F7FA",
                          "cornerRadius": "md",
                          "paddingAll": "10px",
                          "contents":
                              reason_contents
                      }
                  )

              # -----------------------------------------------
              # 最終Flex
              # -----------------------------------------------

              return {
                  "type": "flex",
                  "altText":
                      f"{race['race']} BOATRACE AI予想",

                  "contents": {
                      "type": "bubble",
                      "size": "mega",

                      "body": {
                          "type": "box",
                          "layout": "vertical",
                          "paddingAll": "14px",
                          "contents": body
                      }
                  }
              }


          # =====================================================
          # LINE送信
          # =====================================================

          def send_line(flex):

              token = os.environ.get(
                  "LINE_CHANNEL_ACCESS_TOKEN"
              )

              user_id = os.environ.get(
                  "LINE_USER_ID"
              )

              if not token:
                  raise RuntimeError(
                      "BOATAI が設定されていません"
                  )

              if not user_id:
                  raise RuntimeError(
                      "LINE_USER_ID が設定されていません"
                  )

              response = requests.post(

                  "https://api.line.me/v2/bot/message/push",

                  headers={
                      "Authorization":
                          f"Bearer {token}",

                      "Content-Type":
                          "application/json"
                  },

                  json={
                      "to": user_id,
                      "messages": [
                          flex
                      ]
                  },

                  timeout=30
              )

              print(
                  "LINE:",
                  response.status_code
              )

              if response.status_code >= 400:

                  print(
                      response.text
                  )

                  response.raise_for_status()


          # =====================================================
          # メイン
          # =====================================================

          def main():

              state = load_state()

              predictions = get_predictions()

              print(
                  "取得レース数:",
                  len(predictions)
              )

              sent = 0

              for race in predictions:

                  # -------------------------------------------
                  # 必ず3+4+3
                  # -------------------------------------------

                  if (
                      len(race["main"]) != 3
                      or
                      len(race["cover"]) != 4
                      or
                      len(race["hole"]) != 3
                  ):

                      print(
                          "買い目不一致のためスキップ:",
                          race["race"],
                          len(race["main"]),
                          len(race["cover"]),
                          len(race["hole"])
                      )

                      continue

                  cutoff = race["cutoff"]

                  if not cutoff:
                      continue

                  remain = remaining_minutes(
                      cutoff
                  )

                  if remain is None:
                      continue

                  print(
                      race["race"],
                      "残り",
                      remain,
                      "分"
                  )

                  # -------------------------------------------
                  # 締切10～30分前
                  # -------------------------------------------

                  if (
                      remain < MIN_BEFORE
                      or
                      remain > MAX_BEFORE
                  ):
                      continue

                  # -------------------------------------------
                  # 重複防止
                  # -------------------------------------------

                  key = (
                      NOW.strftime("%Y-%m-%d")
                      +
                      "|"
                      +
                      race["race"]
                  )

                  if key in state:

                      print(
                          "通知済み:",
                          race["race"]
                      )

                      continue

                  # -------------------------------------------
                  # Flex作成
                  # -------------------------------------------

                  flex = build_flex(
                      race,
                      remain
                  )

                  # -------------------------------------------
                  # LINE
                  # -------------------------------------------

                  send_line(flex)

                  state[key] = NOW.isoformat()

                  sent += 1

                  print(
                      "送信完了:",
                      race["race"]
                  )

              save_state(state)

              print(
                  "今回通知:",
                  sent,
                  "件"
              )


          if __name__ == "__main__":
              main()

          PY

          python line_notify.py

      # =========================================================
      # 通知済み履歴保存
      # =========================================================
      - name: Save notification history
        run: |
          if [ -f .boatrace_line_notified.json ]; then

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .boatrace_line_notified.json

            if git diff --cached --quiet; then
              echo "変更なし"
            else
              git commit -m "Update BOATRACE LINE notification history"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push origin HEAD:"${GITHUB_REF_NAME}"
            fi

          fi
