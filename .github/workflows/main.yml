name: BOATRACE AI LINE Notification

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: boatrace-ai-line
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create BOATRACE AI script
        run: |
          cat > line_notify.py <<'PY'
          import os
          import re
          import json
          import math
          import time
          import hashlib
          import itertools
          from pathlib import Path
          from datetime import datetime, timedelta, timezone

          import requests

          JST = timezone(timedelta(hours=9))
          API_BASE = "https://boatraceopenapi.github.io/api/v1"
          ODDS_BASE = "https://lamrongol.github.io/BoatraceOdds/v3"
          MODEL_NAME = "gold-v4-stable"
          STATE_FILE = Path("boatrace_line_state.json")
          LOCAL_ODDS_FILE = Path("odds_today.json")

          LINE_TOKEN = os.getenv("LINE_CHANNEL_ACCESS_TOKEN", "").strip()
          LINE_USER_ID = os.getenv("LINE_USER_ID", "").strip()

          STADIUMS = {
              1: "桐生", 2: "戸田", 3: "江戸川", 4: "平和島", 5: "多摩川", 6: "浜名湖",
              7: "蒲郡", 8: "常滑", 9: "津", 10: "三国", 11: "びわこ", 12: "住之江",
              13: "尼崎", 14: "鳴門", 15: "丸亀", 16: "児島", 17: "宮島", 18: "徳山",
              19: "下関", 20: "若松", 21: "芦屋", 22: "福岡", 23: "唐津", 24: "大村",
          }

          def now_jst():
              return datetime.now(JST)

          def n(v, default=0.0):
              try:
                  return float(v)
              except (TypeError, ValueError):
                  return float(default)

          def i(v, default=0):
              try:
                  return int(float(v))
              except (TypeError, ValueError):
                  return int(default)

          def get_json(url):
              try:
                  r = requests.get(
                      f"{url}?t={int(time.time())}",
                      timeout=25,
                      headers={"User-Agent": "BOATRACE-AI-LINE/4.1", "Cache-Control": "no-cache"},
                  )
                  print("GET", url, r.status_code)
                  if r.status_code == 200:
                      return r.json()
              except Exception as e:
                  print("GET ERROR", url, repr(e))
              return None

          def fetch_races():
              now = now_jst()
              url = f"{API_BASE}/{now:%Y}/{now:%Y%m%d}.json"
              data = get_json(url)
              if not isinstance(data, dict):
                  raise RuntimeError("BOATRACEデータを取得できませんでした")
              return data

          def fetch_odds():
              # サイト本体が利用しているリポジトリ内の odds_today.json を最優先で使う
              if LOCAL_ODDS_FILE.exists():
                  try:
                      data = json.loads(LOCAL_ODDS_FILE.read_text(encoding="utf-8"))
                      if isinstance(data, (dict, list)):
                          print("ODDS SOURCE local odds_today.json")
                          return data, "odds_today.json"
                  except Exception as e:
                      print("LOCAL ODDS ERROR", repr(e))

              # ローカルファイルが読めない場合だけ外部URLへフォールバック
              now = now_jst()
              urls = [
                  ("日付JSON", f"{ODDS_BASE}/{now:%Y}/{now:%Y%m%d}.json"),
                  ("today.json", f"{ODDS_BASE}/today.json"),
              ]
              for name, url in urls:
                  data = get_json(url)
                  if isinstance(data, (dict, list)):
                      print("ODDS SOURCE", name)
                      return data, name
              return None, "未取得"

          def flatten_races(data):
              out = []
              programs = data.get("programs", {}) if isinstance(data, dict) else {}
              stadiums = programs.get("stadiums", {}) if isinstance(programs, dict) else {}
              if not isinstance(stadiums, dict):
                  return out
              for stadium_key, stadium_data in stadiums.items():
                  if not isinstance(stadium_data, dict):
                      continue
                  races = stadium_data.get("races", {})
                  if not isinstance(races, dict):
                      continue
                  for race_key, race in races.items():
                      if not isinstance(race, dict):
                          continue
                      x = dict(race)
                      x["stadium_number"] = i(race.get("stadium_number", stadium_key))
                      x["race_number"] = i(race.get("race_number", race_key))
                      out.append(x)
              return out

          def close_dt(race):
              raw = str(race.get("closed_at", "")).strip()
              for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%d %H:%M", "%Y/%m/%d %H:%M:%S", "%Y/%m/%d %H:%M"):
                  try:
                      return datetime.strptime(raw, fmt).replace(tzinfo=JST)
                  except ValueError:
                      pass
              return None

          def future_race(race):
              dt = close_dt(race)
              return dt is None or dt > now_jst()

          def preview_racers(race):
              preview = race.get("preview", {})
              if not isinstance(preview, dict):
                  return {}
              racers = preview.get("racers", {})
              return racers if isinstance(racers, dict) else {}

          def ready(race):
              racers = preview_racers(race)
              for boat in range(1, 7):
                  p = racers.get(str(boat), {})
                  if not isinstance(p, dict):
                      return False
                  if n(p.get("exhibition_time"), -1) <= 0:
                      return False
                  st = n(p.get("start_timing"), 999)
                  if not math.isfinite(st) or st >= 999:
                      return False
              return True

          def racer_stats(race, boat):
              racers = race.get("racers", {})
              if not isinstance(racers, dict):
                  return {}
              x = racers.get(str(boat), {})
              return x if isinstance(x, dict) else {}

          def analyze(race):
              if not ready(race):
                  return None
              preview = race.get("preview", {})
              pr = preview_racers(race)
              rows = []
              for boat in range(1, 7):
                  p = pr.get(str(boat), {})
                  s = racer_stats(race, boat)
                  ex = n(p.get("exhibition_time"), 99)
                  st = n(p.get("start_timing"), 1)
                  course = i(p.get("course_number", boat), boat)
                  score = 0.0
                  score += (10.0 - ex) * 22.0
                  score += (0.25 - st) * 42.0
                  score += (7 - course) * 3.8
                  score += n(s.get("win_rate")) * 2.6
                  score += n(s.get("second_place_rate")) * 0.18
                  score += n(s.get("motor_second_place_rate")) * 0.16
                  score += n(s.get("boat_second_place_rate")) * 0.08
                  rows.append({"boat": boat, "score": score, "ex": ex, "st": st, "course": course})

              rows.sort(key=lambda x: x["score"], reverse=True)
              ex_rank = sorted(rows, key=lambda x: x["ex"])
              st_rank = sorted(rows, key=lambda x: x["st"])
              top, second = rows[0], rows[1]

              weather = preview if isinstance(preview, dict) else {}
              wind = n(weather.get("wind_speed"))
              wave = n(weather.get("wave_height"))
              changes = sum(1 for x in rows if x["course"] != x["boat"])

              rating = 70
              rating += max(0, min(10, (top["score"] - second["score"]) * 0.7))
              rating += 4 if ex_rank[0]["boat"] == top["boat"] else 0
              rating += 4 if st_rank[0]["boat"] == top["boat"] else 0
              rating += 3 if top["course"] == 1 else 0
              rating += 2 if wind <= 4 else 0
              rating += 2 if wave <= 4 else 0
              rating -= 3 if changes >= 2 else 0
              rating -= 4 if wind >= 7 else 0
              rating -= 4 if wave >= 8 else 0
              rating = int(round(max(0, min(100, rating))))

              return {
                  "race": race,
                  "boats": rows,
                  "rating": rating,
                  "grade": "S" if rating >= 82 else ("A" if rating >= 74 else "B"),
                  "wind": wind,
                  "wave": wave,
                  "ex1": ex_rank[0]["boat"],
                  "st1": st_rank[0]["boat"],
                  "top": top,
              }

          def find_odds_node(obj, stadium, race_no):
              # odds_today.json の現在の構造を直接読む
              if isinstance(obj, dict):
                  stadiums = obj.get("stadiums")
                  if isinstance(stadiums, dict):
                      stadium_node = stadiums.get(str(stadium), stadiums.get(stadium))
                      if isinstance(stadium_node, dict):
                          races = stadium_node.get("races", {})
                          if isinstance(races, dict):
                              race_node = races.get(str(race_no), races.get(race_no))
                              if isinstance(race_node, dict):
                                  trifecta = race_node.get("trifecta")
                                  if isinstance(trifecta, (dict, list)):
                                      return trifecta

              # 旧形式・外部データ形式にも対応
              if isinstance(obj, list):
                  for v in obj:
                      found = find_odds_node(v, stadium, race_no)
                      if found is not None:
                          return found
                  return None
              if not isinstance(obj, dict):
                  return None

              s = i(obj.get("stadium_number", obj.get("stadium", obj.get("place_no", 0))))
              r = i(obj.get("race_number", obj.get("race", obj.get("race_no", 0))))
              if s == stadium and r == race_no:
                  if isinstance(obj.get("trifecta"), (dict, list)):
                      return obj.get("trifecta")
                  odds = obj.get("odds")
                  if isinstance(odds, dict) and isinstance(odds.get("trifecta"), (dict, list)):
                      return odds.get("trifecta")

              for v in obj.values():
                  if isinstance(v, (dict, list)):
                      found = find_odds_node(v, stadium, race_no)
                      if found is not None:
                          return found
              return None

          def flatten_odds(node):
              out = {}
              if isinstance(node, list):
                  for x in node:
                      if not isinstance(x, dict):
                          continue
                      combo = str(x.get("combination", x.get("combo", "")))
                      odds = n(x.get("odds", x.get("rate", x.get("value", 0))))
                      if re.fullmatch(r"[1-6]-[1-6]-[1-6]", combo) and odds > 0:
                          out[combo] = odds
                  return out
              if not isinstance(node, dict):
                  return out
              for k, v in node.items():
                  key = str(k)
                  if re.fullmatch(r"[1-6]-[1-6]-[1-6]", key):
                      odds = n(v.get("odds", v.get("rate", v.get("value", 0)))) if isinstance(v, dict) else n(v)
                      if odds > 0:
                          out[key] = odds
                  elif key.isdigit() and isinstance(v, dict):
                      a = int(key)
                      for k2, v2 in v.items():
                          if not str(k2).isdigit() or not isinstance(v2, dict):
                              continue
                          b = int(k2)
                          for k3, v3 in v2.items():
                              if not str(k3).isdigit():
                                  continue
                              c = int(k3)
                              if len({a, b, c}) != 3 or not all(1 <= z <= 6 for z in (a, b, c)):
                                  continue
                              odds = n(v3.get("odds", v3.get("rate", v3.get("value", 0)))) if isinstance(v3, dict) else n(v3)
                              if odds > 0:
                                  out[f"{a}-{b}-{c}"] = odds
              return out

          def probabilities(analysis):
              score = {x["boat"]: max(0.1, x["score"] + 50) for x in analysis["boats"]}
              raw = {}
              for a, b, c in itertools.permutations(range(1, 7), 3):
                  key = f"{a}-{b}-{c}"
                  raw[key] = score[a] * (score[b] ** 0.72) * (score[c] ** 0.48)
              total = sum(raw.values()) or 1
              return {k: v / total for k, v in raw.items()}

          def tickets_for(analysis, odds_map):
              if not odds_map:
                  return []
              probs = probabilities(analysis)
              rows = []
              for combo, odds in odds_map.items():
                  p = probs.get(combo, 0.0)
                  rows.append({"combo": combo, "odds": odds, "p": p, "ev": p * odds})

              main = sorted((x for x in rows if x["odds"] <= 15), key=lambda x: (x["p"], x["ev"]), reverse=True)[:3]
              cover = sorted((x for x in rows if 15 < x["odds"] < 80), key=lambda x: (x["p"], x["ev"]), reverse=True)[:4]
              hole = sorted((x for x in rows if x["odds"] >= 80), key=lambda x: (x["p"], x["ev"]), reverse=True)[:3]
              if not (len(main) == 3 and len(cover) == 4 and len(hole) == 3):
                  return []
              result = []
              for group, arr in (("本命", main), ("狙い", cover), ("穴", hole)):
                  for x in arr:
                      y = dict(x)
                      y["group"] = group
                      y["money"] = 100
                      result.append(y)
              return result

          def state_load():
              if not STATE_FILE.exists():
                  return {"date": now_jst().strftime("%Y-%m-%d"), "sent": {}}
              try:
                  x = json.loads(STATE_FILE.read_text(encoding="utf-8"))
                  if not isinstance(x, dict):
                      raise ValueError
                  return x
              except Exception:
                  return {"date": now_jst().strftime("%Y-%m-%d"), "sent": {}}

          def state_save(state):
              STATE_FILE.write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8")

          def race_key(race):
              return f"{now_jst():%Y-%m-%d}_{i(race.get('stadium_number'))}_{i(race.get('race_number'))}"

          def message_for(analysis, tickets, odds_source):
              race = analysis["race"]
              stadium = i(race.get("stadium_number"))
              race_no = i(race.get("race_number"))
              venue = STADIUMS.get(stadium, f"会場{stadium}")
              close = close_dt(race)
              close_text = close.strftime("%H:%M") if close else "--:--"
              top = analysis["top"]
              lines = [
                  "🚤 BOAT RACE AI予想",
                  "",
                  "🔥 勝負度S",
                  f"{venue} {race_no}R",
                  f"AI信頼スコア：{analysis['rating']}",
                  f"締切予定：{close_text}",
                  f"展開中心：{top['boat']}号艇",
                  f"展示1位：{analysis['ex1']}号艇 / ST1位：{analysis['st1']}号艇",
                  f"風速：{analysis['wind']:.1f}m / 波高：{analysis['wave']:.1f}cm",
                  "",
              ]
              for group in ("本命", "狙い", "穴"):
                  lines.append(f"{group}🚤")
                  for t in (x for x in tickets if x["group"] == group):
                      lines.append(f"{t['combo']} 100円 / {t['odds']:.1f}倍 / AI{t['p']*100:.1f}%")
                  lines.append("")
              lines += ["合計：1,000円", f"オッズ取得：{odds_source}", f"Model：{MODEL_NAME}"]
              return "\n".join(lines)

          def line_push(text):
              if not LINE_TOKEN or not LINE_USER_ID:
                  raise RuntimeError("GitHub Secrets BOATAI または LINE_USER_ID が未設定です")
              r = requests.post(
                  "https://api.line.me/v2/bot/message/push",
                  headers={"Authorization": f"Bearer {LINE_TOKEN}", "Content-Type": "application/json"},
                  json={"to": LINE_USER_ID, "messages": [{"type": "text", "text": text[:5000]}]},
                  timeout=25,
              )
              print("LINE", r.status_code, r.text[:300])
              if r.status_code != 200:
                  raise RuntimeError(f"LINE送信失敗: HTTP {r.status_code}")

          def main():
              print("BOATRACE AI LINE START", now_jst().isoformat())
              races = flatten_races(fetch_races())
              odds_data, odds_source = fetch_odds()
              if odds_data is None:
                  print("オッズ未取得。今回は通知しません。")
                  return

              state = state_load()
              today = now_jst().strftime("%Y-%m-%d")
              if state.get("date") != today:
                  state = {"date": today, "sent": {}}
              sent = state.setdefault("sent", {})

              candidates = []
              for race in races:
                  if not future_race(race):
                      continue
                  analysis = analyze(race)
                  if not analysis or analysis["grade"] != "S":
                      continue
                  stadium = i(race.get("stadium_number"))
                  race_no = i(race.get("race_number"))
                  odds_map = flatten_odds(find_odds_node(odds_data, stadium, race_no))
                  tickets = tickets_for(analysis, odds_map)
                  if len(tickets) == 10:
                      candidates.append((analysis, tickets))

              candidates.sort(key=lambda x: x[0]["rating"], reverse=True)
              print("S通知候補", len(candidates))

              for analysis, tickets in candidates:
                  key = race_key(analysis["race"])
                  signature = hashlib.sha256(
                      json.dumps([(x["combo"], round(x["odds"], 1)) for x in tickets], ensure_ascii=False).encode("utf-8")
                  ).hexdigest()
                  if sent.get(key) == signature:
                      print("SKIP", key)
                      continue
                  line_push(message_for(analysis, tickets, odds_source))
                  sent[key] = signature
                  state_save(state)
                  time.sleep(1)

              state_save(state)
              print("BOATRACE AI LINE END")

          if __name__ == "__main__":
              main()
          PY

      - name: Run BOATRACE AI LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.BOATAI }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python line_notify.py

      - name: Save notification state
        run: |
          if [ -f boatrace_line_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add boatrace_line_state.json
            if git diff --cached --quiet; then
              echo "通知状態に変更なし"
            else
              git commit -m "Update BOATRACE LINE notification state"
              git push
            fi
          else
            echo "state file not found"
          fi
