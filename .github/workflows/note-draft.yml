name: note-draft

on:
  workflow_dispatch:
    inputs:
      title:
        description: "note title"
        required: true
        type: string
      body:
        description: "note body"
        required: true
        type: string

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Create note draft
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_TITLE: ${{ inputs.title }}
          NOTE_BODY: ${{ inputs.body }}
        run: node note-draft.js

      - name: Upload result screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-draft-result
          path: note-draft-result.png
          if-no-files-found: ignore
