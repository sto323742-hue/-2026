<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI 5分前最終確定・3連複重複なし</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="host" src="./rough-stable-v2-trio-overlap-fixed-final5-fixed.html?v=trio-unique-20260912"></iframe>

<script>
const host=document.getElementById('host');

function getIndexWindow(){
  try{
    const level1=host.contentWindow;
    const stableFrame=level1?.document?.getElementById('host') || level1?.document?.getElementById('rough');
    let level2=stableFrame?.contentWindow;
    if(!level2)return null;

    // final5-fixed -> stable-v2 -> rough -> index
    const roughFrame=level2?.document?.getElementById('rough');
    if(roughFrame){
      level2=roughFrame.contentWindow;
    }
    const appFrame=level2?.document?.getElementById('app');
    return appFrame?.contentWindow||null;
  }catch(e){
    return null;
  }
}

function installUniqueTrioPatch(){
  const w=getIndexWindow();
  if(!w)return false;

  try{
    w.eval(`
      (function(){
        if(window.__TRIO_UNIQUE_3_PATCH_V1__)return;
        if(typeof makeTrioLongshots!=='function')return;

        window.__TRIO_UNIQUE_3_PATCH_V1__=true;
        const originalMakeTrioLongshots=makeTrioLongshots;

        function normalizedTrioKey(combo){
          const nums=String(combo||'')
            .split(/[^1-6]+/)
            .filter(Boolean)
            .map(Number)
            .filter(n=>n>=1&&n<=6);
          if(nums.length!==3)return '';
          return nums.slice().sort((a,b)=>a-b).join('-');
        }

        makeTrioLongshots=function(a){
          const raw=originalMakeTrioLongshots(a);
          if(!Array.isArray(raw))return [];

          const seen=new Set();
          const unique=[];

          for(const item of raw){
            const key=normalizedTrioKey(item?.combo);
            if(!key || seen.has(key))continue;
            seen.add(key);
            unique.push({...item,combo:key});
            if(unique.length>=3)break;
          }

          // 元関数で3本未満になった場合は、候補プールから別の3艇セットを補充
          if(unique.length<3){
            const pool=Array.isArray(a?.comboPool)?a.comboPool:[];
            const groups={};

            for(const p of pool){
              const key=normalizedTrioKey(p?.combo);
              if(!key || seen.has(key))continue;
              if(!groups[key])groups[key]={key,prob:0,odds:[]};
              groups[key].prob += Number(p?.probability||0);
              const o=Number(p?.odds||0);
              if(o>0)groups[key].odds.push(o);
            }

            const extras=Object.values(groups)
              .map(g=>{
                g.odds.sort((x,y)=>x-y);
                g.median=g.odds.length?g.odds[Math.floor(g.odds.length/2)]:0;
                g.score=g.prob*Math.log10(Math.max(g.median,10));
                return g;
              })
              .filter(g=>g.odds.length>=3 && g.median>=35)
              .sort((a,b)=>b.score-a.score);

            for(const g of extras){
              if(unique.length>=3)break;
              if(seen.has(g.key))continue;
              seen.add(g.key);
              unique.push({
                combo:g.key,
                probability:g.prob,
                marketMedian:g.median,
                deduped:true
              });
            }
          }

          return unique.slice(0,3);
        };
      })();
    `);
    return true;
  }catch(e){
    console.warn('trio unique patch failed',e);
    return false;
  }
}

function tryInstall(){
  if(installUniqueTrioPatch())return;
  setTimeout(tryInstall,250);
}

host.addEventListener('load',()=>setTimeout(tryInstall,250));
setTimeout(tryInstall,500);
setInterval(installUniqueTrioPatch,5000);
</script>
</body>
</html>
