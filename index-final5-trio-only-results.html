<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI予想 Ver.3・3連複成績のみ</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="app" src="./index-final5-trio5-with-results.html?v=trio-only-results-20260912"></iframe>
<script>
const outer=document.getElementById('app');

function applyTrioOnly(){
  try{
    const wrapperDoc=outer.contentDocument;
    if(!wrapperDoc) return false;

    const inner=wrapperDoc.getElementById('app');
    if(!inner || !inner.contentDocument) return false;

    const d=inner.contentDocument;

    const statsOpen=d.getElementById('statsOpen');
    const historyOpen=d.getElementById('historyOpen');
    const venueOpen=d.getElementById('venueOpen');
    const menu=d.querySelector('.menu');
    if(statsOpen) statsOpen.textContent='📊 3連複成績を見る';
    if(historyOpen) historyOpen.style.display='none';
    if(venueOpen) venueOpen.style.display='none';
    if(menu) menu.style.gridTemplateColumns='1fr';

    const statsSection=d.getElementById('statsSection');
    if(statsSection){
      const title=statsSection.querySelector('.panel-title');
      if(title) title.textContent='📊 3連複成績';
    }

    const stats=d.getElementById('stats');
    if(stats) stats.style.display='none';

    ['learningStats','learningToggle','learningProgressWrap',
     'historyToggle','historyWrap','venueToggle','venueWrap']
      .forEach(id=>{
        const el=d.getElementById(id);
        if(el) el.style.display='none';
      });

    if(statsSection){
      statsSection.querySelectorAll('.section-title').forEach(el=>el.style.display='none');
    }

    const qStats=d.getElementById('qStats');
    if(qStats) qStats.textContent='📊 3連複';

    const trioBox=d.getElementById('trioStatsBox');
    if(trioBox){
      const note=trioBox.querySelector('.learning-note');
      if(note) note.textContent='3連複は5点×100円＝1レース500円として集計します。';
    }

    return true;
  }catch(e){
    return false;
  }
}

outer.addEventListener('load',()=>{
  let count=0;
  const timer=setInterval(()=>{
    applyTrioOnly();
    count++;
    if(count>120) clearInterval(timer);
  },500);
});

setInterval(applyTrioOnly,2000);
</script>
</body>
</html>
