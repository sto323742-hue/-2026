<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI 荒れるレース安定版・5分前最終確定</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="host" src="./rough-stable-v2-trio-overlap-fixed.html?v=final5-20260912"></iframe>

<script>
const host=document.getElementById('host');

function getIndexWindow(){
  try{
    const stable=host.contentWindow;
    const roughFrame=stable?.document?.getElementById('rough');
    const rough=roughFrame?.contentWindow;
    const appFrame=rough?.document?.getElementById('app');
    return appFrame?.contentWindow||null;
  }catch(e){
    return null;
  }
}

function installFinal5Patch(){
  const w=getIndexWindow();
  if(!w)return false;

  try{
    w.eval(`
      (function(){
        if(window.__FINAL5_LOCK_PATCH_V1__)return;
        if(typeof finalDecision!=='function' || typeof minutesToClose!=='function')return;

        window.__FINAL5_LOCK_PATCH_V1__=true;
        const originalFinalDecision=finalDecision;
        const LOCK_KEY='boat_ai_final5_locks_v1';

        function readLocks(){
          try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'{}')}catch(e){return{}}
        }
        function writeLocks(v){
          try{localStorage.setItem(LOCK_KEY,JSON.stringify(v))}catch(e){}
        }
        function todayJstLocal(){
          return new Intl.DateTimeFormat('en-CA',{
            timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
          }).format(new Date());
        }
        function final5Key(a){
          try{
            if(typeof raceKey==='function')return raceKey(a?.race||{});
          }catch(e){}
          const r=a?.race||{};
          return [r.date||todayJstLocal(),r.stadium_number||'',r.race_number||''].join('_');
        }

        let locks=readLocks();
        const today=todayJstLocal();
        for(const k of Object.keys(locks)){
          if(locks[k]?.date!==today)delete locks[k];
        }
        writeLocks(locks);

        finalDecision=function(a){
          const m=minutesToClose(a?.race);
          const key=final5Key(a);
          const saved=locks[key];

          if(saved?.decision){
            return {...saved.decision,minutes:m};
          }

          if(Number.isFinite(m) && m>5){
            return {
              status:'checking',
              label:'⏳ 5分前に最終判定',
              minutes:m,
              strictPass:false,
              final5:true
            };
          }

          if(Number.isFinite(m) && m>=0 && m<=5){
            const base=originalFinalDecision(a);
            const confirmed=base?.status==='confirmed';
            const decision={
              ...base,
              status:confirmed?'confirmed':'hold',
              label:confirmed?'✅ 5分前最終確定':'⚠️ 5分前最終見送り',
              minutes:m,
              final5:true,
              fixedAt:new Date().toISOString()
            };
            locks[key]={date:todayJstLocal(),decision};
            writeLocks(locks);
            return decision;
          }

          return originalFinalDecision(a);
        };

        function refreshFinal5Display(){
          try{
            if(!Array.isArray(analyses))return;
            for(const a of analyses)a.finalDecision=finalDecision(a);
            if(typeof display==='function')display();
          }catch(e){}
        }

        refreshFinal5Display();
        window.__FINAL5_REFRESH_TIMER__=setInterval(refreshFinal5Display,10000);
      })();
    `);

    return true;
  }catch(e){
    console.warn('final5 patch failed',e);
    return false;
  }
}

function tryInstall(){
  if(installFinal5Patch())return;
  setTimeout(tryInstall,200);
}

host.addEventListener('load',()=>{
  setTimeout(tryInstall,100);
});

setTimeout(tryInstall,300);
setInterval(installFinal5Patch,5000);
</script>
</body>
</html>
