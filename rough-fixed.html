<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI 荒れるレース厳選版</title>
<style>
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}
.bar{position:fixed;z-index:10;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;background:#0b0b0b;border-bottom:1px solid #765b19;color:#f4cf67;font-size:12px;font-weight:900}
.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#58dc8d}
.frame{position:fixed;top:46px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 46px);border:0;background:#050505}
</style>
</head>
<body>
<div class="bar" id="bar"><span class="dot"></span>結果自動反映 強化ON</div>
<iframe class="frame" id="rough" src="./rough.html"></iframe>
<script>
const outer=document.getElementById('rough');
const bar=document.getElementById('bar');
let busy=false;

function getInner(){
  try{return outer.contentWindow.document.getElementById('app')?.contentWindow||null}catch(e){return null}
}
function jstDate(){
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
  }).format(new Date());
}
async function fallbackSettle(w){
  const d=jstDate();
  const y=d.slice(0,4),ymd=d.replaceAll('-','');
  const res=await fetch(
    `https://boatraceopenapi.github.io/api/v1/${y}/${ymd}.json?ts=${Date.now()}`,
    {cache:'no-store'}
  );
  if(!res.ok)throw new Error('result api '+res.status);

  const data=await res.json();
  const flatten=w.eval('flatten');
  const settle=w.eval('settle');
  const renderStats=w.eval('renderStats');

  if(typeof flatten!=='function'||typeof settle!=='function'){
    throw new Error('inner functions not ready');
  }

  settle(flatten(data));
  if(typeof renderStats==='function')renderStats();

  try{
    const display=w.eval('display');
    if(typeof display==='function')display();
  }catch(e){}
}

async function refreshResults(){
  if(busy)return;
  busy=true;

  try{
    const w=getInner();
    if(!w)throw new Error('inner frame not ready');

    let refreshed=false;

    try{
      const autoRefresh=w.eval('autoRefresh');
      if(typeof autoRefresh==='function'){
        await autoRefresh(true);
        refreshed=true;
      }
    }catch(e){}

    if(!refreshed){
      await fallbackSettle(w);
    }

    try{
      const renderStats=w.eval('renderStats');
      if(typeof renderStats==='function')renderStats();
    }catch(e){}

    // 通常版の再描画後、荒れるレース版の表示を必ず再適用する。
    // これにより「🔥 波乱度 xx/100 厳選通過」が更新後に消えない。
    try{
      const roughWin=outer.contentWindow;
      const roughApply=roughWin.eval('apply');
      if(typeof roughApply==='function'){
        roughApply();
        setTimeout(()=>{ try{ roughWin.eval('apply')(); }catch(e){} },300);
        setTimeout(()=>{ try{ roughWin.eval('apply')(); }catch(e){} },1200);
      }
    }catch(e){
      console.warn('rough badge re-apply failed',e);
    }

    bar.innerHTML='<span class="dot"></span>結果自動反映 強化ON・最新確認済み';
  }catch(e){
    console.warn('rough-fixed result refresh failed',e);
    bar.textContent='結果確認中… 自動再試行します';
  }finally{
    busy=false;
  }
}

outer.addEventListener('load',()=>{
  setTimeout(refreshResults,2500);
  setTimeout(refreshResults,7000);
  setTimeout(refreshResults,15000);
});

setInterval(refreshResults,30*1000);

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)refreshResults();
});

window.addEventListener('focus',refreshResults);

// Safariで再描画が発生した場合も波乱度表示を復元
setInterval(()=>{
  try{
    const rw=outer.contentWindow;
    const fn=rw.eval('apply');
    if(typeof fn==='function')fn();
  }catch(e){}
},2500);
</script>
</body>
</html>
