<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI 荒れるレース厳選版</title>
<style>
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}.bar{position:fixed;z-index:10;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;background:#0b0b0b;border-bottom:1px solid #765b19;color:#f4cf67;font-size:12px;font-weight:900}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#58dc8d}.frame{position:fixed;top:46px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 46px);border:0;background:#050505}
</style>
</head>
<body>
<div class="bar" id="bar"><span class="dot"></span>結果自動反映 強化ON</div>
<iframe class="frame" id="rough" src="./rough.html"></iframe>
<script>
const outer=document.getElementById('rough');
const bar=document.getElementById('bar');
let busy=false;
function getInner(){try{return outer.contentWindow.document.getElementById('app')?.contentWindow||null}catch(e){return null}}
async function refreshResults(){
  if(busy)return; busy=true;
  try{
    const w=getInner();
    if(!w){busy=false;return}
    const res=await fetch('https://boatraceopenapi.github.io/api/v1/today.json?ts='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('result api '+res.status);
    const data=await res.json();
    const f=w.eval('flatten'), s=w.eval('settle'), r=w.eval('renderStats');
    if(typeof f!=='function'||typeof s!=='function')throw new Error('inner functions not ready');
    s(f(data));
    if(typeof r==='function')r();
    try{if(typeof w.eval('display')==='function')w.eval('display')()}catch(e){}
    bar.innerHTML='<span class="dot"></span>結果自動反映 強化ON・最新確認済み';
  }catch(e){
    bar.textContent='結果確認中…';
  }finally{busy=false}
}
outer.addEventListener('load',()=>{setTimeout(refreshResults,2500);setTimeout(refreshResults,7000)});
setInterval(refreshResults,60*1000);
</script>
</body>
</html>
