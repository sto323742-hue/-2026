<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI 荒れるレース安定版</title>
<style>
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",sans-serif}
.bar{position:fixed;z-index:10;top:0;left:0;right:0;height:46px;display:flex;align-items:center;justify-content:center;background:#0b0b0b;border-bottom:1px solid #765b19;color:#f4cf67;font-size:12px;font-weight:900}
.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:#58dc8d}
.frame{position:fixed;top:46px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 46px);border:0;background:#050505}
</style>
</head>
<body>
<div class="bar" id="bar"><span class="dot"></span>安定版・結果自動反映ON</div>
<iframe class="frame" id="rough" src="./rough.html?v=stable-20260911-2"></iframe>

<script>
const outer=document.getElementById('rough');
const bar=document.getElementById('bar');
let busy=false;

function getInner(){
  try{
    return outer.contentWindow.document.getElementById('app')?.contentWindow||null;
  }catch(e){ return null; }
}

function jstDate(){
  return new Intl.DateTimeFormat('en-CA',{
    timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
  }).format(new Date());
}

function installStablePatch(){
  try{
    const rw=outer.contentWindow;
    if(!rw || !rw.document)return false;

    rw.eval(`
      (function(){
        if(window.__ROUGH_STABLE_PATCH_V2__) return;
        if(typeof roughDecision!=='function' || typeof oddsMoveSignal!=='function') return;

        window.__ROUGH_STABLE_PATCH_V2__=true;

        const LOCK_KEY='boat_ai_rough_pass_locks_v2';
        const MOVE_KEY='boat_ai_rough_move_cache_v2';

        function readObj(k){
          try{return JSON.parse(sessionStorage.getItem(k)||'{}')}catch(e){return{}}
        }
        function writeObj(k,v){
          try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}
        }

        let locks=readObj(LOCK_KEY);
        let moveCache=readObj(MOVE_KEY);

        // 前回の別日データは使わない
        const today=new Intl.DateTimeFormat('en-CA',{
          timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
        }).format(new Date());
        for(const k of Object.keys(locks)){
          if(!k.startsWith(today+'_')) delete locks[k];
        }
        writeObj(LOCK_KEY,locks);

        // パッチ導入前に一度通過していたものも回収
        try{
          const arr=frame?.contentWindow?.eval('analyses');
          if(Array.isArray(arr)){
            for(const a of arr){
              if(a?.roughDecision?.pass){
                locks[raceRoughKey(a)]=a.roughDecision;
              }
            }
            writeObj(LOCK_KEY,locks);
          }
        }catch(e){}

        const originalMove=oddsMoveSignal;
        oddsMoveSignal=function(a){
          const key=raceRoughKey(a);
          const cached=moveCache[key];

          // 同一レースのオッズ変動シグナルは60秒間保持。
          // rough.html の2.5秒再判定で急に0点へ戻るのを防ぐ。
          if(cached && Date.now()-Number(cached.ts||0)<60000 && cached.value){
            return cached.value;
          }

          const value=originalMove(a);
          moveCache[key]={ts:Date.now(),value};
          writeObj(MOVE_KEY,moveCache);
          return value;
        };

        const originalDecision=roughDecision;
        roughDecision=function(a){
          const key=raceRoughKey(a);
          const locked=locks[key];

          // 一度「厳選通過」したレースは、そのページを開いている間は固定
          if(locked && locked.pass){
            return locked;
          }

          const fresh=originalDecision(a);

          if(fresh && fresh.pass){
            locks[key]=fresh;
            writeObj(LOCK_KEY,locks);
          }
          return fresh;
        };

        // DOMに通過表示が出た瞬間も念のため固定
        setInterval(()=>{
          try{
            const doc=frame?.contentDocument;
            const arr=frame?.contentWindow?.eval('analyses');
            if(!doc||!Array.isArray(arr))return;

            const cards=[...doc.querySelectorAll('#results .race')];
            for(const card of cards){
              const badge=card.querySelector('.rough-badge');
              if(!badge)continue;

              const title=card.querySelector('.race-name')?.textContent||'';
              const m=title.match(/(\\d+)R/);
              if(!m)continue;
              const raceNo=Number(m[1]);

              const a=arr.find(x=>Number(x?.race?.race_number)===raceNo &&
                String(card.textContent||'').includes(
                  String((x?.race?.stadium_number && {
                    1:'桐生',2:'戸田',3:'江戸川',4:'平和島',5:'多摩川',6:'浜名湖',
                    7:'蒲郡',8:'常滑',9:'津',10:'三国',11:'びわこ',12:'住之江',
                    13:'尼崎',14:'鳴門',15:'丸亀',16:'児島',17:'宮島',18:'徳山',
                    19:'下関',20:'若松',21:'芦屋',22:'福岡',23:'唐津',24:'大村'
                  }[x.race.stadium_number])||'')
                )
              );
              if(!a)continue;

              const key=raceRoughKey(a);
              if(a?.roughDecision?.pass){
                locks[key]=a.roughDecision;
                writeObj(LOCK_KEY,locks);
              }
            }
          }catch(e){}
        },250);
      })();
    `);
    return true;
  }catch(e){
    console.warn('stable patch failed',e);
    return false;
  }
}

async function fallbackSettle(w){
  const d=jstDate();
  const y=d.slice(0,4), ymd=d.replaceAll('-','');
  const res=await fetch(
    `https://boatraceopenapi.github.io/api/v1/${y}/${ymd}.json?ts=${Date.now()}`,
    {cache:'no-store'}
  );
  if(!res.ok)throw new Error('result api '+res.status);

  const data=await res.json();
  const flatten=w.eval('flatten');
  const settle=w.eval('settle');
  const renderStats=w.eval('renderStats');

  if(typeof flatten!=='function'||typeof settle!=='function'){
    throw new Error('inner functions not ready');
  }

  settle(flatten(data));
  if(typeof renderStats==='function')renderStats();
}

async function refreshResults(){
  if(busy)return;
  busy=true;
  try{
    installStablePatch();

    const w=getInner();
    if(!w)throw new Error('inner frame not ready');

    let usedAuto=false;
    try{
      const autoRefresh=w.eval('autoRefresh');
      if(typeof autoRefresh==='function'){
        await autoRefresh(true);
        usedAuto=true;
      }
    }catch(e){}

    if(!usedAuto) await fallbackSettle(w);

    // 通常版が描画し直した後、荒れる版を再適用
    try{
      const rw=outer.contentWindow;
      rw.eval('injected=false;lastKey="";apply()');
    }catch(e){}

    bar.innerHTML='<span class="dot"></span>安定版・結果自動反映ON・最新確認済み';
  }catch(e){
    console.warn(e);
    bar.innerHTML='<span class="dot"></span>安定版・結果確認中…';
  }finally{
    busy=false;
  }
}

outer.addEventListener('load',()=>{
  // rough.html本体の初回判定より前にパッチを入れるため細かく試行
  [0,50,100,200,400,700,1000].forEach(ms=>setTimeout(installStablePatch,ms));
  setTimeout(refreshResults,3000);
  setTimeout(refreshResults,8000);
});

setInterval(refreshResults,30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden)refreshResults(); });
window.addEventListener('focus',refreshResults);
</script>
</body>
</html>
