<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI予想・最終配置版</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
#outer{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="outer" src="./index-final5-trifecta-lowodds-adjusted.html?v=final-layout-20260915"></iframe>
<script>
const outer=document.getElementById('outer');
function doc(){
  try{
    const d=outer.contentWindow.document, a=d.getElementById('app');
    return a&&a.contentWindow ? a.contentWindow.document : d;
  }catch(e){return null}
}
function counts(t){
  const g=r=>((t||'').match(r)||[])[1]||'0';
  return {s:g(/S評価\s*[:：]\s*(\d+)/),p:g(/期待値通過\s*[:：]\s*(\d+)/),x:g(/見送り\s*[:：]\s*(\d+)/)};
}
function titleBefore(el,txt){
  let p=el?.previousElementSibling;
  if(p&&(p.textContent||'').includes(txt)) return p;
  const root=el?.closest('#statsSection')||el?.parentElement;
  return root?[...root.querySelectorAll('.section-title')].find(x=>(x.textContent||'').includes(txt)):null;
}
function install(){
 const d=doc(); if(!d)return false;
 const status=d.getElementById('status'), stats=d.getElementById('statsSection');
 if(!status||!stats)return false;

 if(!d.getElementById('final-layout-css')){
  const s=d.createElement('style'); s.id='final-layout-css';
  s.textContent=`
   #status.finalSimple{padding:0!important;background:transparent!important;border:0!important}
   .fs-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
   .fs-card{padding:13px 3px 11px;text-align:center;background:#090909;border:1px solid #5b4718;border-radius:12px;min-width:0}
   .fs-card span{display:block;color:#ddd;font-size:11px;font-weight:900;white-space:nowrap}
   .fs-card b{display:block;color:#f2cd67;font-size:23px;margin-top:6px}
   .fs-card small{font-size:10px;margin-left:2px}
   .fs-flags{display:flex;justify-content:center;gap:13px;margin-top:10px;padding-top:10px;border-top:1px solid #3d3012;font-size:11px;font-weight:900;color:#ddd}
   .menu.finalMenu{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important}
   .menu.finalMenu button{min-width:0!important;width:100%!important;padding:13px 3px!important;font-size:11px!important;line-height:1.3!important;white-space:normal!important}
   #bottomLearningArea{margin-top:16px}
   @media(max-width:360px){.fs-card span,.fs-flags,.menu.finalMenu button{font-size:10px}.fs-card b{font-size:21px}}
  `;
  d.head.appendChild(s);
 }

 // 本日のAI予想をシンプル化
 const raw=status.dataset.originalStatus||status.textContent||'';
 if(!status.dataset.originalStatus || !status.querySelector('.fs-grid')) status.dataset.originalStatus=raw;
 const c=counts(status.dataset.originalStatus);
 status.classList.add('finalSimple');
 status.innerHTML=`<div class="fs-grid">
   <div class="fs-card"><span>🔥 S評価</span><b>${c.s}<small>レース</small></b></div>
   <div class="fs-card"><span>💰 期待値通過</span><b>${c.p}<small>レース</small></b></div>
   <div class="fs-card"><span>💤 見送り</span><b>${c.x}<small>レース</small></b></div>
  </div><div class="fs-flags"><span>🗄️ オッズ連動 ON</span><span>｜</span><span>↻ 自動更新 ON</span></div>`;
 const panel=status.closest('.panel');
 if(panel) panel.querySelectorAll('.notice').forEach(x=>x.style.display='none');

 // 3メニューを必ず横並び
 const menu=d.querySelector('.menu');
 if(menu) menu.classList.add('finalMenu');

 // 不的中接近度分析 + 会場別学習進捗を最下部へ
 let bottom=d.getElementById('bottomLearningArea');
 if(!bottom){bottom=d.createElement('div');bottom.id='bottomLearningArea';stats.appendChild(bottom)}

 const learningStats=d.getElementById('learningStats');
 let nearTitle=null;
 if(learningStats){
   nearTitle=learningStats.previousElementSibling;
   if(!nearTitle||(nearTitle.textContent||'').indexOf('不的中接近度分析')<0)
     nearTitle=[...stats.querySelectorAll('.section-title')].find(x=>(x.textContent||'').includes('不的中接近度分析'));
 }
 if(nearTitle) bottom.appendChild(nearTitle);
 if(learningStats) bottom.appendChild(learningStats);

 const lt=d.getElementById('learningToggle'), lw=d.getElementById('learningProgressWrap');
 const ltitle=titleBefore(lt,'会場別 学習進捗');
 if(ltitle) bottom.appendChild(ltitle);
 if(lt) bottom.appendChild(lt);
 if(lw) bottom.appendChild(lw);

 return true;
}
function boot(){let n=0;const t=setInterval(()=>{n++;if(install()||n>120)clearInterval(t)},250)}
outer.addEventListener('load',()=>setTimeout(boot,500));setTimeout(boot,1200);
</script>
</body></html>
