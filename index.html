<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">

<title>BOAT RACE AI予想 Ver.3</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  "Hiragino Kaku Gothic ProN",
  "Yu Gothic",
  sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:820px;
  margin:auto;
  padding:16px 10px 100px;
}

.header{
  text-align:center;
  padding:10px 4px 18px;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:.4px;
}

.brand .gold,
.ver{
  color:#efc559;
}

.ver{
  font-size:12px;
  margin-left:5px;
}

.sub{
  margin-top:6px;
  color:#9d9d9d;
  font-size:12px;
}

.panel,
.race{
  background:linear-gradient(180deg,#111,#090909);
  border:1px solid #765b19;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
}

.panel-title{
  color:#f3ca5b;
  font-weight:950;
  font-size:19px;
  margin-bottom:13px;
}

select,
input[type=date]{
  width:100%;
  height:51px;
  border:1px solid #775d1c;
  border-radius:12px;
  background:#080808;
  color:#fff;
  padding:0 12px;
  font-size:16px;
}

.status{
  margin-top:11px;
  padding:11px;
  border-radius:12px;
  background:#080808;
  border:1px solid #26210f;
  color:#c8c0a8;
  font-size:12px;
  line-height:1.7;
}

.notice{
  margin-top:8px;
  color:#777;
  font-size:10px;
  line-height:1.6;
}

.race{
  border-color:#6f571d;
}

.race-head,
.ai-top,
.total,
.profit{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.race-name{
  font-size:20px;
  font-weight:950;
}

.race-meta{
  font-size:11px;
  color:#aaa;
  margin-top:4px;
  line-height:1.6;
}

.smark{
  width:49px;
  height:49px;
  border:1px solid #f1c95e;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f1c95e;
  font-size:23px;
  font-weight:950;
}

.ai-box{
  margin-top:10px;
  background:#080808;
  border:1px solid #29220e;
  border-radius:12px;
  padding:11px;
}

.ai-score{
  font-size:23px;
  color:#f2cd67;
  font-weight:950;
}

.candidate-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}

.candidate{
  background:#111;
  border-radius:9px;
  text-align:center;
  padding:8px 3px;
}

.candidate small,
.weather-item small{
  display:block;
  color:#8d8d8d;
  font-size:9px;
}

.candidate b{
  font-size:17px;
}

.weather-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.weather-item{
  background:#111;
  border-radius:9px;
  padding:8px 4px;
  text-align:center;
}

.weather-item b{
  display:block;
  margin-top:2px;
  font-size:13px;
}

.scenario-box{
  margin-top:10px;
  padding:11px;
  border-radius:12px;
  border:1px solid #584516;
  background:linear-gradient(135deg,#151005,#090909);
}

.scenario-title{
  color:#f2cd67;
  font-size:13px;
  font-weight:950;
  margin-bottom:8px;
}

.scenario-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:10px;
  border-radius:10px;
  background:#111;
  border:1px solid #382d12;
}

.scenario-main strong,
.scenario-main span{
  color:#ffd971;
  font-weight:950;
}

.scenario-main strong{
  font-size:17px;
}

.scenario-main span{
  font-size:20px;
}

.scenario-list{
  margin-top:6px;
}

.scenario-row{
  display:grid;
  grid-template-columns:1fr 60px;
  gap:6px;
  padding:7px 8px;
  border-bottom:1px solid #26200e;
  font-size:11px;
}

.scenario-row:last-child{
  border-bottom:0;
}

.scenario-row b{
  text-align:right;
  color:#e8ca73;
}

.scenario-note{
  margin-top:7px;
  color:#8e846b;
  font-size:9px;
  line-height:1.55;
}

.gold-btn,
.toggle{
  width:100%;
  border-radius:13px;
  font-weight:900;
}

.gold-btn{
  min-height:44px;
  margin-top:10px;
  background:#17140d;
  border:1px solid #6e581d;
  color:#f0cc68;
}

.toggle{
  min-height:45px;
  margin-top:8px;
  background:#131313;
  border:1px solid #55451a;
  color:#edcc70;
}

.detail{
  display:none;
  margin-top:8px;
}

.bet-head{
  margin-top:7px;
  padding:9px 10px;
  border-radius:10px;
  background:#0b0b0b;
  border:1px solid #302813;
  font-weight:900;
}

.bet-head.main{
  color:#71baff;
}

.bet-head.cover{
  color:#e8d7a4;
}

.bet-head.hole{
  color:#ff9b52;
}

.ticket{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  padding:8px 10px;
  border-bottom:1px solid #24200f;
  background:#090909;
}

.combo{
  font-weight:950;
  letter-spacing:1px;
}

.money{
  color:#efd16e;
  font-weight:900;
}

.ticket-sub{
  grid-column:1/-1;
  color:#8f8f8f;
  font-size:9px;
  line-height:1.5;
}

.total{
  border-top:1px solid #6d551c;
  margin-top:9px;
  padding-top:9px;
  font-weight:950;
}

.logic,
.reason{
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:#0a0a0a;
  color:#aaa;
  font-size:10px;
  line-height:1.65;
}

.reason{
  border:1px solid #463814;
  background:#0b0905;
  color:#c8bb96;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.menu button{
  min-height:48px;
  border-radius:11px;
  border:1px solid #55451a;
  background:#111;
  color:#e8ca73;
  font-weight:900;
}

.stats{
  display:none;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.tab{
  height:43px;
  border:1px solid #55451a;
  background:#131313;
  color:#ddd;
  border-radius:10px;
  font-weight:900;
}

.tab.active{
  background:linear-gradient(135deg,#f4d070,#c8901f);
  color:#070707;
}

.range{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.range.show{
  display:grid;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:10px;
}

.stat{
  background:#090909;
  border:1px solid #2c2510;
  border-radius:11px;
  padding:11px;
}

.stat small{
  display:block;
  color:#aa9e78;
  font-size:10px;
}

.stat b{
  display:block;
  margin-top:3px;
  font-size:19px;
}

.green{
  color:#58dc8d;
}

.red{
  color:#ff6a6a;
}

.profit{
  margin-top:9px;
  padding:14px;
  border:1px solid #8a6719;
  border-radius:12px;
  background:linear-gradient(90deg,#171005,#080808);
}

.profit strong{
  font-size:26px;
  color:#f1cc65;
}

.section-title{
  margin:16px 0 8px;
  color:#f2cd68;
  font-weight:950;
}

.history-wrap,
.venue-wrap{
  display:none;
}

.history-controls{
  margin:10px 0;
}

.venue-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.venue-tabs::-webkit-scrollbar{
  display:none;
}

.venue-chip{
  flex:0 0 auto;
  min-width:67px;
  height:40px;
  padding:0 11px;
  border:1px solid #55451a;
  border-radius:10px;
  background:#111;
  color:#ddd;
  font-size:12px;
  font-weight:900;
}

.venue-chip.active{
  background:linear-gradient(135deg,#f4d070,#c8901f);
  color:#080808;
  border-color:#e9c057;
}

.result-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:4px 0 9px;
}

.result-chip{
  min-height:42px;
  border-radius:10px;
  border:1px solid #4a421e;
  background:#111;
  color:#ddd;
  font-size:11px;
  font-weight:900;
}

.result-chip.active.all{
  background:#d5aa3c;
  color:#080808;
}

.result-chip.active.hit-only{
  border-color:#35c77b;
  background:#0c2b1d;
  color:#65eaa5;
}

.result-chip.active.miss-only{
  border-color:#d85050;
  background:#2d1010;
  color:#ff8888;
}

.history-caption{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:7px 1px;
  color:#9b906f;
  font-size:10px;
}

.history-scroll{
  overflow-x:auto;
  border:1px solid #342b12;
  border-radius:12px;
}

.history-table{
  min-width:940px;
  width:100%;
  border-collapse:collapse;
  background:#080808;
  font-size:11px;
}

.history-table th,
.history-table td{
  padding:9px 7px;
  border-bottom:1px solid #25200f;
  border-right:1px solid #201c0e;
  text-align:center;
  white-space:nowrap;
}

.history-table th{
  color:#d8bb65;
  background:#0d0c08;
}

.hit{
  color:#58dc8d;
  font-weight:950;
}

.miss{
  color:#ff6a6a;
  font-weight:950;
}

.odds{
  color:#f0d06c;
  font-weight:950;
}

.roi{
  color:#58dc8d;
  font-weight:950;
}

.scenario-mini{
  color:#e8ca73;
  font-weight:900;
}

.venue-row{
  display:grid;
  grid-template-columns:1.1fr .7fr .8fr .9fr 1fr;
  gap:5px;
  padding:9px 3px;
  border-bottom:1px solid #26200e;
  font-size:11px;
}

.footer{
  text-align:center;
  color:#686868;
  font-size:10px;
  line-height:1.7;
  margin-top:24px;
}

.quick{
  position:fixed;
  right:9px;
  bottom:calc(11px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:20;
}

.quick button{
  height:42px;
  min-width:75px;
  border:1px solid #745a19;
  border-radius:999px;
  background:#111;
  color:#f0cc68;
  font-weight:900;
}

.empty{
  padding:22px 10px;
  text-align:center;
  color:#aaa;
  background:#0d0d0d;
  border:1px solid #302812;
  border-radius:14px;
  margin-bottom:12px;
}

.learning-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:9px;
}

.learning-card{
  background:#090909;
  border:1px solid #342b12;
  border-radius:11px;
  padding:10px;
}

.learning-card small{
  display:block;
  color:#aa9e78;
  font-size:9px;
}

.learning-card b{
  display:block;
  margin-top:4px;
  font-size:17px;
}

.learning-summary{
  margin-top:10px;
  padding:12px;
  border:1px solid #5c4918;
  border-radius:12px;
  background:linear-gradient(135deg,#151005,#090909);
  font-size:11px;
  line-height:1.7;
  color:#cfc3a0;
}

.progress-list{
  display:grid;
  gap:7px;
  margin-top:9px;
}

.progress-item{
  background:#090909;
  border:1px solid #2c2510;
  border-radius:11px;
  padding:9px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
}

.progress-track{
  height:7px;
  background:#1c1a13;
  border-radius:999px;
  overflow:hidden;
  margin-top:7px;
}

.progress-fill{
  height:100%;
  background:linear-gradient(90deg,#b77a18,#f0cc68);
  border-radius:999px;
}

.learn-ready{
  color:#58dc8d;
  font-weight:950;
}

.learn-mid{
  color:#f0cc68;
  font-weight:950;
}

.learn-low{
  color:#aaa;
  font-weight:900;
}

.proximity{
  font-weight:950;
}

.prox-exact{
  color:#58dc8d;
}

.prox-near{
  color:#f0cc68;
}

.prox-mid{
  color:#71baff;
}

.prox-low{
  color:#aaa;
}

.learning-note{
  margin-top:8px;
  color:#81775d;
  font-size:9px;
  line-height:1.6;
}

.learning-accordion{
  margin-top:14px;
}

.accordion-head{
  width:100%;
  min-height:48px;
  border:0;
  border-bottom:1px solid #302812;
  background:transparent;
  color:#f2cd68;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 2px;
  font-weight:950;
  font-size:16px;
  text-align:left;
}

.accordion-arrow{
  flex:0 0 auto;
  width:28px;
  height:28px;
  border:1px solid #5b491a;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#efc559;
  background:#111;
  transition:transform .2s ease;
}

.accordion-head[aria-expanded="true"] .accordion-arrow{
  transform:rotate(180deg);
}

.accordion-body{
  display:none;
  padding-top:2px;
}

.accordion-body.open{
  display:block;
}

@media(max-width:480px){

  .brand{
    font-size:23px;
  }

  .wrap{
    padding-left:9px;
    padding-right:9px;
  }

  .panel,
  .race{
    padding:13px;
  }

  .stat b{
    font-size:17px;
  }

  .profit strong{
    font-size:23px;
  }

  .range{
    grid-template-columns:1fr;
  }

  .candidate b{
    font-size:16px;
  }

  .menu{
    grid-template-columns:1fr;
  }

  .venue-chip{
    min-width:64px;
  }

  .result-chip{
    font-size:10px;
  }
}
</style>
</head>

<body>

<div class="wrap" id="top">

<header class="header">

  <div class="brand">
    <span class="gold">
      🚤 BOAT RACE
    </span>

    AI予想

    <span class="ver">
      Ver.3
    </span>
  </div>

  <div class="sub">
    展示予測 × 学習データ × 不的中接近度 × 会場別100R学習
  </div>

</header>


<section class="panel">

  <div class="panel-title">
    本日のS評価レース
  </div>

  <div class="status" id="status">
    最新データを自動取得しています…
  </div>

  <div class="notice">
    本線3点・狙い4点・穴3点＝合計10点。
    <br>
    本線＝AI推定確率上位、
    狙い＝展開・攻め役・期待値を重視、
    穴＝高配当シナリオを狙います。
    <br>
    展示情報が6艇分揃ったレースのみ
    S評価判定します。
  </div>

</section>


<div id="results"></div>


<section class="panel">

  <div class="menu">

    <button id="statsOpen">
      📊 AI成績を見る
    </button>

    <button id="historyOpen">
      🎯 的中・不的中
    </button>

    <button id="venueOpen">
      📍 会場別成績
    </button>

  </div>

</section>


<section class="panel stats" id="statsSection">

  <div class="panel-title">
    📊 AI成績
  </div>

  <div class="tabs">

    <button class="tab active" data-period="day">
      今日
    </button>

    <button class="tab" data-period="custom">
      期間指定
    </button>

    <button class="tab" data-period="all">
      全期間
    </button>

  </div>

  <div class="range" id="rangeBox">

    <input type="date" id="fromDate">

    <input type="date" id="toDate">

  </div>

  <div id="stats"></div>


  <div class="learning-accordion">

    <button
      class="accordion-head"
      id="learningStatsToggle"
      type="button"
      aria-expanded="false"
      aria-controls="learningStatsWrap"
    >

      <span>
        🧠 不的中接近度分析
      </span>

      <span class="accordion-arrow">
        ▼
      </span>

    </button>

    <div
      class="accordion-body"
      id="learningStatsWrap"
    >
      <div id="learningStats"></div>
    </div>

  </div>


  <div class="learning-accordion">

    <button
      class="accordion-head"
      id="learningProgressToggle"
      type="button"
      aria-expanded="false"
      aria-controls="learningProgressWrap"
    >

      <span>
        📍 会場別 学習進捗（100R基準）
      </span>

      <span class="accordion-arrow">
        ▼
      </span>

    </button>

    <div
      class="accordion-body"
      id="learningProgressWrap"
    >
      <div id="learningProgress"></div>
    </div>

  </div>


  <div class="section-title">
    的中・不的中レース
  </div>

  <button class="toggle" id="historyToggle">
    一覧を表示
  </button>

  <div class="history-wrap" id="historyWrap">
    <div id="history"></div>
  </div>


  <div class="section-title">
    会場別成績
  </div>

  <button class="toggle" id="venueToggle">
    会場別成績を表示
  </button>

  <div class="venue-wrap" id="venueWrap">
    <div id="venueStats"></div>
  </div>

</section>


<footer class="footer">
  AI評価・展開予測は参考情報です。
  <br>
  投票は無理のない範囲で行ってください。
</footer>

</div>


<div class="quick">

  <button id="qStats">
    📊 成績
  </button>

  <button id="qTop">
    ↑ 上へ
  </button>

</div>


<script>

/*
=====================================
 BOAT RACE API
=====================================
*/

const API_BASE =
'https://boatraceopenapi.github.io/api/v1';


/*
=====================================
 保存キー

★ここは変更しない
過去成績を引き継ぎます
=====================================
*/

const STORAGE_KEY =
'boat_ai_gold_v1_records';

const UI_STATE_KEY =
'boat_ai_gold_ui_state_v1';

const MODEL_NAME =
'gold-v3-learning-proximity-venue100';


/*
=====================================
 固定検証額
=====================================
*/

const FIXED_BET_PER_TICKET = 100;

const FIXED_RACE_STAKE = 1000;


/*
=====================================
 会場
=====================================
*/

const STADIUMS={

  1:'桐生',
  2:'戸田',
  3:'江戸川',
  4:'平和島',
  5:'多摩川',
  6:'浜名湖',
  7:'蒲郡',
  8:'常滑',
  9:'津',
  10:'三国',
  11:'びわこ',
  12:'住之江',
  13:'尼崎',
  14:'鳴門',
  15:'丸亀',
  16:'児島',
  17:'宮島',
  18:'徳山',
  19:'下関',
  20:'若松',
  21:'芦屋',
  22:'福岡',
  23:'唐津',
  24:'大村'

};


const WEATHER_NAMES={

  1:'晴',
  2:'曇',
  3:'雨',
  4:'雪',
  5:'霧'

};


let analyses=[];

let period='day';

let lastDataSignature='';

let autoUpdateBusy=false;

let historyVenue='all';

let historyResult='all';


const $=
id=>
document.getElementById(id);


const num=
(v,d=0)=>
Number.isFinite(Number(v))
?
Number(v)
:
d;


const clamp=
(v,a,b)=>
Math.max(
  a,
  Math.min(
    b,
    v
  )
);


/*
=====================================
 日本時間 YYYY-MM-DD
=====================================
*/

function todayJST(){

  return new Intl
  .DateTimeFormat(
    'en-CA',

/*
=====================================
 API用 JST日付
=====================================
*/

function apiDateJST(){

  const parts=
  new Intl.DateTimeFormat(
    'en-CA',
    {
      timeZone:'Asia/Tokyo',
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }
  )
  .formatToParts(
    new Date()
  );


  const obj={};


  for(
    const p
    of parts
  ){

    if(
      p.type!=='literal'
    ){

      obj[p.type]=p.value;

    }

  }


  return{

    year:obj.year,

    ymd:
    `${obj.year}${obj.month}${obj.day}`

  };

}

/*
=====================================
 fetch タイムアウト付き
=====================================
*/

async function fetchJSON(
  url,
  timeout=15000
){

  const controller=
  new AbortController();


  const timer=
  setTimeout(
    ()=>controller.abort(),
    timeout
  );


  try{

    const res=
    await fetch(
      url,
      {
        cache:'no-store',
        signal:controller.signal
      }
    );


    if(
      !res.ok
    ){

      throw new Error(
        `HTTP ${res.status}`
      );

    }


    const data=
    await res.json();


    if(
      !data
      ||
      typeof data!=='object'
    ){

      throw new Error(
        'JSONデータが空です'
      );

    }


    return data;

  }
  finally{

    clearTimeout(
      timer
    );

  }

}

/*
=====================================
 艇スコア
=====================================
*/

function boatScore(
  r,
  boat
){

  const racer=
  racerData(
    r,
    boat
  );


  const preview=
  previewData(
    r,
    boat
  );


  const course=
  num(
    preview.course_number,
    boat
  );


  const exhibition=
  num(
    preview.exhibition_time,
    7
  );


  const start=
  num(
    preview.start_timing,
    .25
  );


  const national=
  num(
    racer.national_winning_percentage,
    num(
      racer.winning_percentage,
      5
    )
  );


  const local=
  num(
    racer.local_winning_percentage,
    national
  );


  const motor=
  num(
    racer.motor_triple_rate,
    num(
      racer.motor_winning_percentage,
      30
    )
  );


  const boatRate=
  num(
    racer.boat_triple_rate,
    num(
      racer.boat_winning_percentage,
      30
    )
  );


  const avgST=
  num(
    racer.average_start_timing,
    .18
  );


  let score=0;


  score +=
  national * 6.2;


  score +=
  local * 2.4;


  score +=
  motor * .17;


  score +=
  boatRate * .08;


  score +=
  Math.max(
    0,
    7.10-exhibition
  )
  *
  32;


  score +=
  Math.max(
    0,
    .25-start
  )
  *
  45;


  score +=
  Math.max(
    0,
    .22-avgST
  )
  *
  22;


  score +=
  Math.max(
    0,
    7-course
  )
  *
  2.7;


  if(
    course===1
  ){

    score += 9;

  }


  return score;

}

/*
=====================================
 展開予測
=====================================
*/

function buildScenario(
  r,
  boats,
  weather
){

  const firstMap={};

  const candidates=[];


  for(
    const b
    of boats
  ){

    const boat=
    b.boat;


    const p=
    previewData(
      r,
      boat
    );


    const course=
    num(
      p.course_number,
      boat
    );


    const st=
    num(
      p.start_timing,
      .20
    );


    const ex=
    num(
      p.exhibition_time,
      7
    );


    let tactic='展開突き';

    let raw=0;


    if(
      course===1
    ){

      tactic='逃げ';

      raw=
      .34
      +
      Math.max(
        0,
        .18-st
      )
      *
      1.8
      +
      Math.max(
        0,
        6.90-ex
      )
      *
      .8;

    }
    else if(
      course===2
    ){

      tactic='差し';

      raw=
      .19
      +
      Math.max(
        0,
        .17-st
      )
      *
      1.4;

    }
    else if(
      course===3
    ){

      tactic=
      st<=.13
      ?
      'まくり'
      :
      'まくり差し';

      raw=
      .18
      +
      Math.max(
        0,
        .17-st
      )
      *
      1.7;

    }
    else if(
      course===4
    ){

      tactic=
      st<=.12
      ?
      'まくり'
      :
      'まくり差し';

      raw=
      .15
      +
      Math.max(
        0,
        .16-st
      )
      *
      1.8;

    }
    else{

      tactic='展開突き';

      raw=
      .08
      +
      Math.max(
        0,
        .15-st
      )
      *
      1.2;

    }


    raw *=
    (
      1
      +
      b.normalized
      *
      .55
    );


    if(
      weather.windSpeed>=6
    ){

      raw *=
      course>=3
      ?
      1.06
      :
      .96;

    }


    if(
      weather.wave>=8
    ){

      raw *=
      course===1
      ?
      .94
      :
      1.03;

    }


    raw=
    Math.max(
      .01,
      raw
    );


    firstMap[
      boat
    ]=
    raw;


    candidates.push({

      boat,

      tactic,

      raw

    });

  }


  const total=
  candidates.reduce(
    (
      s,
      x
    )=>
    s+x.raw,
    0
  );


  for(
    const x
    of candidates
  ){

    x.probability=
    total
    ?
    x.raw/total
    :
    0;

  }


  candidates.sort(
    (
      a,
      b
    )=>
    b.probability
    -
    a.probability
  );


  const top=
  candidates[0]
  ||
  null;


  const attacker=
  candidates.find(
    x=>
    x.tactic==='まくり'
    ||
    x.tactic==='まくり差し'
  )
  ||
  candidates[1]
  ||
  null;


  return{

    candidates,

    top,

    attacker,

    firstMap

  };

}


/*
=====================================
 AI評価
=====================================
*/

function evaluate(r){

  const raw=
  Array.from(
    {
      length:6
    },
    (
      _,
      i
    )=>{

      const boat=
      i+1;


      return{

        boat,

        score:
        boatScore(
          r,
          boat
        )

      };

    }
  )
  .sort(
    (
      a,
      b
    )=>
    b.score-a.score
  );


  const min=
  Math.min(
    ...raw.map(
      x=>x.score
    )
  );


  const max=
  Math.max(
    ...raw.map(
      x=>x.score
    )
  );


  const boats=
  raw.map(
    x=>({

      ...x,

      normalized:
      max===min
      ?
      .5
      :
      (
        x.score-min
      )
      /
      (
        max-min
      )

    })
  );


  const weather=
  weatherData(r);


  const exRank=
  exhibitionRanking(r);


  const stRank=
  startRanking(r);


  const changes=
  courseChanges(r);


  const scenario=
  buildScenario(
    r,
    boats,
    weather
  );


  const spread=
  boats[0].score
  -
  boats[2].score;


  const topScenario=
  scenario?.top?.probability
  ||
  0;


  let rating=68;


  rating +=
  clamp(
    spread*.65,
    0,
    13
  );


  rating +=
  topScenario*18;


  if(
    exRank[0]?.boat
    ===
    boats[0]?.boat
  ){

    rating+=4;

  }


  if(
    stRank[0]?.boat
    ===
    boats[0]?.boat
  ){

    rating+=4;

  }


  if(
    changes.length===0
  ){

    rating+=3;

  }
  else if(
    changes.length>=3
  ){

    rating-=8;

  }


  if(
    weather.windSpeed>=8
  ){

    rating-=8;

  }
  else if(
    weather.windSpeed>=6
  ){

    rating-=4;

  }


  if(
    weather.wave>=10
  ){

    rating-=8;

  }
  else if(
    weather.wave>=7
  ){

    rating-=4;

  }


  if(
    topScenario<.25
  ){

    rating-=8;

  }


  rating=
  Math.round(
    clamp(
      rating,
      0,
      99
    )
  );


  const grade=
  rating>=84
  &&
  weather.windSpeed<8
  &&
  weather.wave<10
  &&
  changes.length<3
  &&
  topScenario>=.24
  ?
  'S'
  :
  'A';


  const reasons=[];


  reasons.push(
    `艇評価1位は${boats[0].boat}号艇`
  );


  reasons.push(
    `展示1位は${exRank[0]?.boat||'-'}号艇`
  );


  reasons.push(
    `展示ST1位は${stRank[0]?.boat||'-'}号艇`
  );


  if(
    scenario.top
  ){

    reasons.push(
      `展開本線は${scenario.top.boat}号艇 ${scenario.top.tactic}`
    );

  }


  if(
    scenario.attacker
  ){

    reasons.push(
      `攻め役候補は${scenario.attacker.boat}号艇`
    );

  }


  if(
    weather.windSpeed>=5
  ){

    reasons.push(
      `風速${weather.windSpeed}mを展開補正`
    );

  }


  if(
    weather.wave>=5
  ){

    reasons.push(
      `波高${weather.wave}cmを展開補正`
    );

  }


  return{

    race:r,

    boats,

    weather,

    exhibitionRank:exRank,

    startRank:stRank,

    courseChanges:changes,

    scenario,

    rating,

    grade,

    reasons

  };

}

function allCombos(){

  const arr=[];

  for(
    let a=1;
    a<=6;
    a++
  ){

    for(
      let b=1;
      b<=6;
      b++
    ){

      if(
        b===a
      ){
        continue;
      }

      for(
        let c=1;
        c<=6;
        c++
      ){

        if(
          c===a
          ||
          c===b
        ){
          continue;
        }

        arr.push(
          `${a}-${b}-${c}`
        );

      }

    }

  }

  return arr;

}


/*
=====================================
 艇評価取得
=====================================
*/

function boatByNumber(
  a,
  boat
){

  return(
    a.boats.find(
      x=>
      x.boat===boat
    )
    ||
    {
      normalized:0
    }

/*
=====================================
 3連単重み
=====================================
*/

function comboRawWeight(
  combo,
  a
){

  const [
    first,
    second,
    third
  ]=
  combo
  .split('-')
  .map(Number);


  const f=
  boatByNumber(
    a,
    first
  );


  const s=
  boatByNumber(
    a,
    second
  );


  const t=
  boatByNumber(
    a,
    third
  );


  let weight=1;


  weight *=
  .35
  +
  f.normalized
  *
  1.5;


  weight *=
  .45
  +
  s.normalized
  *
  1.0;


  weight *=
  .55
  +
  t.normalized
  *
  .75;


  const firstScenario=
  a.scenario?.firstMap?.[
    first
  ]
  ||
  0;


  weight *=
  1
  +
  firstScenario
  *
  2.8;


  const attacker=
  a.scenario
  ?.attacker
  ?.boat;


  if(
    attacker
    &&
    (
      first===attacker
      ||
      second===attacker
    )
  ){

    weight *= 1.10;

  }


  const topBoat=
  a.boats[0]
  ?.boat;


  if(
    first===topBoat
  ){

    weight *= 1.08;

  }


  return weight;

}


/*
=====================================
 3連単全体確率キャッシュ
=====================================
*/

function comboProbabilityMap(a){

  const combos=
  allCombos();


  const rows=
  combos.map(
    combo=>({

      combo,

      weight:
      comboRawWeight(
        combo,
        a
      )

    })
  );


  const total=
  rows.reduce(
    (
      sum,
      x
    )=>
    sum+x.weight,
    0
  );


  const map=
  new Map();


  for(
    const x
    of rows
  ){

    map.set(
      x.combo,
      total
      ?
      x.weight/total
      :
      0
    );

  }


  return map;

}


/*
=====================================
 組み合わせAI推定確率
=====================================
*/

function comboProbability(
  combo,
  a
){

  if(
    !a._comboProbabilityMap
  ){

    a._comboProbabilityMap=
    comboProbabilityMap(
      a
    );

  }


  return(
    a._comboProbabilityMap.get(
      combo
    )
    ||
    0
  );

}

      1;


      const spreadBonus=
      top3.includes(
        p[1]
      )
      &&
      top3.includes(
        p[2]
      )
      ?
      1.06
      :
      1;


      const rankBonus=
      index>=2
      ?
      1.05
      :
      1;


      return{

        ...x,

        targetScore:
        x.probability
        *
        (
          1
          +
          firstScenario
          *
          1.15
        )
        *
        nonFavorite
        *
        attackerBonus
        *
        spreadBonus
        *
        rankBonus

      };

    }
  )
  .sort(
    (
      x,
      y
    )=>
    y.targetScore
    -
    x.targetScore
  );


  const cover=
  targetCandidates
  .slice(
    0,
    4
  )
  .map(
    x=>x.combo
  );


  const used=
  new Set(
    [
      ...main,
      ...cover
    ]
  );


  let special=null;


  if(
    attacker
  ){

    const ac=
    scored.filter(
      x=>{

        if(
          used.has(
            x.combo
          )
        ){
          return false;
        }


        const p=
        x.combo
        .split('-')
        .map(Number);


        return(
          p[0]===attacker
          &&
          (
            topBoats.includes(
              p[1]
            )
            ||
            topBoats.includes(
              p[2]
            )
          )
        );

      }
    );


    if(
      ac.length
    ){

      special=
      ac[0].combo;

    }

  }


  if(
    !special
  ){

    special=
    scored.find(
      x=>{

        if(
          used.has(
            x.combo
          )
        ){
          return false;
        }


        return(
          Number(
            x.combo[0]
          )
          !==
          topBoat
        );

      }
    )
    ?.combo;

  }


  if(
    special
  ){

    used.add(
      special
    );

  }


  const holeCandidates=
  scored
  .slice(
    7
  )
  .map(
    (
      x,
      index
    )=>{

      const first=
      Number(
        x.combo[0]
      );


      const firstScenario=
      a.scenario
      ?.firstMap
      ?.[first]
      ||
      0;


      const outsider=
      first!==topBoat
      ?
      1.30
      :
      1;


      const middleBonus=
      index>=4
      ?
      1.10
      :
      1;


      return{

        ...x,

        holeScore:
        x.probability
        *
        (
          1
          +
          firstScenario
          *
          1.8
        )
        *
        outsider
        *
        middleBonus

      };

    }
  )
  .filter(
    x=>
    !used.has(
      x.combo
    )
  )
  .sort(
    (
      x,
      y
    )=>
    y.holeScore
    -
    x.holeScore
  );


  const hole=
  holeCandidates
  .slice(
    0,
    2
  )
  .map(
    x=>x.combo
  );


  if(
    special
  ){

    hole.push(
      special
    );

  }


  for(
    const x
    of scored
  ){

    if(
      hole.length>=3
    ){
      break;
    }


    if(
      !used.has(
        x.combo
      )
      &&
      !hole.includes(
        x.combo
      )
    ){

      hole.push(
        x.combo
      );

    }

  }


  return{

    main,

    cover,

    hole:
    hole.slice(
      0,
      3
    ),

    special

  };

}


/*
=====================================
 固定100円 × 10点
=====================================
*/

function allocateTickets(
  ticketSet,
  a
){

  const all=[

    ...ticketSet.main.map(
      combo=>({
        combo,
        group:'main'
      })
    ),

    ...ticketSet.cover.map(
      combo=>({
        combo,
        group:'cover'
      })
    ),

    ...ticketSet.hole.map(
      combo=>({
        combo,
        group:'hole'
      })
    )

  ];


  return all.map(
    x=>({

      ...x,

      probability:
      comboProbability(
        x.combo,
        a
      ),

      special:
      x.combo
      ===
      ticketSet.special,

      money:
      FIXED_BET_PER_TICKET

    })
  );

}

/*
=====================================
 3連単分解
=====================================
*/

function comboParts(combo){

  return String(
    combo
    ||
    ''
  )
  .split('-')
  .map(Number)
  .filter(
    x=>
    x>=1
    &&
    x<=6
  )
  .slice(
    0,
    3
  );

}


/*
=====================================
 1買い目の接近度
=====================================
*/

function analyzeTicketCloseness(
  ticketCombo,
  resultCombo
){

  const p=
  comboParts(
    ticketCombo
  );


  const r=
  comboParts(
    resultCombo
  );


  if(
    p.length!==3
    ||
    r.length!==3
  ){

    return{

      score:0,
      type:'unknown',
      label:'分析不可',
      overlap:0,
      positionMatches:0,
      missPositions:[]

    };

  }


  const positions=
  [0,1,2]
  .filter(
    i=>
    p[i]===r[i]
  );


  const positionMatches=
  positions.length;


  const overlap=
  p.filter(
    x=>
    r.includes(x)
  )
  .length;


  const missPositions=
  [0,1,2]
  .filter(
    i=>
    p[i]!==r[i]
  )
  .map(
    i=>i+1
  );


  if(
    ticketCombo
    ===
    resultCombo
  ){

    return{

      score:100,
      type:'exact',
      label:'完全一致',
      overlap:3,
      positionMatches:3,
      missPositions:[]

    };

  }


  if(
    overlap===3
  ){

    return{

      score:90,
      type:'three_wrong_order',
      label:'3艇一致・順番違い',
      overlap,
      positionMatches,
      missPositions

    };

  }


  if(
    positionMatches===2
  ){

    const miss=
    missPositions[0];


    return{

      score:82,
      type:'two_positions',
      label:
      `${miss}着だけ外れ`,
      overlap,
      positionMatches,
      missPositions

    };

  }


  if(
    overlap===2
  ){

    return{

      score:65,
      type:'two_boats',
      label:'2艇一致',
      overlap,
      positionMatches,
      missPositions

    };

  }


  if(
    overlap===1
  ){

    return{

      score:35,
      type:'one_boat',
      label:'1艇一致',
      overlap,
      positionMatches,
      missPositions

    };

  }


  return{

    score:0,
    type:'none',
    label:'完全外れ',
    overlap:0,
    positionMatches:0,
    missPositions:[1,2,3]

  };

}


/*
=====================================
 予想10点の接近度
=====================================
*/

function analyzePredictionCloseness(
  rec,
  resultCombo
){

  const tickets=
  Array.isArray(
    rec?.tickets
  )
  ?
  rec.tickets
  :
  [];


  if(
    !tickets.length
    ||
    !resultCombo
  ){

    return{

      score:0,
      type:'unknown',
      label:'予想10点データなし',
      bestCombo:'',
      bestGroup:'',
      overlap:0,
      positionMatches:0,
      missPositions:[]

    };

  }


  const ranked=
  tickets
  .map(
    t=>({

      ...analyzeTicketCloseness(
        t.combo,
        resultCombo
      ),

      combo:t.combo,

      group:
      t.group
      ||
      '',

      special:
      !!t.special

    })
  )
  .sort(
    (
      a,
      b
    )=>
    b.score-a.score
    ||
    b.positionMatches-a.positionMatches
    ||
    b.overlap-a.overlap
  );


  const best=
  ranked[0];


  return{

    score:best.score,
    type:best.type,
    label:best.label,
    bestCombo:best.combo,
    bestGroup:best.group,
    special:best.special,
    overlap:best.overlap,
    positionMatches:
    best.positionMatches,
    missPositions:
    best.missPositions,

    top3:
    ranked
    .slice(
      0,
      3
    )
    .map(
      x=>({

        combo:x.combo,
        group:x.group,
        score:x.score,
        label:x.label

      })
    )

  };

}


/*
=====================================
 過去データ学習補完
=====================================
*/

function backfillLearningRecords(){

  const rs=
  records();


  let changed=false;


  for(
    const rec
    of rs
  ){

    if(
      !rec.learningSnapshot
      &&
      Array.isArray(
        rec.tickets
      )
      &&
      rec.tickets.length
    ){

      rec.learningSnapshot={

        model:
        rec.model
        ||
        MODEL_NAME,

        savedAt:
        rec.savedAt
        ||
        '',

        rating:
        num(
          rec.rating
        ),

        grade:
        rec.grade
        ||
        'S',

        tickets:
        rec.tickets.map(
          t=>({

            combo:t.combo,

            group:
            t.group
            ||
            '',

            probability:
            num(
              t.probability
            ),

            special:
            !!t.special,

            money:
            num(
              t.money,
              FIXED_BET_PER_TICKET
            )

          })
        ),

        predictionMeta:
        rec.predictionMeta
        ||
        null

      };


      changed=true;

    }


    if(
      rec.done
      &&
      rec.result
      &&
      !rec.proximity
      &&
      Array.isArray(
        rec.tickets
      )
      &&
      rec.tickets.length
    ){

      rec.proximity=
      analyzePredictionCloseness(
        rec,
        rec.result
      );


      changed=true;

    }

  }


  if(
    changed
  ){

    save(
      rs
    );

  }

}

function proximityClass(p){

  if(
    !p
  ){
    return 'prox-low';
  }


  if(
    p.type==='exact'
  ){
    return 'prox-exact';
  }


  if(
    p.score>=80
  ){
    return 'prox-near';
  }


  if(
    p.score>=60
  ){
    return 'prox-mid';
  }


  return 'prox-low';

/*
=====================================
 不的中学習集計
=====================================
*/

function learningSummary(rs){

  const done=
  rs.filter(
    x=>x.done
  );


  const miss=
  done.filter(
    x=>!x.hit
  );


  const known=
  miss.filter(
    x=>
    x.proximity
    &&
    x.proximity.type
    !==
    'unknown'
  );


  const c={

    three:0,
    twoPos:0,
    twoBoats:0,
    one:0,
    none:0,

    thirdOnly:0,
    secondOnly:0,
    firstOnly:0

  };


  for(
    const x
    of known
  ){

    const p=
    x.proximity;


    if(
      p.type===
      'three_wrong_order'
    ){

      c.three++;

    }
    else if(
      p.type===
      'two_positions'
    ){

      c.twoPos++;

    }
    else if(
      p.type===
      'two_boats'
    ){

      c.twoBoats++;

    }
    else if(
      p.type===
      'one_boat'
    ){

      c.one++;

    }
    else if(
      p.type===
      'none'
    ){

      c.none++;

    }


    if(
      p.type===
      'two_positions'
      &&
      p.missPositions
      ?.length===1
    ){

      if(
        p.missPositions[0]===1
      ){
        c.firstOnly++;
      }


      if(
        p.missPositions[0]===2
      ){
        c.secondOnly++;
      }


      if(
        p.missPositions[0]===3
      ){
        c.thirdOnly++;
      }

    }

  }


  const close=
  known.filter(
    x=>
    num(
      x.proximity?.score
    )
    >=65
  )
  .length;


  const closeRate=
  known.length
  ?
  close
  /
  known.length
  *
  100
  :
  0;


  return{

    done,
    miss,
    known,
    c,
    close,
    closeRate

  };

}

    if(
      !old.done
    ){

      Object.assign(
        old,
        {

          tickets,

          stake,

          rating:
          a.rating,

          predictionMeta,

          savedAt:
          new Date()
          .toISOString(),

          model:
          MODEL_NAME,

          learningSnapshot:
          snapshot

        }
      );


      save(
        rs
      );

    }


    return;

  }


  rs.push({

    key,

    date:
    r.date
    ||
    todayJST(),

    stadium:
    r.stadium_number,

    venue:
    STADIUMS[
      r.stadium_number
    ]
    ||
    '会場',

    raceNumber:
    r.race_number,

    grade:'S',

    rating:
    a.rating,

    tickets,

    stake,

    done:false,

    hit:false,

    result:'',

    payout:0,

    resultOdds:0,

    returnAmount:0,

    savedAt:
    new Date()
    .toISOString(),

    model:
    MODEL_NAME,

    predictionMeta,

    learningSnapshot:
    snapshot

  });


  save(
    rs
  );

}


/*
=====================================
 3連単払戻
=====================================
*/

function payouts(r){

  const trifecta=
  r?.result
  ?.payouts
  ?.trifecta;


  return(
    Array.isArray(
      trifecta
    )
    ?
    trifecta
    :
    []
  );

}


/*
=====================================
 結果照合
=====================================
*/

function settle(races){

  const rs=
  records();


  let changed=false;


  for(
    const rec
    of rs
  ){

    if(
      rec.done
    ){
      continue;
    }


    const r=
    races.find(
      x=>
      raceKey(x)
      ===
      rec.key
    );


    if(
      !r
    ){
      continue;
    }


    const p=
    payouts(r);


    if(
      !p.length
    ){
      continue;
    }


    const winner=
    p[0];


    const combo=
    String(
      winner.combination
      ||
      ''
    );


    const pay=
    num(
      winner.amount
    );


    if(
      !combo
    ){
      continue;
    }


    rec.done=true;


    rec.result=
    combo;


    rec.payout=
    pay;


    rec.resultOdds=
    pay>0
    ?
    pay/100
    :
    0;


    const hitTicket=
    rec.tickets
    ?.find(
      t=>
      t.combo===combo
    );


    rec.hit=
    !!hitTicket;


    rec.hitGroup=
    hitTicket?.group
    ||
    '';


    rec.returnAmount=
    hitTicket
    ?
    Math.round(
      pay
      /
      100
      *
      FIXED_BET_PER_TICKET
    )
    :
    0;


    rec.proximity=
    analyzePredictionCloseness(
      rec,
      combo
    );


    rec.settledAt=
    new Date()
    .toISOString();


    changed=true;

  }


  if(
    changed
  ){

    save(
      rs
    );

  }

}

function dataSignature(races){

  return JSON.stringify(

    races.map(
      r=>[

        raceKey(r),

        r.closed_at,

        r.preview?.wind_speed,

        r.preview
        ?.wind_direction_number,

        r.preview
        ?.wave_height,

        r.preview
        ?.weather_number,

        r.preview
        ?.air_temperature,

        r.preview
        ?.water_temperature,

        ...Array.from(
          {
            length:6
          },
          (
            _,
            i
          )=>{

            const p=
            r.preview
            ?.racers
            ?.[String(i+1)];


            return[

              p?.exhibition_time,

              p?.start_timing,

              p?.course_number

            ];

          }
        ),

        r.result
        ?.payouts
        ?.trifecta
        ?.[0]
        ?.combination,

        r.result
        ?.payouts
        ?.trifecta
        ?.[0]
        ?.amount

      ]
    )

  );

}


/*
=====================================
 レース分析
=====================================
*/

function analyzeRaces(races){

  settle(
    races
  );


  const arr=[];


  for(
    const r
    of races
  ){

    if(
      !upcoming(r)
      ||
      !previewReady(r)
    ){
      continue;
    }


    const a=
    evaluate(r);


    if(
      a?.grade==='S'
    ){

      arr.push(
        a
      );


      savePrediction(
        a
      );

    }

  }


  arr.sort(
    (
      a,
      b
    )=>
    b.rating-a.rating
  );


  analyses=
  arr;


  display();


  renderStats();


  return arr;

}


/*
=====================================
 自動更新
=====================================
*/

async function autoRefresh(
  force=false
){

  if(
    autoUpdateBusy
  ){
    return;
  }


  autoUpdateBusy=true;


  const status=
  $('status');


  try{

    if(
      force
    ){

      status.innerHTML=
      `
      最新データを
      自動取得しています…
      `;

    }


    const data=
    await fetchToday();


    const races=
    flatten(
      data
    );


    if(
      !races.length
    ){

      throw new Error(
        'レースデータが0件です'
      );

    }


    const signature=
    dataSignature(
      races
    );


    settle(
      races
    );


    if(
      force
      ||
      signature
      !==
      lastDataSignature
    ){

      lastDataSignature=
      signature;


      const arr=
      analyzeRaces(
        races
      );


      const readyCount=
      races.filter(
        r=>
        upcoming(r)
        &&
        previewReady(r)
      )
      .length;


      status.innerHTML=
      `
      ✅ 自動更新完了

      <br>

      取得レース：
      ${races.length}R

      ／

      展示分析可能：
      ${readyCount}R

      <br>

      🔥 S評価：
      ${arr.length}レース

      <br>

      展示・水面・進入・展開を
      Ver.3 AIが自動分析しました。
      `;

    }
    else{

      renderStats();


      status.innerHTML=
      `
      ✅ 自動確認済み

      <br>

      🔥 S評価：
      ${analyses.length}レース

      <br>

      最新データに
      変化はありません。
      `;

    }

  }
  catch(e){

    console.error(
      'BOAT RACE自動更新エラー',
      e
    );


    const message=
    e?.name==='AbortError'
    ?
    '通信がタイムアウトしました'
    :
    e?.message
    ||
    '通信エラー';


    status.innerHTML=
    `
    ⚠️ 自動更新に失敗しました。

    <br>

    ${message}

    <br>

    次回の自動更新で
    再試行します。
    `;

  }
  finally{

    autoUpdateBusy=false;

  }

}


/*
=====================================
 集計期間
=====================================
*/

function filterRecords(){

  const all=
  records();


  if(
    period==='all'
  ){

    return all;

  }


  if(
    period==='day'
  ){

    return all.filter(
      x=>
      x.date===todayJST()
    );

  }


  const from=
  $('fromDate').value;


  const to=
  $('toDate').value;


  return all.filter(
    x=>
    (
      !from
      ||
      x.date>=from
    )
    &&
    (
      !to
      ||
      x.date<=to
    )
  );

}


/*
=====================================
 成績計算
=====================================
*/

function calc(rs){

  const done=
  rs.filter(
    x=>x.done
  );


  const stake=
  done.reduce(
    (
      sum,
      x
    )=>
    sum
    +
    num(
      x.stake
    ),
    0
  );


  const returns=
  done.reduce(
    (
      sum,
      x
    )=>
    sum
    +
    num(
      x.returnAmount
    ),
    0
  );


  const hits=
  done.filter(
    x=>x.hit
  )
  .length;


  const each=
  done.map(
    x=>({

      ...x,

      raceRoi:
      num(
        x.stake
      )>0
      ?
      num(
        x.returnAmount
      )
      /
      num(
        x.stake
      )
      *
      100
      :
      0

    })
  );


  return{

    done,

    races:
    done.length,

    hits,

    stake,

    ret:
    returns,

    hitRate:
    done.length
    ?
    hits
    /
    done.length
    *
    100
    :
    0,

    roi:
    stake
    ?
    returns
    /
    stake
    *
    100
    :
    0,

    profit:
    returns-stake,

    maxPayout:
    each.length
    ?
    Math.max(
      ...each.map(
        x=>
        num(
          x.returnAmount
        )
      )
    )
    :
    0,

    maxRoi:
    each.length
    ?
    Math.max(
      ...each.map(
        x=>
        x.raceRoi
      )
    )
    :
    0

  };

}

            <th>日付</th>
            <th>場</th>
            <th>R</th>
            <th>AI展開</th>
            <th>結果</th>
            <th>オッズ</th>
            <th>判定</th>
            <th>接近度</th>
            <th>的中枠</th>
            <th>払戻金</th>
            <th>回収率</th>

          </tr>

        </thead>


        <tbody>

          ${
            shown.map(
              x=>{

                const raceRoi=
                num(
                  x.stake
                )>0
                ?
                num(
                  x.returnAmount
                )
                /
                num(
                  x.stake
                )
                *
                100
                :
                0;


                const odds=
                num(
                  x.resultOdds,
                  num(
                    x.payout
                  )
                  /
                  100
                );


                const group=
                x.hitGroup==='main'
                ?
                '本線'
                :
                x.hitGroup==='cover'
                ?
                '狙い'
                :
                x.hitGroup==='hole'
                ?
                '穴'
                :
                '-';


                return`
                <tr>

                  <td>
                    ${
                      x.date
                      ?.slice(5)
                      ||
                      '-'
                    }
                  </td>

                  <td>
                    ${x.venue||'-'}
                  </td>

                  <td>
                    ${x.raceNumber}R
                  </td>

                  <td class="scenario-mini">
                    ${topScenarioText(x)}
                  </td>

                  <td>
                    <b>
                      ${x.result||'-'}
                    </b>
                  </td>

                  <td class="odds">
                    ${
                      odds
                      ?
                      odds.toFixed(1)
                      +
                      '倍'
                      :
                      '-'
                    }
                  </td>

                  <td
                    class="${
                      x.hit
                      ?
                      'hit'
                      :
                      'miss'
                    }"
                  >

                    ${
                      x.hit
                      ?
                      '◎ 的中'
                      :
                      '× 不的中'
                    }

                  </td>

                  <td
                    class="
                    proximity
                    ${
                      proximityClass(
                        x.proximity
                      )
                    }"
                  >

                    ${
                      x.proximity
                      ?.label
                      ||
                      '-'
                    }

                    ${
                      x.proximity
                      ?.bestCombo
                      ?
                      `
                      <br>
                      <small>

                        ${
                          x.proximity
                          .bestCombo
                        }

                        /

                        ${
                          groupLabel(
                            x.proximity
                            .bestGroup
                          )
                        }

                      </small>
                      `
                      :
                      ''
                    }

                  </td>

                  <td>
                    ${group}
                  </td>

                  <td>
                    ${
                      num(
                        x.returnAmount
                      )
                      .toLocaleString()
                    }円
                  </td>

                  <td
                    class="${
                      raceRoi>=100
                      ?
                      'roi'
                      :
                      ''
                    }"
                  >

                    ${raceRoi.toFixed(1)}%

                  </td>

                </tr>
                `;

              }
            )
            .join('')
          }

        </tbody>

      </table>

    </div>
    `;

  }
  else{

    body=
    `
    <div class="empty">

      この条件の
      確定レースはありません。

    </div>
    `;

  }


  $('history').innerHTML=
  `
  <div class="history-controls">

    ${venueTabs}

    ${resultTabs}

    <div class="history-caption">

      <span>

        ${
          historyVenue==='all'
          ?
          '全会場'
          :
          historyVenue
        }

      </span>

      <span>
        ${shown.length}R表示
      </span>

    </div>

  </div>

  ${body}

  <div class="notice">

    会場タブは横に
    スライドできます。

    オッズ表示は
    3連単確定払戻額÷100です。

  </div>
  `;


  document
  .querySelectorAll(
    '[data-hvenue]'
  )
  .forEach(
    btn=>{

      btn.onclick=()=>{

        historyVenue=
        btn.dataset.hvenue;


        historyResult='all';


        renderHistory(
          rs
        );

      };

    }
  );


  document
  .querySelectorAll(
    '[data-hresult]'
  )
  .forEach(
    btn=>{

      btn.onclick=()=>{

        historyResult=
        btn.dataset.hresult;


        renderHistory(
          rs
        );

      };

    }
  );

}


/*
=====================================
 会場別成績
=====================================
*/

function renderVenue(rs){

  const done=
  rs.filter(
    x=>x.done
  );


  const map=
  new Map();


  for(
    const x
    of done
  ){

    if(
      !map.has(
        x.venue
      )
    ){

      map.set(
        x.venue,
        []
      );

    }


    map.get(
      x.venue
    )
    .push(
      x
    );

  }


  if(
    !map.size
  ){

    $('venueStats').innerHTML=
    `
    <div class="empty">
      会場別成績は
      まだありません。
    </div>
    `;


    return;

  }


  const rows=
  [...map.entries()]
  .map(
    (
      [
        venue,
        data
      ]
    )=>({

      venue,

      ...calc(
        data
      )

    })
  )
  .sort(
    (
      a,
      b
    )=>
    b.roi-a.roi
  );


  $('venueStats').innerHTML=
  `
  <div class="venue-row">

    <b>会場</b>
    <b>R</b>
    <b>的中率</b>
    <b>回収率</b>
    <b>学習進捗</b>

  </div>

  ${
    rows.map(
      x=>
      `
      <div class="venue-row">

        <span>
          ${x.venue}
        </span>

        <span>
          ${x.races}
        </span>

        <span>
          ${x.hitRate.toFixed(1)}%
        </span>

        <span
          class="${
            x.roi>=100
            ?
            'green'
            :
            ''
          }"
        >

          ${x.roi.toFixed(1)}%

        </span>

        <span
          class="${
            x.races>=100
            ?
            'learn-ready'
            :
            x.races>=50
            ?
            'learn-mid'
            :
            'learn-low'
          }"
        >

          ${Math.min(
            x.races,
            100
          )}/100R

        </span>

      </div>
      `
    )
    .join('')
  }
  `;

}


/*
=====================================
 成績画面を開く
=====================================
*/

function showStats(
  openHistory=false,
  openVenue=false
){

  $('statsSection')
  .style.display=
  'block';


  renderStats();


  if(
    openHistory
  ){

    $('historyWrap')
    .style.display=
    'block';


    $('historyToggle')
    .textContent=
    '一覧を隠す';

  }


  if(
    openVenue
  ){

    $('venueWrap')
    .style.display=
    'block';


    $('venueToggle')
    .textContent=
    '会場別成績を隠す';

  }


  $('statsSection')
  .scrollIntoView({

    behavior:'smooth',

    block:'start'

  });

}


/*
=====================================
 各ボタン
=====================================
*/

$('statsOpen').onclick=
()=>showStats();


$('historyOpen').onclick=
()=>showStats(
  true,
  false
);


$('venueOpen').onclick=
()=>showStats(
  false,
  true
);


$('qStats').onclick=
()=>showStats();


$('qTop').onclick=
()=>{

  $('top')
  .scrollIntoView({

    behavior:'smooth'

  });

};


/*
=====================================
 的中・不的中開閉
=====================================
*/

$('historyToggle').onclick=
()=>{

  const wrap=
  $('historyWrap');


  const open=
  wrap.style.display
  ===
  'block';


  wrap.style.display=
  open
  ?
  'none'
  :
  'block';


  $('historyToggle')
  .textContent=
  open
  ?
  '一覧を表示'
  :
  '一覧を隠す';

};


/*
=====================================
 会場別成績開閉
=====================================
*/

$('venueToggle').onclick=
()=>{

  const wrap=
  $('venueWrap');


  const open=
  wrap.style.display
  ===
  'block';


  wrap.style.display=
  open
  ?
  'none'
  :
  'block';


  $('venueToggle')
  .textContent=
  open
  ?
  '会場別成績を表示'
  :
  '会場別成績を隠す';

};


/*
=====================================
 集計期間タブ
=====================================
*/

document
.querySelectorAll(
  '.tab'
)
.forEach(
  btn=>{

    btn.onclick=()=>{

      period=
      btn.dataset.period;


      document
      .querySelectorAll(
        '.tab'
      )
      .forEach(
        x=>{

          x.classList.toggle(
            'active',
            x===btn
          );

        }
      );


      $('rangeBox')
      .classList.toggle(
        'show',
        period==='custom'
      );


      renderStats();

    };

  }
);


/*
=====================================
 日付指定
=====================================
*/

$('fromDate').onchange=
renderStats;


$('toDate').onchange=
renderStats;


/*
=====================================
 起動処理
=====================================
*/

backfillLearningRecords();


initLearningAccordions();


renderStats();


autoRefresh(
  true
);


/*
=====================================
 60秒ごと自動確認
=====================================
*/

setInterval(
  ()=>{

    if(
      !document.hidden
    ){

      autoRefresh(
        false
      );

    }

  },
  60000
);


/*
=====================================
 アプリ復帰時更新
=====================================
*/

window.addEventListener(
  'focus',
  ()=>{

    autoRefresh(
      true
    );

  }
);


/*
=====================================
 画面復帰時更新
=====================================
*/

document.addEventListener(
  'visibilitychange',
  ()=>{

    if(
      !document.hidden
    ){

      autoRefresh(
        true
      );

    }

  }
);

</script>

</body>
</html>
