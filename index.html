<script>

/* ========================================
   設定
======================================== */

const API_BASE =
  "https://boatraceopenapi.github.io/api/v1";

const STORAGE_KEY =
  "boat_ai_ver1_records";

const STADIUMS = {

  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"

};

let currentFilter = "S";
let currentPeriod = "month";
let currentRaces = [];


/* ========================================
   基本
======================================== */

function numberValue(
  value,
  fallback = 0
){

  const valueNumber =
    Number(value);

  return Number.isFinite(
    valueNumber
  )
    ? valueNumber
    : fallback;

}


function todayJST(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Tokyo",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    )
    .formatToParts(
      new Date()
    );

  const map = {};

  parts.forEach(
    part => {

      if(
        part.type !== "literal"
      ){

        map[part.type] =
          part.value;

      }

    }
  );

  return (
    map.year +
    "-" +
    map.month +
    "-" +
    map.day
  );

}


function compactDate(date){

  return date.replaceAll(
    "-",
    ""
  );

}


function apiURL(date){

  return (
    API_BASE +
    "/" +
    date.substring(0,4) +
    "/" +
    compactDate(date) +
    ".json"
  );

}


async function fetchTodayData(){

  const date =
    todayJST();

  const response =
    await fetch(
      apiURL(date) +
      "?t=" +
      Date.now(),
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      "HTTP " +
      response.status
    );

  }

  return await response.json();

}


/* ========================================
   APIをレース配列に変換
======================================== */

function flattenRaces(data){

  const stadiums =
    data
      ?.programs
      ?.stadiums || {};

  const races = [];


  for(
    const [
      stadiumKey,
      stadiumData
    ]
    of Object.entries(stadiums)
  ){

    const raceMap =
      stadiumData
        ?.races || {};


    for(
      const [
        raceKey,
        race
      ]
      of Object.entries(raceMap)
    ){

      if(!race){
        continue;
      }

      races.push({

        ...race,

        stadium_number:
          numberValue(
            race.stadium_number,
            stadiumKey
          ),

        race_number:
          numberValue(
            race.race_number,
            raceKey
          )

      });

    }

  }


  return races;

}


/* ========================================
   締切時間
======================================== */

function closeTimestamp(race){

  const closed =
    race?.closed_at;

  if(!closed){
    return null;
  }

  const formatted =
    closed.replace(
      " ",
      "T"
    );

  const date =
    new Date(
      formatted +
      "+09:00"
    );

  return Number.isNaN(
    date.getTime()
  )
    ? null
    : date.getTime();

}


function isUpcoming(race){

  const timestamp =
    closeTimestamp(race);

  if(timestamp === null){
    return true;
  }

  return timestamp >
    Date.now();

}


function closeTime(race){

  const text =
    race?.closed_at;

  if(!text){
    return "--:--";
  }

  const match =
    text.match(
      /(\d{2}):(\d{2})/
    );

  return match
    ? match[1] + ":" + match[2]
    : "--:--";

}


/* ========================================
   展示情報チェック
======================================== */

function previewReady(race){

  const racers =
    race
      ?.preview
      ?.racers;

  if(!racers){
    return false;
  }


  for(
    let boat = 1;
    boat <= 6;
    boat++
  ){

    const racer =
      racers[String(boat)];

    if(!racer){
      return false;
    }

    const exhibition =
      Number(
        racer.exhibition_time
      );

    const startTiming =
      Number(
        racer.start_timing
      );

    if(
      !Number.isFinite(
        exhibition
      ) ||
      exhibition <= 0
    ){

      return false;

    }

    if(
      !Number.isFinite(
        startTiming
      )
    ){

      return false;

    }

  }


  return true;

}


/* ========================================
   選手1艇のAI点数
======================================== */

function scoreBoat(
  racer,
  previewRacer,
  entryNumber
){

  const national =
    numberValue(
      racer?.national_win_rate,
      5
    );

  const national2 =
    numberValue(
      racer?.national_top_2_percent,
      30
    );

  const national3 =
    numberValue(
      racer?.national_top_3_percent,
      45
    );

  const local =
    numberValue(
      racer?.local_win_rate,
      national
    );

  const local2 =
    numberValue(
      racer?.local_top_2_percent,
      national2
    );

  const motor2 =
    numberValue(
      racer?.motor_top_2_percent,
      30
    );

  const motor3 =
    numberValue(
      racer?.motor_top_3_percent,
      45
    );

  const boat2 =
    numberValue(
      racer?.boat_top_2_percent,
      30
    );

  const averageST =
    numberValue(
      racer?.average_start_timing,
      .18
    );

  const exhibition =
    numberValue(
      previewRacer?.exhibition_time,
      6.85
    );

  const exhibitionST =
    numberValue(
      previewRacer?.start_timing,
      averageST
    );

  const rank =
    numberValue(
      racer?.rank_number,
      4
    );

  const flying =
    numberValue(
      racer?.flying_count,
      0
    );

  const course =
    numberValue(
      previewRacer?.course_number,
      entryNumber
    );


  let score = 0;


  /* 全国成績 */
  score += national * 8;
  score += national2 * .35;
  score += national3 * .12;


  /* 当地成績 */
  score += local * 4;
  score += local2 * .18;


  /* モーター */
  score += motor2 * .40;
  score += motor3 * .10;


  /* ボート */
  score += boat2 * .15;


  /* 平均ST */
  score +=
    Math.max(
      0,
      (.22 - averageST) *
      100
    );


  /* 展示タイム */
  score +=
    Math.max(
      -10,
      (6.90 - exhibition) *
      75
    );


  /* 展示ST */
  score +=
    Math.max(
      -8,
      (.20 - exhibitionST) *
      60
    );


  /* 級別 */
  if(rank === 1){

    score += 9;

  }else if(rank === 2){

    score += 5;

  }else if(rank === 3){

    score += 1;

  }else{

    score -= 2;

  }


  /* フライング */
  score -=
    flying * 4;


  /* 進入コース */
  const courseBonus = {

    1:16,
    2:7,
    3:5,
    4:2,
    5:-1,
    6:-4

  };

  score +=
    courseBonus[course] || 0;


  return score;

}


/* ========================================
   レース全体のAI評価
======================================== */

function evaluateRace(race){

  if(
    !previewReady(race)
  ){

    return null;

  }


  const racers =
    race?.racers || {};

  const previews =
    race
      ?.preview
      ?.racers || {};


  const boats = [];


  for(
    let entry = 1;
    entry <= 6;
    entry++
  ){

    const racer =
      racers[String(entry)];

    const preview =
      previews[String(entry)];

    if(
      !racer ||
      !preview
    ){

      return null;

    }


    boats.push({

      boat:entry,

      racer,

      preview,

      score:
        scoreBoat(
          racer,
          preview,
          entry
        )

    });

  }


  boats.sort(
    (a,b) =>
      b.score - a.score
  );


  const first =
    boats[0];

  const second =
    boats[1];

  const third =
    boats[2];


  const gap1 =
    first.score -
    second.score;

  const gap2 =
    second.score -
    third.score;


  /*
    「AI評価」は的中率ではありません。
    レース内の優位性を0〜99に変換します。
  */

  let rating =
    64;

  rating +=
    Math.min(
      18,
      Math.max(
        0,
        gap1 * 1.8
      )
    );

  rating +=
    Math.min(
      8,
      Math.max(
        0,
        gap2 * .9
      )
    );


  if(first.boat === 1){

    rating += 6;

  }


  const wind =
    numberValue(
      race
        ?.preview
        ?.wind_speed,
      0
    );

  const wave =
    numberValue(
      race
        ?.preview
        ?.wave_height,
      0
    );


  if(wind >= 5){

    rating -= 3;

  }

  if(wind >= 8){

    rating -= 4;

  }

  if(wave >= 5){

    rating -= 3;

  }


  rating =
    Math.round(
      Math.max(
        0,
        Math.min(
          99,
          rating
        )
      )
    );


  let grade = "B";


  if(
    rating >= 82 &&
    gap1 >= 5
  ){

    grade = "S";

  }else if(
    rating >= 74
  ){

    grade = "A";

  }


  return {

    grade,

    rating,

    boats,

    wind,

    wave

  };

}


/* ========================================
   買い目作成
======================================== */

function pushUnique(
  array,
  combination
){

  if(
    combination &&
    !array.includes(
      combination
    )
  ){

    array.push(
      combination
    );

  }

}


function makeTickets(
  boats
){

  const a =
    boats[0].boat;

  const b =
    boats[1].boat;

  const c =
    boats[2].boat;

  const d =
    boats[3].boat;


  const main = [];
  const cover = [];
  const hole = [];


  /* 本線 */

  pushUnique(
    main,
    `${a}-${b}-${c}`
  );

  pushUnique(
    main,
    `${a}-${c}-${b}`
  );

  pushUnique(
    main,
    `${a}-${b}-${d}`
  );


  /* 押さえ */

  pushUnique(
    cover,
    `${a}-${c}-${d}`
  );

  pushUnique(
    cover,
    `${a}-${d}-${b}`
  );

  pushUnique(
    cover,
    `${b}-${a}-${c}`
  );

  pushUnique(
    cover,
    `${b}-${c}-${a}`
  );


  /* 穴 */

  pushUnique(
    hole,
    `${c}-${a}-${b}`
  );

  pushUnique(
    hole,
    `${b}-${d}-${a}`
  );

  pushUnique(
    hole,
    `${d}-${a}-${c}`
  );


  return {
    main,
    cover,
    hole
  };

}


function allTickets(
  tickets
){

  return [

    ...tickets.main,
    ...tickets.cover,
    ...tickets.hole

  ];

}

function predictionKey(
  date,
  stadium,
  raceNo
){

  return (
    date +
    "_" +
    stadium +
    "_" +
    raceNo
  );

}


function savePrediction(
  race,
  analysis,
  tickets,
  money
){

  const date =
    race.date ||
    todayJST();

  const stadium =
    Number(
      race.stadium_number
    );

  const raceNo =
    Number(
      race.race_number
    );

  const key =
    predictionKey(
      date,
      stadium,
      raceNo
    );


  const records =
    loadRecords();


  let record =
    records.find(
      item =>
        item.key === key
    );


  if(!record){

    record = {

      key,

      date,

      stadium,

      venue:
        STADIUMS[stadium] ||
        `会場${stadium}`,

      raceNo,

      grade:
        analysis.grade,

      rating:
        analysis.rating,

      tickets:
        allTickets(
          tickets
        ),

      stake:
        money.total,

      perTicket:
        money.perTicket,

      status:"pending",

      result:"",

      payout:0,

      hit:false,

      returnAmount:0,

      createdAt:
        new Date()
          .toISOString()

    };


    records.push(
      record
    );

    saveRecords(
      records
    );

  }


  return record;

}


/* ========================================
   結果確定
======================================== */

function settleRaceRecord(
  race
){

  const result =
    race?.result;

  if(!result){
    return;
  }


  const trifectas =
    result
      ?.payouts
      ?.trifecta;

  if(
    !Array.isArray(
      trifectas
    ) ||
    trifectas.length === 0
  ){

    return;
  }


  const date =
    race.date ||
    todayJST();

  const key =
    predictionKey(
      date,
      Number(
        race.stadium_number
      ),
      Number(
        race.race_number
      )
    );


  const records =
    loadRecords();


  const record =
    records.find(
      item =>
        item.key === key
    );


  if(
    !record ||
    record.status === "done"
  ){

    return;

  }


  const official =
    trifectas[0];


  const hitPayout =
    trifectas.find(
      payout =>
        record.tickets.includes(
          payout.combination
        )
    );


  record.status =
    "done";

  record.result =
    official
      ?.combination ||
    "";

  record.payout =
    numberValue(
      official?.amount,
      0
    );

  record.hit =
    !!hitPayout;


  if(hitPayout){

    record.returnAmount =
      Math.round(
        record.perTicket *
        numberValue(
          hitPayout.amount
        ) /
        100
      );

  }else{

    record.returnAmount =
      0;

  }


  record.settledAt =
    new Date()
      .toISOString();


  saveRecords(
    records
  );

}

/* ========================================
   成績期間
======================================== */

function periodMatches(
  date,
  period
){

  const today =
    todayJST();


  if(period === "day"){

    return (
      date === today
    );

  }


  if(period === "month"){

    return (
      date.substring(0,7) ===
      today.substring(0,7)
    );

  }


  return (
    date.substring(0,4) ===
    today.substring(0,4)
  );

}


function setPeriod(
  period
){

  currentPeriod =
    period;


  [
    "day",
    "month",
    "year"
  ]
  .forEach(
    item => {

      document
        .getElementById(
          "period-" + item
        )
        .classList
        .toggle(
          "active",
          item === period
        );

    }
  );


  renderStats();

}


/* ========================================
   成績計算
======================================== */

function calculateStats(
  records
){

  const done =
    records.filter(
      record =>
        record.status ===
        "done"
    );


  const races =
    done.length;


  const hits =
    done.filter(
      record =>
        record.hit
    ).length;


  const stake =
    done.reduce(
      (
        total,
        record
      ) =>
        total +
        numberValue(
          record.stake
        ),
      0
    );


  const returns =
    done.reduce(
      (
        total,
        record
      ) =>
        total +
        numberValue(
          record.returnAmount
        ),
      0
    );


  return {

    races,

    hits,

    stake,

    returns,

    hitRate:
      races > 0
      ?
      hits /
      races *
      100
      :
      0,

    roi:
      stake > 0
      ?
      returns /
      stake *
      100
      :
      0,

    profit:
      returns -
      stake

  };

}


/* ========================================
   成績表示
======================================== */

function renderStats(){

  const records =
    loadRecords()
      .filter(
        record =>
          periodMatches(
            record.date,
            currentPeriod
          )
      )
      .sort(
        (a,b) => {

          return (
            b.date.localeCompare(
              a.date
            ) ||
            Number(
              b.raceNo
            ) -
            Number(
              a.raceNo
            )
          );

        }
      );


  const stats =
    calculateStats(
      records
    );


  const profitClass =
    stats.profit >= 0
    ? "plus"
    : "minus";


  document
    .getElementById(
      "stats"
    )
    .innerHTML = `

      <div class="stats-grid">

        <div class="stat-box">

          <div class="stat-label">
            確定レース
          </div>

          <div class="stat-value">
            ${stats.races}
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            的中
          </div>

          <div class="stat-value">
            ${stats.hits}
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            的中率
          </div>

          <div class="stat-value">
            ${stats.hitRate.toFixed(1)}%
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            回収率
          </div>

          <div class="stat-value">
            ${stats.roi.toFixed(1)}%
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            投資額
          </div>

          <div class="stat-value">
            ${stats.stake.toLocaleString()}円
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            収支
          </div>

          <div
            class="
              stat-value
              ${profitClass}
            "
          >

            ${
              stats.profit >= 0
              ? "+"
              : ""
            }

            ${stats.profit.toLocaleString()}円

          </div>

        </div>

      </div>

    `;


  renderHistory(
    records
  );


  renderVenueStats(
    records
  );

}


/* ========================================
   レース別
======================================== */

function renderHistory(
  records
){

  const box =
    document.getElementById(
      "history"
    );


  if(
    records.length === 0
  ){

    box.innerHTML = `

      <div class="notice">
        この期間の予想記録はありません。
      </div>

    `;

    return;

  }


  box.innerHTML =
    records
      .map(
        record => `

          <div class="history-item">

            <div class="history-head">

              <div>

                <div class="history-race">

                  ${record.venue}
                  ${record.raceNo}R

                </div>

                <div class="history-date">

                  ${record.date}
                  ／
                  ${record.grade}
                  ／
                  AI評価
                  ${record.rating}

                </div>

              </div>


              ${
                record.status !== "done"
                ? `

                  <span
                    class="
                      result-badge
                      result-wait
                    "
                  >
                    結果待ち
                  </span>

                `
                :
                record.hit
                ? `

                  <span
                    class="
                      result-badge
                      result-hit
                    "
                  >
                    🎯 的中
                  </span>

                `
                : `

                  <span
                    class="
                      result-badge
                      result-miss
                    "
                  >
                    不的中
                  </span>

                `
              }

            </div>


            ${
              record.status === "done"
              ? `

                <div class="history-result">

                  3連単：
                  ${record.result || "--"}

                  <br>

                  投資：
                  ${numberValue(
                    record.stake
                  ).toLocaleString()}円

                  ／

                  回収：
                  ${numberValue(
                    record.returnAmount
                  ).toLocaleString()}円

                </div>

              `
              : ""
            }

          </div>

        `
      )
      .join("");

}


/* ========================================
   会場別
======================================== */

function renderVenueStats(
  records
){

  const groups = {};


  records.forEach(
    record => {

      if(
        !groups[
          record.venue
        ]
      ){

        groups[
          record.venue
        ] = [];

      }


      groups[
        record.venue
      ].push(
        record
      );

    }
  );


  const rows =
    Object.entries(
      groups
    )
    .map(
      ([venue,data]) => {

        return {

          venue,

          stats:
            calculateStats(
              data
            )

        };

      }
    )
    .filter(
      item =>
        item.stats.races > 0
    )
    .sort(
      (a,b) =>
        b.stats.roi -
        a.stats.roi
    );


  const box =
    document.getElementById(
      "venueStats"
    );


  if(
    rows.length === 0
  ){

    box.innerHTML = `

      <div class="notice">
        この期間の確定成績はありません。
      </div>

    `;

    return;

  }


  box.innerHTML = `

    <div class="venue-row">

      <strong>会場</strong>
      <strong>的中率</strong>
      <strong>回収率</strong>
      <strong>収支</strong>

    </div>


    ${rows
      .map(
        item => {

          const stats =
            item.stats;

          return `

            <div class="venue-row">

              <strong>
                ${item.venue}
              </strong>

              <span>
                ${stats.hitRate.toFixed(1)}%
              </span>

              <span>
                ${stats.roi.toFixed(1)}%
              </span>

              <span
                class="
                  ${
                    stats.profit >= 0
                    ? "plus"
                    : "minus"
                  }
                "
              >

                ${
                  stats.profit >= 0
                  ? "+"
                  : ""
                }

                ${stats.profit.toLocaleString()}円

              </span>

            </div>

          `;

        }
      )
      .join("")
    }

  `;

}


/* ========================================
   成績欄開閉
======================================== */

function toggleHistory(){

  const wrap =
    document.getElementById(
      "historyWrap"
    );

  const button =
    document.getElementById(
      "historyButton"
    );


  const hidden =
    getComputedStyle(
      wrap
    ).display === "none";


  wrap.style.display =
    hidden
    ? "block"
    : "none";


  button.textContent =
    hidden
    ? "🎯 レース別結果を隠す"
    : "🎯 レース別結果を表示";

}

  const wrap =

  const button =
    document.getElementById(
      "venueButton"
    );


  const hidden =

    });

    .getElementById(

/* ========================================
   保存済み結果を更新
======================================== */

async function refreshResults(){

  try{

    const data =
      await fetchTodayData();


    const races =
      flattenRaces(
        data
      );


    races.forEach(
      settleRaceRecord
    );


    renderStats();


  }catch(error){

    console.warn(
      "結果自動更新失敗",
      error
    );

  }

}


/* ========================================
   初期化
======================================== */

renderStats();

refreshResults();


/*
  1分ごとに結果確認
*/

setInterval(
  refreshResults,
  60000
);


/*
  アプリへ戻った時にも更新
*/

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      !document.hidden
    ){

      refreshResults();

    }

  }
);


window.addEventListener(
  "focus",
  refreshResults
);

</script>
