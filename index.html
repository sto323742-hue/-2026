<body>

<div class="container">

  <div class="header">
    <h1>🚤 BOAT RACE AI予想</h1>
    <div class="sub">
      全国24場から「直前情報が揃った勝負度S」だけ自動抽出
    </div>
  </div>

  <div class="card">

    <div class="title">
      本日の勝負レース
    </div>

    <label>
      1レース購入資金
    </label>

    <select id="budget">
      <option value="1000" selected>1,000円</option>
      <option value="2000">2,000円</option>
      <option value="3000">3,000円</option>
      <option value="5000">5,000円</option>
      <option value="10000">10,000円</option>
    </select>

    <button onclick="loadToday()">
      🔍 勝負度Sを自動検索
    </button>

    <button class="refresh" onclick="loadToday()">
      ↻ 最新データに更新
    </button>

    <div style="height:14px"></div>

    <div class="status" id="status">
      直前情報（展示タイム・展示ST）が6艇分揃ったレースのみ判定します。
    </div>

    <div class="small">
      本線3点・押さえ4点・穴3点＝合計10点。10点すべて同額です。
      結果取得後は的中／不的中と回収率を自動記録します。
    </div>

  </div>

  <div id="results"></div>

  <div class="card">

    <div class="title">
      成績・統計
    </div>

    <div class="period-tabs">
      <button id="tab-day" onclick="setPeriod('day')">
        今日
      </button>

      <button id="tab-month" onclick="setPeriod('month')">
        今月
      </button>

      <button id="tab-year" onclick="setPeriod('year')">
        今年
      </button>
    </div>

    <div id="stats"></div>

    <div style="height:16px"></div>

    <div style="font-weight:900;margin-bottom:8px">
      会場別成績
    </div>

    <div id="venueStats"></div>

  </div>

  <div class="footer">
    AI評価は参考情報です。投票は無理のない資金で行ってください。
  </div>

<script>

const STADIUMS={
  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"
};

const STORE_KEY="boat_ai_s_records_v2";

let currentPeriod="day";


function n(v,f=0){
  const x=Number(v);
  return Number.isFinite(x)?x:f;
}


function todayJST(){

  return new Intl.DateTimeFormat(
    'sv-SE',
    {
      timeZone:'Asia/Tokyo',
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }
  ).format(new Date());

}


function ymdCompact(d){
  return d.replaceAll('-','');
}


function apiUrl(date){

  return `https://boatraceopenapi.github.io/api/v1/${date.slice(0,4)}/${ymdCompact(date)}.json`;

}


function loadRecords(){

  try{

    return JSON.parse(
      localStorage.getItem(STORE_KEY)||'[]'
    );

  }catch{

    return [];

  }

}


function saveRecords(a){

  localStorage.setItem(
    STORE_KEY,
    JSON.stringify(a)
  );

}


function allTickets(t){

  return [
    ...t.main,
    ...t.cover,
    ...t.hole
  ];

}


function hasCompletePreview(race){

  const p=race?.preview?.racers;

  if(!p){
    return false;
  }

  for(let i=1;i<=6;i++){

    const x=p[String(i)];

    if(
      !x ||
      x.exhibition_time==null ||
      x.start_timing==null
    ){
      return false;
    }

  }

  return true;

}


function boatScore(racer,preview,boat){

  const national=n(racer?.national_win_rate,5);
  const local=n(racer?.local_win_rate,national);
  const motor=n(racer?.motor_top_2_percent,30);
  const boatRate=n(racer?.boat_top_2_percent,30);
  const avgST=n(racer?.average_start_timing,.18);
  const ex=n(preview?.exhibition_time,6.85);
  const exST=n(preview?.start_timing,avgST);
  const rank=n(racer?.rank_number,2);

  let s=0;

  s+=national*5;
  s+=local*2.7;
  s+=motor*.30;
  s+=boatRate*.12;

  s+=Math.max(
    0,
    (.22-avgST)*70
  );

  s+=Math.max(
    0,
    (6.95-ex)*35
  );

  s+=Math.max(
    0,
    (.20-exST)*45
  );

  if(rank===1){
    s+=5;
  }

  if(rank===2){
    s+=3;
  }

  s+=({
    1:12,
    2:6,
    3:4,
    4:2,
    5:0,
    6:-2
  }[boat]||0);

  return s;

}


function evaluateRace(race){

  if(!hasCompletePreview(race)){
    return null;
  }

  const racers=race?.racers||{};
  const previews=race.preview.racers;

  const boats=[];

  for(let i=1;i<=6;i++){

    const racer=racers[String(i)];

    if(!racer){
      return null;
    }

    boats.push({
      boat:i,
      score:boatScore(
        racer,
        previews[String(i)],
        i
      )
    });

  }

  boats.sort(
    (a,b)=>b.score-a.score
  );

  const gap1=
    boats[0].score-
    boats[1].score;

  const gap2=
    boats[1].score-
    boats[2].score;

  let confidence=
    60+
    Math.min(18,gap1*2.2)+
    Math.min(8,gap2);

  if(boats[0].boat===1){
    confidence+=7;
  }

  const wind=n(
    race?.preview?.wind_speed,
    0
  );

  const wave=n(
    race?.preview?.wave_height,
    0
  );

  if(wind>=6){
    confidence-=6;
  }

  if(wave>=5){
    confidence-=4;
  }

  confidence=
    Math.max(
      0,
      Math.min(
        99,
        confidence
      )
    );

  const grade=
    (
      confidence>=78 &&
      gap1>=5
    )
    ?'S'
    :(confidence>=68?'A':'B');

  return{
    grade,
    confidence,
    boats,
    wind,
    wave
  };

}


function uniquePush(a,v){

  if(
    v &&
    !a.includes(v)
  ){
    a.push(v);
  }

}


function makeTickets(boats){

  const [a,b,c,d]=
    boats
    .slice(0,4)
    .map(x=>x.boat);

  const main=[];
  const cover=[];
  const hole=[];

  uniquePush(main,`${a}-${b}-${c}`);
  uniquePush(main,`${a}-${c}-${b}`);
  uniquePush(main,`${a}-${b}-${d}`);

  uniquePush(cover,`${a}-${c}-${d}`);
  uniquePush(cover,`${a}-${d}-${b}`);
  uniquePush(cover,`${b}-${a}-${c}`);
  uniquePush(cover,`${b}-${c}-${a}`);

  uniquePush(hole,`${c}-${a}-${b}`);
  uniquePush(hole,`${b}-${d}-${a}`);
  uniquePush(hole,`${d}-${a}-${c}`);

  return{
    main,
    cover,
    hole
  };

}


function ticketsHTML(
  title,
  cls,
  tickets,
  amount
){

  return `
    <div class="bet-title ${cls}">
      ${title}
    </div>

    ${
      tickets.map(
        t=>`
          <div class="ticket">

            <div class="combo">
              ${t}
            </div>

            <div class="money">
              ${amount.toLocaleString()}円
            </div>

          </div>
        `
      ).join('')
    }
  `;

}


function raceKey(
  date,
  stadium,
  raceNo
){

  return `${date}-${Number(stadium)}-${Number(raceNo)}`;

}


function upsertPrediction(
  date,
  stadium,
  raceNo,
  race,
  analysis,
  tickets,
  stake
){

  let recs=loadRecords();

  const sNo=Number(stadium);
  const rNo=Number(raceNo);

  const key=
    raceKey(
      date,
      sNo,
      rNo
    );

  let r=
    recs.find(
      x=>
        x.date===date &&
        Number(x.stadium)===sNo &&
        Number(x.raceNo)===rNo
    );

  if(!r){

    r={
      key,
      date,
      stadium:sNo,
      venue:
        STADIUMS[sNo]
        ||`会場${sNo}`,
      raceNo:rNo,
      confidence:
        Math.round(
          analysis.confidence
        ),
      tickets:
        allTickets(tickets),
      stake,
      perTicket:stake/10,
      status:'pending',
      payout:0,
      returnAmount:0,
      hit:false,
      createdAt:
        new Date().toISOString()
    };

    recs.push(r);

    saveRecords(recs);

  }else{

    let changed=false;

    if(r.key!==key){

      r.key=key;
      changed=true;

    }

    if(!r.venue){

      r.venue=
        STADIUMS[sNo]
        ||`会場${sNo}`;

      changed=true;

    }

    if(
      !Array.isArray(r.tickets) ||
      !r.tickets.length
    ){

      r.tickets=
        allTickets(tickets);

      changed=true;

    }

    if(!n(r.stake,0)){

      r.stake=stake;
      changed=true;

    }

    if(!n(r.perTicket,0)){

      r.perTicket=stake/10;
      changed=true;

    }

    if(changed){

      saveRecords(recs);

    }

  }

  return r;

}


function formatOdds(payout){

  const odds=
    n(payout,0)/100;

  if(!odds){
    return '--';
  }

  return odds.toFixed(1);

}


function resultHTML(rec){

  if(
    !rec ||
    rec.status!=='done'
  ){

    return `
      <div class="result-panel">

        <span class="result-badge pending">
          ⏳ 結果待ち
        </span>

      </div>
    `;

  }

  if(rec.hit){

    return `
      <div class="result-panel hit-panel">

        <div class="result-head">
          🎯 的中
        </div>

        <div class="result-line">
          結果：${rec.result||'--'}
        </div>

        <div class="result-line">
          オッズ：${formatOdds(rec.payout)}倍
        </div>

      </div>
    `;

  }

  return `
    <div class="result-panel miss-panel">

      <div class="result-head">
        ✕ 不的中
      </div>

      <div class="result-line">
        結果：${rec.result||'--'}
      </div>

    </div>
  `;

}


function renderRace(
  placeName,
  stadium,
  raceNo,
  race,
  analysis,
  date
){

  const budget=
    Number(
      document
      .getElementById('budget')
      .value
    );

  const perTicket=
    Math.floor(
      budget/10/100
    )*100;

  const actualTotal=
    perTicket*10;

  const tickets=
    makeTickets(
      analysis.boats
    );

  const first=
    analysis.boats[0];

  const second=
    analysis.boats[1];

  const third=
    analysis.boats[2];

  const closed=
    race.closed_at
    ?race.closed_at.substring(11,16)
    :'--:--';

  const rec=
    upsertPrediction(
      date,
      stadium,
      raceNo,
      race,
      analysis,
      tickets,
      actualTotal
    );

  return `
    <div
      class="race-card"
      data-race-key="${rec.key}"
    >

      <div class="race-head">

        <div>

          <div class="place">
            ${placeName}
          </div>

          <div class="race-number">
            ${raceNo}R　締切 ${closed}
          </div>

        </div>

        <div class="s-badge">
          S
        </div>

      </div>

      <div class="score">

        <div class="score-main">

          <span>
            AI信頼度
          </span>

          <span class="score-value">
            ${analysis.confidence.toFixed(0)}%
          </span>

        </div>

        <div class="rank">

          <div class="rank-box">

            <div class="rank-label">
              1着候補
            </div>

            <div class="rank-boat">
              ${first.boat}号艇
            </div>

          </div>

          <div class="rank-box">

            <div class="rank-label">
              2着候補
            </div>

            <div class="rank-boat">
              ${second.boat}号艇
            </div>

          </div>

          <div class="rank-box">

            <div class="rank-label">
              3着候補
            </div>

            <div class="rank-boat">
              ${third.boat}号艇
            </div>

          </div>

        </div>

      </div>

      ${
        ticketsHTML(
          '本線 3点',
          'main-title',
          tickets.main,
          perTicket
        )
      }

      ${
        ticketsHTML(
          '押さえ 4点',
          'cover-title',
          tickets.cover,
          perTicket
        )
      }

      ${
        ticketsHTML(
          '穴 3点',
          'hole-title',
          tickets.hole,
          perTicket
        )
      }

      <div class="total">

        <span>
          合計
        </span>

        <span>
          ${actualTotal.toLocaleString()}円
        </span>

      </div>

      <div class="js-result">
        ${resultHTML(rec)}
      </div>

    </div>
  `;

}


function getTrifectas(result){

  const arr=
    result?.payouts?.trifecta;

  return Array.isArray(arr)
    ?arr.filter(
      x=>x?.combination
    )
    :[];

}


function findRace(
  data,
  stadium,
  raceNo
){

  const stadiums=
    data?.programs?.stadiums||{};

  const stadiumKey=
    Object.keys(stadiums)
    .find(
      k=>
        Number(k)===
        Number(stadium)
    );

  if(stadiumKey==null){
    return null;
  }

  const races=
    stadiums[stadiumKey]
    ?.races||{};

  const raceKey=
    Object.keys(races)
    .find(
      k=>
        Number(k)===
        Number(raceNo)
    );

  return raceKey==null
    ?null
    :races[raceKey];

}


/* =========================
   当日の全レースを確認

   終了済みでもSだったレースを
   戦績用に保存
========================= */

function syncTodayPredictions(
  data,
  date
){

  const stadiums=
    data?.programs?.stadiums||{};

  const budget=
    Number(
      document
      .getElementById('budget')
      ?.value
      ||1000
    );

  const perTicket=
    Math.max(
      100,
      Math.floor(
        budget/10/100
      )*100
    );

  const stake=
    perTicket*10;

  let saved=0;

  for(
    const [stadium,sd]
    of Object.entries(stadiums)
  ){

    for(
      const [raceNo,race]
      of Object.entries(
        sd?.races||{}
      )
    ){

      const analysis=
        evaluateRace(race);

      if(
        !analysis ||
        analysis.grade!=='S'
      ){
        continue;
      }

      const before=
        loadRecords()
        .some(
          x=>
            x.date===date &&
            Number(x.stadium)===Number(stadium) &&
            Number(x.raceNo)===Number(raceNo)
        );

      upsertPrediction(
        date,
        stadium,
        raceNo,
        race,
        analysis,
        makeTickets(
          analysis.boats
        ),
        stake
      );

      if(!before){
        saved++;
      }

    }

  }

  return saved;

}


/* =========================
   結果確定
========================= */

function settleFromData(
  data,
  date
){

  let recs=
    loadRecords();

  let changed=false;

  for(const r of recs){

    if(
      r.date!==date ||
      r.status==='done'
    ){
      continue;
    }

    const race=
      findRace(
        data,
        r.stadium,
        r.raceNo
      );

    const tfs=
      getTrifectas(
        race?.result
      );

    if(!tfs.length){
      continue;
    }

    const hitTf=
      tfs.find(
        tf=>
          r.tickets.includes(
            tf.combination
          )
      );

    const displayTf=
      hitTf||
      tfs[0];

    r.status='done';

    r.result=
      tfs.map(
        tf=>tf.combination
      ).join(' / ');

    r.payout=
      hitTf
      ?n(hitTf.amount,0)
      :n(displayTf.amount,0);

    r.hit=
      !!hitTf;

    /*
      回収金は画面に出しません。
      統計計算だけに使用します。
    */

    r.returnAmount=
      hitTf
      ?Math.round(
        r.perTicket*
        n(hitTf.amount,0)/
        100
      )
      :0;

    r.settledAt=
      new Date().toISOString();

    changed=true;

  }

  if(changed){

    saveRecords(recs);

  }

  return changed;

}


/* =========================
   表示中のレース結果更新
========================= */

function updateRenderedResults(){

  const recs=
    loadRecords();

  document
  .querySelectorAll(
    '[data-race-key]'
  )
  .forEach(card=>{

    const rec=
      recs.find(
        r=>
          r.key===
          card.dataset.raceKey
      );

    const box=
      card.querySelector(
        '.js-result'
      );

    if(
      !rec ||
      !box
    ){
      return;
    }

    box.innerHTML=
      resultHTML(rec);

  });

}


/* =========================
   結果・戦績の自動更新
========================= */

async function refreshPendingResults(){

  const date=
    todayJST();

  try{

    const url=
      `${apiUrl(date)}?t=${Date.now()}`;

    const res=
      await fetch(
        url,
        {
          cache:'no-store'
        }
      );

    if(!res.ok){

      throw new Error(
        `HTTP ${res.status}`
      );

    }

    const data=
      await res.json();

    /*
      締切後・会場終了後の
      Sレースも戦績用に保存
    */

    syncTodayPredictions(
      data,
      date
    );

    /*
      保存済みSレースと
      結果を照合
    */

    settleFromData(
      data,
      date
    );

    /*
      レース結果表示更新
    */

    updateRenderedResults();

    /*
      今日・今月・今年・
      会場別成績を更新
    */

    renderStats();

  }catch(e){

    console.warn(
      '結果・戦績の自動更新に失敗:',
      e
    );

  }

}


/* =========================
   締切前判定
========================= */

function isUpcoming(race){

  if(!race?.closed_at){
    return true;
  }

  const dt=
    new Date(
      race.closed_at
      .replace(' ','T')
      +'+09:00'
    );

  return dt.getTime()
    >Date.now();

}


/* =========================
   本日のSレース
========================= */

async function loadToday(){

  const status=
    document.getElementById(
      'status'
    );

  const results=
    document.getElementById(
      'results'
    );

  const date=
    todayJST();

  status.textContent=
    '最新データを取得しています…';

  results.innerHTML='';

  try{

    const url=
      `${apiUrl(date)}?t=${Date.now()}`;

    const res=
      await fetch(
        url,
        {
          cache:'no-store'
        }
      );

    if(!res.ok){

      throw new Error(
        `HTTP ${res.status}`
      );

    }

    const data=
      await res.json();

    /*
      先に当日の全Sレースを保存
      終了済みレースも対象
    */

    syncTodayPredictions(
      data,
      date
    );

    /*
      結果確定
    */

    settleFromData(
      data,
      date
    );

    const stadiums=
      data?.programs?.stadiums||{};

    let html='';
    let count=0;

    /*
      画面上には
      締切前Sレースだけ表示
    */

    for(
      const [stadium,sd]
      of Object.entries(stadiums)
    ){

      for(
        const [raceNo,race]
        of Object.entries(
          sd?.races||{}
        )
      ){

        if(
          !isUpcoming(race)
        ){
          continue;
        }

        const analysis=
          evaluateRace(race);

        if(
          !analysis ||
          analysis.grade!=='S'
        ){
          continue;
        }

        html+=
          renderRace(

            STADIUMS[
              Number(stadium)
            ]
            ||
            `会場${stadium}`,

            Number(stadium),

            Number(raceNo),

            race,

            analysis,

            date

          );

        count++;

      }

    }

    results.innerHTML=
      html
      ||
      `
        <div class="no-race">

          現在表示できる締切前のSレースはありません。

          <br>

          終了済みのSレースは
          「今日の戦績」に自動反映します。

        </div>
      `;

    status.textContent=
      `${date}：締切前Sレース ${count}件。終了済みレースの戦績も確認しました。`;

    renderStats();

  }catch(e){

    console.error(e);

    status.textContent=
      'データ取得に失敗しました。少し時間を置いて再度お試しください。';

    results.innerHTML=
      `
        <div class="no-race">
          APIデータを取得できませんでした。
        </div>
      `;

    renderStats();

  }

}


/* =========================
   統計期間判定
========================= */

function periodMatch(
  date,
  p
){

  const t=
    todayJST();

  if(p==='day'){

    return date===t;

  }

  if(p==='month'){

    return date.slice(0,7)
      ===t.slice(0,7);

  }

  return date.slice(0,4)
    ===t.slice(0,4);

}


/* =========================
   統計計算
========================= */

function calcStats(rows){

  const done=
    rows.filter(
      r=>
        r.status==='done'
    );

  const races=
    done.length;

  const hits=
    done.filter(
      r=>r.hit
    ).length;

  const stake=
    done.reduce(
      (s,r)=>
        s+n(r.stake),
      0
    );

  const ret=
    done.reduce(
      (s,r)=>
        s+n(r.returnAmount),
      0
    );

  return{

    races,
    hits,
    stake,
    ret,

    hitRate:
      races
      ?hits/races*100
      :0,

    roi:
      stake
      ?ret/stake*100
      :0,

    profit:
      ret-stake

  };

}


/* =========================
   今日・今月・今年切替
========================= */

function setPeriod(p){

  currentPeriod=p;

  renderStats();

}


/* =========================
   統計表示
========================= */

function renderStats(){

  for(
    const p
    of [
      'day',
      'month',
      'year'
    ]
  ){

    document
    .getElementById(
      `tab-${p}`
    )
    ?.classList
    .toggle(
      'active',
      p===currentPeriod
    );

  }

  const rows=
    loadRecords()
    .filter(
      r=>
        periodMatch(
          r.date,
          currentPeriod
        )
    );

  const s=
    calcStats(rows);

  const profitCls=
    s.profit>=0
    ?'positive'
    :'negative';

  document
  .getElementById(
    'stats'
  )
  .innerHTML=
  `

    <div class="stats-grid">

      <div class="stat">

        <div class="stat-label">
          確定レース
        </div>

        <div class="stat-value">
          ${s.races}
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          的中
        </div>

        <div class="stat-value">
          ${s.hits}
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          的中率
        </div>

        <div class="stat-value">
          ${s.hitRate.toFixed(1)}%
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          回収率
        </div>

        <div class="stat-value">
          ${s.roi.toFixed(1)}%
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          投資額
        </div>

        <div class="stat-value">
          ${s.stake.toLocaleString()}円
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          収支
        </div>

        <div class="stat-value ${profitCls}">

          ${s.profit>=0?'+':''}${s.profit.toLocaleString()}円

        </div>

      </div>

    </div>
  `;


  const groups={};


  for(const r of rows){

    (
      groups[r.venue]??=[]
    ).push(r);

  }


  const entries=
    Object.entries(groups)
    .map(
      ([v,a])=>
        [
          v,
          calcStats(a)
        ]
    )
    .sort(
      (a,b)=>
        b[1].roi-
        a[1].roi
    );


  document
  .getElementById(
    'venueStats'
  )
  .innerHTML=

    entries.length

    ?`

      <div class="venue-row">

        <strong>
          会場
        </strong>

        <strong>
          的中率
        </strong>

        <strong>
          回収率
        </strong>

        <strong>
          収支
        </strong>

      </div>


      ${
        entries.map(
          ([v,x])=>
          `

            <div class="venue-row">

              <strong>
                ${v}
              </strong>

              <span>
                ${x.hitRate.toFixed(1)}%
              </span>

              <span>
                ${x.roi.toFixed(1)}%
              </span>

              <span class="${x.profit>=0?'positive':'negative'}">

                ${x.profit>=0?'+':''}${x.profit.toLocaleString()}円

              </span>

            </div>

          `
        ).join('')
      }

    `

    :`

      <div class="small">
        まだ確定済みの成績がありません。
      </div>

    `;

}


/* =========================
   初期起動
========================= */

/*
  保存済み戦績を表示
*/

renderStats();


/*
  ページを開いた直後に
  今日のSレースと結果を確認
*/

refreshPendingResults();


/*
  60秒ごとに
  結果・戦績を更新
*/

setInterval(
  refreshPendingResults,
  60000
);


/*
  スマホでこのページに
  戻った時も更新
*/

document.addEventListener(
  'visibilitychange',
  ()=>{

    if(!document.hidden){

      refreshPendingResults();

    }

  }
);


/*
  ブラウザへ戻った時も更新
*/

window.addEventListener(
  'focus',
  refreshPendingResults
);

</script>
