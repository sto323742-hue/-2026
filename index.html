<script>

/* ========================================
   基本設定
======================================== */

const API_BASE =
  "https://boatraceopenapi.github.io/api/v1";


const STORAGE_KEY =
  "boat_ai_ver1_records";


const STADIUMS = {

  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"

};


let currentFilter =
  "S";


let currentPeriod =
  "month";


let currentAnalyses =
  [];


/* ========================================
   数値変換
======================================== */

function num(
  value,
  fallback = 0
){

  const n =
    Number(
      value
    );


  return Number.isFinite(
    n
  )
    ? n
    : fallback;

}


/* ========================================
   日本時間
======================================== */

function todayJST(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Tokyo",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"
      }
    )
    .formatToParts(
      new Date()
    );


  const map = {};


  for(
    const part
    of parts
  ){

    if(
      part.type !==
      "literal"
    ){

      map[
        part.type
      ] =
        part.value;

    }

  }


  return (
    map.year +
    "-" +
    map.month +
    "-" +
    map.day
  );

}


function compactDate(
  date
){

  return date.replaceAll(
    "-",
    ""
  );

}


/* ========================================
   API URL
======================================== */

function apiURL(
  date
){

  return (
    API_BASE +
    "/" +
    date.slice(
      0,
      4
    ) +
    "/" +
    compactDate(
      date
    ) +
    ".json"
  );

}


/* ========================================
   API取得
======================================== */

async function fetchTodayData(){

  const date =
    todayJST();


  const response =
    await fetch(

      apiURL(
        date
      ) +
      "?t=" +
      Date.now(),

      {
        cache:
          "no-store"
      }

    );


  if(
    !response.ok
  ){

    throw new Error(
      "データ取得エラー：" +
      response.status
    );

  }


  return await response.json();

}


/* ========================================
   レース一覧へ変換
======================================== */

function flattenRaces(
  data
){

  const stadiums =
    data
      ?.programs
      ?.stadiums ||
    {};


  const races = [];


  for(
    const [
      stadiumKey,
      stadiumData
    ]
    of Object.entries(
      stadiums
    )
  ){

    const raceMap =
      stadiumData
        ?.races ||
      {};


    for(
      const [
        raceKey,
        race
      ]
      of Object.entries(
        raceMap
      )
    ){

      if(
        !race
      ){

        continue;

      }


      races.push({

        ...race,

        stadium_number:
          num(
            race.stadium_number,
            stadiumKey
          ),

        race_number:
          num(
            race.race_number,
            raceKey
          )

      });

    }

  }


  return races;

}


/* ========================================
   締切時間
======================================== */

function closeTimestamp(
  race
){

  const closed =
    race
      ?.closed_at;


  if(
    !closed
  ){

    return null;

  }


  const text =
    closed.replace(
      " ",
      "T"
    );


  const date =
    new Date(
      text +
      "+09:00"
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return null;

  }


  return date.getTime();

}


function isUpcoming(
  race
){

  const time =
    closeTimestamp(
      race
    );


  if(
    time === null
  ){

    return true;

  }


  return (
    time >
    Date.now()
  );

}


function closeTime(
  race
){

  const text =
    race
      ?.closed_at;


  if(
    !text
  ){

    return "--:--";

  }


  const match =
    text.match(
      /(\d{2}):(\d{2})/
    );


  return match
    ? (
        match[1] +
        ":" +
        match[2]
      )
    : "--:--";

}


/* ========================================
   展示データ確認
======================================== */

function previewReady(
  race
){

  const previewRacers =
    race
      ?.preview
      ?.racers;


  if(
    !previewRacers
  ){

    return false;

  }


  for(
    let boat = 1;
    boat <= 6;
    boat++
  ){

    const preview =
      previewRacers[
        String(
          boat
        )
      ];


    if(
      !preview
    ){

      return false;

    }


    const exhibition =
      Number(
        preview.exhibition_time
      );


    const start =
      Number(
        preview.start_timing
      );


    if(
      !Number.isFinite(
        exhibition
      ) ||
      exhibition <= 0
    ){

      return false;

    }


    if(
      !Number.isFinite(
        start
      )
    ){

      return false;

    }

  }


  return true;

}


/* ========================================
   艇スコア
======================================== */

function scoreBoat(
  racer,
  preview,
  entry
){

  const nationalWin =
    num(
      racer
        ?.national_win_rate,
      5
    );


  const national2 =
    num(
      racer
        ?.national_top_2_percent,
      30
    );


  const national3 =
    num(
      racer
        ?.national_top_3_percent,
      45
    );


  const localWin =
    num(
      racer
        ?.local_win_rate,
      nationalWin
    );


  const local2 =
    num(
      racer
        ?.local_top_2_percent,
      national2
    );


  const motor2 =
    num(
      racer
        ?.motor_top_2_percent,
      30
    );


  const motor3 =
    num(
      racer
        ?.motor_top_3_percent,
      45
    );


  const boat2 =
    num(
      racer
        ?.boat_top_2_percent,
      30
    );


  const averageST =
    num(
      racer
        ?.average_start_timing,
      .18
    );


  const exhibition =
    num(
      preview
        ?.exhibition_time,
      6.85
    );


  const exhibitionST =
    num(
      preview
        ?.start_timing,
      averageST
    );


  const rank =
    num(
      racer
        ?.rank_number,
      4
    );


  const flying =
    num(
      racer
        ?.flying_count,
      0
    );


  const course =
    num(
      preview
        ?.course_number,
      entry
    );


  let score = 0;


  score +=
    nationalWin *
    8;


  score +=
    national2 *
    .35;


  score +=
    national3 *
    .12;


  score +=
    localWin *
    4;


  score +=
    local2 *
    .18;


  score +=
    motor2 *
    .40;


  score +=
    motor3 *
    .10;


  score +=
    boat2 *
    .15;


  score +=
    Math.max(
      0,
      (
        .22 -
        averageST
      ) *
      100
    );


  score +=
    Math.max(
      -10,
      (
        6.90 -
        exhibition
      ) *
      75
    );


  score +=
    Math.max(
      -8,
      (
        .20 -
        exhibitionST
      ) *
      60
    );


  if(
    rank === 1
  ){

    score += 9;

  }
  else if(
    rank === 2
  ){

    score += 5;

  }
  else if(
    rank === 3
  ){

    score += 1;

  }
  else{

    score -= 2;

  }


  score -=
    flying *
    4;


  const courseBonus = {

    1:16,
    2:7,
    3:5,
    4:2,
    5:-1,
    6:-4

  };


  score +=
    courseBonus[
      course
    ] || 0;


  return score;

}


/* ========================================
   レース評価
======================================== */

function evaluateRace(
  race
){

  if(
    !previewReady(
      race
    )
  ){

    return null;

  }


  const racers =
    race
      ?.racers ||
    {};


  const previews =
    race
      ?.preview
      ?.racers ||
    {};


  const boats = [];


  for(
    let entry = 1;
    entry <= 6;
    entry++
  ){

    const racer =
      racers[
        String(
          entry
        )
      ];


    const preview =
      previews[
        String(
          entry
        )
      ];


    if(
      !racer ||
      !preview
    ){

      return null;

    }


    boats.push({

      boat:
        entry,

      racer:
        racer,

      preview:
        preview,

      score:
        scoreBoat(
          racer,
          preview,
          entry
        )

    });

  }


  boats.sort(
    (
      a,
      b
    ) =>
      b.score -
      a.score
  );


  const first =
    boats[0];


  const second =
    boats[1];


  const third =
    boats[2];


  const gap1 =
    first.score -
    second.score;


  const gap2 =
    second.score -
    third.score;


  let rating =
    64;


  rating +=
    Math.min(
      18,
      Math.max(
        0,
        gap1 *
        1.8
      )
    );


  rating +=
    Math.min(
      8,
      Math.max(
        0,
        gap2 *
        .9
      )
    );


  if(
    first.boat === 1
  ){

    rating += 6;

  }


  const wind =
    num(
      race
        ?.preview
        ?.wind_speed,
      0
    );


  const wave =
    num(
      race
        ?.preview
        ?.wave_height,
      0
    );


  if(
    wind >= 5
  ){

    rating -= 3;

  }


  if(
    wind >= 8
  ){

    rating -= 4;

  }


  if(
    wave >= 5
  ){

    rating -= 3;

  }


  rating =
    Math.round(
      Math.max(
        0,
        Math.min(
          99,
          rating
        )
      )
    );


  let grade =
    "B";


  if(
    rating >= 82 &&
    gap1 >= 5
  ){

    grade =
      "S";

  }
  else if(
    rating >= 74
  ){

    grade =
      "A";

  }


  return {

    race:
      race,

    boats:
      boats,

    rating:
      rating,

    grade:
      grade,

    gap1:
      gap1,

    gap2:
      gap2

  };

}

function makeTickets(

    ]

}


/* ========================================
   資金配分
======================================== */

function allocateMoney(
  tickets,
  budget
){

  const all = [

    ...tickets.main.map(
      combo => ({
        combo,
        group:"main"
      })
    ),

    ...tickets.cover.map(
      combo => ({
        combo,
        group:"cover"
      })
    ),

    ...tickets.hole.map(
      combo => ({
        combo,
        group:"hole"
      })
    )

  ];


  const units =
    Math.floor(
      budget /
      100
    );


  const baseUnits =
    Math.floor(
      units /
      all.length
    );


  let remainder =
    units -
    (
      baseUnits *
      all.length
    );


  return all.map(
    item => {

      let unit =
        Math.max(
          1,
          baseUnits
        );


      if(
        remainder > 0
      ){

        unit++;

        remainder--;

      }


      return {

        ...item,

        money:
          unit *
          100

      };

    }
  );

}

/* ========================================
   予想保存
======================================== */

function savePrediction(
  analysis
){

  const race =
    analysis.race;


  const key =
    raceKey(
      race
    );


  const records =
    getRecords();


  if(
    records.some(
      record =>
        record.key === key
    )
  ){

    return;

  }


  const budget =
    Number(
      document
        .getElementById(
          "budget"
        )
        .value
    );


  const tickets =
    makeTickets(
      analysis.boats
    );


  const allocated =
    allocateMoney(
      tickets,
      budget
    );


  const stake =
    allocated.reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.money,
      0
    );


  records.push({

    key:
      key,

    date:
      race.date ||
      todayJST(),

    stadium:
      race.stadium_number,

    venue:
      STADIUMS[
        race.stadium_number
      ] ||
      "会場",

    raceNumber:
      race.race_number,

    grade:
      analysis.grade,

    rating:
      analysis.rating,

    first:
      analysis.boats[0].boat,

    second:
      analysis.boats[1].boat,

    third:
      analysis.boats[2].boat,

    tickets:
      allocated,

    stake:
      stake,

    done:
      false,

    hit:
      false,

    result:
      "",

    payout:
      0,

    returnAmount:
      0,

    savedAt:
      new Date().toISOString(),

    model:
      "ver1-2-5-3"

  });


  saveRecords(
    records
  );

}


/* ========================================
   払戻取得
======================================== */

function getTrifectaPayouts(
  race
){

  const trifecta =
    race
      ?.result
      ?.payouts
      ?.trifecta;


  return Array.isArray(
    trifecta
  )
    ? trifecta
    : [];

}


/* ========================================
   結果確定
======================================== */

function settleRecords(
  races
){

  const records =
    getRecords();


  let changed =
    false;


  for(
    const record
    of records
  ){

    if(
      record.done
    ){

      continue;

    }


    const race =
      races.find(
        item =>
          raceKey(
            item
          ) ===
          record.key
      );


    if(
      !race
    ){

      continue;

    }


    const payouts =
      getTrifectaPayouts(
        race
      );


    if(
      payouts.length === 0
    ){

      continue;

    }


    const winning =
      payouts[0];


    const combination =
      String(
        winning.combination ||
        ""
      );


    const payout =
      num(
        winning.amount,
        0
      );


    if(
      !combination
    ){

      continue;

    }


    record.done =
      true;


    record.result =
      combination;


    record.payout =
      payout;


    const hitTicket =
      record.tickets.find(
        ticket =>
          ticket.combo ===
          combination
      );


    if(
      hitTicket
    ){

      record.hit =
        true;


      record.returnAmount =
        Math.round(
          (
            payout /
            100
          ) *
          hitTicket.money
        );

    }
    else{

      record.hit =
        false;


      record.returnAmount =
        0;

    }


    changed =
      true;

  }


  if(
    changed
  ){

    saveRecords(
      records
    );

  }

}

/* ========================================

======================================== */

function inPeriod(
  date
){

  const today =
    todayJST();


  if(
    currentPeriod === "day"
  ){

    return (
      date ===
      today
    );

  }


  if(
    currentPeriod === "month"
  ){

    return (
      date.slice(
        0,
        7
      ) ===
      today.slice(
        0,
        7
      )
    );

  }


  return (
    date.slice(
      0,
      4
    ) ===
    today.slice(
      0,
      4
    )
  );

}

    stake,
    returns,
    hitRate,
    roi,
    profit

  };

}


/* ========================================
   成績描画
======================================== */

  const records =

  const stats =

      ? "plus"
      : "minus";


  document
    .getElementById(
      "stats"
    )
    .innerHTML = `

      <div class="stats-grid">

        <div class="stat-box">

          <div class="stat-label">
            確定レース
          </div>

          <div class="stat-value">
            ${stats.races}
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            的中数
          </div>

          <div class="stat-value">
            ${stats.hits}
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            的中率
          </div>

          <div class="stat-value">
            ${stats.hitRate.toFixed(1)}%
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            回収率
          </div>

          <div class="stat-value">
            ${stats.roi.toFixed(1)}%
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            投資額
          </div>

          <div class="stat-value">
            ${stats.stake.toLocaleString()}円
          </div>

        </div>


        <div class="stat-box">

          <div class="stat-label">
            払戻
          </div>

          <div class="stat-value">
            ${stats.returns.toLocaleString()}円
          </div>

        </div>


        <div class="stat-box">

        </div>

          <div class="stat-label">

          </div>

    `;


  renderHistory(

/* ========================================
   レース別結果
======================================== */

function renderHistory(
  records
){

  const done =
    records
      .filter(
        record =>
          record.done
      )
      .sort(
        (
          a,
          b
        ) =>
          String(
            b.date
          )
          .localeCompare(
            String(
              a.date
            )
          )
      );


  const history =
    document.getElementById(
      "history"
    );


  if(
    done.length === 0
  ){

    history.innerHTML = `

      <div class="empty">
        確定済みレースはありません。
      </div>

    `;


    return;

  }


  history.innerHTML =
    done
      .map(
        record => {

          const badge =
            record.hit
              ? `
                <span
                  class="
                    result-badge
                    result-hit
                  "
                >
                  的中
                </span>
              `
              : `
                <span
                  class="
                    result-badge
                    result-miss
                  "
                >
                  不的中
                </span>
              `;


          return `

            <div class="history-item">

              <div class="history-head">

                <div>

                  <div class="history-race">
                    ${record.venue}
                    ${record.raceNumber}R
                    ・
                    ${record.grade}
                  </div>

                  <div class="history-date">
                    ${record.date}
                  </div>

                </div>

                ${badge}

              </div>


              <div class="history-result">

                結果：
                ${record.result || "-"}
                <br>

                投資：
                ${num(
                  record.stake
                ).toLocaleString()}円

                ／

                払戻：
                ${num(
                  record.returnAmount
                ).toLocaleString()}円

              </div>

            </div>

          `;

        }
      )
      .join("");

}


/* ========================================
   会場別成績
======================================== */

function renderVenueStats(
  records
){

  const done =
    records.filter(
      record =>
        record.done
    );


  const map =
    new Map();


  for(
    const record
    of done
  ){

    const venue =
      record.venue ||
      "会場";


    if(
      !map.has(
        venue
      )
    ){

      map.set(
        venue,
        []
      );

    }


    map.get(
      venue
    )
    .push(
      record
    );

  }


  const venueStats =
    document.getElementById(
      "venueStats"
    );


  if(
    map.size === 0
  ){

    venueStats.innerHTML = `

      <div class="empty">
        会場別成績はまだありません。
      </div>

    `;


    return;

  }


  let html = `

    <div class="venue-row">

      <strong>
        会場
      </strong>

      <strong>
        R
      </strong>

      <strong>
        的中率
      </strong>

      <strong>
        回収率
      </strong>

    </div>

  `;


  const rows =
    [];


  for(
    const [
      venue,
      venueRecords
    ]
    of map.entries()
  ){

    const s =
      calculateStats(
        venueRecords
      );


    rows.push({

      venue,

      ...s

    });

  }


  rows.sort(
    (
      a,
      b
    ) =>
      b.roi -
      a.roi
  );


  html +=
    rows
      .map(
        row => `

          <div class="venue-row">

            <div>
              ${row.venue}
            </div>

            <div>
              ${row.races}
            </div>

            <div>
              ${row.hitRate.toFixed(1)}%
            </div>

            <div>
              ${row.roi.toFixed(1)}%
            </div>

          </div>

        `
      )
      .join("");


  venueStats.innerHTML =
    html;

}

/* ========================================
   定期的に結果更新
======================================== */

async function refreshResultsOnly(){

  try{

    const data =
      await fetchTodayData();


    const races =
      flattenRaces(
        data
      );


    settleRecords(
      races
    );


    renderStats();

  }
  catch(
    error
  ){

    console.log(
      "結果更新待機中",
      error
    );

  }

}


/*
  1分ごとに結果確認
*/

setInterval(
  refreshResultsOnly,
  60 * 1000
);


/*
  アプリへ戻った時にも確認
*/

window.addEventListener(
  "focus",
  refreshResultsOnly
);


document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      refreshResultsOnly();

    }

  }
);
