<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI予想 Ver.3</title>
<style>
html,body{
  margin:0;
  min-height:100%;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
.loader{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  text-align:center;
  color:#efc559;
  font-weight:900;
  line-height:1.8;
}
</style>
</head>
<body>
<div class="loader" id="boot">最新版を読み込んでいます…</div>

<script>
(async()=>{
  const SOURCE =
    'https://raw.githubusercontent.com/sto323742-hue/-2026/e8bbddfc4286501574141d2cfe5f89fdd29e4a5f/index.html';

  try{
    const res = await fetch(SOURCE,{cache:'no-store'});
    if(!res.ok) throw new Error('source '+res.status);

    let src = await res.text();

    /* PDF保存ボタン用CSS */
    src = src.replace(
      '</style>',
      `
.pdf-save{
  width:100%;
  min-height:48px;
  margin-top:8px;
  border-radius:13px;
  font-weight:950;
  background:linear-gradient(135deg,#f4d070,#c8901f);
  border:1px solid #e8c45b;
  color:#070707;
}
.pdf-save:active{
  transform:scale(.99);
}
</style>`
    );

    /* 「一覧を表示/閉じる」の直下にPDF保存ボタンを追加 */
    const historyToggleBlock = `
  <button class="toggle" id="historyToggle">
    一覧を表示
  </button>`;

    const historyToggleWithPdf = `
  <button class="toggle" id="historyToggle">
    一覧を表示
  </button>

  <button class="pdf-save" id="pdfSave" type="button">
    📄 PDF保存
  </button>`;

    if(src.includes(historyToggleBlock)){
      src = src.replace(historyToggleBlock, historyToggleWithPdf);
    }else{
      throw new Error('history button not found');
    }

    /* PDF出力機能を既存script末尾へ追加 */
    const pdfScript = String.raw`
/* ========================================
   的中成績 PDF保存
   ・的中のみ
   ・不的中なし
   ・接近度なし
   ・総レース数/件数表示なし
   ・円グラフ/棒グラフなし
======================================== */

function pdfPeriodText(){

  if(period==='day'){
    return '今日';
  }

  if(period==='all'){
    return '全期間';
  }

  const from=
    $('fromDate')?.value||'';

  const to=
    $('toDate')?.value||'';

  if(from && to){
    return from+' ～ '+to;
  }

  if(from){
    return from+' ～';
  }

  if(to){
    return '～ '+to;
  }

  return '期間指定';
}


function pdfEscape(v){

  return String(v??'')
  .replaceAll('&','&amp;')
  .replaceAll('<','&lt;')
  .replaceAll('>','&gt;')
  .replaceAll('"','&quot;')
  .replaceAll("'",'&#39;');
}


function pdfHitRecords(){

  let rs=
    filterRecords(
      records()
    )
    .filter(
      x=>
        x.done &&
        x.hit
    );

  if(
    historyVenue!=='all'
  ){

    rs=
      rs.filter(
        x=>
          x.venue===
          historyVenue
      );
  }

  rs.sort(
    (a,b)=>
      String(
        b.date
      )
      .localeCompare(
        String(
          a.date
        )
      ) ||
      num(
        b.race
      )-
      num(
        a.race
      )
  );

  return rs;
}


function openHitPdf(){

  const rows=
    pdfHitRecords();

  if(!rows.length){

    alert(
      'この条件ではPDFに保存できる的中レースがありません。'
    );

    return;
  }

  const venueText=
    historyVenue==='all'
    ?'全会場'
    :historyVenue;

  const titleDate=
    todayJST()
    .replaceAll('-','');

  const safeVenue=
    venueText
    .replace(
      /[\\\\/:*?"<>|\\s]+/g,
      '_'
    );

  const report=
    rows.map(
      x=>`
        <tr>
          <td>${pdfEscape(x.date||'-')}</td>
          <td>${pdfEscape(x.venue||'-')}</td>
          <td>${pdfEscape((x.race??'-')+'R')}</td>
          <td class="hit">的中</td>
          <td>${pdfEscape(resultOrderText(x))}</td>
          <td class="odds">${pdfEscape(resultOddsText(x))}</td>
        </tr>
      `
    )
    .join('');

  const doc=`
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>boat_result_${safeVenue}_${titleDate}</title>
<style>
@page{
  size:A4 portrait;
  margin:12mm;
}
*{
  box-sizing:border-box;
}
body{
  margin:0;
  color:#111;
  background:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}
.sheet{
  width:100%;
}
h1{
  margin:0 0 8px;
  font-size:22px;
}
.meta{
  margin-bottom:14px;
  font-size:11px;
  color:#555;
  line-height:1.7;
}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:10.5px;
}
th,td{
  border:1px solid #aaa;
  padding:7px 5px;
  text-align:center;
  word-break:break-word;
}
th{
  background:#f3f3f3;
  font-weight:900;
}
th:nth-child(1),td:nth-child(1){width:22%}
th:nth-child(2),td:nth-child(2){width:16%}
th:nth-child(3),td:nth-child(3){width:10%}
th:nth-child(4),td:nth-child(4){width:12%}
th:nth-child(5),td:nth-child(5){width:20%}
th:nth-child(6),td:nth-child(6){width:20%}
.hit{
  font-weight:900;
}
.odds{
  font-weight:900;
}
.print-guide{
  margin:0 0 12px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:12px;
}
.print-btn{
  width:100%;
  min-height:46px;
  margin:0 0 14px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:900;
}
@media print{
  .no-print{
    display:none!important;
  }
}
</style>
</head>
<body>

<div class="sheet">

  <div class="no-print print-guide">
    iPhoneでは下のボタンを押し、印刷画面から共有して
    「ファイルに保存」を選ぶとPDFとして保存できます。
  </div>

  <button
    class="no-print print-btn"
    onclick="window.print()"
  >
    📄 PDFとして保存 / 印刷
  </button>

  <h1>
    BOAT RACE AI 的中成績
  </h1>

  <div class="meta">
    会場：${pdfEscape(venueText)}<br>
    対象期間：${pdfEscape(pdfPeriodText())}
  </div>

  <table>
    <thead>
      <tr>
        <th>日付</th>
        <th>会場</th>
        <th>R</th>
        <th>結果</th>
        <th>順番</th>
        <th>オッズ</th>
      </tr>
    </thead>
    <tbody>
      ${report}
    </tbody>
  </table>

</div>

</body>
</html>`;

  const w=
    window.open(
      '',
      '_blank'
    );

  if(!w){

    alert(
      'PDF画面を開けませんでした。Safariのポップアップ設定をご確認ください。'
    );

    return;
  }

  w.document.open();
  w.document.write(doc);
  w.document.close();

  setTimeout(
    ()=>{
      try{
        w.focus();
        w.print();
      }catch(e){
        console.warn(e);
      }
    },
    500
  );
}


if(
  $('pdfSave')
){

  $('pdfSave').onclick=
    openHitPdf;
}
`;

    const closeScript = '</' + 'script>';

    const pos = src.lastIndexOf(closeScript);
    if(pos < 0) throw new Error('script end not found');

    src =
      src.slice(0,pos) +
      '\n' +
      pdfScript +
      '\n' +
      src.slice(pos);

    document.open();
    document.write(src);
    document.close();

  }catch(e){
    console.error(e);

    document.body.innerHTML = `
      <div class="loader">
        読み込みに失敗しました。<br>
        通信状態を確認してページを再読み込みしてください。<br><br>
        ${String(e.message||e)}
      </div>
    `;
  }
})();
</script>
</body>
</html>
