<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI予想 Ver.2</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}

.wrap{
  max-width:820px;
  margin:auto;
  padding:16px 10px 100px
}

.header{
  text-align:center;
  padding:10px 4px 18px
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:.4px
}

.brand .gold{color:#efc559}

.ver{
  font-size:12px;
  color:#efc559;
  margin-left:5px
}

.sub{
  margin-top:6px;
  color:#9d9d9d;
  font-size:12px
}

.panel,
.race{
  background:linear-gradient(180deg,#111,#090909);
  border:1px solid #765b19;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px
}

.panel-title{
  color:#f3ca5b;
  font-weight:950;
  font-size:19px;
  margin-bottom:13px
}

.budget-label{
  font-size:12px;
  color:#c9b98a;
  margin-bottom:6px
}

select,
input[type=date]{
  width:100%;
  height:51px;
  border:1px solid #775d1c;
  border-radius:12px;
  background:#080808;
  color:#fff;
  padding:0 12px;
  font-size:16px
}

.gold-btn,
.toggle{
  width:100%;
  border:0;
  border-radius:13px;
  font-weight:900
}

.status{
  margin-top:11px;
  padding:11px;
  border-radius:12px;
  background:#080808;
  border:1px solid #26210f;
  color:#c8c0a8;
  font-size:12px;
  line-height:1.7
}

.notice{
  margin-top:8px;
  color:#777;
  font-size:10px;
  line-height:1.6
}

.race{
  border-color:#6f571d
}

.race-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.race-name{
  font-size:20px;
  font-weight:950
}

.race-meta{
  font-size:11px;
  color:#a9a9a9;
  margin-top:4px
}

.smark{
  width:49px;
  height:49px;
  border:1px solid #f1c95e;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f1c95e;
  font-size:23px;
  font-weight:950
}

.ai-box{
  margin-top:10px;
  background:#080808;
  border:1px solid #29220e;
  border-radius:12px;
  padding:11px
}

.ai-top{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.ai-score{
  font-size:23px;
  color:#f2cd67;
  font-weight:950
}

.weather-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px
}

.weather-item{
  background:#111;
  border-radius:9px;
  padding:8px 4px;
  text-align:center
}

.weather-item small{
  display:block;
  color:#898989;
  font-size:9px
}

.weather-item b{
  display:block;
  margin-top:2px;
  font-size:13px
}

.candidate-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px
}

.candidate{
  background:#111;
  border-radius:9px;
  text-align:center;
  padding:8px 3px
}

.candidate small{
  display:block;
  color:#8d8d8d;
  font-size:9px
}

.candidate b{
  font-size:17px
}

.gold-btn{
  min-height:44px;
  margin-top:10px;
  background:#17140d;
  border:1px solid #6e581d;
  color:#f0cc68
}

.detail{
  display:none;
  margin-top:8px
}

.bet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:7px;
  padding:9px 10px;
  border-radius:10px;
  background:#0b0b0b;
  border:1px solid #302813;
  font-weight:900
}

.bet-head.main{color:#71baff}
.bet-head.cover{color:#e8d7a4}
.bet-head.hole{color:#ff9b52}

.ticket{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  padding:8px 10px;
  border-bottom:1px solid #24200f;
  background:#090909
}

.combo{
  font-weight:950;
  letter-spacing:1px
}

.money{
  color:#efd16e;
  font-weight:900
}

.ticket-sub{
  grid-column:1/-1;
  color:#8f8f8f;
  font-size:9px;
  line-height:1.5
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #6d551c;
  margin-top:9px;
  padding-top:9px;
  font-weight:950
}

.logic{
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:#0a0a0a;
  color:#aaa;
  font-size:10px;
  line-height:1.65
}

.reason{
  margin-top:9px;
  padding:11px;
  border:1px solid #463814;
  border-radius:11px;
  background:#0b0905;
  color:#c8bb96;
  font-size:10px;
  line-height:1.75
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px
}

.menu button{
  min-height:48px;
  border-radius:11px;
  border:1px solid #55451a;
  background:#111;
  color:#e8ca73;
  font-weight:900
}

.stats{display:none}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px
}

.tab{
  height:43px;
  border:1px solid #55451a;
  background:#131313;
  color:#ddd;
  border-radius:10px;
  font-weight:900
}

.tab.active{
  background:linear-gradient(135deg,#f4d070,#c8901f);
  color:#070707
}

.range{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px
}

.range.show{
  display:grid
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:10px
}

.stat{
  background:#090909;
  border:1px solid #2c2510;
  border-radius:11px;
  padding:11px
}

.stat small{
  display:block;
  color:#aa9e78;
  font-size:10px
}

.stat b{
  display:block;
  margin-top:3px;
  font-size:19px
}

.green{color:#58dc8d}
.red{color:#ff6a6a}

.profit{
  margin-top:9px;
  padding:14px;
  border:1px solid #8a6719;
  border-radius:12px;
  background:linear-gradient(90deg,#171005,#080808);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px
}

.profit strong{
  font-size:26px;
  color:#f1cc65
}

.section-title{
  margin:16px 0 8px;
  color:#f2cd68;
  font-weight:950
}

.history-scroll{
  overflow-x:auto;
  border:1px solid #342b12;
  border-radius:12px
}

.history-table{
  min-width:760px;
  width:100%;
  border-collapse:collapse;
  background:#080808;
  font-size:11px
}

.history-table th,
.history-table td{
  padding:9px 7px;
  border-bottom:1px solid #25200f;
  border-right:1px solid #201c0e;
  text-align:center
}

.history-table th{
  color:#d8bb65;
  background:#0d0c08
}

.hit{
  color:#ff665c;
  font-weight:950
}

.miss{
  color:#6fb4ff;
  font-weight:950
}

.odds{
  color:#f0d06c;
  font-weight:950
}

.roi{
  color:#58dc8d;
  font-weight:950
}

.toggle{
  min-height:45px;
  margin-top:8px;
  background:#131313;
  border:1px solid #55451a;
  color:#edcc70
}

.history-wrap,
.venue-wrap{
  display:none
}

.venue-row{
  display:grid;
  grid-template-columns:1.1fr .6fr .8fr .9fr;
  gap:5px;
  padding:9px 3px;
  border-bottom:1px solid #26200e;
  font-size:11px
}

.footer{
  text-align:center;
  color:#686868;
  font-size:10px;
  line-height:1.7;
  margin-top:24px
}

.quick{
  position:fixed;
  right:9px;
  bottom:calc(11px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:20
}

.quick button{
  height:42px;
  min-width:75px;
  border:1px solid #745a19;
  border-radius:999px;
  background:#111;
  color:#f0cc68;
  font-weight:900
}

.empty{
  padding:22px 10px;
  text-align:center;
  color:#aaa;
  background:#0d0d0d;
  border:1px solid #302812;
  border-radius:14px;
  margin-bottom:12px
}

@media(max-width:480px){

  .brand{
    font-size:23px
  }

  .wrap{
    padding-left:9px;
    padding-right:9px
  }

  .panel,
  .race{
    padding:13px
  }

  .stat b{
    font-size:17px
  }

  .profit strong{
    font-size:23px
  }

  .range{
    grid-template-columns:1fr
  }

  .candidate b{
    font-size:16px
  }

  .menu{
    grid-template-columns:1fr
  }
}
</style>
</head>

<body>

<div class="wrap" id="top">

<header class="header">

  <div class="brand">
    <span class="gold">🚤 BOAT RACE</span>
    AI予想
    <span class="ver">Ver.2</span>
  </div>

  <div class="sub">
    天候・水面・展示・期待値を自動評価
  </div>

</header>

<section class="panel">

  <div class="panel-title">
    本日のAI予想
  </div>

  <div class="budget-label">
    1レース購入資金
  </div>

  <select id="budget">
    <option value="1000">1,000円</option>
    <option value="2000">2,000円</option>
    <option value="3000">3,000円</option>
    <option value="5000">5,000円</option>
    <option value="10000">10,000円</option>
  </select>

  <div class="status" id="status">
    最新データを自動取得しています…
  </div>

  <div class="notice">
    ページを開くだけで自動更新します。
    展示・風・波・天候などに変化があった時だけAI予想を再計算します。
    AI評価は独自スコアで、的中率そのものではありません。
  </div>

</section>

<div id="results"></div>

<section class="panel">

  <div class="menu">
    <button id="statsOpen">📊 AI成績を見る</button>
    <button id="historyOpen">🎯 的中・不的中</button>
    <button id="venueOpen">📍 会場別成績</button>
  </div>

</section>

<section class="panel stats" id="statsSection">

  <div class="panel-title">
    📊 AI成績
  </div>

  <div class="tabs">
    <button class="tab active" data-period="day">今日</button>
    <button class="tab" data-period="custom">期間指定</button>
    <button class="tab" data-period="all">全期間</button>
  </div>

  <div class="range" id="rangeBox">
    <input type="date" id="fromDate">
    <input type="date" id="toDate">
  </div>

  <div id="stats"></div>

  <div class="section-title">
    的中・不的中レース
  </div>

  <button class="toggle" id="historyToggle">
    一覧を表示
  </button>

  <div class="history-wrap" id="historyWrap">
    <div id="history"></div>
  </div>

  <div class="section-title">
    会場別成績
  </div>

  <button class="toggle" id="venueToggle">
    会場別成績を表示
  </button>

  <div class="venue-wrap" id="venueWrap">
    <div id="venueStats"></div>
  </div>

</section>

<footer class="footer">
  AI評価は参考情報です。<br>
  投票は無理のない範囲で行ってください。
</footer>

</div>

<div class="quick">
  <button id="qStats">📊 成績</button>
  <button id="qTop">↑ 上へ</button>
</div>

<script>

const API_BASE=
'https://boatraceopenapi.github.io/api/v1';

const STORAGE_KEY=
'boat_ai_gold_v1_records';

const STADIUMS={

  1:'桐生',
  2:'戸田',
  3:'江戸川',
  4:'平和島',
  5:'多摩川',
  6:'浜名湖',
  7:'蒲郡',
  8:'常滑',
  9:'津',
  10:'三国',
  11:'びわこ',
  12:'住之江',
  13:'尼崎',
  14:'鳴門',
  15:'丸亀',
  16:'児島',
  17:'宮島',
  18:'徳山',
  19:'下関',
  20:'若松',
  21:'芦屋',
  22:'福岡',
  23:'唐津',
  24:'大村'

};

const WEATHER_NAMES={
  1:'晴',
  2:'曇',
  3:'雨',
  4:'雪',
  5:'霧'
};

let analyses=[];
let period='day';
let lastDataSignature='';
let autoUpdateBusy=false;

const $=
id=>document.getElementById(id);

const num=
(v,d=0)=>
Number.isFinite(Number(v))
?
Number(v)
:
d;


/* ==============================
   日本時間
============================== */

function todayJST(){

  return new Intl.DateTimeFormat(
    'en-CA',
    {
      timeZone:'Asia/Tokyo',
      year:'numeric',
      month:'2-digit',
      day:'2-digit'
    }
  ).format(new Date());

}


/* ==============================
   API URL
============================== */

function apiURL(d){

  return `${API_BASE}/${d.slice(0,4)}/${d.replaceAll('-','')}.json`;

}


/* ==============================
   最新データ取得
============================== */

async function fetchToday(){

  const d=
  todayJST();

  const r=
  await fetch(
    apiURL(d)+'?t='+Date.now(),
    {
      cache:'no-store'
    }
  );

  if(!r.ok){

    throw Error(
      'data '+r.status
    );

  }

  return r.json();

}


/* ==============================
   レース一覧化
============================== */

function flatten(data){

  const out=[];

  const ss=
  data?.programs?.stadiums
  ||
  {};

  for(
    const [sk,sd]
    of
    Object.entries(ss)
  ){

    for(
      const [rk,r]
      of
      Object.entries(
        sd?.races
        ||
        {}
      )
    ){

      if(!r){
        continue;
      }

      out.push({

        ...r,

        stadium_number:
        num(
          r.stadium_number,
          sk
        ),

        race_number:
        num(
          r.race_number,
          rk
        )

      });

    }

  }

  return out;

}


/* ==============================
   レースキー
============================== */

function raceKey(r){

  return `${r.date||todayJST()}_${r.stadium_number}_${r.race_number}`;

}


/* ==============================
   締切時刻
============================== */

function closeTime(r){

  const m=
  String(
    r?.closed_at
    ||
    ''
  ).match(
    /(\d{2}):(\d{2})/
  );

  return m
  ?
  `${m[1]}:${m[2]}`
  :
  '--:--';

}


/* ==============================
   締切前判定
============================== */

function upcoming(r){

  if(!r?.closed_at){
    return true;
  }

  const t=
  new Date(
    String(
      r.closed_at
    )
    .replace(
      ' ',
      'T'
    )
    +
    '+09:00'
  ).getTime();

  return(
    Number.isNaN(t)
    ||
    t>Date.now()
  );

}


/* ==============================
   展示情報確認
============================== */

function previewReady(r){

  const p=
  r?.preview?.racers;

  if(!p){
    return false;
  }

  for(
    let i=1;
    i<=6;
    i++
  ){

    if(
      !p[String(i)]
    ){
      return false;
    }

    const e=
    Number(
      p[String(i)]
      .exhibition_time
    );

    const s=
    Number(
      p[String(i)]
      .start_timing
    );

    if(
      !Number.isFinite(e)
      ||
      e<=0
      ||
      !Number.isFinite(s)
    ){
      return false;
    }

  }

  return true;

}


/* ==============================
   天候・水面情報
============================== */

function weatherInfo(r){

  const p=
  r?.preview
  ||
  {};

  return{

    windSpeed:
    num(
      p.wind_speed
    ),

    windDirection:
    num(
      p.wind_direction_number
    ),

    wave:
    num(
      p.wave_height
    ),

    weather:
    num(
      p.weather_number
    ),

    air:
    num(
      p.air_temperature
    ),

    water:
    num(
      p.water_temperature
    )

  };

}


/* ==============================
   艇スコア
============================== */

function scoreBoat(
  r,
  p,
  entry
){

  let s=0;

  const nw=
  num(
    r?.national_win_rate,
    5
  );

  const n2=
  num(
    r?.national_top_2_percent,
    30
  );

  const n3=
  num(
    r?.national_top_3_percent,
    45
  );

  const lw=
  num(
    r?.local_win_rate,
    nw
  );

  const l2=
  num(
    r?.local_top_2_percent,
    n2
  );

  const m2=
  num(
    r?.motor_top_2_percent,
    30
  );

  const m3=
  num(
    r?.motor_top_3_percent,
    45
  );

  const b2=
  num(
    r?.boat_top_2_percent,
    30
  );

  const ast=
  num(
    r?.average_start_timing,
    .18
  );

  const ex=
  num(
    p?.exhibition_time,
    6.85
  );

  const est=
  num(
    p?.start_timing,
    ast
  );

  const rank=
  num(
    r?.rank_number,
    4
  );

  const f=
  num(
    r?.flying_count,
    0
  );

  const course=
  num(
    p?.course_number,
    entry
  );

  s+=
  nw*8
  +
  n2*.35
  +
  n3*.12
  +
  lw*4
  +
  l2*.18
  +
  m2*.4
  +
  m3*.1
  +
  b2*.15;

  s+=
  Math.max(
    0,
    (.22-ast)*100
  )
  +
  Math.max(
    -10,
    (6.9-ex)*75
  )
  +
  Math.max(
    -8,
    (.2-est)*60
  );

  s+=
  rank===1
  ?
  9
  :
  rank===2
  ?
  5
  :
  rank===3
  ?
  1
  :
  -2;

  s-=
  f*4;

  s+=
  ({
    1:16,
    2:7,
    3:5,
    4:2,
    5:-1,
    6:-4
  }[course]||0);

  return s;

}


/* ==============================
   展示順位
============================== */

function exhibitionRank(boats){

  return[
    ...boats
  ]
  .sort(
    (a,b)=>
    num(
      a.preview?.exhibition_time,
      99
    )
    -
    num(
      b.preview?.exhibition_time,
      99
    )
  )
  .map(
    x=>x.boat
  );

}


/* ==============================
   展示ST順位
============================== */

function startRank(boats){

  return[
    ...boats
  ]
  .sort(
    (a,b)=>
    num(
      a.preview?.start_timing,
      9
    )
    -
    num(
      b.preview?.start_timing,
      9
    )
  )
  .map(
    x=>x.boat
  );

}


/* ==============================
   進入変化
============================== */

function courseChanges(boats){

  return boats.filter(
    x=>
    num(
      x.preview?.course_number,
      x.boat
    )
    !==
    x.boat
  );

}


/* ==============================
   レースAI評価
============================== */

function evaluate(r){

  if(
    !previewReady(r)
  ){
    return null;
  }

  const boats=[];

  for(
    let i=1;
    i<=6;
    i++
  ){

    const rr=
    r?.racers?.[
      String(i)
    ];

    const p=
    r?.preview?.racers?.[
      String(i)
    ];

    if(
      !rr
      ||
      !p
    ){
      return null;
    }

    boats.push({

      boat:i,

      score:
      scoreBoat(
        rr,
        p,
        i
      ),

      racer:rr,

      preview:p

    });

  }

  boats.sort(
    (a,b)=>
    b.score-a.score
  );

  const g1=
  boats[0].score
  -
  boats[1].score;

  const g2=
  boats[1].score
  -
  boats[2].score;

  const w=
  weatherInfo(r);

  let rating=
  64
  +
  Math.min(
    18,
    Math.max(
      0,
      g1*1.8
    )
  )
  +
  Math.min(
    8,
    Math.max(
      0,
      g2*.9
    )
  );

  if(
    boats[0].boat===1
  ){
    rating+=6;
  }

  if(
    w.windSpeed>=5
  ){
    rating-=3;
  }

  if(
    w.windSpeed>=8
  ){
    rating-=4;
  }

  if(
    w.wave>=5
  ){
    rating-=3;
  }

  if(
    w.wave>=8
  ){
    rating-=4;
  }

  const exRanks=
  exhibitionRank(
    boats
  );

  const stRanks=
  startRank(
    boats
  );

  if(
    exRanks[0]
    ===
    boats[0].boat
  ){
    rating+=2;
  }

  if(
    stRanks[0]
    ===
    boats[0].boat
  ){
    rating+=2;
  }

  if(
    exRanks
    .slice(0,2)
    .includes(
      boats[0].boat
    )
    &&
    stRanks
    .slice(0,2)
    .includes(
      boats[0].boat
    )
  ){
    rating+=2;
  }

  const changes=
  courseChanges(
    boats
  );

  if(
    changes.length>=2
  ){
    rating-=3;
  }

  rating=
  Math.round(
    Math.max(
      0,
      Math.min(
        99,
        rating
      )
    )
  );

  const stable=
  w.windSpeed<8
  &&
  w.wave<7
  &&
  g1>=5;

  const skip=
  rating<82
  ||
  w.windSpeed>=10
  ||
  w.wave>=10
  ||
  changes.length>=4;

  const reasons=[];

  reasons.push(
    `AI上位艇 ${
      boats
      .slice(0,3)
      .map(
        x=>x.boat+'号艇'
      )
      .join('・')
    }`
  );

  reasons.push(
    `展示上位 ${
      exRanks
      .slice(0,3)
      .map(
        x=>x+'号艇'
      )
      .join('・')
    }`
  );

  reasons.push(
    `ST上位 ${
      stRanks
      .slice(0,3)
      .map(
        x=>x+'号艇'
      )
      .join('・')
    }`
  );

  reasons.push(
    `風 ${w.windSpeed}m / 波 ${w.wave}cm`
  );

  if(
    changes.length
  ){

    reasons.push(
      `進入変化 ${
        changes
        .map(
          x=>
          `${x.boat}号艇→${num(x.preview.course_number)}コース`
        )
        .join('、')
      }`
    );

  }

  return{

    race:r,

    boats,

    rating,

    grade:
    (
      rating>=82
      &&
      stable
      &&
      !skip
    )
    ?
    'S'
    :
    'B',

    gap1:g1,

    weather:w,

    exhibitionRank:
    exRanks,

    startRank:
    stRanks,

    courseChanges:
    changes,

    reasons,

    skip

  };

}


/* ==============================
   艇の確率化
============================== */

function probabilityMap(boats){

  const raw={};

  let total=0;

  for(
    const x
    of
    boats
  ){

    const v=
    Math.exp(
      x.score/45
    );

    raw[x.boat]=v;

    total+=v;

  }

  for(
    const k
    of
    Object.keys(raw)
  ){

    raw[k]/=
    total;

  }

  return raw;

}


/* ==============================
   3連単推定確率
============================== */

function comboProbability(
  combo,
  boats
){

  const p=
  probabilityMap(
    boats
  );

  const a=
  combo
  .split('-')
  .map(Number);

  if(
    a.length!==3
  ){
    return 0;
  }

  const p1=
  p[a[0]]
  ||
  0;

  const rem1=
  1-p1;

  const p2=
  rem1>0
  ?
  (
    p[a[1]]
    ||
    0
  )
  /
  rem1
  :
  0;

  const rem2=
  1
  -
  p1
  -
  (
    p[a[1]]
    ||
    0
  );

  const p3=
  rem2>0
  ?
  (
    p[a[2]]
    ||
    0
  )
  /
  rem2
  :
  0;

  return Math.max(
    0,
    p1*p2*p3
  );

}


/* ==============================
   本線2・押さえ5・穴3
============================== */

function makeTickets(a){

  const b=
  a.boats;

  const[
    x1,
    x2,
    x3,
    x4,
    x5,
    x6
  ]=
  b.map(
    x=>x.boat
  );

  const main=[

    `${x1}-${x2}-${x3}`,

    `${x1}-${x3}-${x2}`

  ];

  const cover=[

    `${x1}-${x2}-${x4}`,

    `${x1}-${x3}-${x4}`,

    `${x1}-${x4}-${x2}`,

    `${x2}-${x1}-${x3}`,

    `${x2}-${x3}-${x1}`

  ];

  const normalHole=[

    `${x3}-${x1}-${x2}`,

    `${x2}-${x4}-${x1}`

  ];

  const used=
  new Set([

    ...main,

    ...cover,

    ...normalHole

  ]);

  const ex=
  a.exhibitionRank;

  const st=
  a.startRank;

  const w=
  a.weather;

  const attackBoat=
  [
    ...new Set([
      ex[0],
      st[0],
      ex[1],
      st[1],
      x4,
      x5,
      x6
    ])
  ]
  .find(
    n=>n!==x1
  )
  ||
  x4;

  let specialCandidates=[];

  if(
    w.windSpeed>=5
    ||
    w.wave>=4
  ){

    specialCandidates=[

      `${attackBoat}-${x1}-${x2}`,

      `${attackBoat}-${x2}-${x1}`,

      `${x3}-${attackBoat}-${x1}`,

      `${x4}-${x1}-${attackBoat}`

    ];

  }
  else{

    specialCandidates=[

      `${x4}-${x1}-${x3}`,

      `${x5}-${x2}-${x1}`,

      `${x6}-${x1}-${x2}`,

      `${x3}-${x5}-${x1}`

    ];

  }

  const special=
  specialCandidates
  .find(
    x=>!used.has(x)
  )
  ||
  `${x4}-${x1}-${x3}`;

  return{

    main,

    cover,

    hole:[
      ...normalHole,
      special
    ],

    special

  };

}
  /* ==============================
   資金配分
============================== */

function allocate(
  t,
  budget,
  a
){

  const all=[

    ...t.main.map(
      combo=>({
        combo,
        group:'main'
      })
    ),

    ...t.cover.map(
      combo=>({
        combo,
        group:'cover'
      })
    ),

    ...t.hole.map(
      combo=>({
        combo,
        group:'hole'
      })
    )

  ];

  const enriched=
  all.map(
    x=>{

      const probability=
      comboProbability(
        x.combo,
        a.boats
      );

      return{

        ...x,

        probability,

        expectedScore:
        probability,

        special:
        x.combo
        ===
        t.special

      };

    }
  );

  const units=
  Math.max(
    10,
    Math.floor(
      budget/100
    )
  );

  const weights=
  enriched.map(
    x=>
    x.group==='main'
    ?
    1.35
    :
    x.group==='cover'
    ?
    1
    :
    .8
  );

  const totalWeight=
  weights.reduce(
    (s,x)=>s+x,
    0
  );

  let assigned=0;

  const out=
  enriched.map(
    (x,i)=>{

      const unitsFor=
      Math.max(
        1,
        Math.floor(
          units
          *
          weights[i]
          /
          totalWeight
        )
      );

      assigned+=
      unitsFor;

      return{

        ...x,

        money:
        unitsFor*100

      };

    }
  );

  let diff=
  units-assigned;

  let i=0;

  while(
    diff>0
  ){

    out[
      i%out.length
    ].money+=100;

    diff--;

    i++;

  }

  while(
    diff<0
  ){

    const target=
    out
    .slice()
    .reverse()
    .find(
      x=>x.money>100
    );

    if(
      !target
    ){
      break;
    }

    target.money-=100;

    diff++;

  }

  return out;

}

    weather.air,

    a.startRank,

    courseChanges:

        boat:
        x.boat,

        course:

          x.preview?.course_number,
          x.boat
        )

      })
    ),

    reasons:
    a.reasons,

    specialHole:
    ticketSet.special

  };

  const old=
  rs.find(

  );

  if(

  ){

    if(

    ){

      old.tickets=

      predictionMeta;

      old.savedAt=
      new Date()
      .toISOString();

  rs.push({

    payout:0,

    resultOdds:0,

    returnAmount:0,

    savedAt:
    new Date()
    .toISOString(),

    'gold-v2-weather-ev',

}

/* ==============================
   的中・不的中自動判定
============================== */

function settle(races){

  const rs=
  records();

  let ch=false;

  for(
    const rec
    of
    rs
  ){

    if(
      rec.done
    ){
      continue;
    }

    const r=
    races.find(
      x=>
      raceKey(x)
      ===
      rec.key
    );

    if(
      !r
    ){
      continue;
    }

    const p=
    payouts(r);

    if(
      !p.length
    ){
      continue;
    }

    const w=
    p[0];

    const combo=
    String(
      w.combination
      ||
      ''
    );

    const pay=
    num(
      w.amount
    );

    if(
      !combo
    ){
      continue;
    }

    rec.done=
    true;

    rec.result=
    combo;

    rec.payout=
    pay;

    rec.resultOdds=
    pay>0
    ?
    pay/100
    :
    0;

    const ht=
    rec.tickets.find(
      t=>
      t.combo===combo
    );

    rec.hit=
    !!ht;

    rec.returnAmount=
    ht
    ?
    Math.round(
      pay/100
      *
      ht.money
    )
    :
    0;

    ch=
    true;

  }

  if(
    ch
  ){

    save(rs);

  }

}

/* ==============================
   AI再計算
============================== */

function analyzeRaces(races){

  settle(
    races
  );

  const arr=[];

  for(
    const r
    of
    races
  ){

    if(
      !upcoming(r)
      ||
      !previewReady(r)
    ){
      continue;
    }

    const a=
    evaluate(r);

    if(
      a?.grade==='S'
    ){

      arr.push(
        a
      );

      savePrediction(
        a
      );

    }

  }

  arr.sort(
    (a,b)=>
    b.rating-a.rating
  );

  analyses=
  arr;

  display();

  renderStats();

  return arr;

}


/* ==============================
   完全自動更新
============================== */

async function autoRefresh(
  force=false
){

  if(
    autoUpdateBusy
  ){
    return;
  }

  autoUpdateBusy=
  true;

  const st=
  $('status');

  try{

    if(
      force
      &&
      !analyses.length
    ){

      st.textContent=
      '最新データを自動取得しています…';

    }

    const data=
    await fetchToday();

    const races=
    flatten(data);

    const sig=
    dataSignature(
      races
    );

    settle(
      races
    );

    if(
      force
      ||
      sig!==lastDataSignature
    ){

      lastDataSignature=
      sig;

      const arr=
      analyzeRaces(
        races
      );

      st.innerHTML=
      `

      自動更新完了　
      🔥 S評価：${arr.length}レース

      <br>

      天候・水面・展示データ更新時にAIを再計算します。

      `;

    }
    else{

      renderStats();

      st.innerHTML=
      `

      自動確認済み　
      🔥 S評価：${analyses.length}レース

      <br>

      最新データに変化はありません。

      `;

    }

  }
  catch(e){

    console.error(e);

    st.textContent=
    '自動更新に失敗しました。通信が戻ると次回の自動更新で再試行します。';

  }
  finally{

    autoUpdateBusy=
    false;

  }

}

  ){

    )
  );

/* ==============================
   成績計算
============================== */

function calc(rs){

  const done=
  rs.filter(
    x=>x.done
  );

  const stake=
  done.reduce(
    (s,x)=>
    s+num(x.stake),
    0
  );

  const ret=
  done.reduce(
    (s,x)=>
    s+num(
      x.returnAmount
    ),
    0
  );

  const hits=
  done.filter(
    x=>x.hit
  ).length;

  const each=
  done.map(
    x=>({

      ...x,

      raceRoi:
      num(x.stake)>0
      ?
      num(
        x.returnAmount
      )
      /
      num(
        x.stake
      )
      *
      100
      :
      0

    })
  );

  return{

    done,

    races:
    done.length,

    hits,

    stake,

    ret,

    hitRate:
    done.length
    ?
    hits
    /
    done.length
    *
    100
    :
    0,

    roi:
    stake
    ?
    ret
    /
    stake
    *
    100
    :
    0,

    profit:
    ret-stake,

    maxPayout:
    each.length
    ?
    Math.max(
      ...each.map(
        x=>num(
          x.returnAmount
        )
      )
    )
    :
    0,

    maxRoi:
    each.length
    ?
    Math.max(
      ...each.map(
        x=>x.raceRoi
      )
    )
    :
    0

  };

}


/* ==============================
   成績表示
============================== */

function renderStats(){

  const rs=
  filterRecords();

  const s=
  calc(rs);

  const pc=
  s.profit>=0
  ?
  'green'
  :
  'red';

  $('stats').innerHTML=
  `

  <div class="stats-grid">

    <div class="stat">
      <small>確定レース</small>
      <b>${s.races}R</b>
    </div>

    <div class="stat">
      <small>的中数</small>
      <b>${s.hits}R</b>
    </div>

    <div class="stat">
      <small>的中率</small>
      <b>${s.hitRate.toFixed(1)}%</b>
    </div>

    <div class="stat">
      <small>回収率</small>
      <b class="green">
        ${s.roi.toFixed(1)}%
      </b>
    </div>

    <div class="stat">
      <small>投資額</small>
      <b>
        ${s.stake.toLocaleString()}円
      </b>
    </div>

    <div class="stat">
      <small>払戻金</small>
      <b>
        ${s.ret.toLocaleString()}円
      </b>
    </div>

    <div class="stat">
      <small>最高払戻</small>
      <b>
        ${s.maxPayout.toLocaleString()}円
      </b>
    </div>

    <div class="stat">
      <small>最高回収率</small>
      <b>
        ${s.maxRoi.toFixed(1)}%
      </b>
    </div>

  </div>

  <div class="profit">

    <span>
      収支
    </span>

    <strong class="${pc}">

      ${
        s.profit>=0
        ?
        '+'
        :
        ''
      }

      ${s.profit.toLocaleString()}円

    </strong>

  </div>

  `;

  renderHistory(
    rs
  );

  renderVenue(
    rs
  );

}


/* ==============================
   的中・不的中一覧
============================== */

function renderHistory(rs){

  const done=
  rs
  .filter(
    x=>x.done
  )
  .sort(
    (a,b)=>
    String(
      b.date
    )
    .localeCompare(
      String(a.date)
    )
    ||
    num(
      b.raceNumber
    )
    -
    num(
      a.raceNumber
    )
  );

  if(
    !done.length
  ){

    $('history').innerHTML=
    `

    <div class="empty">
      確定済みレースはありません。
    </div>

    `;

    return;

  }

  $('history').innerHTML=
  `

  <div class="history-scroll">

    <table class="history-table">

      <thead>

        <tr>

          <th>日付</th>

          <th>場</th>

          <th>R</th>

          <th>結果</th>

          <th>オッズ</th>

          <th>判定</th>

          <th>払戻金</th>

          <th>回収率</th>

        </tr>

      </thead>

      <tbody>

      ${
        done.map(
          x=>{

            const rr=
            num(x.stake)>0
            ?
            num(
              x.returnAmount
            )
            /
            num(
              x.stake
            )
            *
            100
            :
            0;

            const od=
            num(
              x.resultOdds,
              num(
                x.payout
              )
              /
              100
            );

            return`

            <tr>

              <td>
                ${x.date.slice(5)}
              </td>

              <td>
                ${x.venue}
              </td>

              <td>
                ${x.raceNumber}R
              </td>

              <td>

                <b>
                  ${x.result||'-'}
                </b>

              </td>

              <td class="odds">

                ${
                  od
                  ?
                  od.toFixed(1)+'倍'
                  :
                  '-'
                }

              </td>

              <td class="${x.hit?'hit':'miss'}">

                ${
                  x.hit
                  ?
                  '◎ 的中'
                  :
                  '× 不的中'
                }

              </td>

              <td>
                ${num(x.returnAmount).toLocaleString()}円
              </td>

              <td class="${rr>=100?'roi':''}">
                ${rr.toFixed(1)}%
              </td>

            </tr>

            `;

          }
        )
        .join('')
      }

      </tbody>

    </table>

  </div>

  <div class="notice">

    オッズは3連単の
    確定払戻額÷100で表示しています。

  </div>

  `;

}


/* ==============================
   会場別成績
============================== */

function renderVenue(rs){

  const done=
  rs.filter(
    x=>x.done
  );

  const m=
  new Map();

  for(
    const x
    of
    done
  ){

    if(
      !m.has(
        x.venue
      )
    ){

      m.set(
        x.venue,
        []
      );

    }

    m.get(
      x.venue
    )
    .push(x);

  }

  if(
    !m.size
  ){

    $('venueStats').innerHTML=
    `

    <div class="empty">
      会場別成績はまだありません。
    </div>

    `;

    return;

  }

  const rows=
  [
    ...m.entries()
  ]
  .map(
    ([venue,a])=>({

      venue,

      ...calc(a)

    })
  )
  .sort(
    (a,b)=>
    b.roi-a.roi
  );

  $('venueStats').innerHTML=
  `

  <div class="venue-row">

    <b>会場</b>

    <b>R</b>

    <b>的中率</b>

    <b>回収率</b>

  </div>

  ${
    rows.map(
      x=>`

      <div class="venue-row">

        <span>
          ${x.venue}
        </span>

        <span>
          ${x.races}
        </span>

        <span>
          ${x.hitRate.toFixed(1)}%
        </span>

        <span class="${x.roi>=100?'green':''}">
          ${x.roi.toFixed(1)}%
        </span>

      </div>

      `
    )
    .join('')
  }

  `;

}


/* ==============================
   成績へ移動
============================== */

function showStats(
  openHistory=false,
  openVenue=false
){

  $('statsSection')
  .style
  .display=
  'block';

  renderStats();

  if(
    openHistory
  ){

    $('historyWrap')
    .style
    .display=
    'block';

    $('historyToggle')
    .textContent=
    '一覧を隠す';

  }

  if(
    openVenue
  ){

    $('venueWrap')
    .style
    .display=
    'block';

    $('venueToggle')
    .textContent=
    '会場別成績を隠す';

  }

  $('statsSection')
  .scrollIntoView({

    behavior:'smooth',

    block:'start'

  });

}


/* ==============================
   ボタン操作
============================== */

$('statsOpen').onclick=
()=>showStats();


$('historyOpen').onclick=
()=>showStats(
  true,
  false
);


$('venueOpen').onclick=
()=>showStats(
  false,
  true
);


$('qStats').onclick=
()=>showStats();


$('qTop').onclick=
()=>$('top')
.scrollIntoView({
  behavior:'smooth'
});


/* ==============================
   資金変更時
============================== */

$('budget').onchange=
()=>{

  display();

  analyses
  .filter(
    x=>x.grade==='S'
  )
  .forEach(
    savePrediction
  );

  renderStats();

};


/* ==============================
   的中一覧開閉
============================== */

$('historyToggle').onclick=
()=>{

  const w=
  $('historyWrap');

  const o=
  w.style.display
  ===
  'block';

  w.style.display=
  o
  ?
  'none'
  :
  'block';

  $('historyToggle')
  .textContent=
  o
  ?
  '一覧を表示'
  :
  '一覧を隠す';

};


/* ==============================
   会場別開閉
============================== */

$('venueToggle').onclick=
()=>{

  const w=
  $('venueWrap');

  const o=
  w.style.display
  ===
  'block';

  w.style.display=
  o
  ?
  'none'
  :
  'block';

  $('venueToggle')
  .textContent=
  o
  ?
  '会場別成績を表示'
  :
  '会場別成績を隠す';

};


/* ==============================
   集計期間
============================== */

document
.querySelectorAll(
  '.tab'
)
.forEach(
  b=>{

    b.onclick=
    ()=>{

      period=
      b.dataset.period;

      document
      .querySelectorAll(
        '.tab'
      )
      .forEach(
        x=>
        x.classList.toggle(
          'active',
          x===b
        )
      );

      $('rangeBox')
      .classList
      .toggle(
        'show',
        period==='custom'
      );

      renderStats();

    };

  }
);


$('fromDate').onchange=
renderStats;


$('toDate').onchange=
renderStats;


/* ==============================
   起動時
============================== */

renderStats();


/*
ページを開いた瞬間に
最新データ取得
↓
AI分析
↓
Sレース表示
*/

autoRefresh(
  true
);


/* ==============================
   60秒ごと自動更新
============================== */

setInterval(
  ()=>{

    if(
      !document.hidden
    ){

      autoRefresh(
        false
      );

    }

  },
  60000
);


/* ==============================
   アプリへ戻った時も更新
============================== */

window.addEventListener(
  'focus',
  ()=>autoRefresh(
    true
  )
);


/* ==============================
   スマホ画面復帰時
============================== */

document.addEventListener(
  'visibilitychange',
  ()=>{

    if(
      !document.hidden
    ){

      autoRefresh(
        true
      );

    }

  }
);

</script>
