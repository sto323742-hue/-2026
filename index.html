<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOAT RACE AI予想</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #08111f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .sub {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 20px;
    }

    .card {
      background: #111c2e;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    label {
      display: block;
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1422;
      color: white;
      font-size: 16px;
    }

    .boat-grid {
      display: grid;
      grid-template-columns: 45px 1fr 1fr 1fr;
      gap: 6px;
      align-items: center;
      margin-top: 8px;
    }

    .boat-number {
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-weight: bold;
      font-size: 18px;
    }

    .b1 { background: white; color: black; }
    .b2 { background: #333; }
    .b3 { background: #e53935; }
    .b4 { background: #2979ff; }
    .b5 { background: #f5d000; color: black; }
    .b6 { background: #2e9d52; }

    .head {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #00c853;
      color: white;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      display: none;
    }

    .rank {
      background: #0b1422;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
    }

    .s {
      color: #ff5252;
      font-size: 28px;
      font-weight: bold;
    }

    .a {
      color: #ffca28;
      font-size: 25px;
      font-weight: bold;
    }

    .buy {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.8;
      color: #69f0ae;
    }

    .note {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚤 BOAT RACE AI</h1>
  <div class="sub">3連単・回収率重視 AI予想</div>

  <div class="card">

    <label>開催場</label>
    <select id="place">
      <option>桐生</option>
      <option>戸田</option>
      <option>江戸川</option>
      <option>平和島</option>
      <option>多摩川</option>
      <option>浜名湖</option>
      <option>蒲郡</option>
      <option>常滑</option>
      <option>津</option>
      <option>三国</option>
      <option>びわこ</option>
      <option>住之江</option>
      <option>尼崎</option>
      <option>鳴門</option>
      <option>丸亀</option>
      <option>児島</option>
      <option>宮島</option>
      <option>徳山</option>
      <option>下関</option>
      <option>若松</option>
      <option>芦屋</option>
      <option>福岡</option>
      <option>唐津</option>
      <option>大村</option>
    </select>

    <label>レース</label>
    <select id="race">
      <option>1R</option>
      <option>2R</option>
      <option>3R</option>
      <option>4R</option>
      <option>5R</option>
      <option>6R</option>
      <option>7R</option>
      <option>8R</option>
      <option>9R</option>
      <option>10R</option>
      <option>11R</option>
      <option>12R</option>
    </select>

  </div>


  <div class="card">

    <h3>選手データ入力</h3>

    <div class="boat-grid">
      <div></div>
      <div class="head">勝率</div>
      <div class="head">モーター%</div>
      <div class="head">展示</div>

      <div class="boat-number b1">1</div>
      <input id="win1" type="number" step="0.01" value="6.50">
      <input id="motor1" type="number" step="0.1" value="35">
      <input id="ex1" type="number" step="0.01" value="6.80">

      <div class="boat-number b2">2</div>
      <input id="win2" type="number" step="0.01" value="6.00">
      <input id="motor2" type="number" step="0.1" value="35">
      <input id="ex2" type="number" step="0.01" value="6.82">

      <div class="boat-number b3">3</div>
      <input id="win3" type="number" step="0.01" value="5.50">
      <input id="motor3" type="number" step="0.1" value="35">
      <input id="ex3" type="number" step="0.01" value="6.84">

      <div class="boat-number b4">4</div>
      <input id="win4" type="number" step="0.01" value="5.00">
      <input id="motor4" type="number" step="0.1" value="35">
      <input id="ex4" type="number" step="0.01" value="6.86">

      <div class="boat-number b5">5</div>
      <input id="win5" type="number" step="0.01" value="4.50">
      <input id="motor5" type="number" step="0.1" value="35">
      <input id="ex5" type="number" step="0.01" value="6.88">

      <div class="boat-number b6">6</div>
      <input id="win6" type="number" step="0.01" value="4.00">
      <input id="motor6" type="number" step="0.1" value="35">
      <input id="ex6" type="number" step="0.01" value="6.90">

    </div>

    <button onclick="predict()">
      AI予想する
    </button>

  </div>


  <div class="card" id="result">

    <h2>🤖 AI予想結果</h2>

    <div id="raceTitle"></div>

    <div class="rank">
      AI勝負度
      <div id="grade" class="s">S</div>
    </div>

    <div class="rank">
      ◎ 本命
      <div id="main"></div>
    </div>

    <div class="rank">
      ○ 対抗
      <div id="second"></div>
    </div>

    <div class="rank">
      ▲ 単穴
      <div id="third"></div>
    </div>

    <h3>🔥 3連単 AI買い目</h3>

    <div class="buy" id="bets"></div>

    <p class="note">
      ※入力データをもとに簡易スコア計算しています。
      実際の投票はオッズ・展示ST・進入・風・水面状況なども確認してください。
    </p>

  </div>

</div>


<script>

function predict() {

  let boats = [];

  for (let i = 1; i <= 6; i++) {

    let win =
      parseFloat(document.getElementById("win" + i).value) || 0;

    let motor =
      parseFloat(document.getElementById("motor" + i).value) || 0;

    let ex =
      parseFloat(document.getElementById("ex" + i).value) || 7;


    /*
      AI簡易評価

      勝率 55%
      モーター 30%
      展示 15%

      1号艇はインコース補正
    */

    let score =
      win * 10 * 0.55 +
      motor * 0.30 +
      (7.20 - ex) * 30 * 0.15;


    /* コース補正 */

    if (i === 1) score += 10;
    if (i === 2) score += 4;
    if (i === 3) score += 2;
    if (i === 4) score += 1;


    boats.push({
      number: i,
      score: score
    });

  }


  boats.sort(function(a, b) {
    return b.score - a.score;
  });


  let a = boats[0].number;
  let b = boats[1].number;
  let c = boats[2].number;
  let d = boats[3].number;


  let difference =
      boats[0].score - boats[1].score;


  let grade = "B";

  if (difference >= 8) {
    grade = "S";
  }
  else if (difference >= 4) {
    grade = "A";
  }


  document.getElementById("grade").innerText =
      grade;


  document.getElementById("main").innerText =
      a + "号艇";


  document.getElementById("second").innerText =
      b + "号艇";


  document.getElementById("third").innerText =
      c + "号艇";


  /*
    3連単
    本線・押さえ・穴
  */

  let bets = [

    a + "-" + b + "-" + c,
    a + "-" + c + "-" + b,
    a + "-" + b + "-" + d,

    b + "-" + a + "-" + c,
    a + "-" + c + "-" + d,

    b + "-" + c + "-" + a,
    c + "-" + a + "-" + b,

    c + "-" + b + "-" + a

  ];


  let html = "";

  bets.forEach(function(bet, index) {

    if (index < 3) {
      html += "◎ " + bet + "<br>";
    }

    else if (index < 6) {
      html += "○ " + bet + "<br>";
    }

    else {
      html += "★ " + bet + "<br>";
    }

  });


  document.getElementById("bets").innerHTML =
      html;


  let place =
      document.getElementById("place").value;

  let race =
      document.getElementById("race").value;


  document.getElementById("raceTitle").innerHTML =
      "<h2>" + place + " " + race + "</h2>";


  document.getElementById("result").style.display =
      "block";


  document.getElementById("result")
      .scrollIntoView({
        behavior: "smooth"
      });

}

</script>

</body>
</html>
