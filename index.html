<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08111f">

<title>BOAT RACE AI予想</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#08111f;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}

.container{
  max-width:720px;
  margin:auto;
  padding:20px 14px 70px;
}

.header{
  text-align:center;
  padding:18px 0 22px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.sub{
  color:#91a7bf;
  font-size:13px;
  margin-top:8px;
}

.card{
  background:#101e31;
  border:1px solid #2c405b;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
}

.title{
  color:#49cfff;
  font-size:21px;
  font-weight:900;
  margin-bottom:16px;
}

label{
  display:block;
  color:#b8c5d6;
  margin-bottom:7px;
  font-size:14px;
}

select{
  width:100%;
  height:54px;
  border:2px solid #304864;
  border-radius:14px;
  background:#081524;
  color:#fff;
  font-size:17px;
  padding:0 12px;
}

button{
  width:100%;
  height:60px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#18cbea,#1478ff);
  color:#fff;
  font-size:19px;
  font-weight:900;
  margin-top:14px;
}

button:active{
  transform:scale(.98);
}

.status{
  background:#091725;
  border-radius:14px;
  padding:13px;
  color:#b9c9da;
  font-size:14px;
  line-height:1.6;
}

.loading{
  text-align:center;
  padding:25px;
  color:#58d6ff;
  font-weight:bold;
}

.race-card{
  background:#101e31;
  border:2px solid #1dd1ff;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 0 18px rgba(29,209,255,.10);
}

.race-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:14px;
}

.place{
  font-size:22px;
  font-weight:900;
}

.race-number{
  color:#9db2c8;
  margin-top:3px;
  font-size:14px;
}

.s-badge{
  background:#ff4059;
  color:white;
  font-size:22px;
  font-weight:900;
  border-radius:13px;
  padding:8px 13px;
}

.score{
  background:#081725;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
}

.score-main{
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

.score-value{
  color:#53dcff;
}

.rank{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.rank-box{
  text-align:center;
  background:#081725;
  border-radius:12px;
  padding:10px 5px;
}

.rank-label{
  color:#849bb4;
  font-size:11px;
}

.rank-boat{
  font-size:22px;
  font-weight:900;
  margin-top:4px;
}

.bet-title{
  margin-top:16px;
  margin-bottom:8px;
  font-size:17px;
  font-weight:900;
}

.main-title{
  color:#55d8ff;
}

.cover-title{
  color:#ffd457;
}

.hole-title{
  color:#ff818c;
}

.ticket{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#081725;
  border:1px solid #294158;
  padding:11px 12px;
  border-radius:12px;
  margin-bottom:7px;
}

.combo{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}

.money{
  color:#72dcff;
  font-weight:800;
}

.total{
  border-top:1px solid #334b65;
  margin-top:15px;
  padding-top:13px;
  display:flex;
  justify-content:space-between;
  font-weight:900;
}

.info{
  margin-top:14px;
  background:#081725;
  border-radius:13px;
  padding:13px;
  font-size:13px;
  line-height:1.7;
  color:#c3d0df;
}

.no-race{
  text-align:center;
  padding:30px 15px;
  background:#101e31;
  border-radius:18px;
  color:#b4c3d3;
  line-height:1.8;
}

.refresh{
  background:#263b55;
}

.small{
  font-size:12px;
  color:#7890aa;
  margin-top:10px;
  line-height:1.5;
}

.footer{
  text-align:center;
  color:#607891;
  font-size:11px;
  margin-top:30px;
}

@media(max-width:480px){
  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .place{
    font-size:20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🚤 BOAT RACE AI予想</h1>
    <div class="sub">
      全国24場から勝負度Sだけ自動抽出
    </div>
  </div>

  <div class="card">

    <div class="title">
      本日の勝負レース
    </div>

    <label>
      1レース購入資金
    </label>

    <select id="budget">
      <option value="1000" selected>1,000円</option>
      <option value="2000">2,000円</option>
      <option value="3000">3,000円</option>
      <option value="5000">5,000円</option>
      <option value="10000">10,000円</option>
    </select>

    <button onclick="loadToday()">
      🔍 勝負度Sを自動検索
    </button>

    <button class="refresh" onclick="loadToday()">
      ↻ 最新データに更新
    </button>

    <div style="height:14px"></div>

    <div class="status" id="status">
      「勝負度Sを自動検索」を押すと、
      全国の開催レースをAI評価します。
    </div>

    <div class="small">
      本線3点・押さえ4点・穴3点の合計10点。
      10点すべて同じ金額で購入します。
    </div>

  </div>

  <div id="results"></div>

  <div class="footer">
    AI評価は参考情報です。投票は無理のない資金で行ってください。
  </div>

</div>

<script>

const STADIUMS = {
  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"
};

function n(value, fallback=0){
  const x = Number(value);
  return Number.isFinite(x) ? x : fallback;
}

function boatScore(racer, preview, boat){

  const national =
    n(racer?.national_win_rate,5.0);

  const local =
    n(racer?.local_win_rate,national);

  const motor =
    n(racer?.motor_top_2_percent,30);

  const boatRate =
    n(racer?.boat_top_2_percent,30);

  const avgST =
    n(racer?.average_start_timing,.18);

  const exhibition =
    n(preview?.exhibition_time,6.85);

  const exhibitionST =
    n(preview?.start_timing,avgST);

  const rank =
    n(racer?.rank_number,2);

  let score = 0;

  score += national * 5.0;
  score += local * 2.7;
  score += motor * 0.30;
  score += boatRate * 0.12;

  score += Math.max(
    0,
    (0.22 - avgST) * 70
  );

  score += Math.max(
    0,
    (6.95 - exhibition) * 35
  );

  score += Math.max(
    0,
    (0.20 - exhibitionST) * 45
  );

  if(rank === 1) score += 5;
  if(rank === 2) score += 3;

  const courseBonus = {
    1:12,
    2:6,
    3:4,
    4:2,
    5:0,
    6:-2
  };

  score += courseBonus[boat] || 0;

  return score;
}

function evaluateRace(race){

  const racers =
    race?.racers || {};

  const previews =
    race?.preview?.racers || {};

  let boats = [];

  for(let i=1;i<=6;i++){

    const racer = racers[String(i)];

    if(!racer) continue;

    const preview =
      previews[String(i)] || {};

    boats.push({
      boat:i,
      racer:racer,
      preview:preview,
      score:boatScore(
        racer,
        preview,
        i
      )
    });
  }

  if(boats.length < 6){
    return null;
  }

  boats.sort(
    (a,b)=>b.score-a.score
  );

  const top = boats[0];
  const second = boats[1];
  const third = boats[2];

  const gap1 =
    top.score-second.score;

  const gap2 =
    second.score-third.score;

  let confidence = 60;

  confidence +=
    Math.min(18,gap1*2.2);

  confidence +=
    Math.min(8,gap2);

  if(top.boat === 1){
    confidence += 7;
  }

  const wind =
    n(race?.preview?.wind_speed,0);

  const wave =
    n(race?.preview?.wave_height,0);

  if(wind >= 6){
    confidence -= 6;
  }

  if(wave >= 5){
    confidence -= 4;
  }

  confidence =
    Math.max(
      0,
      Math.min(99,confidence)
    );

  let grade = "B";

  if(
    confidence >= 78 &&
    gap1 >= 5
  ){
    grade = "S";
  }
  else if(
    confidence >= 68
  ){
    grade = "A";
  }

  return {
    grade,
    confidence,
    boats,
    wind,
    wave
  };
}

function uniquePush(arr, value){

  if(
    value &&
    !arr.includes(value)
  ){
    arr.push(value);
  }
}

function makeTickets(boats){

  const a=boats[0].boat;
  const b=boats[1].boat;
  const c=boats[2].boat;
  const d=boats[3].boat;
  const e=boats[4].boat;
  const f=boats[5].boat;

  let main=[];
  let cover=[];
  let hole=[];

  uniquePush(main,`${a}-${b}-${c}`);
  uniquePush(main,`${a}-${c}-${b}`);
  uniquePush(main,`${a}-${b}-${d}`);

  uniquePush(cover,`${a}-${c}-${d}`);
  uniquePush(cover,`${a}-${d}-${b}`);
  uniquePush(cover,`${b}-${a}-${c}`);
  uniquePush(cover,`${b}-${c}-${a}`);

  uniquePush(hole,`${c}-${a}-${b}`);
  uniquePush(hole,`${b}-${d}-${a}`);
  uniquePush(hole,`${d}-${a}-${c}`);

  return {
    main:main.slice(0,3),
    cover:cover.slice(0,4),
    hole:hole.slice(0,3)
  };
}

function ticketsHTML(
  title,
  cls,
  tickets,
  amount
){

  return `
    <div class="bet-title ${cls}">
      ${title}
    </div>

    ${tickets.map(t=>`
      <div class="ticket">
        <div class="combo">
          ${t}
        </div>
        <div class="money">
          ${amount.toLocaleString()}円
        </div>
      </div>
    `).join("")}
  `;
}

function renderRace(
  placeName,
  raceNo,
  race,
  analysis
){

  const budget =
    Number(
      document.getElementById(
        "budget"
      ).value
    );

  const perTicket =
    Math.floor(
      budget / 10 / 100
    ) * 100;

  const actualTotal =
    perTicket * 10;

  const tickets =
    makeTickets(
      analysis.boats
    );

  const first =
    analysis.boats[0];

  const second =
    analysis.boats[1];

  const third =
    analysis.boats[2];

  const closed =
    race.closed_at
      ? race.closed_at.substring(11,16)
      : "--:--";

  return `
    <div class="race-card">

      <div class="race-head">

        <div>
          <div class="place">
            ${placeName}
          </div>

          <div class="race-number">
            ${raceNo}R　
            締切 ${closed}
          </div>
        </div>

        <div class="s-badge">
          S
        </div>

      </div>

      <div class="score">

        <div class="score-main">
          <span>
            AI信頼度
          </span>

          <span class="score-value">
            ${analysis.confidence.toFixed(0)}%
          </span>
        </div>

        <div class="rank">

          <div class="rank-box">
            <div class="rank-label">
              1着候補
            </div>
            <div class="rank-boat">
              ${first.boat}号艇
            </div>
          </div>

          <div class="rank-box">
            <div class="rank-label">
              2着候補
            </div>
            <div class="rank-boat">
              ${second.boat}号艇
            </div>
          </div>

          <div class="rank-box">
            <div class="rank-label">
              3着候補
            </div>
            <div class="rank-boat">
              ${third.boat}号艇
            </div>
          </div>

        </div>

      </div>

      ${ticketsHTML(
        "本線 3点",
        "main-title",
        tickets.main,
        perTicket
      )}

      ${ticketsHTML(
        "押さえ 4点",
        "cover-title",
        tickets.cover,
        perTicket
      )}

      ${ticketsHTML(
        "穴 3点",
        "hole-title",
        tickets.hole,
        perTicket
      )}

      <div class="total">
        <span>
          合計10点
        </span>
        <span>
          ${actualTotal.toLocaleString()}円
        </span>
      </div>

      <div class="info">

        風速：
        ${analysis.wind}m　

        波高：
        ${analysis.wave}cm
        <br>

        AI1位：
        ${first.boat}号艇
        ${first.racer?.name || ""}
        <br>

        AI2位：
        ${second.boat}号艇
        ${second.racer?.name || ""}
        <br>

        AI3位：
        ${third.boat}号艇
        ${third.racer?.name || ""}

      </div>

    </div>
  `;
}

async function loadToday(){

  const status =
    document.getElementById(
      "status"
    );

  const results =
    document.getElementById(
      "results"
    );

  results.innerHTML =
    `<div class="loading">
      全国レースを分析中…
    </div>`;

  status.innerHTML =
    "最新データを取得しています。";

  try{

    const url =
      "https://boatraceopenapi.github.io/api/v1/today.json?t="
      + Date.now();

    const res =
      await fetch(
        url,
        {cache:"no-store"}
      );

    if(!res.ok){
      throw new Error(
        "データ取得失敗"
      );
    }

    const data =
      await res.json();

    const stadiums =
      data?.programs?.stadiums || {};

    let sRaces=[];

    Object.keys(stadiums).forEach(
      stadiumKey=>{

        const stadium =
          stadiums[stadiumKey];

        const races =
          stadium?.races || {};

        Object.keys(races).forEach(
          raceKey=>{

            const race =
              races[raceKey];

            if(race?.result){
              return;
            }

            const analysis =
              evaluateRace(race);

            if(
              analysis &&
              analysis.grade === "S"
            ){

              sRaces.push({
                stadiumNumber:
                  Number(stadiumKey),

                raceNumber:
                  Number(raceKey),

                race,
                analysis
              });
            }
          }
        );
      }
    );

    sRaces.sort(
      (a,b)=>
        b.analysis.confidence -
        a.analysis.confidence
    );

    status.innerHTML =
      `全国を分析しました。勝負度Sは
      <b>${sRaces.length}レース</b>
      です。`;

    if(sRaces.length === 0){

      results.innerHTML =
        `<div class="no-race">
          現在、AI基準を満たす
          <b>勝負度S</b>はありません。
          <br>
          展示データ更新後に
          「最新データに更新」を押してください。
        </div>`;

      return;
    }

    results.innerHTML =
      sRaces.map(item=>{

        const place =
          STADIUMS[
            item.stadiumNumber
          ] ||
          `${item.stadiumNumber}場`;

        return renderRace(
          place,
          item.raceNumber,
          item.race,
          item.analysis
        );

      }).join("");

  }
  catch(error){

    console.error(error);

    status.innerHTML =
      "データを取得できませんでした。";

    results.innerHTML =
      `<div class="no-race">
        データ取得に失敗しました。
        <br>
        少し時間を置いて、
        「最新データに更新」を
        押してください。
      </div>`;
  }
}

document.getElementById(
  "budget"
).addEventListener(
  "change",
  ()=>{
    loadToday();
  }
);

window.addEventListener(
  "load",
  ()=>{
    loadToday();
  }
);

</script>

</body>
</html>
