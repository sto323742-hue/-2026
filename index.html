<script>

const API_BASE =
  "https://boatraceopenapi.github.io/api/v1";


const STADIUMS = {

  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"

};


const STORAGE_KEY =
  "boatrace_ai_s_records_v2";


function n(
  value,
  fallback=0
){

  const x =
    Number(value);

  return Number.isFinite(x)
    ? x
    : fallback;

}


/* =========================
   スクロール
========================= */

function goToStats(){

  document
    .getElementById(
      "statsSection"
    )
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


function goToTop(){

  document
    .getElementById(
      "topSection"
    )
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* =========================
   日本時間
========================= */

function todayJST(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Tokyo",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(
      new Date()
    );

  const obj = {};

  parts.forEach(
    p =>
      obj[p.type] =
        p.value
  );

  return (
    `${obj.year}-${obj.month}-${obj.day}`
  );

}


/* =========================
   API
========================= */

function apiURL(date){

  const compact =
    date.replaceAll(
      "-",
      ""
    );

  const year =
    date.substring(
      0,
      4
    );

  return (
    `${API_BASE}/${year}/${compact}.json`
  );

}


/* =========================
   レース時間
========================= */

function getRaceTime(race){

  const value =
    race?.closed_at;

  if(!value){

    return "--:--";

  }

  const match =
    String(value).match(
      /(\d{2}):(\d{2})/
    );

  if(!match){

    return "--:--";

  }

  return (
    `${match[1]}:${match[2]}`
  );

}


/* =========================
   AI採点
========================= */

function boatScore(
  racer,
  preview,
  boat
){

  const national =
    n(
      racer?.national_win_rate,
      5
    );

  const local =
    n(
      racer?.local_win_rate,
      national
    );

  const motor =
    n(
      racer?.motor_top_2_percent,
      30
    );

  const boatRate =
    n(
      racer?.boat_top_2_percent,
      30
    );

  const avgST =
    n(
      racer?.average_start_timing,
      .18
    );

  const exhibition =
    n(
      preview?.exhibition_time,
      99
    );

  const exhibitionST =
    n(
      preview?.start_timing,
      99
    );

  const rank =
    n(
      racer?.rank_number,
      2
    );

  let score = 0;

  score +=
    national * 5;

  score +=
    local * 2.7;

  score +=
    motor * .30;

  score +=
    boatRate * .12;

  score +=
    Math.max(
      0,
      (.22 - avgST) * 70
    );

  if(
    exhibition < 10
  ){

    score +=
      Math.max(
        0,
        (6.95 - exhibition) * 35
      );

  }

  if(
    exhibitionST < 1
  ){

    score +=
      Math.max(
        0,
        (.20 - exhibitionST) * 45
      );

  }

  if(
    rank === 1
  ){

    score += 5;

  }

  if(
    rank === 2
  ){

    score += 3;

  }


  const courseBonus = {

    1:12,
    2:6,
    3:4,
    4:2,
    5:0,
    6:-2

  };


  score +=
    courseBonus[boat] || 0;


  return score;

}


/* =========================
   展示6艇確認
========================= */

function previewComplete(race){

  const preview =
    race?.preview;

  const racers =
    preview?.racers;

  if(
    !preview ||
    !racers
  ){

    return false;

  }

  for(
    let i=1;
    i<=6;
    i++
  ){

    const racer =
      racers[String(i)];

    if(!racer){

      return false;

    }

    if(
      racer.exhibition_time === null ||
      racer.exhibition_time === undefined ||
      racer.start_timing === null ||
      racer.start_timing === undefined
    ){

      return false;

    }

  }

  return true;

}


/* =========================
   S判定
========================= */

function evaluateRace(race){

  if(
    !previewComplete(race)
  ){

    return null;

  }

  const racers =
    race?.racers || {};

  const previews =
    race?.preview?.racers || {};

  const boats = [];

  for(
    let i=1;
    i<=6;
    i++
  ){

    const racer =
      racers[String(i)];

    const preview =
      previews[String(i)];

    if(
      !racer ||
      !preview
    ){

      return null;

    }

    boats.push({

      boat:i,

      racer:racer,

      preview:preview,

      score:
        boatScore(
          racer,
          preview,
          i
        )

    });

  }

  boats.sort(
    (a,b) =>
      b.score -
      a.score
  );

  const top =
    boats[0];

  const second =
    boats[1];

  const third =
    boats[2];

  const gap1 =
    top.score -
    second.score;

  const gap2 =
    second.score -
    third.score;

  let confidence = 60;

  confidence +=
    Math.min(
      18,
      gap1 * 2.2
    );

  confidence +=
    Math.min(
      8,
      gap2
    );

  if(
    top.boat === 1
  ){

    confidence += 7;

  }

  const wind =
    n(
      race?.preview?.wind_speed,
      0
    );

  const wave =
    n(
      race?.preview?.wave_height,
      0
    );

  if(
    wind >= 6
  ){

    confidence -= 6;

  }

  if(
    wave >= 5
  ){

    confidence -= 4;

  }

  confidence =
    Math.max(
      0,
      Math.min(
        99,
        confidence
      )
    );


  const grade =

    confidence >= 78 &&
    gap1 >= 5

      ? "S"

      : confidence >= 68

        ? "A"

        : "B";


  return {

    grade,
    confidence,
    boats,
    wind,
    wave

  };

}


/* =========================
   買い目
========================= */

function uniquePush(
  arr,
  value
){

  if(
    value &&
    !arr.includes(value)
  ){

    arr.push(value);

  }

}


function makeTickets(boats){

  const a =
    boats[0].boat;

  const b =
    boats[1].boat;

  const c =
    boats[2].boat;

  const d =
    boats[3].boat;


  const main = [];
  const cover = [];
  const hole = [];


  uniquePush(
    main,
    `${a}-${b}-${c}`
  );

  uniquePush(
    main,
    `${a}-${c}-${b}`
  );

  uniquePush(
    main,
    `${a}-${b}-${d}`
  );


  uniquePush(
    cover,
    `${a}-${c}-${d}`
  );

  uniquePush(
    cover,
    `${a}-${d}-${b}`
  );

  uniquePush(
    cover,
    `${b}-${a}-${c}`
  );

  uniquePush(
    cover,
    `${b}-${c}-${a}`
  );


  uniquePush(
    hole,
    `${c}-${a}-${b}`
  );

  uniquePush(
    hole,
    `${b}-${d}-${a}`
  );

  uniquePush(
    hole,
    `${d}-${a}-${c}`
  );


  return {

    main:
      main.slice(
        0,
        3
      ),

    cover:
      cover.slice(
        0,
        4
      ),

    hole:
      hole.slice(
        0,
        3
      )

  };

}


function allTickets(tickets){

  return [

    ...tickets.main,

    ...tickets.cover,

    ...tickets.hole

  ];

}


/* =========================
   フィルター切替
========================= */

function setTicketFilter(
  button,
  type
){

  const card =
    button.closest(
      ".race-card"
    );

  if(!card){
    return;
  }

  const buttons =
    card.querySelectorAll(
      ".filter-btn"
    );

  buttons.forEach(
    btn =>
      btn.classList.remove(
        "active"
      )
  );

  button.classList.add(
    "active"
  );


  const groups =
    card.querySelectorAll(
      ".bet-group"
    );

  groups.forEach(
    group => {

      const groupType =
        group.dataset.betType;

      if(
        type === "all" ||
        groupType === type
      ){

        group.classList.remove(
          "hidden"
        );

      }

      else{

        group.classList.add(
          "hidden"
        );

      }

    }
  );

}


/* =========================
   買い目表示
========================= */

function ticketsHTML(
  title,
  cls,
  type,
  tickets,
  amount
){

  return `

    <div
      class="bet-group"
      data-bet-type="${type}"
    >

      <div class="bet-title ${cls}">
        ${title}
      </div>

      ${
        tickets.map(
          t => `

            <div class="ticket">

              <div class="combo">
                ${t}
              </div>

              <div class="money">
                ${amount.toLocaleString()}円
              </div>

            </div>

          `
        ).join("")
      }

    </div>

  `;

}


/* =========================
   払戻
========================= */

function getPayout(race){

  const arr =
    race?.result
      ?.payouts
      ?.trifecta;

  if(
    !Array.isArray(arr) ||
    arr.length === 0
  ){

    return null;

  }

  return arr[0];

}


/* =========================
   保存
========================= */

function raceKey(
  date,
  stadium,
  raceNo
){

  return (
    `${date}_${stadium}_${raceNo}`
  );

}


function loadRecords(){

  try{

    return (
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      ) || {}
    );

  }

  catch(e){

    return {};

  }

}


function saveRecords(records){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(records)
  );

}


function savePrediction(
  date,
  stadium,
  raceNo,
  tickets,
  budget
){

  const records =
    loadRecords();

  const key =
    raceKey(
      date,
      stadium,
      raceNo
    );

  if(
    records[key]
  ){

    return records[key];

  }

  const perTicket =
    Math.floor(
      budget /
      10 /
      100
    ) * 100;

  const totalBet =
    perTicket * 10;


  records[key] = {

    date:date,

    stadium:
      Number(stadium),

    raceNo:
      Number(raceNo),

    tickets:
      allTickets(tickets),

    main:
      tickets.main,

    cover:
      tickets.cover,

    hole:
      tickets.hole,

    perTicket:
      perTicket,

    totalBet:
      totalBet,

    result:
      "wait",

    winningCombination:
      null,

    payout:
      0,

    returnAmount:
      0,

    savedAt:
      new Date().toISOString()

  };


  saveRecords(records);


  return records[key];

}


/* =========================
   結果更新
========================= */

function updateResult(
  date,
  stadium,
  raceNo,
  race
){

  const records =
    loadRecords();

  const key =
    raceKey(
      date,
      stadium,
      raceNo
    );

  const record =
    records[key];

  if(!record){

    return;

  }

  const payout =
    getPayout(race);

  if(!payout){

    return;

  }

  const combination =
    String(
      payout.combination || ""
    ).replace(
      /\s/g,
      ""
    );

  const amount =
    n(
      payout.amount,
      0
    );

  const isHit =
    record.tickets.includes(
      combination
    );

  record.winningCombination =
    combination;

  record.payout =
    amount;


  if(isHit){

    record.result =
      "hit";

    record.returnAmount =
      Math.floor(
        amount *
        record.perTicket /
        100
      );

  }

  else{

    record.result =
      "miss";

    record.returnAmount =
      0;

  }


  records[key] =
    record;

  saveRecords(
    records
  );

}


function raceHasResult(race){

  return (
    getPayout(race) !== null
  );

}


/* =========================
   結果表示
========================= */

function resultHTML(record){

  if(!record){

    return `

      <div class="result-box wait">
        ⏳ 結果待ち
      </div>

    `;

  }


  if(
    record.result === "hit"
  ){

    return `

      <div class="result-box hit">

        🎯 的中<br>

        結果：
        ${record.winningCombination}<br>

        払戻：
        ${Number(record.payout).toLocaleString()}円
        ／100円<br>

        回収：
        ${Number(record.returnAmount).toLocaleString()}円

      </div>

    `;

  }


  if(
    record.result === "miss"
  ){

    return `

      <div class="result-box miss">

        ✕ 不的中<br>

        結果：
        ${record.winningCombination}

      </div>

    `;

  }


  return `

    <div class="result-box wait">
      ⏳ 結果待ち
    </div>

  `;

}

/* =========================
   レース一覧
========================= */

function getRacesFromData(data){

  const stadiums =
    data?.programs
      ?.stadiums || {};

  const result = [];


  Object.keys(
    stadiums
  ).forEach(

    stadiumKey => {

      const stadiumData =
        stadiums[stadiumKey];

      const races =
        stadiumData?.races || {};


      Object.keys(
        races
      ).forEach(

        raceKeyValue => {

          const race =
            races[raceKeyValue];


          result.push({

            stadium:
              Number(
                race?.stadium_number ||
                stadiumKey
              ),

            raceNo:
              Number(
                race?.race_number ||
                raceKeyValue
              ),

            race:
              race

          });

        }

      );

    }

  );


  return result;

}


/* =========================
   本日のSレース取得
========================= */

async function loadToday(){

  const status =
    document.getElementById(
      "status"
    );

  const results =
    document.getElementById(
      "results"
    );

  const budget =
    Number(
      document.getElementById(
        "budget"
      ).value
    );

  const date =
    todayJST();


  status.innerHTML =
    "全国24場の最新データを取得中…";


  results.innerHTML = `

    <div class="loading">
      AI分析中…
    </div>

  `;


  try{

    const response =
      await fetch(
        apiURL(date),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    const raceList =
      getRacesFromData(
        data
      );


    if(
      raceList.length === 0
    ){

      results.innerHTML = `

        <div class="no-race">

          本日のレースデータを
          取得できませんでした。<br><br>

          APIの更新を待ってから
          再度お試しください。

        </div>

      `;


      status.innerHTML =
        "レースデータなし";


      renderStats();

      return;

    }


    raceList.forEach(

      item => {

        updateResult(
          date,
          item.stadium,
          item.raceNo,
          item.race
        );

      }

    );


    let sRaces = [];


    raceList.forEach(

      item => {

        const evaluation =
          evaluateRace(
            item.race
          );


        if(
          !evaluation ||
          evaluation.grade !== "S"
        ){

          return;

        }


        const tickets =
          makeTickets(
            evaluation.boats
          );


        const records =
          loadRecords();


        const key =
          raceKey(
            date,
            item.stadium,
            item.raceNo
          );


        let record =
          records[key];


        if(
          !record &&
          raceHasResult(
            item.race
          )
        ){

          return;

        }


        if(!record){

          record =
            savePrediction(
              date,
              item.stadium,
              item.raceNo,
              tickets,
              budget
            );

        }


        updateResult(
          date,
          item.stadium,
          item.raceNo,
          item.race
        );


        const latestRecords =
          loadRecords();


        record =
          latestRecords[key] ||
          record;


        sRaces.push({

          stadium:
            item.stadium,

          raceNo:
            item.raceNo,

          race:
            item.race,

          raceTime:
            getRaceTime(
              item.race
            ),

          evaluation:
            evaluation,

          tickets:{

            main:
              record.main ||
              tickets.main,

            cover:
              record.cover ||
              tickets.cover,

            hole:
              record.hole ||
              tickets.hole

          },

          record:
            record

        });

      }

    );


    sRaces.sort(

      (a,b) => {

        const timeA =
          a.raceTime || "99:99";

        const timeB =
          b.raceTime || "99:99";


        if(
          timeA !== timeB
        ){

          return (
            timeA.localeCompare(
              timeB
            )
          );

        }


        return (
          b.evaluation.confidence -
          a.evaluation.confidence
        );

      }

    );


    if(
      sRaces.length === 0
    ){

      results.innerHTML = `

        <div class="no-race">

          現在、
          勝負度S確定レースはありません。<br><br>

          展示情報6艇分が揃い、
          S条件を満たしたレースだけ
          ここに表示されます。<br><br>

          「最新データに更新」を
          押して再確認してください。

        </div>

      `;


      status.innerHTML =

        `全国24場を確認しました。<br>
         現在の勝負度S：
         <strong>0レース</strong>`;

    }

    else{

      results.innerHTML =

        sRaces.map(

          x =>

            raceCardHTML(

              date,

              x.stadium,

              x.raceNo,

              x.race,

              x.evaluation,

              x.tickets,

              x.record

            )

        ).join("");


      status.innerHTML =

        `全国24場を確認しました。<br>
         勝負度S：
         <strong>${sRaces.length}レース</strong>`;

    }


    renderStats();

  }

  catch(error){

    console.error(
      error
    );


    results.innerHTML = `

      <div class="no-race">

        データ取得に失敗しました。<br><br>

        少し時間を空けて
        「最新データに更新」を
        押してください。

      </div>

    `;


    status.innerHTML =

      `データ取得エラー<br>
       ${error.message}`;


    renderStats();

  }

}


/* =========================
   集計期間
========================= */

function recordInPeriod(
  record,
  period
){

  if(
    period === "all"
  ){

    return true;

  }


  const today =
    todayJST();


  if(
    period === "day"
  ){

    return (
      record.date === today
    );

  }


  if(
    period === "month"
  ){

    return (

      record.date.substring(
        0,
        7
      )

      ===

      today.substring(
        0,
        7
      )

    );

  }


  if(
    period === "year"
  ){

    return (

      record.date.substring(
        0,
        4
      )

      ===

      today.substring(
        0,
        4
      )

    );

  }


  return true;

}


/* =========================
   統計
========================= */

function renderStats(){

  const area =
    document.getElementById(
      "stats"
    );


  if(!area){

    return;

  }


  const period =
    document.getElementById(
      "period"
    )?.value || "month";


  const records =
    Object.values(
      loadRecords()
    ).filter(

      r =>
        recordInPeriod(
          r,
          period
        )

    );


  const finished =
    records.filter(

      r =>
        r.result === "hit" ||
        r.result === "miss"

    );


  const hits =
    finished.filter(

      r =>
        r.result === "hit"

    );


  const totalBet =
    finished.reduce(

      (sum,r) =>
        sum +
        n(
          r.totalBet,
          0
        ),

      0

    );


  const totalReturn =
    finished.reduce(

      (sum,r) =>
        sum +
        n(
          r.returnAmount,
          0
        ),

      0

    );


  const hitRate =

    finished.length > 0

      ? (
          hits.length /
          finished.length *
          100
        )

      : 0;


  const recovery =

    totalBet > 0

      ? (
          totalReturn /
          totalBet *
          100
        )

      : 0;


  const profit =
    totalReturn -
    totalBet;


  let html = `

    <div class="stats-grid">


      <div class="stat">

        <div class="stat-label">
          Sレース
        </div>

        <div class="stat-value blue">
          ${records.length}
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          的中
        </div>

        <div class="stat-value green">
          ${hits.length}
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          的中率
        </div>

        <div class="stat-value yellow">
          ${hitRate.toFixed(1)}%
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          回収率
        </div>

        <div class="stat-value yellow">
          ${recovery.toFixed(1)}%
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          投資額
        </div>

        <div class="stat-value">
          ${totalBet.toLocaleString()}円
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          払戻額
        </div>

        <div class="stat-value green">
          ${totalReturn.toLocaleString()}円
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          収支
        </div>

        <div class="stat-value ${
          profit >= 0
            ? "green"
            : ""
        }">

          ${
            profit >= 0
              ? "+"
              : ""
          }

          ${profit.toLocaleString()}円

        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          結果待ち
        </div>

        <div class="stat-value">

          ${
            records.filter(
              r =>
                r.result === "wait"
            ).length
          }

        </div>

      </div>


    </div>

  `;


  const byStadium = {};


  finished.forEach(

    r => {

      const stadium =
        Number(
          r.stadium
        );


      if(
        !byStadium[stadium]
      ){

        byStadium[stadium] = {

          races:0,
          hits:0,
          bet:0,
          returns:0

        };

      }


      const s =
        byStadium[stadium];


      s.races += 1;


      if(
        r.result === "hit"
      ){

        s.hits += 1;

      }


      s.bet +=
        n(
          r.totalBet,
          0
        );


      s.returns +=
        n(
          r.returnAmount,
          0
        );

    }

  );


  const stadiumKeys =
    Object.keys(
      byStadium
    ).sort(

      (a,b) =>
        Number(a) -
        Number(b)

    );


  if(
    stadiumKeys.length > 0
  ){

    html += `

      <div class="stadium-title">
        会場別成績
      </div>


      <div
        class="stadium-row"
        style="color:#7890aa"
      >

        <div>
          会場
        </div>

        <div>
          的中率
        </div>

        <div>
          回収率
        </div>

      </div>

    `;


    stadiumKeys.forEach(

      key => {

        const s =
          byStadium[key];


        const h =

          s.races > 0

            ? (
                s.hits /
                s.races *
                100
              )

            : 0;


        const r =

          s.bet > 0

            ? (
                s.returns /
                s.bet *
                100
              )

            : 0;


        html += `

          <div class="stadium-row">

            <div>

              ${STADIUMS[key] || key}

              <span style="color:#7890aa">
                (${s.races}R)
              </span>

            </div>


            <div>
              ${h.toFixed(1)}%
            </div>


            <div>
              ${r.toFixed(1)}%
            </div>

          </div>

        `;

      }

    );

  }


  if(
    records.length === 0
  ){

    html += `

      <div
        class="small"
        style="margin-top:15px"
      >

        まだこの期間の
        Sレース記録はありません。

      </div>

    `;

  }


  area.innerHTML =
    html;

}


/* =========================
   起動
========================= */

document.addEventListener(

  "DOMContentLoaded",

  () => {

    renderStats();

  }

);

</script>
