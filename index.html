<script>
const API_BASE =
  "https://boatraceopenapi.github.io/api/v1";

const ODDS_BASE =
  "https://lamrongol.github.io/BoatraceOdds/v3";

const STADIUMS = {
  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"
};

const WEATHER_NAMES = {
  1:"晴",
  2:"曇",
  3:"雨",
  4:"雪",
  5:"霧"
};

let analyses = [];
let oddsData = null;
let autoUpdateBusy = false;

const $ = id =>
  document.getElementById(id);

const num = (v,d=0) =>
  Number.isFinite(Number(v))
    ? Number(v)
    : d;

const clamp = (v,a,b) =>
  Math.max(a,Math.min(b,v));function todayJST(){
  return new Intl.DateTimeFormat(
    "en-CA",
    {
      timeZone:"Asia/Tokyo",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(new Date());
}

function apiURL(){
  const d = todayJST();

  return `${API_BASE}/${d.slice(0,4)}/${d.replaceAll("-","")}.json`;
}

function oddsURL(){
  const d = todayJST();

  return `${ODDS_BASE}/${d.slice(0,4)}/${d.replaceAll("-","")}.json`;
}

async function fetchToday(){
  const r = await fetch(
    apiURL() + "?t=" + Date.now(),
    {cache:"no-store"}
  );

  if(!r.ok){
    throw new Error(
      "race data " + r.status
    );
  }

  return r.json();
}

async function fetchOdds(){
  try{
    const r = await fetch(
      oddsURL() + "?t=" + Date.now(),
      {cache:"no-store"}
    );

    if(!r.ok){
      return null;
    }

    return await r.json();

  }catch(e){
    console.warn(
      "odds unavailable",
      e
    );

    return null;
  }
}

function flatten(data){
  const out = [];

  const ss =
    data?.programs?.stadiums || {};

  for(
    const [stadiumKey,stadium]
    of Object.entries(ss)
  ){
    for(
      const [raceKey,race]
      of Object.entries(
        stadium?.races || {}
      )
    ){
      if(!race){
        continue;
      }

      out.push({
        ...race,

        stadium_number:
          num(
            race.stadium_number,
            stadiumKey
          ),

        race_number:
          num(
            race.race_number,
            raceKey
          )
      });
    }
  }

  return out;
}

function previewReady(r){
  const racers =
    r?.preview?.racers;

  if(!racers){
    return false;
  }

  for(let i=1;i<=6;i++){
    const x =
      racers[String(i)];

    if(!x){
      return false;
    }

    const ex =
      Number(x.exhibition_time);

    const st =
      Number(x.start_timing);

    if(
      !Number.isFinite(ex) ||
      ex <= 0 ||
      !Number.isFinite(st)
    ){
      return false;
    }
  }

  return true;
}

function closeTimestamp(r){
  if(!r?.closed_at){
    return 0;
  }

  const text =
    String(r.closed_at)
    .replace(" ","T");

  const t =
    new Date(
      text + "+09:00"
    ).getTime();

  return Number.isFinite(t)
    ? t
    : 0;
}

function upcoming(r){
  const t =
    closeTimestamp(r);

  return !t ||
    t > Date.now();
}

function closeTime(r){
  const m =
    String(
      r?.closed_at || ""
    ).match(
      /(\d{2}):(\d{2})/
    );

  return m
    ? `${m[1]}:${m[2]}`
    : "--:--";
}

function remainingTime(r){
  const t =
    closeTimestamp(r);

  if(!t){
    return "--";
  }

  let sec =
    Math.floor(
      (t-Date.now()) / 1000
    );

  if(sec <= 0){
    return "締切";
  }

  const h =
    Math.floor(sec/3600);

  sec %= 3600;

  const m =
    Math.floor(sec/60);

  if(h > 0){
    return `${h}時間${m}分`;
  }

  return `${m}分`;
}

function weatherInfo(r){
  const p =
    r?.preview || {};

  return {
    windSpeed:
      num(p.wind_speed),

    windDirection:
      num(
        p.wind_direction_number
      ),

    wave:
      num(p.wave_height),

    weather:
      num(p.weather_number),

    air:
      num(p.air_temperature),

    water:
      num(p.water_temperature)
  };
}

function scoreBoat(
  racer,
  preview,
  entry
){
  let s = 0;

  const nw =
    num(
      racer?.national_win_rate,
      5
    );

  const n2 =
    num(
      racer?.national_top_2_percent,
      30
    );

  const lw =
    num(
      racer?.local_win_rate,
      nw
    );

  const motor =
    num(
      racer?.motor_top_2_percent,
      30
    );

  const ast =
    num(
      racer?.average_start_timing,
      .18
    );

  const ex =
    num(
      preview?.exhibition_time,
      6.85
    );

  const est =
    num(
      preview?.start_timing,
      ast
    );

  const rank =
    num(
      racer?.rank_number,
      4
    );

  const course =
    num(
      preview?.course_number,
      entry
    );

  s += nw * 8;
  s += n2 * .35;
  s += lw * 4;
  s += motor * .45;

  s +=
    Math.max(
      0,
      (.22-ast)*100
    );

  s +=
    Math.max(
      -10,
      (6.9-ex)*75
    );

  s +=
    Math.max(
      -8,
      (.20-est)*60
    );

  if(rank === 1){
    s += 9;
  }else if(rank === 2){
    s += 5;
  }else if(rank === 3){
    s += 1;
  }else{
    s -= 2;
  }

  s += ({
    1:16,
    2:7,
    3:5,
    4:2,
    5:-1,
    6:-4
  }[course] || 0);

  return s;
}

function exhibitionRank(boats){
  return [...boats]
    .sort(
      (a,b) =>
        num(
          a.preview.exhibition_time,
          99
        )
        -
        num(
          b.preview.exhibition_time,
          99
        )
    )
    .map(x=>x.boat);
}

function startRank(boats){
  return [...boats]
    .sort(
      (a,b) =>
        num(
          a.preview.start_timing,
          9
        )
        -
        num(
          b.preview.start_timing,
          9
        )
    )
    .map(x=>x.boat);
}

function evaluate(r){
  if(!previewReady(r)){
    return null;
  }

  const boats = [];

  for(let i=1;i<=6;i++){
    const racer =
      r?.racers?.[String(i)];

    const preview =
      r?.preview?.racers?.[String(i)];

    if(
      !racer ||
      !preview
    ){
      return null;
    }

    boats.push({
      boat:i,

      score:
        scoreBoat(
          racer,
          preview,
          i
        ),

      racer,
      preview
    });
  }

  boats.sort(
    (a,b) =>
      b.score-a.score
  );

  const g1 =
    boats[0].score
    -
    boats[1].score;

  const w =
    weatherInfo(r);

  const exRanks =
    exhibitionRank(boats);

  const stRanks =
    startRank(boats);

  let rating =
    72 +
    Math.min(
      15,
      Math.max(0,g1*1.4)
    );

  if(
    boats[0].boat === 1
  ){
    rating += 5;
  }

  if(
    exRanks[0] ===
    boats[0].boat
  ){
    rating += 3;
  }

  if(
    stRanks[0] ===
    boats[0].boat
  ){
    rating += 3;
  }

  if(w.windSpeed >= 6){
    rating -= 3;
  }

  if(w.windSpeed >= 9){
    rating -= 5;
  }

  if(w.wave >= 6){
    rating -= 3;
  }

  rating =
    Math.round(
      clamp(
        rating,
        0,
        99
      )
    );

  const stable =
    w.windSpeed < 10 &&
    w.wave < 10 &&
    g1 >= 3;

  return {
    race:r,
    boats,
    rating,

    grade:
      rating >= 82 &&
      stable
        ? "S"
        : "B",

    weather:w,
    exhibitionRank:exRanks,
    startRank:stRanks
  };
}function allCombos(){
  const out = [];

  for(let a=1;a<=6;a++){
    for(let b=1;b<=6;b++){
      if(b===a){
        continue;
      }

      for(let c=1;c<=6;c++){
        if(
          c===a ||
          c===b
        ){
          continue;
        }

        out.push(
          `${a}-${b}-${c}`
        );
      }
    }
  }

  return out;
}

function probabilityMap(boats){
  const raw = {};
  let total = 0;

  for(const x of boats){
    const v =
      Math.exp(
        x.score / 45
      );

    raw[x.boat] = v;
    total += v;
  }

  for(
    const key
    of Object.keys(raw)
  ){
    raw[key] /= total;
  }

  return raw;
}

function comboProbability(
  combo,
  analysis
){
  const p =
    probabilityMap(
      analysis.boats
    );

  const parts =
    combo
    .split("-")
    .map(Number);

  const a =
    parts[0];

  const b =
    parts[1];

  const c =
    parts[2];

  const p1 =
    p[a] || 0;

  const remain1 =
    1-p1;

  const p2 =
    remain1 > 0
      ? (p[b]||0)/remain1
      : 0;

  const remain2 =
    1-p1-(p[b]||0);

  const p3 =
    remain2 > 0
      ? (p[c]||0)/remain2
      : 0;

  return Math.max(
    0,
    p1*p2*p3
  );
}

/*
  オッズJSONの形式が変わっても
  trifectaを探せるよう再帰検索
*/
function findRaceOddsNode(
  root,
  stadium,
  race
){
  let found = null;

  function walk(
    obj,
    inheritedStadium=null,
    inheritedRace=null
  ){
    if(
      found ||
      obj == null ||
      typeof obj !== "object"
    ){
      return;
    }

    const s =
      num(
        obj.stadium_number ??
        obj.stadium ??
        obj.jcd ??
        inheritedStadium,
        -1
      );

    const r =
      num(
        obj.race_number ??
        obj.race ??
        obj.rno ??
        inheritedRace,
        -1
      );

    if(
      s === Number(stadium) &&
      r === Number(race) &&
      (
        obj.trifecta ||
        obj.odds?.trifecta
      )
    ){
      found =
        obj.trifecta
        ? obj
        : obj.odds;

      return;
    }

    if(Array.isArray(obj)){
      for(const v of obj){
        walk(
          v,
          inheritedStadium,
          inheritedRace
        );
      }

      return;
    }

    for(
      const [key,value]
      of Object.entries(obj)
    ){
      let nextStadium =
        inheritedStadium;

      let nextRace =
        inheritedRace;

      if(
        key ===
        String(stadium)
      ){
        nextStadium =
          Number(stadium);
      }

      if(
        nextStadium ===
        Number(stadium) &&
        key === String(race)
      ){
        nextRace =
          Number(race);
      }

      walk(
        value,
        nextStadium,
        nextRace
      );
    }
  }

  walk(root);

  return found;
}

function flattenTrifecta(
  trifecta
){
  const map = {};

  if(
    !trifecta ||
    typeof trifecta !== "object"
  ){
    return map;
  }

  /*
    形式1
    {
      "1-2-3": 8.4
    }
  */
  for(
    const [key,value]
    of Object.entries(trifecta)
  ){
    if(
      /^\d-\d-\d$/.test(key) &&
      Number.isFinite(
        Number(value)
      )
    ){
      map[key] =
        Number(value);
    }
  }

  /*
    形式2
    {
      1:{
        2:{
          3:8.4
        }
      }
    }
  */
  for(let a=1;a<=6;a++){
    const lv1 =
      trifecta[a] ??
      trifecta[String(a)];

    if(
      !lv1 ||
      typeof lv1 !== "object"
    ){
      continue;
    }

    for(let b=1;b<=6;b++){
      if(b===a){
        continue;
      }

      const lv2 =
        lv1[b] ??
        lv1[String(b)];

      if(
        !lv2 ||
        typeof lv2 !== "object"
      ){
        continue;
      }

      for(let c=1;c<=6;c++){
        if(
          c===a ||
          c===b
        ){
          continue;
        }

        const v =
          lv2[c] ??
          lv2[String(c)];

        if(
          Number.isFinite(
            Number(v)
          )
        ){
          map[
            `${a}-${b}-${c}`
          ] = Number(v);
        }
      }
    }
  }

  return map;
}

function getOddsMap(
  stadium,
  race
){
  if(!oddsData){
    return {};
  }

  const node =
    findRaceOddsNode(
      oddsData,
      stadium,
      race
    );

  if(!node){
    return {};
  }

  return flattenTrifecta(
    node.trifecta
  );
}

function oddsRanking(oddsMap){
  return Object.entries(
    oddsMap
  )
  .filter(
    ([combo,odds]) =>
      /^\d-\d-\d$/.test(combo) &&
      Number.isFinite(Number(odds)) &&
      Number(odds) > 0
  )
  .sort(
    (a,b) =>
      Number(a[1]) -
      Number(b[1])
  )
  .map(
    ([combo,odds],index) => ({
      combo,
      odds:Number(odds),
      popularity:index+1
    })
  );
}

function makeTickets(analysis){
  const r =
    analysis.race;

  const oddsMap =
    getOddsMap(
      r.stadium_number,
      r.race_number
    );

  const market =
    oddsRanking(
      oddsMap
    );

  const marketMap =
    new Map(
      market.map(
        x=>[
          x.combo,
          x
        ]
      )
    );

  const scored =
    allCombos()
    .map(combo=>{
      const probability =
        comboProbability(
          combo,
          analysis
        );

      const marketInfo =
        marketMap.get(combo);

      const odds =
        marketInfo?.odds || 0;

      const popularity =
        marketInfo?.popularity || 0;

      const ev =
        odds > 0
          ? probability * odds
          : 0;

      return {
        combo,
        probability,
        odds,
        popularity,
        ev
      };
    })
    .sort(
      (a,b) =>
        b.probability -
        a.probability
    );

  /*
    ==========================
    本命🚤 3点
    ==========================
    AI上位を基本にする。
    市場人気1位は絶対に穴へ送らない。
  */

  const main = [];

  if(market.length){
    const favorite =
      scored.find(
        x=>x.popularity===1
      );

    if(favorite){
      main.push(favorite);
    }
  }

  for(const x of scored){
    if(main.length>=3){
      break;
    }

    if(
      !main.some(
        y=>y.combo===x.combo
      )
    ){
      main.push(x);
    }
  }

  const usedMain =
    new Set(
      main.map(x=>x.combo)
    );

  /*
    ==========================
    狙い🚤 4点
    ==========================
  */

  const targetCandidates =
    scored
    .filter(
      x=>
        !usedMain.has(x.combo)
    )
    .map(x=>{
      let value =
        x.probability;

      if(x.odds > 0){
        value *=
          Math.min(
            3,
            1 + x.odds/30
          );

        if(
          x.popularity >= 4 &&
          x.popularity <= 20
        ){
          value *= 1.15;
        }

        if(x.ev > 1){
          value *= 1.15;
        }
      }

      return {
        ...x,
        targetScore:value
      };
    })
    .sort(
      (a,b) =>
        b.targetScore -
        a.targetScore
    );

  const cover =
    targetCandidates
    .slice(0,4);

  const used =
    new Set([
      ...main.map(x=>x.combo),
      ...cover.map(x=>x.combo)
    ]);

  /*
    ==========================
    穴🚤 3点
    ==========================

    重要：
    人気1位～10位は穴に入れない。
  */

  let holeCandidates;

  if(market.length){
    holeCandidates =
      scored
      .filter(
        x=>
          !used.has(x.combo) &&
          x.popularity >= 11
      )
      .map(x=>({
        ...x,

        holeScore:
          x.probability *
          Math.min(
            x.odds || 1,
            100
          )
      }))
      .sort(
        (a,b) =>
          b.holeScore -
          a.holeScore
      );

  }else{
    holeCandidates =
      scored
      .slice(14)
      .filter(
        x=>
          !used.has(x.combo)
      )
      .map(x=>({
        ...x,
        holeScore:
          x.probability
      }))
      .sort(
        (a,b) =>
          b.holeScore -
          a.holeScore
      );
  }

  const hole =
    holeCandidates
    .slice(0,3);

  /*
    万一3点足りない場合も
    人気1～10位は穴へ入れない
  */
  if(hole.length<3){
    for(const x of scored){
      if(hole.length>=3){
        break;
      }

      if(
        used.has(x.combo) ||
        hole.some(
          y=>y.combo===x.combo
        )
      ){
        continue;
      }

      if(
        x.popularity > 0 &&
        x.popularity <= 10
      ){
        continue;
      }

      hole.push(x);
    }
  }

  return {
    main:main.slice(0,3),
    cover:cover.slice(0,4),
    hole:hole.slice(0,3),
    hasOdds:market.length>0
  };
}

function allocate(ticketSet){
  return {
    main:
      ticketSet.main.map(
        x=>({
          ...x,
          group:"main"
        })
      ),

    cover:
      ticketSet.cover.map(
        x=>({
          ...x,
          group:"cover"
        })
      ),

    hole:
      ticketSet.hole.map(
        x=>({
          ...x,
          group:"hole"
        })
      )
  };
}function ticketRows(arr){
  return arr.map(x=>{

    const oddsText =
      x.odds > 0
        ? `${x.odds.toFixed(1)}倍`
        : "取得なし";

    const rankText =
      x.popularity > 0
        ? `人気${x.popularity}位`
        : "人気順位取得なし";

    const rankClass =
      x.popularity > 0 &&
      x.popularity <= 10
        ? "rank-popular"
        : "rank-hole";

    return `
      <div class="ticket">

        <span class="combo">
          ${x.combo}
        </span>

        <span class="money">
          ${oddsText}
        </span>

        <div class="ticket-sub">

          AI推定
          ${(x.probability*100).toFixed(1)}%

          ／

          <span class="${rankClass}">
            ${rankText}
          </span>

        </div>

      </div>
    `;
  }).join("");
}

function judgingBasis(
  analysis,
  hasOdds
){
  const w =
    analysis.weather;

  const top =
    analysis.boats
    .slice(0,3)
    .map(
      x=>`${x.boat}号艇`
    )
    .join("・");

  const ex =
    analysis.exhibitionRank
    .slice(0,3)
    .map(
      x=>`${x}号艇`
    )
    .join("・");

  const st =
    analysis.startRank
    .slice(0,3)
    .map(
      x=>`${x}号艇`
    )
    .join("・");

  return `
    <div class="reason">

      <b>判断基準</b><br>

      ・AI総合上位：
      ${top}<br>

      ・展示上位：
      ${ex}<br>

      ・展示ST上位：
      ${st}<br>

      ・風速：
      ${w.windSpeed}m<br>

      ・波高：
      ${w.wave}cm<br>

      ・3連単人気：
      ${
        hasOdds
          ? "取得済み・買い目分類へ反映"
          : "取得できないためAI順位で分類"
      }

    </div>
  `;
}

function display(){
  const s =
    analyses.filter(
      x=>x.grade==="S"
    );

  if(!s.length){
    $("results").innerHTML = `
      <div class="empty">

        現在表示できる
        S評価レースはありません。

        <br><br>

        <small>
        展示・ST・水面条件が
        揃うまでAIは見送ります。
        </small>

      </div>
    `;

    return;
  }

  $("results").innerHTML =
    s.map(
      raceHTML
    ).join("");

  document
    .querySelectorAll(
      "[data-detail]"
    )
    .forEach(button=>{

      button.onclick = ()=>{

        const detail =
          $(
            button.dataset.detail
          );

        const open =
          detail.style.display
          === "block";

        detail.style.display =
          open
            ? "none"
            : "block";

        button.textContent =
          open
            ? "買い目を見る ▼"
            : "買い目を閉じる ▲";
      };
    });
}

function analyzeRaces(races){
  const arr = [];

  for(const r of races){

    if(
      !upcoming(r) ||
      !previewReady(r)
    ){
      continue;
    }

    const analysis =
      evaluate(r);

    if(
      analysis?.grade === "S"
    ){
      arr.push(
        analysis
      );
    }
  }

  arr.sort(
    (a,b)=>
      b.rating-a.rating
  );

  analyses =
    arr;

  display();

  return arr;
}

async function autoRefresh(){
  if(autoUpdateBusy){
    return;
  }

  autoUpdateBusy = true;

  const status =
    $("status");

  try{

    status.textContent =
      "最新データと3連単人気を取得しています…";

    const results =
      await Promise.all([
        fetchToday(),
        fetchOdds()
      ]);

    const raceData =
      results[0];

    oddsData =
      results[1];

    const races =
      flatten(
        raceData
      );

    const arr =
      analyzeRaces(
        races
      );

    if(oddsData){

      status.innerHTML =
        `自動更新完了　🔥 S評価：${arr.length}レース`
        +
        `<br>`
        +
        `3連単人気データ：取得済み`;

    }else{

      status.innerHTML =
        `自動更新完了　🔥 S評価：${arr.length}レース`
        +
        `<br>`
        +
        `3連単人気データ：未取得 → AI順位で安全分類`;

    }

  }catch(e){

    console.error(e);

    status.textContent =
      "データ取得に失敗しました。通信状態を確認してください。";

  }finally{

    autoUpdateBusy =
      false;
  }
}

/*
  残り時間表示を1分ごとに更新
*/
setInterval(
  ()=>{
    if(analyses.length){
      display();
    }
  },
  60000
);

/*
  レース情報・オッズを1分ごとに再確認
*/
setInterval(
  ()=>{
    if(!document.hidden){
      autoRefresh();
    }
  },
  60000
);

window.addEventListener(
  "focus",
  ()=>{
    autoRefresh();
  }
);

document.addEventListener(
  "visibilitychange",
  ()=>{
    if(!document.hidden){
      autoRefresh();
    }
  }
);

autoRefresh();

</script>
