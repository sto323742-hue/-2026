<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">

<title>BOAT RACE AI予想 Ver.3</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  "Hiragino Kaku Gothic ProN",
  "Yu Gothic",
  sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:820px;
  margin:auto;
  padding:16px 10px 100px;
}

.header{
  text-align:center;
  padding:10px 4px 18px;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:.4px;
}

.brand .gold,
.ver{
  color:#efc559;
}

.ver{
  font-size:12px;
  margin-left:5px;
}

.sub{
  margin-top:6px;
  color:#9d9d9d;
  font-size:12px;
}

.panel,
.race{
  background:linear-gradient(180deg,#111,#090909);
  border:1px solid #765b19;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
}

.panel-title{
  color:#f3ca5b;
  font-weight:950;
  font-size:19px;
  margin-bottom:13px;
}

select,
input[type=date]{
  width:100%;
  height:51px;
  border:1px solid #775d1c;
  border-radius:12px;
  background:#080808;
  color:#fff;
  padding:0 12px;
  font-size:16px;
}

.status{
  margin-top:11px;
  padding:11px;
  border-radius:12px;
  background:#080808;
  border:1px solid #26210f;
  color:#c8c0a8;
  font-size:12px;
  line-height:1.7;
}

.notice{
  margin-top:8px;
  color:#777;
  font-size:10px;
  line-height:1.6;
}

.race{
  border-color:#6f571d;
}

.race-head,
.ai-top,
.total,
.profit{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.race-name{
  font-size:20px;
  font-weight:950;
}

.race-meta{
  font-size:11px;
  color:#aaa;
  margin-top:4px;
  line-height:1.6;
}

.smark{
  width:49px;
  height:49px;
  border:1px solid #f1c95e;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f1c95e;
  font-size:23px;
  font-weight:950;
}

.ai-box{
  margin-top:10px;
  background:#080808;
  border:1px solid #29220e;
  border-radius:12px;
  padding:11px;
}

.ai-score{
  font-size:23px;
  color:#f2cd67;
  font-weight:950;
}

.candidate-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}

.candidate{
  background:#111;
  border-radius:9px;
  text-align:center;
  padding:8px 3px;
}

.candidate small,
.weather-item small{
  display:block;
  color:#8d8d8d;
  font-size:9px;
}

.candidate b{
  font-size:17px;
}

.weather-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.weather-item{
  background:#111;
  border-radius:9px;
  padding:8px 4px;
  text-align:center;
}

.weather-item b{
  display:block;
  margin-top:2px;
  font-size:13px;
}

.scenario-box{
  margin-top:10px;
  padding:11px;
  border-radius:12px;
  border:1px solid #584516;
  background:linear-gradient(135deg,#151005,#090909);
}

.scenario-title{
  color:#f2cd67;
  font-size:13px;
  font-weight:950;
  margin-bottom:8px;
}

.scenario-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:10px;
  border-radius:10px;
  background:#111;
  border:1px solid #382d12;
}

.scenario-main strong,
.scenario-main span{
  color:#ffd971;
  font-weight:950;
}

.scenario-main strong{
  font-size:17px;
}

.scenario-main span{
  font-size:20px;
}

.scenario-list{
  margin-top:6px;
}

.scenario-row{
  display:grid;
  grid-template-columns:1fr 60px;
  gap:6px;
  padding:7px 8px;
  border-bottom:1px solid #26200e;
  font-size:11px;
}

.scenario-row:last-child{
  border-bottom:0;
}

.scenario-row b{
  text-align:right;
  color:#e8ca73;
}

.scenario-note{
  margin-top:7px;
  color:#8e846b;
  font-size:9px;
  line-height:1.55;
}

.gold-btn,
.toggle{
  width:100%;
  border-radius:13px;
  font-weight:900;
}

.gold-btn{
  min-height:44px;
  margin-top:10px;
  background:#17140d;
  border:1px solid #6e581d;
  color:#f0cc68;
}

.toggle{
  min-height:45px;
  margin-top:8px;
  background:#131313;
  border:1px solid #55451a;
  color:#edcc70;
}

.detail{
  display:none;
  margin-top:8px;
}

/* ========================================
   買い目 本線・狙い・穴 横3列表示
======================================== */

.bet-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  align-items:start;
}

.bet-col{
  min-width:0;
  border:1px solid #302813;
  border-radius:12px;
  overflow:hidden;
  background:#090909;
}

/* 本線 */
.bet-col.main-col{
  border-color:#285e91;
  background:
    linear-gradient(
      180deg,
      #071425,
      #090909
    );
}

/* 狙い */
.bet-col.cover-col{
  border-color:#65562d;
  background:
    linear-gradient(
      180deg,
      #171205,
      #090909
    );
}

/* 穴 */
.bet-col.hole-col{
  border-color:#8a4b22;
  background:
    linear-gradient(
      180deg,
      #211006,
      #090909
    );
}

.bet-head{
  margin:0;
  padding:9px 4px;
  border-radius:0;
  background:#0b0b0b;
  border:0;
  border-bottom:1px solid #302813;
  font-weight:950;
  text-align:center;
  font-size:12px;
  white-space:nowrap;
}

.bet-head.main{
  color:#71baff;
}

.bet-head.cover{
  color:#e8d7a4;
}

.bet-head.hole{
  color:#ff9b52;
}

.ticket{
  display:block;
  padding:8px 5px;
  border-bottom:1px solid #24200f;
  background:transparent;
  text-align:center;
}

.ticket:last-child{
  border-bottom:0;
}

.combo{
  display:block;
  font-weight:950;
  letter-spacing:.4px;
  font-size:15px;
  white-space:nowrap;
}

.money{
  display:block;
  margin-top:3px;
  color:#efd16e;
  font-weight:900;
  font-size:11px;
  white-space:nowrap;
}

.ticket-sub{
  display:block;
  margin-top:4px;
  color:#8f8f8f;
  font-size:7px;
  line-height:1.35;
  word-break:break-word;
}

.total{
  border-top:1px solid #6d551c;
  margin-top:9px;
  padding-top:9px;
  font-weight:950;
}

/* iPhone等の小さい画面でも横3列を維持 */
@media(max-width:420px){

  .bet-grid{
    gap:4px;
  }

  .bet-head{
    font-size:11px;
    padding:8px 2px;
  }

  .ticket{
    padding:7px 3px;
  }

  .combo{
    font-size:14px;
  }

  .money{
    font-size:10px;
  }

  .ticket-sub{
    font-size:6.5px;
  }
}

.logic,
.reason{
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:#0a0a0a;
  color:#aaa;
  font-size:10px;
  line-height:1.65;
}

.reason{
  border:1px solid #463814;
  background:#0b0905;
  color:#c8bb96;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.menu button{
  min-height:48px;
  border-radius:11px;
  border:1px solid #55451a;
  background:#111;
  color:#e8ca73;
  font-weight:900;
}

.stats{
  display:none;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.tab{
  height:43px;
  border:1px solid #55451a;
  background:#131313;
  color:#ddd;
  border-radius:10px;
  font-weight:900;
}

.tab.active{
  background:
    linear-gradient(
      135deg,
      #f4d070,
      #c8901f
    );
  color:#070707;
}

.range{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.range.show{
  display:grid;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:10px;
}

.stat{
  background:#090909;
  border:1px solid #2c2510;
  border-radius:11px;
  padding:11px;
}

.stat small{
  display:block;
  color:#aa9e78;
  font-size:10px;
}

.stat b{
  display:block;
  margin-top:3px;
  font-size:19px;
}

.green{
  color:#58dc8d;
}

.red{
  color:#ff6a6a;
}

.profit{
  margin-top:9px;
  padding:14px;
  border:1px solid #8a6719;
  border-radius:12px;
  background:
    linear-gradient(
      90deg,
      #171005,
      #080808
    );
}

.profit strong{
  font-size:26px;
  color:#f1cc65;
}

.section-title{
  margin:16px 0 8px;
  color:#f2cd68;
  font-weight:950;
}

.history-wrap,
.venue-wrap{
  display:none;
}

.history-controls{
  margin:10px 0;
}

.venue-tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:2px 0 8px;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}

.venue-tabs::-webkit-scrollbar{
  display:none;
}

.venue-chip{
  flex:0 0 auto;
  min-width:67px;
  height:40px;
  padding:0 11px;
  border:1px solid #55451a;
  border-radius:10px;
  background:#111;
  color:#ddd;
  font-size:12px;
  font-weight:900;
}

.venue-chip.active{
  background:
    linear-gradient(
      135deg,
      #f4d070,
      #c8901f
    );
  color:#080808;
  border-color:#e9c057;
}

.result-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin:4px 0 9px;
}

.result-chip{
  min-height:42px;
  border-radius:10px;
  border:1px solid #4a421e;
  background:#111;
  color:#ddd;
  font-size:11px;
  font-weight:900;
}

.result-chip.active.all{
  background:#d5aa3c;
  color:#080808;
}

.result-chip.active.hit-only{
  border-color:#35c77b;
  background:#0c2b1d;
  color:#65eaa5;
}

.result-chip.active.miss-only{
  border-color:#d85050;
  background:#2d1010;
  color:#ff8888;
}

.history-caption{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:7px 1px;
  color:#9b906f;
  font-size:10px;
}

.history-scroll{
  overflow-x:auto;
  border:1px solid #342b12;
  border-radius:12px;
}

.history-table{
  min-width:940px;
  width:100%;
  border-collapse:collapse;
  background:#080808;
  font-size:11px;
}

.history-table th,
.history-table td{
  padding:9px 7px;
  border-bottom:1px solid #25200f;
  border-right:1px solid #201c0e;
  text-align:center;
  white-space:nowrap;
}

.history-table th{
  color:#d8bb65;
  background:#0d0c08;
}

.hit{
  color:#58dc8d;
  font-weight:950;
}

.miss{
  color:#ff6a6a;
  font-weight:950;
}

.odds{
  color:#f0d06c;
  font-weight:950;
}

.roi{
  color:#58dc8d;
  font-weight:950;
}

.scenario-mini{
  color:#e8ca73;
  font-weight:900;
}

.venue-row{
  display:grid;
  grid-template-columns:
    1.1fr .7fr .8fr .9fr 1fr;
  gap:5px;
  padding:9px 3px;
  border-bottom:1px solid #26200e;
  font-size:11px;
}

.footer{
  text-align:center;
  color:#686868;
  font-size:10px;
  line-height:1.7;
  margin-top:24px;
}

.quick{
  position:fixed;
  right:9px;
  bottom:
    calc(
      11px +
      env(safe-area-inset-bottom)
    );
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:20;
}

.quick button{
  height:42px;
  min-width:75px;
  border:1px solid #745a19;
  border-radius:999px;
  background:#111;
  color:#f0cc68;
  font-weight:900;
}

.empty{
  padding:22px 10px;
  text-align:center;
  color:#aaa;
  background:#0d0d0d;
  border:1px solid #302812;
  border-radius:14px;
  margin-bottom:12px;
}

.learning-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:9px;
}

.learning-card{
  background:#090909;
  border:1px solid #342b12;
  border-radius:11px;
  padding:10px;
}

.learning-card small{
  display:block;
  color:#aa9e78;
  font-size:9px;
}

.learning-card b{
  display:block;
  margin-top:4px;
  font-size:17px;
}

.learning-summary{
  margin-top:10px;
  padding:12px;
  border:1px solid #5c4918;
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      #151005,
      #090909
    );
  font-size:11px;
  line-height:1.7;
  color:#cfc3a0;
}

.progress-list{
  display:grid;
  gap:7px;
  margin-top:9px;
}

.progress-item{
  background:#090909;
  border:1px solid #2c2510;
  border-radius:11px;
  padding:9px;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
}

.progress-track{
  height:7px;
  background:#1c1a13;
  border-radius:999px;
  overflow:hidden;
  margin-top:7px;
}

.progress-fill{
  height:100%;
  background:
    linear-gradient(
      90deg,
      #b77a18,
      #f0cc68
    );
  border-radius:999px;
}

.learn-ready{
  color:#58dc8d;
  font-weight:950;
}

.learn-mid{
  color:#f0cc68;
  font-weight:950;
}

.learn-low{
  color:#aaa;
  font-weight:900;
}

.proximity{
  font-weight:950;
}

.prox-exact{
  color:#58dc8d;
}

.prox-near{
  color:#f0cc68;
}

.prox-mid{
  color:#71baff;
}

.prox-low{
  color:#aaa;
}

.learning-note{
  margin-top:8px;
  color:#81775d;
  font-size:9px;
  line-height:1.6;
}

.learning-accordion{
  margin-top:14px;
}

.accordion-head{
  width:100%;
  min-height:48px;
  border:0;
  border-bottom:1px solid #302812;
  background:transparent;
  color:#f2cd68;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  text-align:left;
  font-weight:950;
  padding:8px 2px;
}

.accordion-head span:last-child{
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  border:1px solid #5b4717;
  flex:0 0 auto;
}

.accordion-body{
  display:none;
}

.accordion-body.open{
  display:block;
}

</style>
</head>

<body>

<div class="wrap" id="top">

<header class="header">

  <div class="brand">
    🚤
    <span class="gold">
      BOAT RACE
    </span>
    AI予想
    <span class="ver">
      Ver.3
    </span>
  </div>

  <div class="sub">
    展示予測 × 学習データ ×
    不的中接近度 × 会場別100R学習
  </div>

</header>


<section class="panel">

  <div class="panel-title">
    本日のS評価レース
  </div>

  <div
    class="status"
    id="status"
  >
    最新データを自動取得しています…
  </div>

  <div class="notice">
    本線3点・狙い4点・穴3点＝合計10点。<br>
    本線＝AI推定確率上位、
    狙い＝展開・攻め役・期待値重視、
    穴＝高配当シナリオ。<br>
    展示情報が6艇分揃ったレースのみ
    S評価判定します。
  </div>

</section>


<div id="results"></div>


<section class="panel">

  <div class="panel-title">
    操作メニュー
  </div>

  <div class="menu">

    <button id="statsOpen">
      📊 成績
    </button>

    <button id="historyOpen">
      📋 履歴
    </button>

    <button id="venueOpen">
      🏁 会場別
    </button>

  </div>

</section>


<section
  class="panel stats"
  id="statsSection"
>

  <div class="panel-title">
    📊 AI成績
  </div>

  <div class="tabs">

    <button
      class="tab"
      data-period="day"
    >
      今日
    </button>

    <button
      class="tab"
      data-period="custom"
    >
      期間指定
    </button>

    <button
      class="tab active"
      data-period="all"
    >
      全期間
    </button>

  </div>


  <div
    class="range"
    id="rangeBox"
  >

    <input
      type="date"
      id="fromDate"
    >

    <input
      type="date"
      id="toDate"
    >

  </div>


  <div id="stats"></div>


  <div class="learning-accordion">

    <button
      class="accordion-head"
      data-accordion="learningStats"
    >

      <span>
        🧠 不的中接近度分析
      </span>

      <span>
        ▲
      </span>

    </button>

    <div
      class="accordion-body open"
      id="learningStats"
    >
    </div>

  </div>


  <div class="learning-accordion">

    <button
      class="accordion-head"
      data-accordion="learningProgress"
    >

      <span>
        📈 会場別 学習進捗
        （100R基準）
      </span>

      <span>
        ▲
      </span>

    </button>

    <div
      class="accordion-body open"
      id="learningProgress"
    >
    </div>

  </div>


  <div class="section-title">
    レース別結果
  </div>

  <button
    class="toggle"
    id="historyToggle"
  >
    一覧を表示
  </button>

  <div
    class="history-wrap"
    id="historyWrap"
  >
    <div id="history"></div>
  </div>


  <div class="section-title">
    会場別成績
  </div>

  <button
    class="toggle"
    id="venueToggle"
  >
    会場別成績を表示
  </button>

  <div
    class="venue-wrap"
    id="venueWrap"
  >
    <div id="venueStats"></div>
  </div>

</section>


<div class="quick">

  <button id="qStats">
    📊 成績
  </button>

  <button id="qTop">
    ↑ 上へ
  </button>

</div>


<div class="footer">

  AI予想は過去・当日データから
  算出した参考情報です。<br>

  購入判断はご自身の責任でお願いします。

</div>

</div>


<script>

const API =
  'https://boatraceopenapi.vercel.app/api/races';

const STORAGE_KEY =
  'boat_ai_gold_v1_records';

const UI_STATE_KEY =
  'boat_ai_gold_ui_state_v1';

const MODEL_NAME =
  'gold-v3-learning-proximity-venue100';

const EVALUATION_STAKE =
  1000;

const VENUE_TARGET =
  100;

let analyses = [];

let lastDataSignature = '';

let autoUpdateBusy = false;

let period = 'all';

let historyVenue = 'all';

let historyResult = 'all';


const STADIUMS = {

  '01':'桐生',
  '02':'戸田',
  '03':'江戸川',
  '04':'平和島',
  '05':'多摩川',

  const m =
    String(v || '')
      .match(/\d/g);

  return m
    ? m.slice(0,3).map(Number)
    : [];

}


function permutationDistance(
  predicted,
  actual
){

  const p =
    parseCombo(predicted);

  const a =
    parseCombo(actual);

  if(
    p.length !== 3 ||
    a.length !== 3
  ){

    return {
      score:0,
      type:'invalid'
    };

  }


  if(
    p.join('-') ===
    a.join('-')
  ){

    return {
      score:100,
      type:'exact'
    };

  }


  const sameSet =
    [...p]
      .sort()
      .join('-') ===
    [...a]
      .sort()
      .join('-');


  if(sameSet){

    return {
      score:85,
      type:'same3'
    };

  }


  let samePosition = 0;

  for(let i=0;i<3;i++){

    if(p[i] === a[i]){
      samePosition++;
    }

  }


  const common =
    p.filter(
      x => a.includes(x)
    ).length;


  if(
    common === 2 &&
    samePosition >= 2
  ){

    return {
      score:75,
      type:'onePositionMiss'
    };

  }


  if(common === 2){

    return {
      score:65,
      type:'same2'
    };

  }


  if(common === 1){

    return {
      score:35,
      type:'same1'
    };

  }


  return {
    score:0,
    type:'far'
  };

}


function analyzePredictionCloseness(
  rec,
  result
){

  const tickets =
    Array.isArray(rec?.tickets)
      ? rec.tickets
      : [];


  let best = {

    score:0,
    type:'far',
    combo:'',
    group:''

  };


  for(const t of tickets){

    const d =
      permutationDistance(
        t.combo,
        result
      );


    if(d.score > best.score){

      best = {

        score:d.score,
        type:d.type,
        combo:t.combo,
        group:t.group || ''

      };

    }

  }


  const label =

    best.score === 100
      ? '的中'

      : best.type === 'same3'
      ? '3艇一致・順番違い'

      : best.type === 'onePositionMiss'
      ? '着順1か所だけ外れ'

      : best.type === 'same2'
      ? '2艇一致'

      : best.type === 'same1'
      ? '1艇一致'

      : '完全外れ';


  return {

    ...best,
    label

  };

}


function backfillLearningRecords(){

  const rs =
    records();

  let changed =
    false;


  for(const rec of rs){

    if(
      !rec.learningSnapshot &&
      Array.isArray(rec.tickets) &&
      rec.tickets.length
    ){

      rec.learningSnapshot = {

        model:
          rec.model ||
          MODEL_NAME,

        savedAt:
          rec.savedAt ||
          '',

        rating:
          num(rec.rating),

        grade:
          rec.grade ||
          'S',

        tickets:
          rec.tickets.map(
            t => ({

              combo:t.combo,

              group:
                t.group || '',

              probability:
                num(t.probability),

              special:
                !!t.special,

              money:
                num(t.money)

            })
          ),

        predictionMeta:
          rec.predictionMeta ||
          null

      };

      changed =
        true;

    }


    if(
      rec.done &&
      rec.result &&
      !rec.proximity &&
      Array.isArray(rec.tickets) &&
      rec.tickets.length
    ){

      rec.proximity =
        analyzePredictionCloseness(
          rec,
          rec.result
        );

      changed =
        true;

    }

  }


  if(changed){

    save(rs);

  }

}

function racerScore(racer){

  const rank =
    String(
      racer?.class ||
      racer?.rank ||

    ).toUpperCase();


  const rankScore =

    rank === 'A1'
      ? 18

      : rank === 'A2'
      ? 12

      : rank === 'B1'
      ? 6

      : 2;


  const win =
    num(
      racer?.rate_in_all_stadium,
      num(
        racer?.win_rate,
        5
      )
    );


  const motor =
    num(
      racer?.motor_trifecta_rate,
      num(
        racer?.motor_2_rate,
        30
      )
    );


  return (
    rankScore +
    win*2.3 +

  );

function boatBaseScore(
  racer,
  preview,
  boat
){

  const course =
    num(
      preview?.course_number,
      boat
    );


  const courseBonus = {

    1:16,
    2:8,
    3:5,
    4:3,
    5:1,
    6:-1

  };


  const ex =
    num(
      preview?.exhibition_time,
      6.9
    );


  const st =
    num(
      preview?.start_timing,
      .20
    );


  let score =
    racerScore(racer);


  score +=
    courseBonus[course] || 0;


  score +=
    (6.9-ex)*26;


  score +=
    (.20-st)*28;


  return score;

}

function tacticFor(
  boat,
  course
){

  if(course === 1){
    return '逃げ';
  }

  if(course === 2){
    return '差し';
  }

  if(
    course === 3 ||
    course === 4
  ){

  }

  if(course >= 5){

  }

  return '自在';

}


function buildScenario(
  boats,
  weather
){

  const raw =
    boats.map(x => {

      const course =
        num(
          x.preview?.course_number,
          x.boat
        );


      const st =
        num(
          x.preview?.start_timing,
          .20
        );


      const ex =
        num(
          x.preview?.exhibition_time,
          6.9
        );


      let attack =
        x.score;


      if(course === 1){
        attack += 10;
      }


      if(
        course === 3 ||
        course === 4
      ){

        attack +=
          Math.max(
            0,
            (.18-st)*35
          );

      }


      if(ex <= 6.75){
        attack += 4;
      }


      if(weather.windSpeed >= 5){

        if(course === 1){
          attack -= 3;
        }

        if(
          course === 3 ||
          course === 4
        ){
          attack += 2;
        }

      }


      if(weather.wave >= 4){

        if(course === 1){
          attack -= 2;
        }

      }


      return {

        boat:x.boat,
        course,
        tactic:
          tacticFor(
            x.boat,
            course
          ),
        attack

      };

    });


  const max =
    Math.max(
      ...raw.map(x=>x.attack)
    );


  const exp =
    raw.map(
      x =>
        Math.exp(
          (x.attack-max)/9
        )
    );


  const sum =
    exp.reduce(
      (a,b)=>a+b,
      0
    ) || 1;


  const candidates =
    raw
      .map(
        (x,i)=>({

          ...x,

          probability:
            exp[i]/sum

        })
      )
      .sort(
        (a,b)=>
          b.probability-
          a.probability
      );


  const attacker =
    candidates.find(
      x =>
        (
          x.course === 3 ||
          x.course === 4
        ) &&
        x.probability >= .12
    ) ||
    candidates[1] ||
    candidates[0];


  return {

    top:
      candidates[0],

    attacker,

    candidates

  };

}


function evaluate(r){

  const racers =
    r?.racers || {};


  const previews =
    r?.preview?.racers || {};


  const boats = [];


  for(let i=1;i<=6;i++){

    const racer =
      racers[String(i)];


    const preview =
      previews[String(i)];


    if(
      !racer ||
      !preview
    ){

      return null;

    }


    boats.push({

      boat:i,
      racer,
      preview,

      score:
        boatBaseScore(
          racer,
          preview,
          i
        )

    });

  }


  const weather =
    weatherInfo(r);


  const exSorted =
    [...boats]
      .sort(
        (a,b)=>
          num(
            a.preview?.exhibition_time,
            99
          ) -
          num(
            b.preview?.exhibition_time,
            99
          )
      );


  const stSorted =
    [...boats]
      .sort(
        (a,b)=>
          num(
            a.preview?.start_timing,
            99
          ) -
          num(
            b.preview?.start_timing,
            99
          )
      );


  const exRank =
    new Map(
      exSorted.map(
        (x,i)=>[
          x.boat,
          i+1
        ]
      )
    );


  const stRank =
    new Map(
      stSorted.map(
        (x,i)=>[
          x.boat,
          i+1
        ]
      )
    );


  for(const x of boats){

    x.exRank =
      exRank.get(x.boat);


    x.stRank =
      stRank.get(x.boat);


    if(x.exRank === 1){
      x.score += 7;
    }

    if(x.exRank === 2){
      x.score += 4;
    }

    if(x.stRank === 1){
      x.score += 6;
    }

    if(x.stRank === 2){
      x.score += 3;
    }

  }


  boats.sort(
    (a,b)=>
      b.score-a.score
  );


  const scenario =
    buildScenario(
      boats,
      weather
    );


  const courseChanges =
    boats.filter(
      x =>
        num(
          x.preview?.course_number,
          x.boat
        ) !== x.boat
    );


  const top =
    boats[0];


  const second =
    boats[1];


  const third =
    boats[2];


  const gap1 =
    top.score -
    second.score;


  const gap2 =
    second.score -
    third.score;


  let rating =
    60;


  rating +=
    Math.min(
      17,
      gap1*1.7
    );


  rating +=
    Math.min(
      7,
      Math.max(
        0,
        gap2
      )*.7
    );


  if(top.boat === 1){
    rating += 6;
  }


  if(top.exRank <= 2){
    rating += 4;
  }


  if(top.stRank <= 2){
    rating += 4;
  }


  if(
    scenario.top.boat ===
    top.boat
  ){

    rating += 5;

  }


  const topScenario =
    scenario.top.probability;


  const secondScenario =
    scenario.candidates[1]
      ?.probability || 0;


  if(
    topScenario -
    secondScenario >
    .10
  ){

    rating += 4;

  }


  if(weather.windSpeed >= 6){
    rating -= 7;
  }


  if(weather.wave >= 5){
    rating -= 6;
  }


  if(courseChanges.length >= 3){
    rating -= 6;
  }


  if(topScenario < .24){
    rating -= 7;
  }


  rating =
    Math.round(
      clamp(
        rating,
        0,
        99
      )
    );


  const stableWater =
    weather.windSpeed <= 6 &&
    weather.wave <= 5;


  const stableEntry =
    courseChanges.length <= 3;


  const clear =
    gap1 >= 4 ||
    topScenario >= .28;


  const grade =
    (
      rating >= 78 &&
      stableWater &&
      stableEntry &&
      clear
    )
      ? 'S'
      : 'A';


  const reasons = [];


  reasons.push(
    `${top.boat}号艇を総合1位評価`
  );


  if(top.exRank <= 2){

    reasons.push(
      `${top.boat}号艇は展示タイム上位`
    );

  }


  if(top.stRank <= 2){

    reasons.push(
      `${top.boat}号艇は展示ST上位`
    );

  }


  if(scenario?.attacker){

    reasons.push(
      `攻め役候補は${scenario.attacker.boat}号艇 ${scenario.attacker.tactic}`
    );

  }


  if(courseChanges.length){

    reasons.push(
      `進入変化${courseChanges.length}艇を補正`
    );

  }


  if(
    weather.windSpeed >= 4 ||
    weather.wave >= 3
  ){

    reasons.push(
      `風${weather.windSpeed}m・波${weather.wave}cmを水面補正`
    );

  }


  return {

    race:r,
    boats,
    rating,
    grade,
    weather,
    scenario,
    reasons,

    exhibitionRank:
      exSorted.map(
        x=>x.boat
      ),

    startRank:
      stSorted.map(
        x=>x.boat
      ),

    courseChanges

  };

}function probabilityMap(boats){

  const raw = {};
  let total = 0;

  for(const x of boats){

    const v =
      Math.exp(
        x.score / 45
      );

    raw[x.boat] = v;
    total += v;

  }

  for(const k of Object.keys(raw)){

    raw[k] /= total || 1;

  }

  return raw;

}


function allCombos(){

  const out = [];

  for(let a=1;a<=6;a++){

    for(let b=1;b<=6;b++){

      if(b === a){
        continue;
      }

      for(let c=1;c<=6;c++){

        if(
          c === a ||
          c === b
        ){
          continue;
        }

        out.push(
          `${a}-${b}-${c}`
        );

      }

    }

  }

  return out;

}


function baseComboProbability(
  combo,
  boats
){

  const p =
    probabilityMap(boats);

  const a =
    combo
      .split('-')
      .map(Number);


  if(a.length !== 3){
    return 0;
  }


  const p1 =
    p[a[0]] || 0;


  const remain1 =
    1-p1;


  const p2 =
    remain1 > 0
      ? (p[a[1]] || 0) / remain1
      : 0;


  const remain2 =
    1 -
    p1 -
    (p[a[1]] || 0);


  const p3 =
    remain2 > 0
      ? (p[a[2]] || 0) / remain2
      : 0;


  return Math.max(
    0,
    p1*p2*p3
  );

}


function scenarioFirstProbability(
  analysis,
  boat
){

  const found =
    analysis?.scenario?.candidates
      ?.find(
        x => x.boat === boat
      );


  return found
    ? num(found.probability,1/6)
    : 1/6;

}


function comboRawWeight(
  combo,
  analysis
){

  const head =
    Number(
      combo.split('-')[0]
    );


  const base =
    baseComboProbability(
      combo,
      analysis.boats
    );


  const scenarioHead =
    scenarioFirstProbability(
      analysis,
      head
    );


  const factor =
    clamp(
      Math.pow(
        scenarioHead/(1/6),
        .45
      ),
      .55,
      1.70
    );


  return base*factor;

}


function buildComboProbabilities(
  analysis
){

  const combos =
    allCombos();


  const weighted =
    combos.map(
      combo => ({

        combo,

        weight:
          comboRawWeight(
            combo,
            analysis
          )

      })
    );


  const total =
    weighted.reduce(
      (s,x)=>s+x.weight,
      0
    ) || 1;


  return weighted.map(
    x => ({

      combo:x.combo,

      probability:
        x.weight/total

    })
  );

}


function comboProbability(
  combo,
  analysis
){

  const list =
    buildComboProbabilities(
      analysis
    );


  return (
    list.find(
      x => x.combo === combo
    )?.probability || 0
  );

}


function makeTickets(analysis){

  const scored =
    buildComboProbabilities(
      analysis
    )
    .sort(
      (a,b)=>
        b.probability-
        a.probability
    );


  /*
   ==========================
   本線3点
   AI推定確率上位
   ==========================
  */

  const main =
    scored
      .slice(0,3)
      .map(
        x => x.combo
      );


  const usedMain =
    new Set(main);


  const topBoat =
    analysis.boats[0]?.boat;


  const top3 =
    analysis.boats
      .slice(0,3)
      .map(
        x => x.boat
      );


  const attacker =
    analysis.scenario
      ?.attacker
      ?.boat;


  const topBoats =
    analysis.boats
      .slice(0,4)
      .map(
        x => x.boat
      );


  /*
   ==========================
   狙い4点
   展開＋期待値重視
   ==========================
  */

  const targetCandidates =
    scored
      .filter(
        x =>
          !usedMain.has(
            x.combo
          )
      )
      .map(
        (x,index)=>{

          const p =
            x.combo
              .split('-')
              .map(Number);


          const firstScenario =
            scenarioFirstProbability(
              analysis,
              p[0]
            );


          const nonFavorite =
            p[0] !== topBoat
              ? 1.18
              : 1;


          const attackerBonus =
            attacker &&
            p.includes(attacker)
              ? 1.12
              : 1;


          const spreadBonus =
            top3.includes(p[1]) &&
            top3.includes(p[2])
              ? 1.06
              : 1;


          const rankBonus =
            index >= 2
              ? 1.05
              : 1;


          return {

            ...x,

            targetScore:
              x.probability *
              (
                1 +
                firstScenario*1.15
              ) *
              nonFavorite *
              attackerBonus *
              spreadBonus *
              rankBonus

          };

        }
      )
      .sort(
        (a,b)=>
          b.targetScore-
          a.targetScore
      );


  const cover =
    targetCandidates
      .slice(0,4)
      .map(
        x => x.combo
      );


  const used =
    new Set([
      ...main,
      ...cover
    ]);


  /*
   ==========================
   特殊穴 ★
   攻め役連動
   ==========================
  */

  let special =
    null;


  if(attacker){

    const specialCandidates =
      scored.filter(
        x => {

          if(
            used.has(
              x.combo
            )
          ){
            return false;
          }


          const p =
            x.combo
              .split('-')
              .map(Number);


          return (
            p[0] === attacker &&
            (
              topBoats.includes(p[1]) ||
              topBoats.includes(p[2])
            )
          );

        }
      );


    if(
      specialCandidates.length
    ){

      special =
        specialCandidates[0]
          .combo;

    }

  }


  if(!special){

    special =
      scored.find(
        x => {

          if(
            used.has(
              x.combo
            )
          ){
            return false;
          }

          return (
            Number(
              x.combo.split('-')[0]
            ) !== topBoat
          );

        }
      )?.combo || null;

  }


  if(special){

    used.add(special);

  }


  /*
   ==========================
   穴 残り2点
   ==========================
  */

  const holeCandidates =
    scored
      .slice(7)
      .map(
        (x,index)=>{

          const first =
            Number(
              x.combo.split('-')[0]
            );


          const firstScenario =
            scenarioFirstProbability(
              analysis,
              first
            );


          const outsider =
            first !== topBoat
              ? 1.30
              : 1;


          const middleBonus =
            index >= 4
              ? 1.10
              : 1;


          return {

            ...x,

            holeScore:
              x.probability *
              (
                1 +
                firstScenario*1.8
              ) *
              outsider *
              middleBonus

          };

        }
      )
      .filter(
        x =>
          !used.has(
            x.combo
          )
      )
      .sort(
        (a,b)=>
          b.holeScore-
          a.holeScore
      );


  const hole =
    holeCandidates
      .slice(0,2)
      .map(
        x => x.combo
      );


  if(special){

    hole.push(special);

  }


  /*
   念のため3点未満なら補充
  */

  for(const x of scored){

    if(hole.length >= 3){
      break;
    }


    if(
      !used.has(x.combo) &&
      !hole.includes(x.combo)
    ){

      hole.push(
        x.combo
      );

    }

  }


  return {

    main,

    cover,

    hole:
      hole.slice(0,3),

    special

  };

}


function allocate(
  ticketSet,
  budget,
  analysis
){

  const all = [

    ...ticketSet.main.map(
      combo => ({
        combo,
        group:'main'
      })
    ),

    ...ticketSet.cover.map(
      combo => ({
        combo,
        group:'cover'
      })
    ),

    ...ticketSet.hole.map(
      combo => ({
        combo,
        group:'hole'
      })
    )

  ];


  const probabilities =
    buildComboProbabilities(
      analysis
    );


  const probMap =
    new Map(
      probabilities.map(
        x => [
          x.combo,
          x.probability
        ]
      )
    );


  const enriched =
    all.map(
      x => ({

        ...x,

        probability:
          probMap.get(
            x.combo
          ) || 0,

        special:
          x.combo ===
          ticketSet.special

      })
    );


  const units =
    Math.max(
      10,
      Math.floor(
        budget/100
      )
    );


  const weights =
    enriched.map(
      x =>
        x.group === 'main'
          ? 1.35
          : x.group === 'cover'
          ? 1
          : .8
    );


  const totalWeight =
    weights.reduce(
      (s,x)=>s+x,
      0
    );


  let assigned =
    0;


  const out =
    enriched.map(
      (x,i)=>{

        const u =
          Math.max(
            1,
            Math.floor(
              units *
              weights[i] /
              totalWeight
            )
          );


        assigned += u;


        return {

          ...x,

          money:
            u*100

        };

      }
    );


  let diff =
    units-assigned;


  let i =
    0;


  while(diff > 0){

    out[
      i%out.length
    ].money += 100;

    diff--;
    i++;

  }


  while(diff < 0){

    const target =
      [...out]
        .reverse()
        .find(
          x => x.money > 100
        );


    if(!target){
      break;
    }


    target.money -= 100;

    diff++;

  }


  return out;

}


function proximityClass(p){

  if(!p){
    return 'prox-low';
  }


  if(
    p.type === 'exact'
  ){
    return 'prox-exact';
  }


  if(
    num(p.score) >= 80
  ){
    return 'prox-near';
  }


  if(
    num(p.score) >= 60
  ){
    return 'prox-mid';
  }


  return 'prox-low';

}

  );

function learningSummary(rs){

  const done =
    rs.filter(
      x => x.done
    );


  const miss =
    done.filter(
      x => !x.hit
    );


  const known =
    miss.filter(
      x =>
        x.proximity &&
        x.proximity.type !==
        'invalid'
    );


  const count = {

    same3:0,
    onePositionMiss:0,
    same2:0,
    same1:0,
    far:0

  };


  for(const x of known){

    const t =
      x.proximity?.type;


    if(t === 'same3'){

      count.same3++;

    }else if(
      t === 'onePositionMiss'
    ){

      count.onePositionMiss++;

    }else if(
      t === 'same2'
    ){

      count.same2++;

    }else if(
      t === 'same1'
    ){

      count.same1++;

    }else if(
      t === 'far'
    ){

      count.far++;

    }

  }


  const close =
    known.filter(
      x =>
        num(
          x.proximity?.score
        ) >= 65
    ).length;


  const closeRate =
    known.length
      ? close /
        known.length *
        100
      : 0;


  return {

    done,
    miss,
    known,
    count,
    close,
    closeRate

  };

}

}function calc(rs){

  const done =
    rs.filter(
      x => x.done
    );

  const stake =
    done.reduce(
      (s,x) =>
        s + num(x.stake),
      0
    );

  const ret =
    done.reduce(
      (s,x) =>
        s + num(x.returnAmount),
      0
    );

  const hits =
    done.filter(
      x => x.hit
    ).length;

  const each =
    done.map(
      x => ({

        ...x,

        raceRoi:
          num(x.stake) > 0
            ? num(x.returnAmount) /
              num(x.stake) *
              100
            : 0

      })
    );

  return {

    done,

    races:
      done.length,

    hits,

    stake,

    ret,

    hitRate:
      done.length
        ? hits /
          done.length *
          100
        : 0,

    roi:
      stake
        ? ret /
          stake *
          100
        : 0,

    profit:
      ret - stake,

    maxPayout:
      each.length
        ? Math.max(
            ...each.map(
              x =>
                num(
                  x.returnAmount
                )
            )
          )
        : 0,

    maxRoi:
      each.length
        ? Math.max(
            ...each.map(
              x => x.raceRoi
            )
          )
        : 0

  };

}

function savePrediction(analysis){

  const r =
    analysis.race;

  const key =
    raceKey(r);

  const rs =
    records();

  const ticketSet =
    makeTickets(
      analysis
    );

  const tickets =
    allocate(
      ticketSet,
      EVALUATION_STAKE,
      analysis
    );

  const stake =
    tickets.reduce(
      (s,x) =>
        s + x.money,
      0
    );

  const w =
    analysis.weather;

  const predictionMeta = {

    windSpeed:
      w.windSpeed,

    windDirection:
      w.windDirection,

    wave:
      w.wave,

    weather:
      w.weather,

    airTemperature:
      w.air,

    waterTemperature:
      w.water,

    exhibitionRank:
      analysis.exhibitionRank,

    startRank:
      analysis.startRank,

    courseChanges:
      analysis.courseChanges.map(
        x => ({

          boat:
            x.boat,

          course:
            num(
              x.preview?.course_number,
              x.boat
            )

        })
      ),

    scenario:
      analysis.scenario
        .candidates
        .slice(0,6)
        .map(
          x => ({

            boat:
              x.boat,

            tactic:
              x.tactic,

            probability:
              x.probability

          })
        ),

    attacker:
      analysis.scenario?.attacker
        ? {

            boat:
              analysis.scenario
                .attacker
                .boat,

            tactic:
              analysis.scenario
                .attacker
                .tactic

          }
        : null,

    reasons:
      analysis.reasons,

    specialHole:
      ticketSet.special

  };

  const old =
    rs.find(
      x =>
        x.key === key
    );

  if(old){

    if(!old.done){

      Object.assign(
        old,
        {

          tickets,

          stake,

          rating:
            analysis.rating,

          predictionMeta,

          savedAt:
            new Date()
              .toISOString(),

          model:
            MODEL_NAME,

          learningSnapshot:{

            model:
              MODEL_NAME,

            savedAt:
              new Date()
                .toISOString(),

            rating:
              analysis.rating,

            grade:'S',

            tickets:
              tickets.map(
                t => ({

                  combo:
                    t.combo,

                  group:
                    t.group || '',

                  probability:
                    num(
                      t.probability
                    ),

                  special:
                    !!t.special,

                  money:
                    num(
                      t.money
                    )

                })
              ),

            predictionMeta

          }

        }
      );

      save(rs);

    }

    return;

  }

  rs.push({

    key,

    date:
      r.date ||
      todayJST(),

    stadium:
      r.stadium_number,

    venue:
      STADIUMS[
        r.stadium_number
      ] || '会場',

    raceNumber:
      r.race_number,

    grade:'S',

    rating:
      analysis.rating,

    tickets,

    stake,

    done:false,

    hit:false,

    result:'',

    payout:0,

    resultOdds:0,

    returnAmount:0,

    savedAt:
      new Date()
        .toISOString(),

    model:
      MODEL_NAME,

    predictionMeta,

    learningSnapshot:{

      model:
        MODEL_NAME,

      savedAt:
        new Date()
          .toISOString(),

      rating:
        analysis.rating,

      grade:'S',

      tickets:
        tickets.map(
          t => ({

            combo:
              t.combo,

            group:
              t.group || '',

            probability:
              num(
                t.probability
              ),

            special:
              !!t.special,

            money:
              num(
                t.money
              )

          })
        ),

      predictionMeta

    }

  });

  save(rs);

}


function payouts(r){

    : [];

}


function settle(races){

  const rs =
    records();

  let changed =
    false;

  for(const rec of rs){

    if(rec.done){
      continue;
    }

    const r =
      races.find(
        x =>
          raceKey(x) ===
          rec.key
      );

    if(!r){
      continue;
    }

    const p =
      payouts(r);

    if(!p.length){
      continue;
    }

    const winner =
      p[0];

    const combo =
      String(
        winner.combination ||
        ''
      );

    const pay =
      num(
        winner.amount
      );

    if(!combo){
      continue;
    }

    rec.done =
      true;

    rec.result =
      combo;

    rec.payout =
      pay;

    rec.resultOdds =
      pay > 0
        ? pay / 100
        : 0;

    const hitTicket =
      rec.tickets?.find(
        t =>
          t.combo === combo
      );

    rec.hit =
      !!hitTicket;

    rec.hitGroup =
      hitTicket?.group ||
      '';

    rec.returnAmount =
      hitTicket
        ? Math.round(
            pay /
            100 *
            hitTicket.money
          )
        : 0;

    rec.proximity =
      analyzePredictionCloseness(
        rec,
        combo
      );

    rec.settledAt =
      new Date()
        .toISOString();

    changed =
      true;

  }

  if(changed){

    save(rs);

  }

}

          人気本命からのズレを加味して
          期待値寄りに選定します。

          <br><br>

          穴3点は高配当展開を重視し、
          ★は攻め役連動の特殊穴です。

        </div>

      </div>

    </article>
  `;

}

function dataSignature(races){

  return JSON.stringify(

    races.map(
      r => [

        raceKey(r),

        r.closed_at,

        r.preview?.wind_speed,

        r.preview
          ?.wind_direction_number,

        r.preview?.wave_height,

        r.preview?.weather_number,

        r.preview
          ?.air_temperature,

        r.preview
          ?.water_temperature,

        ...Array.from(
          {length:6},
          (_,i) => {

            const p =
              r.preview
                ?.racers
                ?.[String(i+1)];

            return [

              p?.exhibition_time,

              p?.start_timing,

              p?.course_number

            ];

          }
        ),

        r.result
          ?.payouts
          ?.trifecta
          ?.[0]
          ?.combination,

        r.result
          ?.payouts
          ?.trifecta
          ?.[0]
          ?.amount

      ]
    )

  );

}


function analyzeRaces(races){

  settle(races);

  const arr = [];

  for(const r of races){

    if(
      !upcoming(r) ||
      !previewReady(r)
    ){
      continue;
    }

    const analysis =
      evaluate(r);

    if(
      analysis?.grade === 'S'
    ){

      arr.push(
        analysis
      );

      savePrediction(
        analysis
      );

    }

  }

  arr.sort(
    (a,b) =>
      b.rating -
      a.rating
  );

  analyses =
    arr;

  display();

  renderStats();

  return arr;

}


async function autoRefresh(
  force=false
){

  if(autoUpdateBusy){
    return;
  }

  autoUpdateBusy =
    true;

  const st =
    $('status');

  try{

    if(
      force &&
      !analyses.length
    ){

      st.textContent =
        '最新データを自動取得しています…';

    }

    const data =
      await fetchToday();

    const races =
      flatten(data);

    const signature =
      dataSignature(
        races
      );

    settle(races);

    if(
      force ||
      signature !==
      lastDataSignature
    ){

      lastDataSignature =
        signature;

      const arr =
        analyzeRaces(
          races
        );

      const previewCount =
        races.filter(
          previewReady
        ).length;

      st.innerHTML =
        `
        ✅ 自動更新完了
        <br>

        取得レース：
        ${races.length}R

        ／

        展示分析可能：
        ${previewCount}R

        <br>

        🔥 S評価：
        ${arr.length}レース

        <br>

        展示・水面・進入・展開を
        Ver.3 AIが自動分析しました。
        `;

    }else{

      renderStats();

      st.innerHTML =
        `
        ✅ 自動確認済み
        <br>

        取得レース：
        ${races.length}R

        <br>

        🔥 S評価：
        ${analyses.length}レース

        <br>

        最新データに変化はありません。
        `;

    }

  }catch(e){

    console.error(e);

    st.textContent =
      '自動更新に失敗しました。通信が戻ると次回の自動更新で再試行します。';

  }finally{

    autoUpdateBusy =
      false;

  }

}


function filterRecords(){

  const all =
    records();

  if(period === 'all'){

    return all;

  }

  if(period === 'day'){

    return all.filter(
      x =>
        x.date ===
        todayJST()
    );

  }

  const from =
    $('fromDate').value;

  const to =
    $('toDate').value;

  return all.filter(
    x =>
      (!from || x.date >= from) &&
      (!to || x.date <= to)
  );

}

    x?.predictionMeta

  return s

    : '-';

}


function renderHistory(rs){

  const allDone =
    rs
      .filter(
        x => x.done
      )
      .sort(
        (a,b) =>
          String(
            b.date
          ).localeCompare(
            String(
              a.date
            )
          ) ||
          num(
            b.raceNumber
          ) -
          num(
            a.raceNumber
          )
      );

  if(!allDone.length){

    $('history').innerHTML =
      `
      <div class="empty">
        確定済みレースはありません。
      </div>
      `;

    return;

  }

  const venueNames =
    Object.values(
      STADIUMS
    );

  const venueBase =
    historyVenue === 'all'
      ? allDone
      : allDone.filter(
          x =>
            x.venue ===
            historyVenue
        );

  const hits =
    venueBase.filter(
      x => x.hit
    ).length;

  const misses =
    venueBase.length -
    hits;

  let shown =
    venueBase;

  if(
    historyResult === 'hit'
  ){

    shown =
      venueBase.filter(
        x => x.hit
      );

  }

  if(
    historyResult === 'miss'
  ){

    shown =
      venueBase.filter(
        x => !x.hit
      );

  }

  const venueTabs =
    `
    <div class="venue-tabs">

      <button
        class="venue-chip ${
          historyVenue === 'all'
            ? 'active'
            : ''
        }"
        data-hvenue="all"
      >
        全会場
      </button>

      ${venueNames
        .map(
          venue => `
            <button
              class="venue-chip ${
                historyVenue === venue
                  ? 'active'
                  : ''
              }"
              data-hvenue="${venue}"
            >
              ${venue}
            </button>
          `
        )
        .join('')}

    </div>
    `;

  const resultTabs =
    `
    <div class="result-tabs">

      <button
        class="result-chip all ${
          historyResult === 'all'
            ? 'active'
            : ''
        }"
        data-hresult="all"
      >
        すべて
        (${venueBase.length}R)
      </button>

      <button
        class="result-chip hit-only ${
          historyResult === 'hit'
            ? 'active'
            : ''
        }"
        data-hresult="hit"
      >
        ● 的中のみ
        (${hits}R)
      </button>

      <button
        class="result-chip miss-only ${
          historyResult === 'miss'
            ? 'active'
            : ''
        }"
        data-hresult="miss"
      >
        ● 不的中のみ
        (${misses}R)
      </button>

    </div>
    `;

  const body =
    shown.length

      ? `
        <div class="history-scroll">

          <table class="history-table">

            <thead>

              <tr>

                <th>日付</th>
                <th>場</th>
                <th>R</th>
                <th>AI展開</th>
                <th>結果</th>
                <th>オッズ</th>
                <th>判定</th>
                <th>接近度</th>
                <th>的中枠</th>
                <th>払戻金</th>
                <th>回収率</th>

              </tr>

            </thead>

            <tbody>

              ${shown.map(
                x => {

                  const roi =
                    num(x.stake) > 0
                      ? num(
                          x.returnAmount
                        ) /
                        num(
                          x.stake
                        ) *
                        100
                      : 0;

                  const odds =
                    num(
                      x.resultOdds,
                      num(
                        x.payout
                      ) / 100
                    );

                  const group =
                    x.hitGroup === 'main'
                      ? '本線'
                      : x.hitGroup === 'cover'
                      ? '狙い'
                      : x.hitGroup === 'hole'
                      ? '穴'
                      : '-';

                  return `
                    <tr>

                      <td>
                        ${x.date?.slice(5) || '-'}
                      </td>

                      <td>
                        ${x.venue || '-'}
                      </td>

                      <td>
                        ${x.raceNumber}R
                      </td>

                      <td class="scenario-mini">
                        ${topScenarioText(x)}
                      </td>

                      <td>
                        <b>
                          ${x.result || '-'}
                        </b>
                      </td>

                      <td class="odds">

                        ${
                          odds
                            ? odds.toFixed(1)+'倍'
                            : '-'
                        }

                      </td>

                      <td
                        class="${
                          x.hit
                            ? 'hit'
                            : 'miss'
                        }"
                      >

                        ${
                          x.hit
                            ? '◎ 的中'
                            : '× 不的中'
                        }

                      </td>

                      <td
                        class="
                          proximity
                          ${
                            proximityClass(
                              x.proximity
                            )
                          }
                        "
                      >

                        ${
                          x.proximity
                            ?.label ||
                          '-'
                        }

                        ${
                          x.proximity?.combo

                            ? `
                              <br>
                              <small>

                                ${x.proximity.combo}

                                /

                                ${
                                  groupLabel(
                                    x.proximity.group
                                  )
                                }

                              </small>
                            `

                            : ''
                        }

                      </td>

                      <td>
                        ${group}
                      </td>

                      <td>
                        ${num(
                          x.returnAmount
                        ).toLocaleString()}円
                      </td>

                      <td
                        class="${
                          roi >= 100
                            ? 'roi'
                            : ''
                        }"
                      >
                        ${roi.toFixed(1)}%
                      </td>

                    </tr>
                  `;

                }
              ).join('')}

            </tbody>

          </table>

        </div>
      `

      : `
        <div class="empty">
          この条件の確定レースはありません。
        </div>
      `;

  $('history').innerHTML =
    `
    <div class="history-controls">

      ${venueTabs}

      ${resultTabs}

      <div class="history-caption">

        <span>

          ${
            historyVenue === 'all'
              ? '全会場'
              : historyVenue
          }

        </span>

        <span>
          ${shown.length}R表示
        </span>

      </div>

    </div>

    ${body}

    <div class="notice">

      会場タブは横にスライドできます。
      オッズは3連単確定払戻額÷100です。

    </div>
    `;

  document
    .querySelectorAll(
      '[data-hvenue]'
    )
    .forEach(
      btn => {

        btn.onclick =
          () => {

            historyVenue =
              btn.dataset.hvenue;

            historyResult =
              'all';

            renderHistory(rs);

          };

      }
    );

  document
    .querySelectorAll(
      '[data-hresult]'
    )
    .forEach(
      btn => {

        btn.onclick =
          () => {

            historyResult =
              btn.dataset.hresult;

            renderHistory(rs);

          };

      }
    );

}


function renderVenue(rs){

  const done =
    rs.filter(
      x => x.done
    );

  const map =
    new Map();

  for(const x of done){

    if(
      !map.has(
        x.venue
      )
    ){

      map.set(
        x.venue,
        []
      );

    }

    map
      .get(x.venue)
      .push(x);

  }

  if(!map.size){

    $('venueStats').innerHTML =
      `
      <div class="empty">
        会場別成績はまだありません。
      </div>
      `;

    return;

  }

  const rows =
    [...map.entries()]
      .map(
        ([venue,a]) => ({

          venue,

          ...calc(a)

        })
      )
      .sort(
        (a,b) =>
          b.roi -
          a.roi
      );

  $('venueStats').innerHTML =
    `
    <div class="venue-row">

      <b>会場</b>
      <b>R</b>
      <b>的中率</b>
      <b>回収率</b>
      <b>学習進捗</b>

    </div>

    ${rows.map(
      x => `
        <div class="venue-row">

          <span>
            ${x.venue}
          </span>

          <span>
            ${x.races}
          </span>

          <span>
            ${x.hitRate.toFixed(1)}%
          </span>

          <span
            class="${
              x.roi >= 100
                ? 'green'
                : ''
            }"
          >
            ${x.roi.toFixed(1)}%
          </span>

          <span
            class="${
              x.races >= 100
                ? 'learn-ready'
                : x.races >= 50
                ? 'learn-mid'
                : 'learn-low'
            }"
          >
            ${Math.min(
              x.races,
              100
            )}/100R
          </span>

        </div>
      `
    ).join('')}
    `;

}


function showStats(
  openHistory=false,
  openVenue=false
){

  $('statsSection')
    .style
    .display =
      'block';

  renderStats();

  if(openHistory){

    $('historyWrap')
      .style
      .display =
        'block';

    $('historyToggle')
      .textContent =
        '一覧を隠す';

  }

  if(openVenue){

    $('venueWrap')
      .style
      .display =
        'block';

    $('venueToggle')
      .textContent =
        '会場別成績を隠す';

  }

  $('statsSection')
    .scrollIntoView({

      behavior:'smooth',

      block:'start'

    });

}
