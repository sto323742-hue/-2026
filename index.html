<!DOCTYPE html>

<style>

}

body{

.container{

.header{

.card,

<script>

const STADIUMS = {
  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"
};


const STORE_KEY =
  "boat_ai_s_records_v3";


let currentPeriod =
  "month";


function goTop(){

  document
    .getElementById("pageTop")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


function goStats(){

  document
    .getElementById("statsSection")
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


function toggleHistory(){

  const wrap =
    document.getElementById(
      "raceHistoryWrap"
    );

  const btn =
    document.getElementById(
      "historyToggleBtn"
    );

  const hidden =
    getComputedStyle(wrap).display ===
    "none";

  if(hidden){

    wrap.style.display =
      "block";

    btn.textContent =
      "🎯 レース別結果を隠す";

  }else{

    wrap.style.display =
      "none";

    btn.textContent =
      "🎯 レース別結果を表示";

  }

}


function toggleVenueStats(){

  const wrap =
    document.getElementById(
      "venueStatsWrap"
    );

  const btn =
    document.getElementById(
      "venueToggleBtn"
    );

  const hidden =
    getComputedStyle(wrap).display ===
    "none";

  if(hidden){

    wrap.style.display =
      "block";

    btn.textContent =
      "📍 会場別成績を隠す";

  }else{

    wrap.style.display =
      "none";

    btn.textContent =
      "📍 会場別成績を表示";

  }

}


function n(
  value,
  fallback = 0
){

  const number =
    Number(value);

  return Number.isFinite(number)
    ? number
    : fallback;

}


function todayJST(){

  return new Intl.DateTimeFormat(
    "sv-SE",
    {
      timeZone:"Asia/Tokyo",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }
  ).format(
    new Date()
  );

}


function compactDate(date){

  return date.replaceAll(
    "-",
    ""
  );

}


function apiUrl(
  type,
  date
){

  return (
    "https://boatraceopenapi.github.io/" +
    type +
    "/v3/" +
    date.slice(0,4) +
    "/" +
    compactDate(date) +
    ".json"
  );

}


async function fetchJSON(url){

  const response =
    await fetch(
      url + "?t=" + Date.now(),
      {
        cache:"no-store"
      }
    );

  if(!response.ok){

    throw new Error(
      response.status +
      " " +
      url
    );

  }

  return await response.json();

}


function loadRecords(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORE_KEY
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveRecords(records){

  localStorage.setItem(
    STORE_KEY,
    JSON.stringify(records)
  );

}


function keyOf(
  stadium,
  raceNo
){

  return (
    Number(stadium) +
    "-" +
    Number(raceNo)
  );

}


function indexByRace(array){

  const map =
    new Map();

  for(
    const race
    of (array || [])
  ){

    map.set(
      keyOf(
        race.stadium_number,
        race.number
      ),
      race
    );

  }

  return map;

}


function previewReady(
  preview
){

  if(
    !preview ||
    !Array.isArray(
      preview.boats
    ) ||
    preview.boats.length < 6
  ){

    return false;

  }

  return preview.boats.every(
    boat =>
      Number(
        boat.racer_exhibition_time
      ) > 0
  );

}


function boatScore(
  programBoat,
  previewBoat
){

  const national =
    n(
      programBoat
        ?.racer_national_top_1_percent,
      5
    );

  const local =
    n(
      programBoat
        ?.racer_local_top_1_percent,
      national
    );

  const motor =
    n(
      programBoat
        ?.racer_assigned_motor_top_2_percent,
      30
    );

  const boatRate =
    n(
      programBoat
        ?.racer_assigned_boat_top_2_percent,
      30
    );

  const avgST =
    n(
      programBoat
        ?.racer_average_start_timing,
      .18
    );

  const exhibition =
    n(
      previewBoat
        ?.racer_exhibition_time,
      6.85
    );

  const exhibitionST =
    n(
      previewBoat
        ?.racer_start_timing,
      avgST
    );

  const racerClass =
    n(
      programBoat
        ?.racer_class_number,
      3
    );

  const boat =
    n(
      programBoat
        ?.racer_boat_number,
      6
    );


  let score = 0;

  score +=
    national * 5;

  score +=
    local * 2.7;

  score +=
    motor * .30;

  score +=
    boatRate * .12;

  score +=
    Math.max(
      0,
      (.22 - avgST) * 70
    );

  score +=
    Math.max(
      0,
      (6.95 - exhibition) * 35
    );

  score +=
    Math.max(
      0,
      (.20 - exhibitionST) * 45
    );


  if(racerClass === 1){

    score += 6;

  }else if(
    racerClass === 2
  ){

    score += 4;

  }


  const courseBonus = {
    1:12,
    2:6,
    3:4,
    4:2,
    5:0,
    6:-2
  };

  score +=
    courseBonus[boat] || 0;


  return score;

}


function evaluateRace(
  program,
  preview
){

  if(
    !previewReady(preview)
  ){

    return null;

  }


  const programBoats =
    program?.boats || [];


  if(
    programBoats.length < 6
  ){

    return null;

  }


  const previewMap =
    new Map(
      preview.boats.map(
        boat => [
          Number(
            boat.racer_boat_number
          ),
          boat
        ]
      )
    );


  const boats =
    programBoats
      .map(
        programBoat => ({

          boat:
            Number(
              programBoat
                .racer_boat_number
            ),

          score:
            boatScore(
              programBoat,
              previewMap.get(
                Number(
                  programBoat
                    .racer_boat_number
                )
              )
            )

        })
      )
      .sort(
        (a,b) =>
          b.score - a.score
      );


  const gap1 =
    boats[0].score -
    boats[1].score;


  const gap2 =
    boats[1].score -
    boats[2].score;


  let confidence =
    60 +
    Math.min(
      18,
      gap1 * 2.2
    ) +
    Math.min(
      8,
      gap2
    );


  if(
    boats[0].boat === 1
  ){

    confidence += 7;

  }


  const wind =
    n(
      preview.wind_speed,
      0
    );

  const wave =
    n(
      preview.wave_height,
      0
    );


  if(wind >= 6){

    confidence -= 6;

  }

  if(wave >= 5){

    confidence -= 4;

  }


  confidence =
    Math.max(
      0,
      Math.min(
        99,
        confidence
      )
    );


  const grade =
    (
      confidence >= 78 &&
      gap1 >= 5
    )
    ? "S"
    :
    (
      confidence >= 68
      ? "A"
      : "B"
    );


  return {
    grade,
    confidence,
    boats,
    wind,
    wave
  };

}


function uniquePush(
  array,
  value
){

  if(
    value &&
    !array.includes(value)
  ){

    array.push(value);

  }

}


function makeTickets(boats){

  const [
    a,
    b,
    c,
    d
  ] =
    boats
      .slice(0,4)
      .map(
        item => item.boat
      );


  const main = [];
  const cover = [];
  const hole = [];


  uniquePush(
    main,
    `${a}-${b}-${c}`
  );

  uniquePush(
    main,
    `${a}-${c}-${b}`
  );

  uniquePush(
    main,
    `${a}-${b}-${d}`
  );


  uniquePush(
    cover,
    `${a}-${c}-${d}`
  );

  uniquePush(
    cover,
    `${a}-${d}-${b}`
  );

  uniquePush(
    cover,
    `${b}-${a}-${c}`
  );

  uniquePush(
    cover,
    `${b}-${c}-${a}`
  );


  uniquePush(
    hole,
    `${c}-${a}-${b}`
  );

  uniquePush(
    hole,
    `${b}-${d}-${a}`
  );

  uniquePush(
    hole,
    `${d}-${a}-${c}`
  );


  return {
    main,
    cover,
    hole
  };

}


function allTickets(tickets){

  return [
    ...tickets.main,
    ...tickets.cover,
    ...tickets.hole
  ];

}


function recordKey(
  date,
  stadium,
  raceNo
){

  return (
    date +
    "-" +
    Number(stadium) +
    "-" +
    Number(raceNo)
  );

}


function upsertPrediction(
  date,
  program,
  analysis,
  tickets,
  stake
){

  let records =
    loadRecords();


  const key =
    recordKey(
      date,
      program.stadium_number,
      program.number
    );


  let record =
    records.find(
      item =>
        item.key === key
    );


  if(!record){

    record = {

      key,

      date,

      stadium:
        Number(
          program.stadium_number
        ),

      venue:
        STADIUMS[
          program.stadium_number
        ] ||
        "会場" +
        program.stadium_number,

      raceNo:
        Number(
          program.number
        ),

      confidence:
        Math.round(
          analysis.confidence
        ),

      tickets:
        allTickets(
          tickets
        ),

      stake,

      perTicket:
        stake / 10,

      status:
        "pending",

      result:
        "",

      payout:
        0,

      returnAmount:
        0,

      hit:
        false,

      createdAt:
        new Date()
          .toISOString()

    };


    records.push(record);

    saveRecords(records);

  }


  return record;

}


function ticketsHTML(
  title,
  className,
  tickets,
  amount
){

  return `
    <div class="bet-title ${className}">
      ${title}
    </div>

    ${tickets.map(
      ticket => `
        <div class="ticket">

          <div class="combo">
            ${ticket}
          </div>

          <div class="money">
            ${amount.toLocaleString()}円
          </div>

        </div>
      `
    ).join("")}
  `;

}


function resultHTML(record){

  if(
    !record ||
    record.status !== "done"
  ){

    return `
      <span class="result-badge pending">
        ⏳ 結果待ち
      </span>
    `;

  }


  if(record.hit){

    return `
      <span class="result-badge hit">
        🎯 的中　${record.result}
      </span>
    `;

  }


  return `
    <span class="result-badge miss">
      ✕ 不的中　${record.result}
    </span>
  `;

}


function isUpcoming(program){

  if(!program?.closed_at){

    return true;

  }


  const date =
    new Date(
      program.closed_at
        .replace(
          " ",
          "T"
        ) +
      "+09:00"
    );


  return (
    date.getTime() >
    Date.now()
  );

}

function getTrifectas(
  resultRace
){

  const array =
    resultRace
      ?.payouts
      ?.trifecta;


  return Array.isArray(array)
    ?
    array.filter(
      item =>
        item?.combination
    )
    :
    [];

}


function settleRecordsForDate(
  date,
  resultsArray
){

  let records =
    loadRecords();


  let changed =
    false;


  const resultMap =
    indexByRace(
      resultsArray
    );


  for(
    const record
    of records
  ){

    if(
      record.date !== date ||
      record.status === "done"
    ){

      continue;

    }


    const resultRace =
      resultMap.get(
        keyOf(
          record.stadium,
          record.raceNo
        )
      );


    const trifectas =
      getTrifectas(
        resultRace
      );


    if(
      !trifectas.length
    ){

      continue;

    }


    const hit =
      trifectas.find(
        item =>
          record.tickets.includes(
            item.combination
          )
      );


    const official =
      trifectas[0];


    record.status =
      "done";


    record.result =
      official
        ?.combination || "";


    record.payout =
      n(
        official
          ?.amount,
        0
      );


    record.hit =
      !!hit;


    record.returnAmount =
      hit
      ?
      Math.round(
        record.perTicket *
        n(
          hit.amount,
          0
        ) /
        100
      )
      :
      0;


    record.settledAt =
      new Date()
        .toISOString();


    changed =
      true;

  }


  if(changed){

    saveRecords(records);

  }


  return changed;

}


async function loadToday(){

  const status =
    document.getElementById(
      "status"
    );


  const resultsBox =
    document.getElementById(
      "results"
    );


  const date =
    todayJST();


  status.textContent =
    "出走表・直前情報・結果を取得しています…";


  resultsBox.innerHTML =
    "";


  try{


    const [
      programResponse,
      previewResponse,
      resultResponse
    ] =
      await Promise.allSettled([
        fetchJSON(
          apiUrl(
            "programs",
            date
          )
        ),

        fetchJSON(
          apiUrl(
            "previews",
            date
          )
        ),

        fetchJSON(
          apiUrl(
            "results",
            date
          )
        )
      ]);


    if(
      programResponse.status !==
      "fulfilled"
    ){

      throw programResponse.reason;

    }


    const programs =
      programResponse
        .value
        ?.programs || [];


    const previews =
      previewResponse.status ===
      "fulfilled"
      ?
      previewResponse
        .value
        ?.previews || []
      :
      [];


    const results =
      resultResponse.status ===
      "fulfilled"
      ?
      resultResponse
        .value
        ?.results || []
      :
      [];


    const previewMap =
      indexByRace(
        previews
      );


    settleRecordsForDate(
      date,
      results
    );


    const upcoming =
      programs
        .filter(
          isUpcoming
        )
        .sort(
          (a,b) =>
            Number(
              a.stadium_number
            ) -
            Number(
              b.stadium_number
            )
            ||
            Number(
              a.number
            ) -
            Number(
              b.number
            )
        );


    let html = "";

    let sCount = 0;

    let waitCount = 0;

    let checkedCount = 0;


    for(
      const program
      of upcoming
    ){

      const preview =
        previewMap.get(
          keyOf(
            program.stadium_number,
            program.number
          )
        );


      const analysis =
        evaluateRace(
          program,
          preview
        );


      if(!analysis){

        html +=
          renderWaiting(
            program
          );

        waitCount++;

        continue;

      }


      checkedCount++;


      if(
        analysis.grade === "S"
      ){

        html +=
          renderS(
            program,
            analysis,
            date
          );

        sCount++;

      }

    }


    resultsBox.innerHTML =
      html ||
      `
        <div class="no-race">
          本日の今後のレースはありません。
        </div>
      `;


    status.textContent =
      `${date}：今後 ${upcoming.length}レース / ` +
      `S確定 ${sCount} / ` +
      `展示待ち ${waitCount} / ` +
      `判定済み ${checkedCount}`;


    if(
      previewResponse.status !==
      "fulfilled"
    ){

      status.textContent +=
        "（直前情報APIを取得できません）";

    }


    renderStats();


  }catch(error){


    console.error(error);


    status.textContent =
      "出走表の取得に失敗しました。";


    resultsBox.innerHTML =
      `
        <div class="no-race">

          出走表APIを取得できませんでした。

          <br><br>

          少し時間を置いて
          更新してください。

        </div>
      `;


    renderStats();

  }

}


function periodMatch(
  date,
  period
){

  const today =
    todayJST();


  if(period === "day"){

    return date === today;

  }


  if(period === "month"){

    return (
      date.slice(0,7) ===
      today.slice(0,7)
    );

  }


  return (
    date.slice(0,4) ===
    today.slice(0,4)
  );

}


function calcStats(rows){

  const done =
    rows.filter(
      record =>
        record.status ===
        "done"
    );


  const races =
    done.length;


  const hits =
    done.filter(
      record =>
        record.hit
    ).length;


  const stake =
    done.reduce(
      (sum,record) =>
        sum +
        n(record.stake),
      0
    );


  const returns =
    done.reduce(
      (sum,record) =>
        sum +
        n(record.returnAmount),
      0
    );


  return {

    races,

    hits,

    stake,

    returns,

    hitRate:
      races
      ?
      hits / races * 100
      :
      0,

    roi:
      stake
      ?
      returns / stake * 100
      :
      0,

    profit:
      returns - stake

  };

}


function setPeriod(period){

  currentPeriod =
    period;

  renderStats();

}


function renderStats(){

  for(
    const period
    of [
      "day",
      "month",
      "year"
    ]
  ){

    document
      .getElementById(
        `tab-${period}`
      )
      ?.classList
      .toggle(
        "active",
        period ===
        currentPeriod
      );

  }


  const rows =
    loadRecords()
      .filter(
        record =>
          periodMatch(
            record.date,
            currentPeriod
          )
      )
      .sort(
        (a,b) =>
          b.date.localeCompare(
            a.date
          )
          ||
          Number(a.stadium) -
          Number(b.stadium)
          ||
          Number(a.raceNo) -
          Number(b.raceNo)
      );


  const stats =
    calcStats(rows);


  const profitClass =
    stats.profit >= 0
    ?
    "positive"
    :
    "negative";


  document
    .getElementById(
      "stats"
    )
    .innerHTML =
    `
      <div class="stats-grid">

        <div class="stat">
          <div class="stat-label">
            確定レース
          </div>
          <div class="stat-value">
            ${stats.races}
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            的中
          </div>
          <div class="stat-value">
            ${stats.hits}
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            的中率
          </div>
          <div class="stat-value">
            ${stats.hitRate.toFixed(1)}%
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            回収率
          </div>
          <div class="stat-value">
            ${stats.roi.toFixed(1)}%
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            投資額
          </div>
          <div class="stat-value">
            ${stats.stake.toLocaleString()}円
          </div>
        </div>

        <div class="stat">
          <div class="stat-label">
            収支
          </div>

          <div class="stat-value ${profitClass}">
            ${stats.profit >= 0 ? "+" : ""}
            ${stats.profit.toLocaleString()}円
          </div>

        </div>

      </div>
    `;


  document
    .getElementById(
      "raceHistory"
    )
    .innerHTML =
    rows.length
    ?
    rows.map(
      record =>
      `
        <div class="history-item">

          <div class="history-top">

            <div>

              <div class="history-race">
                ${record.venue}
                ${record.raceNo}R
              </div>

              <div class="history-date">
                ${record.date}
                ・
                AI信頼度
                ${record.confidence}%
              </div>

            </div>


            <div>

              ${
                record.status !==
                "done"
                ?
                `
                  <span class="result-badge pending">
                    ⏳ 結果待ち
                  </span>
                `
                :
                record.hit
                ?
                `
                  <span class="result-badge hit">
                    🎯 的中
                  </span>
                `
                :
                `
                  <span class="result-badge miss">
                    ✕ 不的中
                  </span>
                `
              }

            </div>

          </div>


          ${
            record.status ===
            "done"
            ?
            `
              <div class="history-result">

                3連単結果：
                ${record.result || "--"}

                ${
                  record.hit
                  ?
                  `
                    <br>
                    回収：
                    ${record.returnAmount.toLocaleString()}円
                  `
                  :
                  ""
                }

              </div>
            `
            :
            ""
          }

        </div>
      `
    ).join("")
    :
    `
      <div class="small">
        この期間に保存された
        Sレースはありません。
      </div>
    `;


  const groups = {};


  for(
    const record
    of rows
  ){

    (
      groups[
        record.venue
      ] ??= []
    ).push(record);

  }


  const entries =
    Object.entries(
      groups
    )
    .map(
      ([venue,data]) => [
        venue,
        calcStats(data)
      ]
    )
    .sort(
      (a,b) =>
        b[1].roi -
        a[1].roi
    );


  document
    .getElementById(
      "venueStats"
    )
    .innerHTML =
    entries.length
    ?
    `
      <div class="venue-row">

        <strong>会場</strong>
        <strong>的中率</strong>
        <strong>回収率</strong>
        <strong>収支</strong>

      </div>


      ${
        entries.map(
          ([venue,stats]) =>
          `
            <div class="venue-row">

              <strong>
                ${venue}
              </strong>

              <span>
                ${stats.hitRate.toFixed(1)}%
              </span>

              <span>
                ${stats.roi.toFixed(1)}%
              </span>

              <span
                class="${
                  stats.profit >= 0
                  ?
                  "positive"
                  :
                  "negative"
                }"
              >
                ${
                  stats.profit >= 0
                  ?
                  "+"
                  :
                  ""
                }

                ${stats.profit.toLocaleString()}円
              </span>

            </div>
          `
        ).join("")
      }
    `
    :
    `
      <div class="small">
        この期間には
        確定済みの成績がありません。
      </div>
    `;

}


async function refreshAllPending(){

  const dates =
    [
      ...new Set(
        loadRecords()
          .filter(
            record =>
              record.status !==
              "done"
          )
          .map(
            record =>
              record.date
          )
      )
    ];


  for(
    const date
    of dates
  ){

    try{

      const data =
        await fetchJSON(
          apiUrl(
            "results",
            date
          )
        );


      settleRecordsForDate(
        date,
        data?.results || []
      );


    }catch(error){

      console.warn(
        "結果更新失敗",
        date,
        error
      );

    }

  }


  renderStats();

}


renderStats();


refreshAllPending();


setInterval(
  refreshAllPending,
  60000
);


document.addEventListener(
  "visibilitychange",
  () => {

    if(
      !document.hidden
    ){

      refreshAllPending();

    }

  }
);


window.addEventListener(
  "focus",
  refreshAllPending
);

</script>
