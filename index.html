<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI予想</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.wrap{
  max-width:820px;
  margin:auto;
  padding:16px 10px 100px;
}

/* ================================
   ヘッダー
================================ */

.header{
  text-align:center;
  padding:10px 4px 18px;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:.4px;
}

.brand .gold{
  color:#efc559;
}

.ver{
  font-size:12px;
  color:#efc559;
  margin-left:5px;
}

.sub{
  margin-top:6px;
  color:#9d9d9d;
  font-size:12px;
}

/* ================================
   パネル
================================ */

.panel,
.race{
  background:
    linear-gradient(
      180deg,
      #111,
      #090909
    );
  border:1px solid #765b19;
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
}

.panel-title{
  color:#f3ca5b;
  font-weight:950;
  font-size:19px;
  margin-bottom:13px;
}

.budget-label{
  font-size:12px;
  color:#c9b98a;
  margin-bottom:6px;
}

select,
input[type=date]{
  width:100%;
  height:51px;
  border:1px solid #775d1c;
  border-radius:12px;
  background:#080808;
  color:#fff;
  padding:0 12px;
  font-size:16px;
}

/* ================================
   ボタン
================================ */

.primary,
.secondary,
.gold-btn,
.toggle{
  width:100%;
  border:0;
  border-radius:13px;
  font-weight:900;
}

.primary{
  height:57px;
  margin-top:11px;
  background:
    linear-gradient(
      135deg,
      #f7d477,
      #c58c17
    );
  color:#090909;
  font-size:17px;
}

.secondary{
  height:48px;
  margin-top:9px;
  background:#1b1b1b;
  border:1px solid #50431e;
  color:#eed17b;
}

.status{
  margin-top:11px;
  padding:11px;
  border-radius:12px;
  background:#080808;
  border:1px solid #26210f;
  color:#c8c0a8;
  font-size:12px;
  line-height:1.7;
}

.notice{
  margin-top:8px;
  color:#777;
  font-size:10px;
  line-height:1.6;
}

/* ================================
   レース
================================ */

.race{
  border-color:#6f571d;
}

.race-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.race-name{
  font-size:20px;
  font-weight:950;
}

.race-meta{
  font-size:11px;
  color:#a9a9a9;
  margin-top:4px;
}

.smark{
  width:49px;
  height:49px;
  border:1px solid #f1c95e;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#f1c95e;
  font-size:23px;
  font-weight:950;
}

.ai-box{
  margin-top:10px;
  background:#080808;
  border:1px solid #29220e;
  border-radius:12px;
  padding:11px;
}

.ai-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.ai-score{
  font-size:23px;
  color:#f2cd67;
  font-weight:950;
}

.candidate-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:9px;
}

.candidate{
  background:#111;
  border-radius:9px;
  text-align:center;
  padding:8px 3px;
}

.candidate small{
  display:block;
  color:#8d8d8d;
  font-size:9px;
}

.candidate b{
  font-size:17px;
}

.gold-btn{
  min-height:44px;
  margin-top:10px;
  background:#17140d;
  border:1px solid #6e581d;
  color:#f0cc68;
}

.detail{
  display:none;
  margin-top:8px;
}

/* ================================
   買い目
================================ */

.bet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:7px;
  padding:9px 10px;
  border-radius:10px;
  background:#0b0b0b;
  border:1px solid #302813;
  font-weight:900;
}

.bet-head.main{
  color:#71baff;
}

.bet-head.cover{
  color:#e8d7a4;
}

.bet-head.hole{
  color:#ff9b52;
}

.ticket{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 10px;
  border-bottom:1px solid #24200f;
  background:#090909;
}

.combo{
  font-weight:950;
  letter-spacing:1px;
}

.money{
  color:#efd16e;
  font-weight:900;
}

.total{
  display:flex;
  justify-content:space-between;
  border-top:1px solid #6d551c;
  margin-top:9px;
  padding-top:9px;
  font-weight:950;
}

.logic{
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:#0a0a0a;
  color:#aaa;
  font-size:10px;
  line-height:1.65;
}

/* ================================
   メニュー
================================ */

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.menu button{
  min-height:48px;
  border-radius:11px;
  border:1px solid #55451a;
  background:#111;
  color:#e8ca73;
  font-weight:900;
}

/* ================================
   成績
================================ */

.stats{
  display:none;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.tab{
  height:43px;
  border:1px solid #55451a;
  background:#131313;
  color:#ddd;
  border-radius:10px;
  font-weight:900;
}

.tab.active{
  background:
    linear-gradient(
      135deg,
      #f4d070,
      #c8901f
    );
  color:#070707;
}

.range{
  display:none;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:8px;
}

.range.show{
  display:grid;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px;
  margin-top:10px;
}

.stat{
  background:#090909;
  border:1px solid #2c2510;
  border-radius:11px;
  padding:11px;
}

.stat small{
  display:block;
  color:#aa9e78;
  font-size:10px;
}

.stat b{
  display:block;
  margin-top:3px;
  font-size:19px;
}

.green{
  color:#58dc8d;
}

.red{
  color:#ff6a6a;
}

.profit{
  margin-top:9px;
  padding:14px;
  border:1px solid #8a6719;
  border-radius:12px;
  background:
    linear-gradient(
      90deg,
      #171005,
      #080808
    );
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.profit strong{
  font-size:26px;
  color:#f1cc65;
}

.section-title{
  margin:16px 0 8px;
  color:#f2cd68;
  font-weight:950;
}

/* ================================
   的中・不的中一覧
================================ */

.history-scroll{
  overflow-x:auto;
  border:1px solid #342b12;
  border-radius:12px;
}

.history-table{
  min-width:760px;
  width:100%;
  border-collapse:collapse;
  background:#080808;
  font-size:11px;
}

.history-table th,
.history-table td{
  padding:9px 7px;
  border-bottom:1px solid #25200f;
  border-right:1px solid #201c0e;
  text-align:center;
}

.history-table th{
  color:#d8bb65;
  background:#0d0c08;
}

.hit{
  color:#ff665c;
  font-weight:950;
}

.miss{
  color:#6fb4ff;
  font-weight:950;
}

.odds{
  color:#f0d06c;
  font-weight:950;
}

.roi{
  color:#58dc8d;
  font-weight:950;
}

.toggle{
  min-height:45px;
  margin-top:8px;
  background:#131313;
  border:1px solid #55451a;
  color:#edcc70;
}

.history-wrap,
.venue-wrap{
  display:none;
}

/* ================================
   会場別成績
================================ */

.venue-row{
  display:grid;
  grid-template-columns:1.1fr .6fr .8fr .9fr;
  gap:5px;
  padding:9px 3px;
  border-bottom:1px solid #26200e;
  font-size:11px;
}

.footer{
  text-align:center;
  color:#686868;
  font-size:10px;
  line-height:1.7;
  margin-top:24px;
}

.quick{
  position:fixed;
  right:9px;
  bottom:
    calc(
      11px +
      env(safe-area-inset-bottom)
    );
  display:flex;
  flex-direction:column;
  gap:6px;
  z-index:20;
}

.quick button{
  height:42px;
  min-width:75px;
  border:1px solid #745a19;
  border-radius:999px;
  background:#111;
  color:#f0cc68;
  font-weight:900;
}

.empty{
  padding:22px 10px;
  text-align:center;
  color:#aaa;
  background:#0d0d0d;
  border:1px solid #302812;
  border-radius:14px;
  margin-bottom:12px;
}

/* ================================
   スマホ
================================ */

@media(max-width:480px){

  .brand{
    font-size:23px;
  }

  .wrap{
    padding-left:9px;
    padding-right:9px;
  }

  .panel,
  .race{
    padding:13px;
  }

  .stat b{
    font-size:17px;
  }

  .profit strong{
    font-size:23px;
  }

  .range{
    grid-template-columns:1fr;
  }

  .candidate b{
    font-size:16px;
  }

  .menu{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<div
  class="wrap"
  id="top"
>

<header class="header">

  <div class="brand">

    <span class="gold">
      🚤 BOAT RACE
    </span>

    AI予想

    <span class="ver">
      Ver.1
    </span>

  </div>

  <div class="sub">
    全国24場をAIスコアで自動評価
  </div>

</header>


<section class="panel">

  <div class="panel-title">

  <div class="budget-label">

  </div>

  <select id="budget">

    <option value="2000">
      2,000円

<section

  <div class="panel-title">

  </div>

  <div class="tabs">

    <button
      class="tab active"
      data-period="day"
    >
      今日
    </button>

    <button
      class="tab"

      class="tab"

  >

<footer class="footer">

  投票は無理のない範囲で行ってください。

</div>


<div class="quick">

  <button id="qStats">
    📊 成績
  </button>

  <button id="qTop">
    ↑ 上へ
  </button>

</div>


<script>

/* ================================
   基本設定
================================ */

const API_BASE =
  "https://boatraceopenapi.github.io/api/v1";

const STORAGE_KEY =
  "boat_ai_gold_v1_records";


const STADIUMS = {

  1:"桐生",
  2:"戸田",
  3:"江戸川",
  4:"平和島",
  5:"多摩川",
  6:"浜名湖",
  7:"蒲郡",
  8:"常滑",
  9:"津",
  10:"三国",
  11:"びわこ",
  12:"住之江",
  13:"尼崎",
  14:"鳴門",
  15:"丸亀",
  16:"児島",
  17:"宮島",
  18:"徳山",
  19:"下関",
  20:"若松",
  21:"芦屋",
  22:"福岡",
  23:"唐津",
  24:"大村"

};


let analyses = [];

let period =
  "day";


const $ =
  id =>
    document.getElementById(
      id
    );


function num(
  value,
  fallback = 0
){

  const n =
    Number(
      value
    );

  return Number.isFinite(
    n
  )
    ? n
    : fallback;

}


/* ================================
   日本時間
================================ */

function todayJST(){

  return new Intl
    .DateTimeFormat(
      "en-CA",
      {
        timeZone:
          "Asia/Tokyo",

        year:
          "numeric",

        month:
          "2-digit",

        day:
          "2-digit"
      }
    )
    .format(
      new Date()
    );

}


/* ================================
   API
================================ */

function apiURL(
  date
){

  return (
    API_BASE +
    "/" +
    date.slice(
      0,
      4
    ) +
    "/" +
    date.replaceAll(
      "-",
      ""
    ) +
    ".json"
  );

}


async function fetchToday(){

  const date =
    todayJST();

  const response =
    await fetch(

      apiURL(
        date
      ) +
      "?t=" +
      Date.now(),

      {
        cache:
          "no-store"
      }

    );


  if(
    !response.ok
  ){

    throw new Error(
      "data " +
      response.status
    );

  }


  return await response.json();

}


/* ================================
   レース一覧化
================================ */

function flatten(
  data
){

  const output = [];

  const stadiums =
    data
      ?.programs
      ?.stadiums ||
    {};


  for(
    const [
      stadiumKey,
      stadiumData
    ]
    of Object.entries(
      stadiums
    )
  ){

    for(
      const [
        raceKey,
        race
      ]
      of Object.entries(
        stadiumData
          ?.races ||
        {}
      )
    ){

      if(
        !race
      ){

        continue;

      }


      output.push({

        ...race,

        stadium_number:
          num(
            race.stadium_number,
            stadiumKey
          ),

        race_number:
          num(
            race.race_number,
            raceKey
          )

      });

    }

  }


  return output;

}


/* ================================
   レースキー
================================ */

function raceKey(
  race
){

  return (

    String(
      race.date ||
      todayJST()
    ) +

    "_" +

    String(
      race.stadium_number
    ) +

    "_" +

    String(
      race.race_number
    )

  );

}


/* ================================
   締切時間
================================ */

function closeTime(
  race
){

  const match =
    String(
      race
        ?.closed_at ||
      ""
    )
    .match(
      /(\d{2}):(\d{2})/
    );


  return match
    ? (
        match[1] +
        ":" +
        match[2]
      )
    : "--:--";

}


function upcoming(
  race
){

  if(
    !race
      ?.closed_at
  ){

    return true;

  }


  const time =
    new Date(

      String(
        race.closed_at
      )
      .replace(
        " ",
        "T"
      ) +

      "+09:00"

    )
    .getTime();


  return (
    Number.isNaN(
      time
    ) ||
    time >
    Date.now()
  );

}


/* ================================
   展示データ
================================ */

function previewReady(
  race
){

  const racers =
    race
      ?.preview
      ?.racers;


  if(
    !racers
  ){

    return false;

  }


  for(
    let boat = 1;
    boat <= 6;
    boat++
  ){

    const preview =
      racers[
        String(
          boat
        )
      ];


    if(
      !preview
    ){

      return false;

    }


    const exhibition =
      Number(
        preview.exhibition_time
      );

    const start =
      Number(
        preview.start_timing
      );


    if(
      !Number.isFinite(
        exhibition
      ) ||
      exhibition <= 0
    ){

      return false;

    }


    if(
      !Number.isFinite(
        start
      )
    ){

      return false;

    }

  }


  return true;

}


/* ================================
   艇スコア
================================ */

function scoreBoat(
  racer,
  preview,
  entry
){

  let score = 0;


  const nationalWin =
    num(
      racer
        ?.national_win_rate,
      5
    );


  const national2 =
    num(
      racer
        ?.national_top_2_percent,
      30
    );


  const national3 =
    num(
      racer
        ?.national_top_3_percent,
      45
    );


  const localWin =
    num(
      racer
        ?.local_win_rate,
      nationalWin
    );


  const local2 =
    num(
      racer
        ?.local_top_2_percent,
      national2
    );


  const motor2 =
    num(
      racer
        ?.motor_top_2_percent,
      30
    );


  const motor3 =
    num(
      racer
        ?.motor_top_3_percent,
      45
    );


  const boat2 =
    num(
      racer
        ?.boat_top_2_percent,
      30
    );


  const averageST =
    num(
      racer
        ?.average_start_timing,
      .18
    );


  const exhibition =
    num(
      preview
        ?.exhibition_time,
      6.85
    );


  const exhibitionST =
    num(
      preview
        ?.start_timing,
      averageST
    );


  const rank =
    num(
      racer
        ?.rank_number,
      4
    );


  const flying =
    num(
      racer
        ?.flying_count,
      0
    );


  const course =
    num(
      preview
        ?.course_number,
      entry
    );


  score +=
    nationalWin *
    8;


  score +=
    national2 *
    .35;


  score +=
    national3 *
    .12;


  score +=
    localWin *
    4;


  score +=
    local2 *
    .18;


  score +=
    motor2 *
    .40;


  score +=
    motor3 *
    .10;


  score +=
    boat2 *
    .15;


  score +=
    Math.max(
      0,
      (
        .22 -
        averageST
      ) *
      100
    );


  score +=
    Math.max(
      -10,
      (
        6.90 -
        exhibition
      ) *
      75
    );


  score +=
    Math.max(
      -8,
      (
        .20 -
        exhibitionST
      ) *
      60
    );


  if(
    rank === 1
  ){

    score += 9;

  }
  else if(
    rank === 2
  ){

    score += 5;

  }
  else if(
    rank === 3
  ){

    score += 1;

  }
  else{

    score -= 2;

  }


  score -=
    flying *
    4;


  const courseBonus = {

    1:16,
    2:7,
    3:5,
    4:2,
    5:-1,
    6:-4

  };


  score +=
    courseBonus[
      course
    ] ||
    0;


  return score;

}


/* ================================
   レース評価
================================ */

function evaluate(
  race
){

  if(
    !previewReady(
      race
    )
  ){

    return null;

  }


  const boats = [];


  for(
    let entry = 1;
    entry <= 6;
    entry++
  ){

    const racer =
      race
        ?.racers
        ?.[
          String(
            entry
          )
        ];


    const preview =
      race
        ?.preview
        ?.racers
        ?.[
          String(
            entry
          )
        ];


    if(
      !racer ||
      !preview
    ){

      return null;

    }


    boats.push({

      boat:
        entry,

      score:
        scoreBoat(
          racer,
          preview,
          entry
        ),

      racer:
        racer,

      preview:
        preview

    });

  }


  boats.sort(
    (
      a,
      b
    ) =>
      b.score -
      a.score
  );


  const gap1 =
    boats[0].score -
    boats[1].score;


  const gap2 =
    boats[1].score -
    boats[2].score;


  let rating =
    64;


  rating +=
    Math.min(
      18,
      Math.max(
        0,
        gap1 *
        1.8
      )
    );


  rating +=
    Math.min(
      8,
      Math.max(
        0,
        gap2 *
        .9
      )
    );


  if(
    boats[0].boat ===
    1
  ){

    rating += 6;

  }


  const wind =
    num(
      race
        ?.preview
        ?.wind_speed
    );


  const wave =
    num(
      race
        ?.preview
        ?.wave_height
    );


  if(
    wind >= 5
  ){

    rating -= 3;

  }


  if(
    wind >= 8
  ){

    rating -= 4;

  }


  if(
    wave >= 5
  ){

    rating -= 3;

  }


  rating =
    Math.round(
      Math.max(
        0,
        Math.min(
          99,
          rating
        )
      )
    );


  /*
    見送り判定
    ・風が強すぎない
    ・波が高すぎない
    ・1位候補と2位候補の差が十分
  */

  const stable =
    wind < 8 &&
    wave < 7 &&
    gap1 >= 5;


  return {

    race:
      race,

    boats:
      boats,

    rating:
      rating,

    grade:
      (
        rating >= 82 &&
        stable
      )
        ? "S"
        : "B",

    gap1:
      gap1

  };

}


/* ================================
   買い目
   本線2
   押さえ5
   穴3
================================ */

function makeTickets(
  boats
){

  const [
    a,
    b,
    c,
    d,
    e,
    f
  ] =
    boats.map(
      item =>
        item.boat
    );


  const main = [

    `${a}-${b}-${c}`,

    `${a}-${c}-${b}`

  ];


  const cover = [

    `${a}-${b}-${d}`,

    `${a}-${c}-${d}`,

    `${a}-${d}-${b}`,

    `${b}-${a}-${c}`,

    `${b}-${c}-${a}`

  ];


  /*
    通常穴 2点
  */

  const normalHole = [

    `${c}-${a}-${b}`,

    `${b}-${d}-${a}`

  ];


  /*
    特殊穴ロジック 1点
    表示上は他の穴と区別しない
  */

  const used =
    new Set([

      ...main,

      ...cover,

      ...normalHole

    ]);


  const specialCandidates = [

    `${d}-${a}-${c}`,

    `${e}-${b}-${a}`,

    `${f}-${a}-${b}`,

    `${c}-${e}-${a}`

  ];


  const special =
    specialCandidates.find(
      combo =>
        !used.has(
          combo
        )
    ) ||
    `${d}-${a}-${c}`;


  return {

    main:
      main,

    cover:
      cover,

    hole:[
      ...normalHole,
      special
    ]

  };

}


/* ================================
   資金配分
================================ */

function allocate(
  tickets,
  budget
){

  const all = [

    ...tickets.main.map(
      combo => ({
        combo,
        group:
          "main"
      })
    ),

    ...tickets.cover.map(
      combo => ({
        combo,
        group:
          "cover"
      })
    ),

    ...tickets.hole.map(
      combo => ({
        combo,
        group:
          "hole"
      })
    )

  ];


  const units =
    Math.max(
      10,
      Math.floor(
        budget /
        100
      )
    );


  const base =
    Math.floor(
      units /
      all.length
    );


  let remainder =
    units -
    (
      base *
      all.length
    );


  return all.map(
    item => {

      const extra =
        remainder > 0
          ? 1
          : 0;


      if(
        remainder > 0
      ){

        remainder--;

      }


      return {

        ...item,

        money:
          (
            base +
            extra
          ) *
          100

      };

    }
  );

}

){

      ticketData.reduce(

        ) =>
          sum +
          item.money,
        0
      ),

    done:

    result:

    resultOdds:
      0,

    returnAmount:
      0,

    savedAt:
      new Date()

  });

  );

}


/* ================================
   3連単払戻
================================ */

function payouts(
  race
){

  const trifecta =
    race
      ?.result
      ?.payouts
      ?.trifecta;


  return Array.isArray(
    trifecta
  )
    ? trifecta
    : [];

}


/* ================================
   的中・不的中判定
================================ */

function settle(
  races
){

  const all =
    records();


  let changed =
    false;


  for(
    const record
    of all
  ){

    if(
      record.done
    ){

      continue;

    }


    const race =
      races.find(
        item =>
          raceKey(
            item
          ) ===
          record.key
      );


    if(
      !race
    ){

      continue;

    }


    const payoutList =
      payouts(
        race
      );


    if(
      payoutList.length === 0
    ){

      continue;

    }


    const winning =
      payoutList[0];


    const combination =
      String(
        winning.combination ||
        ""
      );


    const payout =
      num(
        winning.amount
      );


    if(
      !combination
    ){

      continue;

    }


    record.done =
      true;


    /*
      実際の着順
      例 1-3-5
    */

    record.result =
      combination;


    /*
      確定払戻額
      100円購入時の払戻
    */

    record.payout =
      payout;


    /*
      オッズ
      例
      1,850円 ÷ 100
      = 18.5倍
    */

    record.resultOdds =
      payout > 0
        ? payout /
          100
        : 0;


    const hitTicket =
      record.tickets.find(
        ticket =>
          ticket.combo ===
          combination
      );


    record.hit =
      Boolean(
        hitTicket
      );


    /*
      実際の払戻金
    */

    record.returnAmount =
      hitTicket
        ? Math.round(
            (
              payout /
              100
            ) *
            hitTicket.money
          )
        : 0;


    changed =
      true;

  }


  if(
    changed
  ){

    save(
      all
    );

  }

}

function filterRecords(){

  const all =
    records();


  if(
    period ===
    "all"
  ){

    return all;

  }


  if(
    period ===
    "day"
  ){

    return all.filter(
      record =>
        record.date ===
        todayJST()
    );

  }


  const from =
    $("fromDate").value;


  const to =
    $("toDate").value;


  return all.filter(
    record =>

      (
        !from ||
        record.date >=
        from
      ) &&

      (
        !to ||
        record.date <=
        to
      )

  );

}


/* ================================
   成績計算
================================ */

function calc(
  recordList
){

  const done =
    recordList.filter(
      record =>
        record.done
    );


  const stake =
    done.reduce(
      (
        sum,
        record
      ) =>
        sum +
        num(
          record.stake
        ),
      0
    );


  const returns =
    done.reduce(
      (
        sum,
        record
      ) =>
        sum +
        num(
          record.returnAmount
        ),
      0
    );


  const hits =
    done.filter(
      record =>
        record.hit
    )
    .length;


  const each =
    done.map(
      record => ({

        ...record,

        raceRoi:

          num(
            record.stake
          ) > 0

            ? (
                num(
                  record.returnAmount
                ) /
                num(
                  record.stake
                ) *
                100
              )

            : 0

      })
    );


  return {

    done:
      done,

    races:
      done.length,

    hits:
      hits,

    stake:
      stake,

    ret:
      returns,

    hitRate:
      done.length
        ? (
            hits /
            done.length *
            100
          )
        : 0,

    roi:
      stake
        ? (
            returns /
            stake *
            100
          )
        : 0,

    profit:
      returns -
      stake,

    maxPayout:
      each.length
        ? Math.max(
            ...each.map(
              item =>
                num(
                  item.returnAmount
                )
            )
          )
        : 0,

    maxRoi:
      each.length
        ? Math.max(
            ...each.map(
              item =>
                item.raceRoi
            )
          )
        : 0

  };

}

        3連単の確定払戻額 ÷ 100
        で表示しています。

      </div>

    `;

}


/* ================================
   会場別成績
================================ */

function renderVenue(
  recordList
){

  const done =
    recordList.filter(
      record =>
        record.done
    );


  const map =
    new Map();


  for(
    const record
    of done
  ){

    if(
      !map.has(
        record.venue
      )
    ){

      map.set(
        record.venue,
        []
      );

    }


    map
      .get(
        record.venue
      )
      .push(
        record
      );

  }


  if(
    map.size ===
    0
  ){

    $("venueStats")
      .innerHTML = `

        <div class="empty">

          会場別成績はまだありません。

        </div>

      `;


    return;

  }


  const rows =
    [
      ...map.entries()
    ]

    .map(
      (
        [
          venue,
          items
        ]
      ) => ({

        venue,

        ...calc(
          items
        )

      })
    )

    .sort(
      (
        a,
        b
      ) =>
        b.roi -
        a.roi
    );


  $("venueStats")
    .innerHTML = `

      <div class="venue-row">

        <b>
          会場
        </b>

        <b>
          R
        </b>

        <b>
          的中率
        </b>

        <b>
          回収率
        </b>

      </div>


      ${
        rows.map(
          row => `

            <div class="venue-row">

              <span>
                ${row.venue}
              </span>

              <span>
                ${row.races}
              </span>

              <span>
                ${row.hitRate.toFixed(1)}%
              </span>

              <span
                class="${
                  row.roi >= 100
                    ? "green"
                    : ""
                }"
              >

                ${row.roi.toFixed(1)}%

              </span>

            </div>

          `
        )
        .join(
          ""
        )
      }

    `;

}


/* ================================
   成績画面表示
================================ */

function showStats(
  openHistory = false,
  openVenue = false
){

  $("statsSection")
    .style.display =
    "block";


  renderStats();


  if(
    openHistory
  ){

    $("historyWrap")
      .style.display =
      "block";


    $("historyToggle")
      .textContent =
      "一覧を隠す";

  }


  if(
    openVenue
  ){

    $("venueWrap")
      .style.display =
      "block";


    $("venueToggle")
      .textContent =
      "会場別成績を隠す";

  }


  $("statsSection")
    .scrollIntoView({

      behavior:
        "smooth",

      block:
        "start"

    });

}


/* ================================
   ボタン
================================ */

$("runBtn")
  .onclick =
  loadToday;


$("refreshBtn")
  .onclick =
  loadToday;


$("statsOpen")
  .onclick =
  () =>
    showStats();


$("historyOpen")
  .onclick =
  () =>
    showStats(
      true,
      false
    );


$("venueOpen")
  .onclick =
  () =>
    showStats(
      false,
      true
    );


$("qStats")
  .onclick =
  () =>
    showStats();


$("qTop")
  .onclick =
  () =>

    $("top")
      .scrollIntoView({

        behavior:
          "smooth"

      });


$("budget")
  .onchange =
  display;


/* ================================
   履歴 開閉
================================ */

$("historyToggle")
  .onclick =
  () => {

    const wrap =
      $("historyWrap");


    const open =
      wrap.style.display ===
      "block";


    wrap.style.display =
      open
        ? "none"
        : "block";


    $("historyToggle")
      .textContent =
      open
        ? "一覧を表示"
        : "一覧を隠す";

  };


/* ================================
   会場別 開閉
================================ */

$("venueToggle")
  .onclick =
  () => {

    const wrap =
      $("venueWrap");


    const open =
      wrap.style.display ===
      "block";


    wrap.style.display =
      open
        ? "none"
        : "block";


    $("venueToggle")
      .textContent =
      open
        ? "会場別成績を表示"
        : "会場別成績を隠す";

  };


/* ================================
   今日 / 期間指定 / 全期間
================================ */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button.onclick =
        () => {

          period =
            button.dataset.period;


          document
            .querySelectorAll(
              ".tab"
            )
            .forEach(
              item =>

                item
                  .classList
                  .toggle(

                    "active",

                    item ===
                    button

                  )

            );


          $("rangeBox")
            .classList
            .toggle(

              "show",

              period ===
              "custom"

            );


          renderStats();

        };

    }
  );


$("fromDate")
  .onchange =
  renderStats;


$("toDate")
  .onchange =
  renderStats;


/* ================================
   初期表示
================================ */

renderStats();


/* ================================
   1分ごとに結果確認
================================ */

setInterval(

  async () => {

    try{

      const data =
        await fetchToday();


      const races =
        flatten(
          data
        );


      settle(
        races
      );


      renderStats();

    }
    catch{

      /*
        エラー時は何もしない
      */

    }

  },

  60 *
  1000

);


/* ================================
   アプリに戻った時
================================ */

window.addEventListener(
  "focus",
  renderStats
);

</script>
