<div class="container">

<div class="header">

<div class="card">

本日の勝負レース
</div>

</select>

↻ 最新データに更新
</button>

「勝負度Sを自動検索」を押してください。
</div>

</div>

今日
</button>

</button>

今年
</button>

</div>

<script>

const STADIUMS={
1:"桐生",2:"戸田",3:"江戸川",4:"平和島",
5:"多摩川",6:"浜名湖",7:"蒲郡",8:"常滑",
9:"津",10:"三国",11:"びわこ",12:"住之江",
13:"尼崎",14:"鳴門",15:"丸亀",16:"児島",
17:"宮島",18:"徳山",19:"下関",20:"若松",
21:"芦屋",22:"福岡",23:"唐津",24:"大村"
};

const STORE_KEY="boat_ai_s_records_v2";

let currentPeriod="month";

function n(v,f=0){
const x=Number(v);
return Number.isFinite(x)?x:f;
}

function todayJST(){
return new Intl.DateTimeFormat(
'sv-SE',
{
timeZone:'Asia/Tokyo',
year:'numeric',
month:'2-digit',
day:'2-digit'
}
).format(new Date());
}

function apiUrl(date){
const compact=date.replaceAll('-','');

return `https://boatraceopenapi.github.io/api/v1/${date.slice(0,4)}/${compact}.json`;
}

function loadRecords(){

try{

return JSON.parse(
localStorage.getItem(STORE_KEY)||'[]'
);

}catch{

return [];

}

}

function saveRecords(records){

localStorage.setItem(
STORE_KEY,
JSON.stringify(records)
);

}

function hasCompletePreview(race){

const racers=
race?.preview?.racers;

if(!racers)return false;

for(let i=1;i<=6;i++){

const r=
racers[String(i)];

if(
!r ||
r.exhibition_time==null ||
r.start_timing==null
){

return false;

}

}

return true;

}

function boatScore(
racer,
preview,
boat
){

const national=
n(racer?.national_win_rate,5);

const local=
n(racer?.local_win_rate,national);

const motor=
n(racer?.motor_top_2_percent,30);

const boatRate=
n(racer?.boat_top_2_percent,30);

const avgST=
n(racer?.average_start_timing,.18);

const ex=
n(preview?.exhibition_time,6.85);

const exST=
n(preview?.start_timing,avgST);

let score=0;

score+=national*5;
score+=local*2.7;
score+=motor*.30;
score+=boatRate*.12;

score+=Math.max(
0,
(.22-avgST)*70
);

score+=Math.max(
0,
(6.95-ex)*35
);

score+=Math.max(
0,
(.20-exST)*45
);

score+=({
1:12,
2:6,
3:4,
4:2,
5:0,
6:-2
}[boat]||0);

return score;

}

function evaluateRace(race){

if(!hasCompletePreview(race)){
return null;
}

const racers=
race?.racers||{};

const previews=
race.preview.racers;

const boats=[];

for(let i=1;i<=6;i++){

const racer=
racers[String(i)];

if(!racer)return null;

boats.push({

boat:i,

score:
boatScore(
racer,
previews[String(i)],
i
)

});

}

boats.sort(
(a,b)=>
b.score-a.score
);

const gap1=
boats[0].score-
boats[1].score;

const gap2=
boats[1].score-
boats[2].score;

let confidence=
60+
Math.min(18,gap1*2.2)+
Math.min(8,gap2);

if(boats[0].boat===1){
confidence+=7;
}

const wind=
n(race?.preview?.wind_speed,0);

const wave=
n(race?.preview?.wave_height,0);

if(wind>=6){
confidence-=6;
}

if(wave>=5){
confidence-=4;
}

confidence=
Math.max(
0,
Math.min(
99,
confidence
)
);

const grade=
confidence>=78 &&
gap1>=5
?'S'
:'A';

return{
grade,
confidence,
boats,
wind,
wave
};

}

function uniquePush(
array,
value
){

if(
value &&
!array.includes(value)
){

array.push(value);

}

}

function makeTickets(boats){

const [
a,b,c,d
]=
boats.slice(0,4)
.map(
x=>x.boat
);

const main=[];
const cover=[];
const hole=[];

uniquePush(main,`${a}-${b}-${c}`);
uniquePush(main,`${a}-${c}-${b}`);
uniquePush(main,`${a}-${b}-${d}`);

uniquePush(cover,`${a}-${c}-${d}`);
uniquePush(cover,`${a}-${d}-${b}`);
uniquePush(cover,`${b}-${a}-${c}`);
uniquePush(cover,`${b}-${c}-${a}`);

uniquePush(hole,`${c}-${a}-${b}`);
uniquePush(hole,`${b}-${d}-${a}`);
uniquePush(hole,`${d}-${a}-${c}`);

return{
main,
cover,
hole
};

}

function allTickets(t){

return[
...t.main,
...t.cover,
...t.hole
];

}

function raceKey(
date,
stadium,
raceNo
){

return `${date}-${stadium}-${raceNo}`;

}

function upsertPrediction(
date,
stadium,
raceNo,
analysis,
tickets,
stake
){

let records=
loadRecords();

const key=
raceKey(
date,
stadium,
raceNo
);

let record=
records.find(
r=>r.key===key
);

if(!record){

record={

key:key,

date:date,

stadium:
Number(stadium),

venue:
STADIUMS[stadium],

raceNo:
Number(raceNo),

confidence:
Math.round(
analysis.confidence
),

tickets:
allTickets(tickets),

stake:stake,

perTicket:
stake/10,

status:'pending',

result:'',

payout:0,

returnAmount:0,

hit:false,

createdAt:
new Date()
.toISOString()

};

records.push(
record
);

saveRecords(
records
);

}

return record;

}

function ticketHTML(
title,
className,
tickets,
amount
){

return`

<div class="bet-title ${className}">
${title}
</div>

${

tickets.map(
ticket=>

`

<div class="ticket">

<div class="combo">
${ticket}
</div>

<div class="money">
${amount.toLocaleString()}円
</div>

</div>

`

).join('')

}

`;

}

function renderRace(
placeName,
stadium,
raceNo,
race,
analysis,
date
){

const budget=
Number(
document
.getElementById(
'budget'
)
.value
);

const perTicket=
Math.max(
100,
Math.floor(
budget/10/100
)*100
);

const total=
perTicket*10;

const tickets=
makeTickets(
analysis.boats
);

const first=
analysis.boats[0];

const second=
analysis.boats[1];

const third=
analysis.boats[2];

const record=
upsertPrediction(
date,
stadium,
raceNo,
analysis,
tickets,
total
);

const closed=
race.closed_at
?race.closed_at.substring(11,16)
:'--:--';

let result=

`<span class="result-badge pending">
⏳ 結果待ち
</span>`;

if(record.status==='done'){

result=
record.hit

?`

<span class="result-badge hit">
🎯 的中
</span>

`

:`

<span class="result-badge miss">
✕ 不的中
</span>

`;

}

return`

<div
class="race-card"
data-race-key="${record.key}"
>

<div class="race-head">

<div>

<div class="place">
${placeName}
</div>

<div class="race-number">
${raceNo}R　締切 ${closed}
</div>

</div>

<div class="s-badge">
S
</div>

</div>

<div class="score">

<div class="score-main">

<span>
AI信頼度
</span>

<span class="score-value">
${analysis.confidence.toFixed(0)}%
</span>

</div>

<div class="rank">

<div class="rank-box">

<div class="rank-label">
1着候補
</div>

<div class="rank-boat">
${first.boat}号艇
</div>

</div>

<div class="rank-box">

<div class="rank-label">
2着候補
</div>

<div class="rank-boat">
${second.boat}号艇
</div>

</div>

<div class="rank-box">

<div class="rank-label">
3着候補
</div>

<div class="rank-boat">
${third.boat}号艇
</div>

</div>

</div>

</div>

${ticketHTML(
'🔵 本線 3点',
'main-title',
tickets.main,
perTicket
)}

${ticketHTML(
'🟡 押さえ 4点',
'cover-title',
tickets.cover,
perTicket
)}

${ticketHTML(
'🔴 穴 3点',
'hole-title',
tickets.hole,
perTicket
)}

<div class="total">

<span>
合計
</span>

<span>
${total.toLocaleString()}円
</span>

</div>

<div class="info">

風速 ${analysis.wind}m<br>
波高 ${analysis.wave}cm

<br>

<span class="js-result">
${result}
</span>

</div>

</div>

`;

}

function getTrifectas(result){

const arr=
result?.payouts?.trifecta;

return Array.isArray(arr)
?arr.filter(
x=>x?.combination
)
:[];

}

function findRace(
data,
stadium,
raceNo
){

const stadiums=
data?.programs?.stadiums||{};

const stadiumKey=
Object.keys(stadiums)
.find(
key=>
Number(key)===
Number(stadium)
);

if(stadiumKey==null){
return null;
}

const races=
stadiums[
stadiumKey
]?.races||{};

const raceKey=
Object.keys(races)
.find(
key=>
Number(key)===
Number(raceNo)
);

return raceKey==null
?null
:races[raceKey];

}

function syncTodayPredictions(
data,
date
){

const stadiums=
data?.programs?.stadiums||{};

const budget=
Number(
document
.getElementById(
'budget'
)?.value||1000
);

const perTicket=
Math.max(
100,
Math.floor(
budget/10/100
)*100
);

const stake=
perTicket*10;

for(
const [stadium,sd]
of Object.entries(
stadiums
)
){

for(
const [raceNo,race]
of Object.entries(
sd?.races||{}
)
){

const analysis=
evaluateRace(
race
);

if(
!analysis ||
analysis.grade!=='S'
){

continue;

}

upsertPrediction(
date,
stadium,
raceNo,
analysis,
makeTickets(
analysis.boats
),
stake
);

}

}

}

function settleFromData(
data,
date
){

let records=
loadRecords();

let changed=false;

for(
const record
of records
){

if(
record.date!==date ||
record.status==='done'
){

continue;

}

const race=
findRace(
data,
record.stadium,
record.raceNo
);

const trifectas=
getTrifectas(
race?.result
);

if(!trifectas.length){

continue;

}

const hitRace=
trifectas.find(
tf=>
record.tickets.includes(
tf.combination
)
);

const displayed=
hitRace||
trifectas[0];

record.status=
'done';

record.result=
trifectas.map(
tf=>tf.combination
).join(' / ');

record.payout=
n(
displayed?.amount,
0
);

record.hit=
!!hitRace;

record.returnAmount=
hitRace

?Math.round(
record.perTicket*
n(
hitRace.amount,
0
)/
100
)

:0;

record.settledAt=
new Date()
.toISOString();

changed=true;

}

if(changed){

saveRecords(
records
);

}

}

function isUpcoming(race){

if(!race?.closed_at){

return true;

}

const time=
new Date(
race.closed_at
.replace(
' ',
'T'
)
+'+09:00'
);

return(
time.getTime()
>
Date.now()
);

}

async function loadToday(){

const status=
document
.getElementById(
'status'
);

const results=
document
.getElementById(
'results'
);

const date=
todayJST();

status.textContent=
'最新データを取得しています…';

results.innerHTML='';

try{

const response=
await fetch(
`${apiUrl(date)}?t=${Date.now()}`,
{
cache:'no-store'
}
);

if(!response.ok){

throw new Error(
`HTTP ${response.status}`
);

}

const data=
await response.json();

syncTodayPredictions(
data,
date
);

settleFromData(
data,
date
);

const stadiums=
data?.programs?.stadiums||{};

let html='';

let count=0;

for(
const [stadium,sd]
of Object.entries(
stadiums
)
){

for(
const [raceNo,race]
of Object.entries(
sd?.races||{}
)
){

if(!isUpcoming(race)){

continue;

}

const analysis=
evaluateRace(
race
);

if(
!analysis ||
analysis.grade!=='S'
){

continue;

}

html+=
renderRace(
STADIUMS[stadium],
stadium,
raceNo,
race,
analysis,
date
);

count++;

}

}

results.innerHTML=

html ||

`

<div class="no-race">

現在、勝負度Sが確定したレースはありません。

<br><br>

展示情報公開後に
「最新データに更新」
を押してください。

</div>

`;

status.textContent=
`${date}：S確定 ${count}レース`;

renderStats();

}catch(error){

console.error(
error
);

status.textContent=
'データ取得に失敗しました。';

results.innerHTML=

`

<div class="no-race">

APIデータを取得できませんでした。

</div>

`;

}

}

function periodMatch(
date,
period
){

const today=
todayJST();

if(period==='day'){

return date===today;

}

if(period==='month'){

return(
date.slice(0,7)===
today.slice(0,7)
);

}

return(
date.slice(0,4)===
today.slice(0,4)
);

}

function calcStats(rows){

const done=
rows.filter(
r=>
r.status==='done'
);

const races=
done.length;

const hits=
done.filter(
r=>r.hit
).length;

const stake=
done.reduce(
(sum,r)=>
sum+n(r.stake),
0
);

const returns=
done.reduce(
(sum,r)=>
sum+n(r.returnAmount),
0
);

return{

races:races,

hits:hits,

stake:stake,

returns:returns,

hitRate:
races
?hits/races*100
:0,

roi:
stake
?returns/stake*100
:0,

profit:
returns-stake

};

}

function setPeriod(period){

currentPeriod=
period;

renderStats();

}

function renderStats(){

for(
const period
of [
'day',
'month',
'year'
]
){

document
.getElementById(
`tab-${period}`
)
?.classList.toggle(
'active',
period===currentPeriod
);

}

const rows=
loadRecords()

.filter(
r=>
periodMatch(
r.date,
currentPeriod
)
)

.sort(
(a,b)=>{

if(
a.date!==b.date
){

return b.date.localeCompare(
a.date
);

}

if(
Number(a.stadium)!==
Number(b.stadium)
){

return(
Number(a.stadium)-
Number(b.stadium)
);

}

return(
Number(a.raceNo)-
Number(b.raceNo)
);

}
);

const stats=
calcStats(
rows
);

const profitClass=
stats.profit>=0
?'positive'
:'negative';

document
.getElementById(
'stats'
)
.innerHTML=

`

<div class="stats-grid">

<div class="stat">
<div class="stat-label">
確定レース
</div>
<div class="stat-value">
${stats.races}
</div>
</div>

<div class="stat">
<div class="stat-label">
的中
</div>
<div class="stat-value">
${stats.hits}
</div>
</div>

<div class="stat">
<div class="stat-label">
的中率
</div>
<div class="stat-value">
${stats.hitRate.toFixed(1)}%
</div>
</div>

<div class="stat">
<div class="stat-label">
回収率
</div>
<div class="stat-value">
${stats.roi.toFixed(1)}%
</div>
</div>

<div class="stat">
<div class="stat-label">
投資額
</div>
<div class="stat-value">
${stats.stake.toLocaleString()}円
</div>
</div>

<div class="stat">
<div class="stat-label">
収支
</div>
<div class="stat-value ${profitClass}">
${stats.profit>=0?'+':''}${stats.profit.toLocaleString()}円
</div>
</div>

</div>

`;

const history=
document
.getElementById(
'raceHistory'
);

if(rows.length===0){

history.innerHTML=

`

<div class="small">

この期間に保存された
Sレースはありません。

<br>

「勝負度Sを自動検索」
を押すと記録されます。

</div>

`;

}else{

history.innerHTML=

rows.map(
record=>{

const venue=
record.venue||
STADIUMS[
record.stadium
]||
'会場';

let state='';

if(
record.status!=='done'
){

state=

`

<span class="history-pending">
⏳ 結果待ち
</span>

`;

}else if(record.hit){

state=

`

<span class="history-hit">
🎯 的中
</span>

`;

}else{

state=

`

<span class="history-miss">
✕ 不的中
</span>

`;

}

const raceResult=

record.status==='done'

?`

<div class="history-result">
3連単結果：
${record.result||'--'}
</div>

`

:'';

return`

<div class="history-item">

<div class="history-top">

<div>

<div class="history-race">
${venue} ${record.raceNo}R
</div>

<div class="history-date">
${record.date}
・AI信頼度
${record.confidence||'-'}%
</div>

</div>

<div>
${state}
</div>

</div>

${raceResult}

</div>

`;

}

).join('');

}

const groups={};

for(
const record
of rows
){

const venue=
record.venue||
STADIUMS[
record.stadium
];

if(!groups[venue]){

groups[venue]=[];

}

groups[venue].push(
record
);

}

const entries=
Object.entries(
groups
)

.map(
([venue,data])=>
[
venue,
calcStats(data)
]
)

.sort(
(a,b)=>
b[1].roi-
a[1].roi
);

document
.getElementById(
'venueStats'
)
.innerHTML=

entries.length

?`

<div class="venue-row">

<strong>
会場
</strong>

<strong>
的中率
</strong>

<strong>
回収率
</strong>

<strong>
収支
</strong>

</div>

${

entries.map(
([venue,s])=>

`

<div class="venue-row">

<strong>
${venue}
</strong>

<span>
${s.hitRate.toFixed(1)}%
</span>

<span>
${s.roi.toFixed(1)}%
</span>

<span class="${s.profit>=0?'positive':'negative'}">

${s.profit>=0?'+':''}${s.profit.toLocaleString()}円

</span>

</div>

`

).join('')

}

`

:`

<div class="small">

この期間には
確定済みの成績がありません。

</div>

`;

}

async function refreshPendingResults(){

const date=
todayJST();

try{

const response=
await fetch(
`${apiUrl(date)}?t=${Date.now()}`,
{
cache:'no-store'
}
);

if(!response.ok){

return;

}

const data=
await response.json();

syncTodayPredictions(
data,
date
);

settleFromData(
data,
date
);

renderStats();

}catch(error){

console.log(
error
);

}

}

renderStats();

refreshPendingResults();

setInterval(
refreshPendingResults,
60000
);

document.addEventListener(
'visibilitychange',
()=>{

if(!document.hidden){

refreshPendingResults();

}

}
);

window.addEventListener(
'focus',
refreshPendingResults
);

</script>

</body>
</html>
