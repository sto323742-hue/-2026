<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOAT RACE AI予想</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #08111f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .sub-title {
      text-align: center;
      color: #9fb3c8;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .card {
      background: #111c2d;
      border: 1px solid #24344c;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }

    .card-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #5ec8ff;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      color: #b8c8da;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #31445e;
      border-radius: 10px;
      background: #0b1524;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #35b9ff;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .racer-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .boat {
      border-radius: 12px;
      padding: 12px 6px;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      border: 2px solid transparent;
      cursor: pointer;
      user-select: none;
    }

    .boat.selected {
      transform: scale(1.04);
      border-color: #00e0ff;
      box-shadow: 0 0 12px rgba(0,224,255,0.6);
    }

    .b1 {
      background: #f5f5f5;
      color: #111;
    }

    .b2 {
      background: #444;
      color: white;
    }

    .b3 {
      background: #e53935;
      color: white;
    }

    .b4 {
      background: #1565c0;
      color: white;
    }

    .b5 {
      background: #f5d442;
      color: #111;
    }

    .b6 {
      background: #43a047;
      color: white;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 16px;
      margin-top: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .predict-btn {
      background: linear-gradient(135deg, #00a8ff, #00e0ff);
      color: #00101a;
      box-shadow: 0 6px 18px rgba(0,184,255,0.3);
    }

    .reset-btn {
      background: #27374d;
      color: white;
      margin-top: 10px;
      font-size: 14px;
      padding: 12px;
    }

    .result {
      display: none;
    }

    .rank {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 9px;
      background: #0b1524;
      border-left: 5px solid #00bfff;
    }

    .rank-main {
      font-size: 19px;
      font-weight: bold;
    }

    .rank-sub {
      font-size: 12px;
      color: #9eb2c8;
      margin-top: 3px;
    }

    .confidence {
      text-align: center;
      margin-bottom: 15px;
    }

    .confidence-badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 24px;
      font-weight: bold;
    }

    .s {
      background: #ff3b30;
      color: white;
    }

    .a {
      background: #ff9500;
      color: white;
    }

    .b {
      background: #ffd60a;
      color: #111;
    }

    .c {
      background: #636366;
      color: white;
    }

    .bet-section {
      margin-top: 14px;
    }

    .bet-title {
      font-size: 15px;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    .bet {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0b1524;
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 7px;
    }

    .bet-number {
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .bet-money {
      color: #6ee7ff;
      font-weight: bold;
    }

    .main {
      border-left: 4px solid #00d4ff;
    }

    .cover {
      border-left: 4px solid #ffd60a;
    }

    .hole {
      border-left: 4px solid #ff375f;
    }

    .formation {
      background: #091321;
      border-radius: 12px;
      padding: 13px;
      line-height: 1.7;
      font-size: 14px;
      margin-top: 12px;
      color: #d7e6f5;
    }

    .memo {
      background: #0b1524;
      border-radius: 12px;
      padding: 13px;
      font-size: 13px;
      line-height: 1.7;
      color: #afc1d5;
      margin-top: 12px;
    }

    .highlight {
      color: #4bd6ff;
      font-weight: bold;
    }

    .warning {
      color: #ffcb66;
    }

    footer {
      text-align: center;
      color: #61758d;
      font-size: 11px;
      padding: 20px 0 30px;
    }

    @media (max-width: 480px) {
      .container {
        padding: 12px;
      }

      h1 {
        font-size: 24px;
      }

      .grid2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚤 BOAT RACE AI予想</h1>
  <div class="sub-title">
    データ入力型・3連単予想ツール
  </div>

  <div class="card">

    <div class="card-title">① レース情報</div>

    <label>開催場</label>
    <select id="stadium">
      <option>桐生</option>
      <option>戸田</option>
      <option>江戸川</option>
      <option>平和島</option>
      <option>多摩川</option>
      <option>浜名湖</option>
      <option>蒲郡</option>
      <option>常滑</option>
      <option>津</option>
      <option>三国</option>
      <option>びわこ</option>
      <option>住之江</option>
      <option>尼崎</option>
      <option>鳴門</option>
      <option>丸亀</option>
      <option>児島</option>
      <option>宮島</option>
      <option selected>徳山</option>
      <option>下関</option>
      <option>若松</option>
      <option>芦屋</option>
      <option>福岡</option>
      <option>唐津</option>
      <option>大村</option>
    </select>

    <div class="grid2">

      <div>
        <label>レース</label>
        <select id="race">
          <option>1R</option>
          <option>2R</option>
          <option>3R</option>
          <option>4R</option>
          <option>5R</option>
          <option>6R</option>
          <option>7R</option>
          <option>8R</option>
          <option>9R</option>
          <option>10R</option>
          <option>11R</option>
          <option>12R</option>
        </select>
      </div>

      <div>
        <label>購入資金</label>
        <select id="budget">
          <option value="1000">1,000円</option>
          <option value="2000">2,000円</option>
          <option value="3000" selected>3,000円</option>
          <option value="5000">5,000円</option>
          <option value="10000">10,000円</option>
        </select>
      </div>

    </div>

  </div>

  <div class="card">

    <div class="card-title">② 注目する艇を選択</div>

    <div class="racer-grid">

      <div class="boat b1 selected" data-boat="1">
        1号艇
      </div>

      <div class="boat b2" data-boat="2">
        2号艇
      </div>

      <div class="boat b3" data-boat="3">
        3号艇
      </div>

      <div class="boat b4" data-boat="4">
        4号艇
      </div>

      <div class="boat b5" data-boat="5">
        5号艇
      </div>

      <div class="boat b6" data-boat="6">
        6号艇
      </div>

    </div>

    <label>イン逃げ信頼度</label>
    <select id="inner">
      <option value="high">高い</option>
      <option value="normal" selected>普通</option>
      <option value="low">低い</option>
    </select>

    <label>荒れ度</label>
    <select id="rough">
      <option value="low">低い</option>
      <option value="normal" selected>普通</option>
      <option value="high">高い・穴狙い</option>
    </select>

  </div>

  <div class="card">

    <div class="card-title">③ 展示・水面情報</div>

    <div class="grid2">

      <div>
        <label>風速</label>
        <select id="wind">
          <option value="0">0〜2m</option>
          <option value="1">3〜4m</option>
          <option value="2">5m以上</option>
        </select>
      </div>

      <div>
        <label>展示気配</label>
        <select id="exhibition">
          <option value="normal">普通</option>
          <option value="inside">内枠良好</option>
          <option value="outside">外枠良好</option>
        </select>
      </div>

    </div>

    <label>メモ</label>
    <input
      id="raceMemo"
      type="text"
      placeholder="例：3号艇の展示が良い、向かい風など"
    >

    <button class="predict-btn" onclick="predictRace()">
      🤖 AI予想する
    </button>

    <button class="reset-btn" onclick="resetRace()">
      入力をリセット
    </button>

  </div>

  <div class="card result" id="resultCard">

    <div class="card-title">④ AI予想結果</div>

    <div class="confidence">

      <div>
        勝負度
      </div>

      <div
        id="confidence"
        class="confidence-badge a"
      >
        A
      </div>

    </div>

    <div id="ranking"></div>

    <div class="bet-section">

      <div class="bet-title">
        🔵 本線
      </div>

      <div id="mainBets"></div>

      <div class="bet-title">
        🟡 押さえ
      </div>

      <div id="coverBets"></div>

      <div class="bet-title">
        🔴 穴
      </div>

      <div id="holeBets"></div>

    </div>

    <div class="formation" id="formation"></div>

    <div class="memo" id="analysis"></div>

  </div>

  <footer>
    BOAT RACE AI予想ツール<br>
    ※予想結果は参考情報です。的中や利益を保証するものではありません。
  </footer>

</div>

<script>

  let selectedBoat = 1;

  document
    .querySelectorAll(".boat")
    .forEach(function(element) {

      element.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(".boat")
            .forEach(function(item) {
              item.classList.remove("selected");
            });

          element.classList.add("selected");

          selectedBoat =
            Number(element.dataset.boat);

        }
      );

    });


  function shuffle(array) {

    let copy = [...array];

    for (
      let i = copy.length - 1;
      i > 0;
      i--
    ) {

      let j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        copy[i],
        copy[j]
      ] = [
        copy[j],
        copy[i]
      ];

    }

    return copy;
  }


  function makeCombination(
    first,
    second,
    third
  ) {

    return (
      first +
      "-" +
      second +
      "-" +
      third
    );

  }


  function getRanking() {

    const inner =
      document.getElementById("inner").value;

    const rough =
      document.getElementById("rough").value;

    const exhibition =
      document.getElementById("exhibition").value;

    let scores = {
      1: 75,
      2: 58,
      3: 55,
      4: 49,
      5: 42,
      6: 38
    };


    scores[selectedBoat] += 16;


    if (inner === "high") {

      scores[1] += 18;
      scores[2] += 5;

    }


    if (inner === "low") {

      scores[1] -= 17;
      scores[3] += 8;
      scores[4] += 8;

    }


    if (rough === "high") {

      scores[3] += 8;
      scores[4] += 10;
      scores[5] += 7;
      scores[6] += 5;

    }


    if (exhibition === "inside") {

      scores[1] += 7;
      scores[2] += 5;
      scores[3] += 3;

    }


    if (exhibition === "outside") {

      scores[4] += 7;
      scores[5] += 6;
      scores[6] += 5;

    }


    Object.keys(scores)
      .forEach(function(key) {

        scores[key] +=
          Math.random() * 6;

      });


    return Object
      .entries(scores)
      .sort(
        function(a, b) {
          return b[1] - a[1];
        }
      )
      .map(
        function(item) {
          return Number(item[0]);
        }
      );

  }


  function predictRace() {

    const ranking =
      getRanking();

    const budget =
      Number(
        document.getElementById("budget").value
      );

    const rough =
      document.getElementById("rough").value;

    const inner =
      document.getElementById("inner").value;

    const wind =
      Number(
        document.getElementById("wind").value
      );

    const stadium =
      document.getElementById("stadium").value;

    const race =
      document.getElementById("race").value;

    const memo =
      document.getElementById("raceMemo").value;


    const first =
      ranking[0];

    const second =
      ranking[1];

    const third =
      ranking[2];

    const fourth =
      ranking[3];

    const fifth =
      ranking[4];


    let mainBets = [
      makeCombination(first, second, third),
      makeCombination(first, third, second),
      makeCombination(first, second, fourth)
    ];


    let coverBets = [
      makeCombination(second, first, third),
      makeCombination(first, third, fourth),
      makeCombination(second, third, first)
    ];


    let holeBets = [
      makeCombination(third, first, fourth),
      makeCombination(fourth, first, third)
    ];


    if (rough === "high") {

      holeBets = [
        makeCombination(third, fourth, first),
        makeCombination(fourth, third, first)
      ];

    }


    let confidence = "A";


    if (
      inner === "high" &&
      first === 1 &&
      wind === 0
    ) {

      confidence = "S";

    } else if (
      wind === 2 ||
      rough === "high"
    ) {

      confidence = "B";

    }


    const confidenceElement =
      document.getElementById("confidence");

    confidenceElement.textContent =
      confidence;

    confidenceElement.className =
      "confidence-badge " +
      confidence.toLowerCase();


    document.getElementById(
      "ranking"
    ).innerHTML =

      createRankHtml(
        "◎ 本命",
        ranking[0],
        "軸候補"
      ) +

      createRankHtml(
        "○ 対抗",
        ranking[1],
        "相手筆頭"
      ) +

      createRankHtml(
        "▲ 単穴",
        ranking[2],
        "展開次第で頭まで"
      ) +

      createRankHtml(
        "☆ 穴",
        ranking[3],
        "高配当候補"
      );


    const mainTotal =
      Math.round(
        budget * 0.55 / 100
      ) * 100;

    const coverTotal =
      Math.round(
        budget * 0.30 / 100
      ) * 100;

    let holeTotal =
      budget -
      mainTotal -
      coverTotal;


    renderBets(
      "mainBets",
      mainBets,
      mainTotal,
      "main"
    );

    renderBets(
      "coverBets",
      coverBets,
      coverTotal,
      "cover"
    );

    renderBets(
      "holeBets",
      holeBets,
      holeTotal,
      "hole"
    );


    document.getElementById(
      "formation"
    ).innerHTML =

      "<b>3連単フォーメーション例</b><br>" +

      "1着：" +
      ranking[0] +
      "・" +
      ranking[1] +
      "<br>" +

      "2着：" +
      ranking[0] +
      "・" +
      ranking[1] +
      "・" +
      ranking[2] +
      "<br>" +

      "3着：" +
      ranking[0] +
      "・" +
      ranking[1] +
      "・" +
      ranking[2] +
      "・" +
      ranking[3];


    let text =
      "<span class='highlight'>" +
      stadium +
      " " +
      race +
      "</span><br><br>" +

      "AI評価では <b>" +
      ranking[0] +
      "号艇</b> を中心視。" +

      "対抗は <b>" +
      ranking[1] +
      "号艇</b>、" +

      "穴候補は <b>" +
      ranking[3] +
      "号艇</b> です。<br><br>";


    if (rough === "high") {

      text +=
        "<span class='warning'>" +
        "荒れ想定のため、外枠・まくり差し展開を通常より高く評価しています。" +
        "</span><br><br>";

    }


    if (memo !== "") {

      text +=
        "入力メモ： " +
        memo +
        "<br><br>";

    }


    text +=
      "購入資金：" +
      budget.toLocaleString() +
      "円";


    document.getElementById(
      "analysis"
    ).innerHTML =
      text;


    document.getElementById(
      "resultCard"
    ).style.display =
      "block";


    document.getElementById(
      "resultCard"
    ).scrollIntoView({
      behavior: "smooth"
    });

  }


  function createRankHtml(
    mark,
    boat,
    description
  ) {

    return `
      <div class="rank">
        <div>
          <div class="rank-main">
            ${mark} ${boat}号艇
          </div>

          <div class="rank-sub">
            ${description}
          </div>
        </div>
      </div>
    `;

  }


  function renderBets(
    elementId,
    bets,
    total,
    className
  ) {

    const element =
      document.getElementById(elementId);

    element.innerHTML = "";


    const each =
      Math.floor(
        total /
        bets.length /
        100
      ) * 100;


    let remaining =
      total;


    bets.forEach(
      function(bet, index) {

        let money = each;


        if (
          index ===
          bets.length - 1
        ) {

          money =
            Math.max(
              100,
              remaining
            );

        }


        remaining -= money;


        element.innerHTML += `
          <div class="bet ${className}">
            <span class="bet-number">
              ${bet}
            </span>

            <span class="bet-money">
              ${money.toLocaleString()}円
            </span>
          </div>
        `;

      }
    );

  }


  function resetRace() {

    document.getElementById(
      "raceMemo"
    ).value = "";

    document.getElementById(
      "resultCard"
    ).style.display =
      "none";

    selectedBoat = 1;


    document
      .querySelectorAll(".boat")
      .forEach(
        function(item) {
          item.classList.remove(
            "selected"
          );
        }
      );


    document
      .querySelector(
        '[data-boat="1"]'
      )
      .classList.add(
        "selected"
      );

  }

</script>

</body>
</html>
