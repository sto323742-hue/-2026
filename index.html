<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08111f">

<title>BOAT RACE AI予想</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#08111f;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
}

.container{
  width:100%;
  max-width:720px;
  margin:auto;
  padding:20px 14px 80px;
}

.header{
  text-align:center;
  padding:18px 0 22px;
}

.header h1{
  margin:0;
  font-size:28px;
}

.sub{
  color:#91a7bf;
  font-size:13px;
  margin-top:8px;
}

.card{
  background:#101e31;
  border:1px solid #2c405b;
  border-radius:20px;
  padding:18px;
  margin-bottom:16px;
}

.title{
  color:#49cfff;
  font-size:21px;
  font-weight:900;
  margin-bottom:16px;
}

label{
  display:block;
  color:#b8c5d6;
  margin-bottom:7px;
  font-size:14px;
}

select{
  width:100%;
  height:54px;
  border:2px solid #304864;
  border-radius:14px;
  background:#081524;
  color:#fff;
  font-size:17px;
  padding:0 12px;
}

button{
  width:100%;
  min-height:56px;
  border:0;
  border-radius:16px;
  background:linear-gradient(135deg,#18cbea,#1478ff);
  color:#fff;
  font-size:17px;
  font-weight:900;
  margin-top:12px;
  padding:10px;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.refresh{
  background:#263b55;
}

/* 成績を見るボタン */
.stats-button{
  background:linear-gradient(
    135deg,
    #7b46ff,
    #b251ff
  );
}

/* Sレースへ戻るボタン */
.back-button{
  background:#263b55;
  margin-bottom:14px;
}

.status{
  background:#091725;
  border-radius:14px;
  padding:13px;
  color:#b9c9da;
  font-size:14px;
  line-height:1.6;
}

.loading{
  text-align:center;
  padding:25px;
  color:#58d6ff;
  font-weight:bold;
}

.small{
  font-size:12px;
  color:#7890aa;
  margin-top:10px;
  line-height:1.6;
}

.race-card{
  background:#101e31;
  border:2px solid #1dd1ff;
  border-radius:20px;
  padding:18px;
  margin-bottom:18px;
}

.race-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.place-row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.place{
  font-size:22px;
  font-weight:900;
}

/* レース時間 */
.race-time{
  color:#55d8ff;
  font-size:17px;
  font-weight:900;
  background:#0c2a42;
  border:1px solid #24506c;
  border-radius:9px;
  padding:4px 9px;
  white-space:nowrap;
}

.race-number{
  color:#9db2c8;
  margin-top:4px;
  font-size:14px;
}

.s-badge{
  background:#ff4059;
  color:#fff;
  font-size:22px;
  font-weight:900;
  border-radius:13px;
  padding:8px 13px;
}

.score{
  background:#081725;
  border-radius:14px;
  padding:12px;
  margin-top:14px;
}

.score-main{
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

.score-value{
  color:#53dcff;
}

.rank{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.rank-box{
  text-align:center;
  background:#081725;
  border-radius:12px;
  padding:10px 5px;
}

.rank-label{
  color:#849bb4;
  font-size:11px;
}

.rank-boat{
  font-size:22px;
  font-weight:900;
  margin-top:4px;
}

.bet-title{
  margin-top:16px;
  margin-bottom:8px;
  font-size:17px;
  font-weight:900;
}

.main-title{
  color:#55d8ff;
}

.cover-title{
  color:#ffd457;
}

.hole-title{
  color:#ff818c;
}

.ticket{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#081725;
  border:1px solid #294158;
  padding:11px 12px;
  border-radius:12px;
  margin-bottom:7px;
}

.combo{
  font-size:20px;
  font-weight:900;
  letter-spacing:2px;
}

.money{
  color:#72dcff;
  font-weight:800;
}

.total{
  border-top:1px solid #334b65;
  margin-top:15px;
  padding-top:13px;
  display:flex;
  justify-content:space-between;
  font-weight:900;
}

.info{
  margin-top:14px;
  background:#081725;
  border-radius:13px;
  padding:13px;
  font-size:13px;
  line-height:1.7;
  color:#c3d0df;
}

.result-box{
  margin-top:14px;
  padding:14px;
  border-radius:14px;
  background:#081725;
  font-weight:800;
  line-height:1.7;
}

.hit{
  border:1px solid #35df8d;
  color:#63efa8;
}

.miss{
  border:1px solid #ff6575;
  color:#ff8995;
}

.wait{
  border:1px solid #48617c;
  color:#aabbd0;
}

.no-race{
  text-align:center;
  padding:30px 15px;
  background:#101e31;
  border-radius:18px;
  color:#b4c3d3;
  line-height:1.8;
  margin-bottom:18px;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.stat{
  background:#081725;
  border-radius:14px;
  padding:14px;
}

.stat-label{
  color:#8da4bb;
  font-size:12px;
}

.stat-value{
  font-size:22px;
  font-weight:900;
  margin-top:4px;
}

.green{
  color:#5ce6a1;
}

.blue{
  color:#56d8ff;
}

.yellow{
  color:#ffd65a;
}

.stadium-title{
  margin-top:20px;
  margin-bottom:8px;
  font-size:16px;
  font-weight:900;
}

.stadium-row{
  display:grid;
  grid-template-columns:1.3fr .8fr .8fr;
  gap:8px;
  border-bottom:1px solid #25384d;
  padding:10px 0;
  font-size:13px;
}

.stadium-row > div:nth-child(2),
.stadium-row > div:nth-child(3){
  text-align:right;
}

.footer{
  text-align:center;
  color:#607891;
  font-size:11px;
  margin-top:30px;
}

@media(max-width:480px){

  .container{
    padding-left:12px;
    padding-right:12px;
  }

  .place{
    font-size:20px;
  }

  .race-time{
    font-size:15px;
    padding:4px 8px;
  }

  .place-row{
    gap:8px;
  }
}

</style>
</head>

/* =========================
   日本時間
========================= */

function todayJST(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:"Asia/Tokyo",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(
      new Date()
    );


  const obj = {};


  parts.forEach(
    p =>
      obj[p.type] =
        p.value
  );


  return (
    `${obj.year}-${obj.month}-${obj.day}`
  );

}


/* =========================
   API
========================= */

function apiURL(date){

  const compact =
    date.replaceAll(
      "-",
      ""
    );


  const year =
    date.substring(
      0,
      4
    );


  return (
    `${API_BASE}/${year}/${compact}.json`
  );

}


/* =========================
   レース時間
========================= */

function getRaceTime(race){

  const value =
    race?.closed_at;


  if(!value){

    return "--:--";

  }


  const match =
    String(value).match(
      /(\d{2}):(\d{2})/
    );


  if(!match){

    return "--:--";

  }


  return (
    `${match[1]}:${match[2]}`
  );

}
