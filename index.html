<script>
const API_BASE='https://boatraceopenapi.github.io/api/v1';
const ODDS_URL='./odds_today.json';
const STORAGE_KEY='boat_ai_gold_v1_records';
const MODEL_NAME='gold-v3-learning-proximity-venue100-oddsrank-localjson';
const EVALUATION_STAKE=1000;
const STADIUMS={1:'桐生',2:'戸田',3:'江戸川',4:'平和島',5:'多摩川',6:'浜名湖',7:'蒲郡',8:'常滑',9:'津',10:'三国',11:'びわこ',12:'住之江',13:'尼崎',14:'鳴門',15:'丸亀',16:'児島',17:'宮島',18:'徳山',19:'下関',20:'若松',21:'芦屋',22:'福岡',23:'唐津',24:'大村'};
const WEATHER_NAMES={1:'晴',2:'曇',3:'雨',4:'雪',5:'霧'};
let analyses=[],period='day',lastDataSignature='',autoUpdateBusy=false,historyVenue='all',historyResult='all',lastOddsData=null;
const $=id=>document.getElementById(id),num=(v,d=0)=>Number.isFinite(Number(v))?Number(v):d,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function todayJST(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function apiURL(d){return `${API_BASE}/${d.slice(0,4)}/${d.replaceAll('-','')}.json`}
function normalizeLocalOdds(data){
  if(!data||typeof data!=='object')return null;
  const expected=todayJST().replaceAll('-','');
  if(String(data.date||'')!==expected)return null;
  const stadiums=data.stadiums||{};
  const odds=[];

  for(const [stadiumKey,stadium] of Object.entries(stadiums)){
    const races=stadium?.races||{};
    for(const [raceKey,race] of Object.entries(races)){
      const flat=race?.trifecta||{};
      const nested={};

      for(const [combo,value] of Object.entries(flat)){
        const m=String(combo).match(/^([1-6])-([1-6])-([1-6])$/);
        const odd=Number(value);
        if(!m||!Number.isFinite(odd)||odd<=0)continue;
        const [,a,b,c]=m;
        nested[a]??={};
        nested[a][b]??={};
        nested[a][b][c]=odd;
      }

      if(Object.keys(nested).length){
        odds.push({
          stadium_number:Number(stadiumKey),
          number:Number(raceKey),
          trifecta_odds:nested
        });
      }
    }
  }

  return odds.length?{
    date:data.date,
    updated_at:data.updated_at||'',
    odds
  }:null;
}

async function fetchJSONWithTimeout(url,timeout=12000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeout);
  try{
    const r=await fetch(url,{
      cache:'no-store',
      signal:controller.signal
    });
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    return await r.json();
  }finally{
    clearTimeout(timer);
  }
}

async function fetchOddsToday(){
  try{
    const raw=await fetchJSONWithTimeout(
      `${ODDS_URL}?t=${Date.now()}`,
      12000
    );
    const normalized=normalizeLocalOdds(raw);
    if(!normalized)throw new Error('odds_today.json が空、または本日分ではありません');
    return normalized;
  }catch(e){
    console.warn('local odds unavailable',e);
    return null;
  }
}
async function fetchToday(){const r=await fetch(apiURL(todayJST())+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data '+r.status);return r.json()}
function flatten(data){const out=[],ss=data?.programs?.stadiums||{};for(const [sk,sd] of Object.entries(ss))for(const [rk,r] of Object.entries(sd?.races||{}))if(r)out.push({...r,stadium_number:num(r.stadium_number,sk),race_number:num(r.race_number,rk)});return out}
function raceKey(r){return `${r.date||todayJST()}_${r.stadium_number}_${r.race_number}`}
function closeTime(r){const m=String(r?.closed_at||'').match(/(\d{2}):(\d{2})/);return m?`${m[1]}:${m[2]}`:'--:--'}
function upcoming(r){if(!r?.closed_at)return true;const t=new Date(String(r.closed_at).replace(' ','T')+'+09:00').getTime();return Number.isNaN(t)||t>Date.now()}
function minutesToClose(r){
  if(!r?.closed_at)return Infinity;
  const t=new Date(String(r.closed_at).replace(' ','T')+'+09:00').getTime();
  if(Number.isNaN(t))return Infinity;
  return (t-Date.now())/60000;
}
function finalDecision(a){
  const m=minutesToClose(a.race);
  const oddsReady=num(a.oddsCoverage)>=80;
  const topProb=num(a.scenario?.top?.probability);
  const stableWater=num(a.weather?.windSpeed)<8&&num(a.weather?.wave)<7;
  const entryStable=(a.courseChanges||[]).length<=1;
  const exhibitionAligned=(a.exhibitionRank||[]).slice(0,3).includes(a.boats?.[0]?.boat);
  const stAligned=(a.startRank||[]).slice(0,3).includes(a.boats?.[0]?.boat);
  const strictPass=a.grade==='S'&&stableWater&&entryStable&&topProb>=.28&&exhibitionAligned&&stAligned&&oddsReady;
  if(m<=5&&m>=0){
    return {status:strictPass?'confirmed':'hold',label:strictPass?'✅ 最終確定':'⚠️ 最終見送り',minutes:m,strictPass};
  }
  if(m<=15&&m>5){
    return {status:'checking',label:'🔥 最終判定中',minutes:m,strictPass};
  }
  return {status:'waiting',label:'⏳ 最終判定待ち',minutes:m,strictPass};
}
function previewReady(r){const p=r?.preview?.racers;if(!p)return false;for(let i=1;i<=6;i++){const x=p[String(i)];if(!x)return false;const e=Number(x.exhibition_time),s=Number(x.start_timing);if(!Number.isFinite(e)||e<=0||!Number.isFinite(s))return false}return true}
function weatherInfo(r){const p=r?.preview||{};return{windSpeed:num(p.wind_speed),windDirection:num(p.wind_direction_number),wave:num(p.wave_height),weather:num(p.weather_number),air:num(p.air_temperature),water:num(p.water_temperature)}}
function scoreBoat(r,p,entry){let s=0;const nw=num(r?.national_win_rate,5),n2=num(r?.national_top_2_percent,30),n3=num(r?.national_top_3_percent,45),lw=num(r?.local_win_rate,nw),l2=num(r?.local_top_2_percent,n2),m2=num(r?.motor_top_2_percent,30),m3=num(r?.motor_top_3_percent,45),b2=num(r?.boat_top_2_percent,30),ast=num(r?.average_start_timing,.18),ex=num(p?.exhibition_time,6.85),est=num(p?.start_timing,ast),rank=num(r?.rank_number,4),f=num(r?.flying_count,0),course=num(p?.course_number,entry);s+=nw*8+n2*.35+n3*.12+lw*4+l2*.18+m2*.4+m3*.1+b2*.15;s+=Math.max(0,(.22-ast)*100)+Math.max(-10,(6.9-ex)*75)+Math.max(-8,(.2-est)*60);s+=rank===1?9:rank===2?5:rank===3?1:-2;s-=f*4;s+=({1:16,2:7,3:5,4:2,5:-1,6:-4}[course]||0);return s}
function exhibitionRank(boats){return[...boats].sort((a,b)=>num(a.preview?.exhibition_time,99)-num(b.preview?.exhibition_time,99)).map(x=>x.boat)}
function startRank(boats){return[...boats].sort((a,b)=>num(a.preview?.start_timing,9)-num(b.preview?.start_timing,9)).map(x=>x.boat)}

  const favorite=market[0];
  const boats=favorite.combo.split('-').map(Number);

    if(odds>=20)bonus+=0.20;
    if(odds>=50)bonus+=0.10;

function makeTrioLongshots(a){
  const pool=Array.isArray(a?.comboPool)?a.comboPool:[];

  const aiOrder=(a.boats||[]).map(x=>x.boat);

    for(let y=x+1;y<=5;y++){

        const items=perms.map(c=>pool.find(p=>p.combo===c)).filter(Boolean);

        const medianOdds=odds[Math.floor(odds.length/2)];

          key,boats,trioProb,minOdds,medianOdds,maxOdds,outsiderCount,containsTop,favorite,
          marketRank:0,score:0

    .forEach((r,i)=>r.marketRank=i+1);

      r.marketRank>=5 &&
      r.medianOdds>=35 &&
      r.maxOdds>=60 &&
      r.trioProb>=0.025 &&

    .sort((a,b)=>b.score-a.score||b.trioProb-a.trioProb);

    combo:r.key,
    probability:r.trioProb,
    marketRank:r.marketRank,
    marketMedian:r.medianOdds,
    outsiderCount:r.outsiderCount
  }));
}

function makeTickets(a){
  const source=Array.isArray(a.comboPool)&&a.comboPool.length
    ? a.comboPool.map(x=>({...x}))
    : allCombos().map(combo=>({combo,probability:comboProbability(combo,a),odds:0,ev:0}));

  const scored=addPopularityRank(source);
  const withOdds=scored.filter(x=>x.odds>0).length>=80;
  const setInfo=withOdds?popularThreeBoatSet(scored):null;

  // 人気1位3艇セットの「並び替え」を独立再評価。
  // 例: 1-4-5が人気1位なら、4-1-5 / 4-5-1 / 5-1-4 / 5-4-1 等も
  // 展示・ST・展開確率・期待値・オッズで再採点する。
  for(const x of scored){
    x.linkedSet=!!setInfo&&sameThreeBoatSet(x.combo,setInfo);
    x.linkedScore=linkedMarketScore(x,setInfo);
  }

  const used=new Set();

  // 本線3点：10倍未満は原則除外。
  // 人気上位＋AI確率を中心に、人気3艇セットの有力な裏目を昇格。
  let mainPool=scored
    .filter(x=>!withOdds||(x.odds>=10&&x.popRank<=22&&x.odds<=80))
    .sort((x,y)=>
      (Number(y.linkedSet)-Number(x.linkedSet))*0.15 ||
      (y.linkedScore-x.linkedScore) ||
      (y.probability-x.probability)
    );

  const main=[];
  for(const x of mainPool){
    if(main.length>=3)break;
    main.push(x.combo);used.add(x.combo);
  }

  // 10倍以上だけで不足するケース用。まず10倍以上のAI確率順で補完。
  for(const x of [...scored].filter(x=>!withOdds||x.odds>=10).sort((x,y)=>y.linkedScore-x.linkedScore)){
    if(main.length>=3)break;
    if(!used.has(x.combo)){main.push(x.combo);used.add(x.combo);}
  }

  // 狙い4点：10〜120倍を中心に期待値重視。
  let coverPool=scored
    .filter(x=>!used.has(x.combo)&&(!withOdds||(x.odds>=10&&x.odds<=120&&x.popRank<=55)))
    .sort((x,y)=>{
      const yScore=(y.ev*0.65)+(y.linkedScore*4)+(y.linkedSet?0.20:0);
      const xScore=(x.ev*0.65)+(x.linkedScore*4)+(x.linkedSet?0.20:0);
      return yScore-xScore;
    });

  const cover=[];
  for(const x of coverPool){
    if(cover.length>=4)break;
    cover.push(x.combo);used.add(x.combo);
  }
  for(const x of [...scored].filter(x=>!used.has(x.combo)&&(!withOdds||x.odds>=10))
      .sort((x,y)=>(y.ev-x.ev)||(y.linkedScore-x.linkedScore))){
    if(cover.length>=4)break;
    cover.push(x.combo);used.add(x.combo);
  }

  // 穴3点：30倍以上を基本にする。
  // 人気3艇セットの裏目でも、配当妙味がある場合は穴候補に残す。
  let holePool=scored
    .filter(x=>!used.has(x.combo)&&(!withOdds||(x.odds>=30&&x.popRank>=18&&x.probability>=0.0015)))
    .map(x=>({
      ...x,
      holeScore:
        x.probability*Math.log10(Math.max(x.odds,10))*(1+Math.min(x.ev,3))
        *(x.linkedSet?1.35:1)
    }))
    .sort((x,y)=>y.holeScore-x.holeScore);

  const hole=[];
  for(const x of holePool){
    if(hole.length>=3)break;
    hole.push(x.combo);used.add(x.combo);
  }

  if(withOdds&&hole.length<3){
    const fallback=scored
      .filter(x=>!used.has(x.combo)&&x.odds>=20&&x.popRank>=15)
      .sort((x,y)=>{
        const yScore=y.ev+(y.linkedSet?0.35:0)+y.linkedScore*2;
        const xScore=x.ev+(x.linkedSet?0.35:0)+x.linkedScore*2;
        return yScore-xScore;
      });
    for(const x of fallback){
      if(hole.length>=3)break;
      hole.push(x.combo);used.add(x.combo);
    }
  }

  // オッズ未取得時だけ従来方式で補完。
  if(!withOdds){
    const fallback=[...scored].sort((x,y)=>y.probability-x.probability);
    for(const x of fallback){
      if(main.length<3&&!used.has(x.combo)){main.push(x.combo);used.add(x.combo);continue;}
      if(cover.length<4&&!used.has(x.combo)){cover.push(x.combo);used.add(x.combo);continue;}
      if(hole.length<3&&!used.has(x.combo)){hole.push(x.combo);used.add(x.combo);}
      if(main.length>=3&&cover.length>=4&&hole.length>=3)break;
    }
  }

  // LINE通知や画面表示を壊さないため、オッズ取得済みでも最後は10点を保証。
  // ただし10倍未満は最後の最後の補欠扱い。
  if(withOdds){
    const fill=[...scored].filter(x=>!used.has(x.combo)).sort((x,y)=>{
      const yo=y.odds>=10?1:0, xo=x.odds>=10?1:0;
      return (yo-xo)||(y.linkedScore-x.linkedScore)||(y.probability-x.probability);
    });
    for(const x of fill){
      if(main.length<3){main.push(x.combo);used.add(x.combo);continue;}
      if(cover.length<4){cover.push(x.combo);used.add(x.combo);continue;}
      if(hole.length<3){hole.push(x.combo);used.add(x.combo);}
      if(main.length>=3&&cover.length>=4&&hole.length>=3)break;
    }
  }

  return{
    main:main.slice(0,3),
    cover:cover.slice(0,4),
    hole:hole.slice(0,3),
    special:null,
    marketSet:setInfo?{favorite:setInfo.favorite,boats:setInfo.boats,favoriteOdds:setInfo.favoriteOdds}:null
  };
}
function allocate(t,budget,a){
  const all=[
    ...t.main.map(combo=>({combo,group:'main'})),
    ...t.cover.map(combo=>({combo,group:'cover'})),
    ...t.hole.map(combo=>({combo,group:'hole'}))
  ];
  if(Array.isArray(a.comboPool))addPopularityRank(a.comboPool);
  const enriched=all.map(x=>{
    const market=(a.comboPool||[]).find(z=>z.combo===x.combo);
    return {
      ...x,
      probability:comboProbability(x.combo,a),
      odds:market?.odds||0,
      ev:market?.ev||0,
      popRank:market?.popRank||0,
      special:x.combo===t.special
    };
  });
  const units=Math.max(10,Math.floor(budget/100));
  const weights=enriched.map(x=>x.group==='main'?1.35:x.group==='cover'?1:.8);
  const tw=weights.reduce((s,x)=>s+x,0);
  let assigned=0;
  const out=enriched.map((x,i)=>{
    const u=Math.max(1,Math.floor(units*weights[i]/tw));
    assigned+=u;
    return {...x,money:u*100};
  });
  let diff=units-assigned,i=0;
  while(diff>0){out[i%out.length].money+=100;diff--;i++}
  while(diff<0){
    const target=[...out].reverse().find(x=>x.money>100);
    if(!target)break;
    target.money-=100;diff++;
  }
  return out;
}

function renderStats(){const rs=filterRecords(),s=calc(rs),pc=s.profit>=0?'green':'red';$('stats').innerHTML=`<div class="stats-grid"><div class="stat"><small>確定レース</small><b>${s.races}R</b></div><div class="stat"><small>的中数</small><b>${s.hits}R</b></div><div class="stat"><small>的中率</small><b>${s.hitRate.toFixed(1)}%</b></div><div class="stat"><small>回収率</small><b class="${s.roi>=100?'green':''}">${s.roi.toFixed(1)}%</b></div><div class="stat"><small>投資額</small><b>${s.stake.toLocaleString()}円</b></div><div class="stat"><small>払戻金</small><b>${s.ret.toLocaleString()}円</b></div><div class="stat"><small>最高払戻</small><b>${s.maxPayout.toLocaleString()}円</b></div><div class="stat"><small>最高回収率</small><b>${s.maxRoi.toFixed(1)}%</b></div></div><div class="profit"><span>収支</span><strong class="${pc}">${s.profit>=0?'+':''}${s.profit.toLocaleString()}円</strong></div>`;renderLearningStats(rs);renderLearningProgress(rs);renderHistory(rs);renderVenue(rs)}
function topScenarioText(x){const s=x?.predictionMeta?.scenario?.[0];return s?`${s.boat}号艇 ${s.tactic}`:'-'}
function renderHistory(rs){const allDone=rs.filter(x=>x.done).sort((a,b)=>String(b.date).localeCompare(String(a.date))||recordRaceNo(b)-recordRaceNo(a));if(!allDone.length){$('history').innerHTML='<div class="empty">確定済みレースはありません。</div>';return}const venueNames=Object.values(STADIUMS),venueBase=historyVenue==='all'?allDone:allDone.filter(x=>x.venue===historyVenue),hits=venueBase.filter(x=>x.hit).length,misses=venueBase.length-hits;let shown=venueBase;if(historyResult==='hit')shown=venueBase.filter(x=>x.hit);if(historyResult==='miss')shown=venueBase.filter(x=>!x.hit);const venueTabs=`<div class="venue-tabs"><button class="venue-chip ${historyVenue==='all'?'active':''}" data-hvenue="all">全会場</button>${venueNames.map(v=>`<button class="venue-chip ${historyVenue===v?'active':''}" data-hvenue="${v}">${v}</button>`).join('')}</div>`;const resultTabs=`<div class="result-tabs"><button class="result-chip all ${historyResult==='all'?'active':''}" data-hresult="all">すべて (${venueBase.length}R)</button><button class="result-chip hit-only ${historyResult==='hit'?'active':''}" data-hresult="hit">● 的中のみ (${hits}R)</button><button class="result-chip miss-only ${historyResult==='miss'?'active':''}" data-hresult="miss">● 不的中のみ (${misses}R)</button></div>`;const body=shown.length?`<div class="history-scroll"><table class="history-table"><thead><tr><th>日付</th><th>場</th><th>R</th><th>AI展開</th><th>結果</th><th>オッズ</th><th>判定</th><th>接近度</th><th>的中枠</th><th>払戻金</th><th>回収率</th></tr></thead><tbody>${shown.map(x=>{const st=recordStake(x),rt=recordReturn(x),rr=st>0?rt/st*100:null,od=num(x.resultOdds,num(x.payout)/100),group=groupLabel(recordHitGroup(x)),raceNo=recordRaceNo(x);return`<tr><td>${x.date?.slice(5)||'-'}</td><td>${x.venue||'-'}</td><td>${raceNo>0?raceNo+'R':'-'}</td><td class="scenario-mini">${topScenarioText(x)}</td><td><b>${x.result||'-'}</b></td><td class="odds">${od?od.toFixed(1)+'倍':'-'}</td><td class="${x.hit?'hit':'miss'}">${x.hit?'◎ 的中':'× 不的中'}</td><td class="proximity ${proximityClass(x.proximity)}">${x.proximity?.label||'-'}${x.proximity?.bestCombo?`<br><small>${x.proximity.bestCombo} / ${groupLabel(x.proximity.bestGroup)}</small>`:''}</td><td>${x.hit?group:'-'}</td><td>${rt.toLocaleString()}円</td><td class="${rr!==null&&rr>=100?'roi':''}">${rr===null?'-':rr.toFixed(1)+'%'}</td></tr>`}).join('')}</tbody></table></div>`:`<div class="empty">この条件の確定レースはありません。</div>`;$('history').innerHTML=`<div class="history-controls">${venueTabs}${resultTabs}<div class="history-caption"><span>${historyVenue==='all'?'全会場':historyVenue}</span><span>${shown.length}R表示</span></div></div>${body}<div class="notice">会場タブは横にスライドできます。オッズ表示は3連単確定払戻額÷100です。</div>`;document.querySelectorAll('[data-hvenue]').forEach(b=>b.onclick=()=>{historyVenue=b.dataset.hvenue;historyResult='all';renderHistory(rs)});document.querySelectorAll('[data-hresult]').forEach(b=>b.onclick=()=>{historyResult=b.dataset.hresult;renderHistory(rs)})}
function renderVenue(rs){const done=rs.filter(x=>x.done),m=new Map();for(const x of done){if(!m.has(x.venue))m.set(x.venue,[]);m.get(x.venue).push(x)}if(!m.size){$('venueStats').innerHTML='<div class="empty">会場別成績はまだありません。</div>';return}const rows=[...m.entries()].map(([venue,a])=>({venue,...calc(a)})).sort((a,b)=>b.roi-a.roi);$('venueStats').innerHTML=`<div class="venue-row"><b>会場</b><b>R</b><b>的中率</b><b>回収率</b><b>学習進捗</b></div>${rows.map(x=>`<div class="venue-row"><span>${x.venue}</span><span>${x.races}</span><span>${x.hitRate.toFixed(1)}%</span><span class="${x.roi>=100?'green':''}">${x.roi.toFixed(1)}%</span><span class="${x.races>=100?'learn-ready':x.races>=50?'learn-mid':'learn-low'}">${Math.min(x.races,100)}/100R</span></div>`).join('')}`}
function showStats(openHistory=false,openVenue=false){$('statsSection').style.display='block';renderStats();if(openHistory){$('historyWrap').style.display='block';$('historyToggle').textContent='一覧を隠す'}if(openVenue){$('venueWrap').style.display='block';$('venueToggle').textContent='会場別成績を隠す'}$('statsSection').scrollIntoView({behavior:'smooth',block:'start'})}
$('statsOpen').onclick=()=>showStats();$('historyOpen').onclick=()=>showStats(true,false);$('venueOpen').onclick=()=>showStats(false,true);$('qStats').onclick=()=>showStats();$('qTop').onclick=()=>$('top').scrollIntoView({behavior:'smooth'});$('historyToggle').onclick=()=>{const w=$('historyWrap'),o=w.style.display==='block';w.style.display=o?'none':'block';$('historyToggle').textContent=o?'一覧を表示':'一覧を隠す'};$('venueToggle').onclick=()=>{const w=$('venueWrap'),o=w.style.display==='block';w.style.display=o?'none':'block';$('venueToggle').textContent=o?'会場別成績を表示':'会場別成績を隠す'};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('rangeBox').classList.toggle('show',period==='custom');renderStats()});$('fromDate').onchange=renderStats;$('toDate').onchange=renderStats;
if($('learningToggle')){
  $('learningToggle').onclick=()=>{
    const w=$('learningProgressWrap'),o=w.style.display==='block';
    w.style.display=o?'none':'block';
    $('learningToggle').textContent=o?'会場別 学習進捗を表示 ▼':'会場別 学習進捗を隠す ▲';
  };
}
backfillLearningRecords();renderStats();autoRefresh(true);setInterval(()=>{if(!document.hidden)autoRefresh(false)},60000);window.addEventListener('focus',()=>autoRefresh(true));document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoRefresh(true)});


</script>
</body>
