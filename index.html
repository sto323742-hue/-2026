<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOAT RACE AI予想</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #08111f;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .sub-title {
      text-align: center;
      color: #9fb3c8;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .card {
      background: #101c2d;
      border: 1px solid #24364d;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      color: #63b3ff;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
      font-size: 14px;
      color: #c7d4e4;
    }

    select,
    input {
      width: 100%;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #40546d;
      background: #08111f;
      color: white;
      font-size: 16px;
    }

    .racer {
      background: #0b1625;
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .racer-title {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 16px;
      background: linear-gradient(90deg, #007aff, #00b8ff);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      display: none;
    }

    .prediction {
      font-size: 24px;
      font-weight: bold;
      color: #ffd54a;
      text-align: center;
      margin: 15px 0;
    }

    .rank-row {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      margin: 6px 0;
      background: #0b1625;
      border-radius: 8px;
    }

    .rank-score {
      color: #63b3ff;
      font-weight: bold;
    }

    .bet-group {
      margin-top: 15px;
    }

    .bet-title {
      font-weight: bold;
      color: #6fc3ff;
      margin-bottom: 8px;
    }

    .bet {
      display: inline-block;
      background: #17263a;
      padding: 8px 12px;
      margin: 4px;
      border-radius: 8px;
      font-weight: bold;
    }

    .main {
      border: 1px solid #ffcc33;
    }

    .cover {
      border: 1px solid #4fc3f7;
    }

    .hole {
      border: 1px solid #ff6b6b;
    }

    .confidence {
      text-align: center;
      font-size: 18px;
      margin-top: 15px;
    }

    .confidence strong {
      color: #ffd54a;
    }

    .note {
      margin-top: 15px;
      font-size: 12px;
      line-height: 1.6;
      color: #93a5ba;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🚤 BOAT RACE AI予想</h1>
  <div class="sub-title">
    選手・モーター・展示・STを総合分析
  </div>

  <div class="card">
    <h2>レース情報</h2>

    <label>競艇場</label>
    <select id="stadium">
      <option>桐生</option>
      <option>戸田</option>
      <option>江戸川</option>
      <option>平和島</option>
      <option>多摩川</option>
      <option>浜名湖</option>
      <option>蒲郡</option>
      <option>常滑</option>
      <option>津</option>
      <option>三国</option>
      <option>びわこ</option>
      <option>住之江</option>
      <option>尼崎</option>
      <option>鳴門</option>
      <option>丸亀</option>
      <option>児島</option>
      <option>宮島</option>
      <option>徳山</option>
      <option>下関</option>
      <option>若松</option>
      <option>芦屋</option>
      <option>福岡</option>
      <option>唐津</option>
      <option>大村</option>
    </select>

    <label>レース</label>
    <select id="race">
      <option>1R</option>
      <option>2R</option>
      <option>3R</option>
      <option>4R</option>
      <option>5R</option>
      <option>6R</option>
      <option>7R</option>
      <option>8R</option>
      <option>9R</option>
      <option>10R</option>
      <option>11R</option>
      <option>12R</option>
    </select>
  </div>


  <div class="card">
    <h2>選手データ入力</h2>

    <div id="racers"></div>

    <button onclick="predictRace()">
      AI予想を実行
    </button>
  </div>


  <div class="card" id="result">

    <h2>AI予想結果</h2>

    <div class="prediction" id="prediction"></div>

    <div id="ranking"></div>

    <div class="confidence">
      勝負度：
      <strong id="confidence"></strong>
    </div>

    <div class="bet-group">
      <div class="bet-title">🔥 本線</div>
      <div id="mainBets"></div>
    </div>

    <div class="bet-group">
      <div class="bet-title">✅ 押さえ</div>
      <div id="coverBets"></div>
    </div>

    <div class="bet-group">
      <div class="bet-title">💣 穴</div>
      <div id="holeBets"></div>
    </div>

    <div class="note">
      ※この予想は入力されたデータをもとにした簡易AIスコアです。
      実際の舟券購入では直前展示・進入・風・水面状況・オッズも確認してください。
    </div>

  </div>

</div>


<script>

const racersDiv = document.getElementById("racers");

for (let i = 1; i <= 6; i++) {

  racersDiv.innerHTML += `

    <div class="racer">

      <div class="racer-title">
        ${i}号艇
      </div>

      <div class="grid">

        <div>
          <label>全国勝率</label>
          <input
            type="number"
            step="0.01"
            id="rate${i}"
            placeholder="例 6.50"
          >
        </div>

        <div>
          <label>当地勝率</label>
          <input
            type="number"
            step="0.01"
            id="local${i}"
            placeholder="例 6.20"
          >
        </div>

        <div>
          <label>モーター2連率</label>
          <input
            type="number"
            step="0.1"
            id="motor${i}"
            placeholder="例 40"
          >
        </div>

        <div>
          <label>展示タイム</label>
          <input
            type="number"
            step="0.01"
            id="exhibition${i}"
            placeholder="例 6.75"
          >
        </div>

        <div>
          <label>平均ST</label>
          <input
            type="number"
            step="0.01"
            id="st${i}"
            placeholder="例 0.15"
          >
        </div>

        <div>
          <label>展示ST</label>
          <input
            type="number"
            step="0.01"
            id="exst${i}"
            placeholder="例 0.08"
          >
        </div>

      </div>

    </div>

  `;
}


function getNumber(id, defaultValue) {

  const value = parseFloat(
    document.getElementById(id).value
  );

  return isNaN(value)
    ? defaultValue
    : value;
}


function predictRace() {

  let racers = [];

  for (let i = 1; i <= 6; i++) {

    const rate =
      getNumber("rate" + i, 5);

    const local =
      getNumber("local" + i, 5);

    const motor =
      getNumber("motor" + i, 30);

    const exhibition =
      getNumber("exhibition" + i, 6.85);

    const st =
      getNumber("st" + i, 0.18);

    const exst =
      getNumber("exst" + i, 0.15);


    let courseBonus = 0;

    if (i === 1) courseBonus = 22;
    if (i === 2) courseBonus = 12;
    if (i === 3) courseBonus = 9;
    if (i === 4) courseBonus = 7;
    if (i === 5) courseBonus = 4;
    if (i === 6) courseBonus = 2;


    let score =

      rate * 7 +

      local * 4 +

      motor * 0.45 +

      (7.20 - exhibition) * 30 +

      (0.25 - st) * 35 +

      (0.25 - exst) * 25 +

      courseBonus;


    racers.push({
      boat: i,
      score: score
    });

  }


  racers.sort(
    (a, b) =>
      b.score - a.score
  );


  const first =
    racers[0].boat;

  const second =
    racers[1].boat;

  const third =
    racers[2].boat;

  const fourth =
    racers[3].boat;


  document.getElementById(
    "prediction"
  ).innerHTML =

    `${first} → ${second} → ${third}`;


  let rankingHTML = "";

  racers.forEach(
    (racer, index) => {

      rankingHTML += `

        <div class="rank-row">

          <span>
            ${index + 1}位　
            ${racer.boat}号艇
          </span>

          <span class="rank-score">
            ${racer.score.toFixed(1)}
          </span>

        </div>

      `;

    }
  );


  document.getElementById(
    "ranking"
  ).innerHTML = rankingHTML;



  const scoreDiff =
    racers[0].score -
    racers[1].score;


  let confidence = "B";

  if (scoreDiff >= 15) {

    confidence = "S";

  } else if (scoreDiff >= 9) {

    confidence = "A";

  } else if (scoreDiff >= 4) {

    confidence = "B";

  } else {

    confidence = "C";

  }


  document.getElementById(
    "confidence"
  ).innerText = confidence;



  const mainBets = [

    `${first}-${second}-${third}`,

    `${first}-${third}-${second}`,

    `${first}-${second}-${fourth}`

  ];


  const coverBets = [

    `${second}-${first}-${third}`,

    `${first}-${third}-${fourth}`,

    `${first}-${fourth}-${second}`

  ];


  const holeBets = [

    `${third}-${first}-${second}`,

    `${second}-${third}-${first}`

  ];



  document.getElementById(
    "mainBets"
  ).innerHTML = mainBets
    .map(
      bet =>
        `<span class="bet main">${bet}</span>`
    )
    .join("");


  document.getElementById(
    "coverBets"
  ).innerHTML = coverBets
    .map(
      bet =>
        `<span class="bet cover">${bet}</span>`
    )
    .join("");


  document.getElementById(
    "holeBets"
  ).innerHTML = holeBets
    .map(
      bet =>
        `<span class="bet hole">${bet}</span>`
    )
    .join("");


  document.getElementById(
    "result"
  ).style.display = "block";


  document.getElementById(
    "result"
  ).scrollIntoView({
    behavior: "smooth"
  });

}

</script>

</body>
</html>
