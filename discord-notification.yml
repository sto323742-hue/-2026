name: BOATRACE AI Discord Notification

on:
  workflow_dispatch:

jobs:
  discord-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord test
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content":"🚤 BOAT2026 AI予想\n\n✅ Discord通知の接続テストに成功しました！"}' \
            "$DISCORD_WEBHOOK_URL"
