<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BOAT RACE AI 5分前最終確定・3連複3本重複なし</title>
<style>
html,body{margin:0;height:100%;background:#050505;overflow:hidden}
#host{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="host" src="./rough-stable-v2-trio-overlap-fixed.html?v=final5-trio-unique2-20260912"></iframe>

<script>
const host=document.getElementById('host');

function getIndexWindow(){
  try{
    const stable=host.contentWindow;
    const roughFrame=stable?.document?.getElementById('rough');
    const rough=roughFrame?.contentWindow;
    const appFrame=rough?.document?.getElementById('app');
    return appFrame?.contentWindow||null;
  }catch(e){
    return null;
  }
}

function installFinal5Patch(){
  const w=getIndexWindow();
  if(!w)return false;

  try{
    w.eval(`
      (function(){
        if(window.__FINAL5_LOCK_PATCH_V2__)return;
        if(typeof minutesToClose!=='function')return;

        window.__FINAL5_LOCK_PATCH_V2__=true;

        // 旧版の誤った5分前判定ロックは使わない
        try{ localStorage.removeItem('boat_ai_final5_locks_v1'); }catch(e){}

        const LOCK_KEY='boat_ai_final5_locks_v2';

        function readLocks(){
          try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'{}')}catch(e){return{}}
        }
        function writeLocks(v){
          try{localStorage.setItem(LOCK_KEY,JSON.stringify(v))}catch(e){}
        }
        function todayJstLocal(){
          return new Intl.DateTimeFormat('en-CA',{
            timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'
          }).format(new Date());
        }
        function final5Key(a){
          try{
            if(typeof raceKey==='function')return raceKey(a?.race||{});
          }catch(e){}
          const r=a?.race||{};
          return [r.date||todayJstLocal(),r.stadium_number||'',r.race_number||''].join('_');
        }
        function valuePass(a){
          try{
            const v=a?.valueDecision || (typeof expectedValueDecision==='function' ? expectedValueDecision(a) : null);
            return !!v?.pass || v?.status==='pass';
          }catch(e){
            return false;
          }
        }

        let locks=readLocks();
        const today=todayJstLocal();
        for(const k of Object.keys(locks)){
          if(locks[k]?.date!==today)delete locks[k];
        }
        writeLocks(locks);

        finalDecision=function(a){
          const m=minutesToClose(a?.race);
          const key=final5Key(a);
          const saved=locks[key];

          if(saved?.decision){
            return {...saved.decision,minutes:m};
          }

          if(Number.isFinite(m) && m>5){
            return {
              status:'checking',
              label:'⏳ 5分前に最終確定',
              minutes:m,
              strictPass:false,
              final5:true
            };
          }

          if(Number.isFinite(m) && m>=0 && m<=5){
            // 新仕様:
            // 画面に残っているSレースで、S+期待値が合格なら5分前に確定。
            // 旧finalDecisionの追加厳格条件（展示順位・ST順位など）では見送らない。
            const passed = a?.grade==='S' && valuePass(a);

            const decision={
              status:passed?'confirmed':'hold',
              label:passed?'✅ 5分前最終確定':'⚠️ 5分前最終見送り',
              minutes:m,
              strictPass:passed,
              final5:true,
              fixedAt:new Date().toISOString()
            };
            locks[key]={date:todayJstLocal(),decision};
            writeLocks(locks);
            return decision;
          }

          // 締切後
          return {
            status:'closed',
            label:'締切済み',
            minutes:m,
            strictPass:false,
            final5:true
          };
        };

        function refreshFinal5Display(){
          try{
            if(!Array.isArray(analyses))return;
            for(const a of analyses){
              a.valueDecision = a.valueDecision || (typeof expectedValueDecision==='function' ? expectedValueDecision(a) : null);
              a.finalDecision=finalDecision(a);
            }
            if(typeof display==='function')display();
          }catch(e){}
        }

        refreshFinal5Display();
        window.__FINAL5_REFRESH_TIMER_V2__=setInterval(refreshFinal5Display,5000);
      })();
    `);

    return true;
  }catch(e){
    console.warn('final5 v2 patch failed',e);
    return false;
  }
}


function installUniqueTrioPatch(){
  const w=getIndexWindow();
  if(!w)return false;

  try{
    w.eval(`
      (function(){
        if(window.__TRIO_UNIQUE_3_PATCH_V2__)return;
        if(typeof makeTrioLongshots!=='function')return;

        window.__TRIO_UNIQUE_3_PATCH_V2__=true;
        const baseMakeTrioLongshots=makeTrioLongshots;

        function trioKeyLocal(combo){
          const nums=String(combo||'')
            .split(/[^1-6]+/)
            .filter(Boolean)
            .map(Number)
            .filter(x=>x>=1&&x<=6);
          if(nums.length!==3)return '';
          const uniq=[...new Set(nums)];
          if(uniq.length!==3)return '';
          return uniq.sort((a,b)=>a-b).join('-');
        }

        function buildFallbacks(a,used){
          const pool=Array.isArray(a?.comboPool)?a.comboPool:[];
          const ticketSet=(typeof makeTickets==='function')?makeTickets(a):{main:[],cover:[],hole:[]};
          const tri10=[
            ...(ticketSet?.main||[]),
            ...(ticketSet?.cover||[]),
            ...(ticketSet?.hole||[])
          ];

          const overlapCount={};
          for(const c of tri10){
            const k=trioKeyLocal(c);
            if(k)overlapCount[k]=(overlapCount[k]||0)+1;
          }

          const aiOrder=(a?.boats||[]).map(x=>Number(x.boat));
          const groups={};

          for(const p of pool){
            const key=trioKeyLocal(p?.combo);
            if(!key || used.has(key))continue;

            if(!groups[key]){
              groups[key]={
                combo:key,
                probability:0,
                odds:[],
                trifectaOverlap:overlapCount[key]||0,
                outsiderCount:key.split('-').map(Number).filter(b=>aiOrder.indexOf(b)>=3).length
              };
            }

            groups[key].probability += Number(p?.probability||0);
            const o=Number(p?.odds||0);
            if(o>0)groups[key].odds.push(o);
          }

          return Object.values(groups)
            .map(g=>{
              g.odds.sort((a,b)=>a-b);
              g.marketMedian=g.odds.length?g.odds[Math.floor(g.odds.length/2)]:0;
              g.marketMax=g.odds.length?g.odds[g.odds.length-1]:0;
              g.score=
                g.probability *
                Math.log10(Math.max(g.marketMedian,10)) *
                (1+g.outsiderCount*.18) *
                (g.trifectaOverlap>=2 ? .45 : 1);
              return g;
            })
            .filter(g=>g.odds.length>=3)
            .sort((a,b)=>
              (a.trifectaOverlap>=2)-(b.trifectaOverlap>=2) ||
              b.score-a.score ||
              b.probability-a.probability
            );
        }

        makeTrioLongshots=function(a){
          const raw=baseMakeTrioLongshots(a);
          const result=[];
          const used=new Set();

          if(Array.isArray(raw)){
            for(const item of raw){
              const key=trioKeyLocal(item?.combo);
              if(!key || used.has(key))continue;
              used.add(key);
              result.push({...item,combo:key});
              if(result.length===3)break;
            }
          }

          if(result.length<3){
            const fallbacks=buildFallbacks(a,used);

            // まずは従来ルールに近い「大穴＋3連単重複2本未満」を優先
            const preferred=fallbacks.filter(g=>
              g.trifectaOverlap<2 &&
              g.marketMedian>=35 &&
              g.marketMax>=60 &&
              g.probability>=0.02
            );

            // 足りない場合でも、同じ3艇セットは絶対に重複させない
            const reserve=fallbacks.filter(g=>!preferred.includes(g));

            for(const g of [...preferred,...reserve]){
              if(result.length===3)break;
              if(used.has(g.combo))continue;
              used.add(g.combo);
              result.push({
                combo:g.combo,
                probability:g.probability,
                marketMedian:g.marketMedian,
                outsiderCount:g.outsiderCount,
                trifectaOverlap:g.trifectaOverlap,
                uniqueFallback:true
              });
            }
          }

          return result.slice(0,3);
        };
      })();
    `);
    return true;
  }catch(e){
    console.warn('unique trio patch failed',e);
    return false;
  }
}

function tryInstall(){
  const a=installFinal5Patch();
  const b=installUniqueTrioPatch();
  if(a&&b)return;
  setTimeout(tryInstall,200);
}

host.addEventListener('load',()=>setTimeout(tryInstall,100));
setTimeout(tryInstall,300);
setInterval(()=>{
  installFinal5Patch();
  installUniqueTrioPatch();
},5000);
</script>
</body>
</html>
